# yaml-language-server: $schema=../schema/tailoring.schema.json
#
# Tailoring file: how an organization adapts a released standard without forking it.
# Keep it in your own repository. Scanners and generated playbooks read it.

standard: debian                       # standard id
version: 1.0.0                         # release it was written for
profile: server                        # profile key from _standard.yml
title: ACME production servers         # (optional)
owner: secops@acme.example             # (optional) accountable for the deviations

parameters:                            # (optional) overrides, within minimum/maximum/allowed
  CB-DEB-AUTH-001:
    permit_root_login: prohibit-password

exclude:                               # (optional) reported as "excluded"
  - control: CB-DEB-NET-004
    reason: Host is a router, IP forwarding is required.
    until: 2027-06-30                  # (optional) review date

include: []                            # (optional) controls from other profiles to add

fixes:                                 # (optional) opt in to fixes disabled by default (lockout_risk)
  CB-DEB-AUTH-001: true
