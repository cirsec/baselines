# yaml-language-server: $schema=../schema/tailoring.schema.json
#
# Tailoring file: how an organization adapts a released standard without forking it.
# Keep it in your own repository. Check it with `python tools/tailor.py <file>`, then
# generate your scripts and Ansible role with `python tools/generate.py --tailoring <file>`.
# This example tailors the demo standard so it can be checked as is.

standard: buffet                       # standard id
version: 1.1.0                         # release it was written for
profile: hardened                      # profile key from _standard.yml
title: Imaginary Bistro, flu season    # (optional)
owner: kitchen@bistro.example          # (optional) accountable for the deviations

parameters:                            # (optional) overrides, within minimum/maximum/allowed
  CB-BUF-HYG-001:
    min_temp_c: 75

exclude:                               # (optional) reported as "excluded"
  - control: CB-BUF-GUARD-001
    reason: Every dish is served by staff, no self-service.
    until: 2027-06-30                  # (optional) review date

include: []                            # (optional) controls from other profiles to add

fixes: {}                              # (optional) opt in to fixes with lockout_risk, e.g. CB-XXX-AUTH-001: true
