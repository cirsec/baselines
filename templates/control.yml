# yaml-language-server: $schema=../schema/control.schema.json
#
# Template for a new control. Copy to categories/<category>/<standard>/controls/<ID>.yml
# Fields marked (optional) can be removed. Everything else is required.
# Write from primary sources only. Never paste text from a proprietary benchmark.

# --- Identity ---------------------------------------------------------------
id: CB-STD-DOMAIN-000                 # CB-<STANDARD code>-<DOMAIN code>-<NNN>, equal to the file name
title: Desired state, in our own words # e.g. "Block user consent to third-party applications"
finding:
  title: The problem, as shown in a report   # e.g. "Users can grant third-party apps access to company data"
  description: |                       # (optional)
    One or two sentences on the exposure.
status: draft                          # draft | review | active | deprecated
profiles: [baseline]                   # profile keys from _standard.yml
risk:
  severity: medium                     # info | low | medium | high | critical
  score: 5.0                           # (optional) 0-10
assessment: automated                  # automated | partial | manual
tags: [example]                        # (optional) lowercase slugs

# --- Scope ------------------------------------------------------------------
applicability:                         # (optional) omit = all versions, no prerequisite
  versions: ["12"]                     # subset of _standard.yml applies_to versions
  requires: [Some license or feature]
  conditions: |
    Only relevant when ...

# --- Content (Markdown) ------------------------------------------------------
description: |
  What the setting or practice is.
rationale: |
  Why it matters. Which attacks or mistakes it prevents.
impact: |
  Operational side effects. Write "None known." if none.
notes: |                               # (optional)
  Edge cases, exceptions, vendor quirks.

setting:                               # (optional) when the control is about one setting
  location: Admin center > Section > Page, or /etc/file.conf, or API resource
  default_value: Enabled
  recommended_value: "At most {{ max_days }} days"

parameters:                            # (optional) tunable values, referenced as {{ name }}
  - name: max_days
    type: integer                      # string | integer | number | boolean | enum | list
    description: Maximum allowed lifetime.
    unit: days
    default: 180
    profile_defaults:
      hardened: 90
    minimum: 1
    maximum: 365

# --- Audit ------------------------------------------------------------------
audit:
  manual: |
    Step-by-step check for a human.
  logic: all                           # all | any
  checks:                              # required when assessment is automated
    - id: main-check                   # stable slug, used in per-check results
      engine: shell                    # engine key from baselines.yml
      description: What this check reads.
      spec:                            # engine-specific
        command: "test $(some-command) -le {{ max_days }}"

# --- Remediation --------------------------------------------------------------
remediation:
  manual: |
    Step-by-step fix.
  requires_restart: false              # (optional)
  rollback: |                          # (optional)
    How to revert.
  scripts:                             # (optional)
    - id: fix
      engine: shell
      description: Applies the recommended value.
      content: |
        echo "fix here"

# --- Sources and links ------------------------------------------------------
references:                            # sources used to write this control, at least one
  - title: Vendor documentation page
    url: https://example.com/doc
    publisher: Vendor
    kind: vendor-doc                   # vendor-doc | standard | rfc | guide | paper | tool | other
    accessed: 2026-10-16
mappings:                              # (optional) control frameworks, identifiers only
  - framework: nist-800-53r5           # key from baselines.yml, kind control-framework
    framework_version: "5.1.1"
    id: AC-2
    relation: related                  # equivalent | stricter | looser | partial | related
    note: Our own words on the difference.
threats:                               # (optional) ATT&CK, CWE, CVE...
  - framework: mitre-attack
    id: T1078
related_controls:                      # (optional)
  - id: CB-STD-DOMAIN-001
    type: related                      # requires | related | conflicts

# --- People and lifecycle -----------------------------------------------------
authors:
  - name: Jane Doe
    github: janedoe
reviewers: []                          # (optional)
verified:                              # (optional) real-environment tests
  - date: 2026-10-16
    by: janedoe
    environment: Test environment description
introduced_in: 0.1.0                   # standard version where it first appears
created: 2026-10-16
updated: 2026-10-16
# When deprecating, add all of:
# status: deprecated
# deprecated_in: 1.2.0
# deprecation_reason: Why.
# superseded_by: [CB-STD-DOMAIN-002]   # [] if retired without replacement
# supersedes: [...]                    # (optional) on the new control
