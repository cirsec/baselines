name: Wrong check result
description: A check reports fail on a compliant system, or pass on a non-compliant one.
labels: [check]
body:
  - type: markdown
    attributes:
      value: |
        A **pass on a non-compliant system** can hide a real exposure: report it privately instead
        (see SECURITY.md).
  - type: input
    id: control
    attributes:
      label: Control and check
      placeholder: CB-DEB-AUTH-001 / sshd-effective
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Standard release and profile
      placeholder: debian 1.0.0, profile server
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target
      placeholder: Debian 12.7, OpenSSH 9.2
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Result and actual configuration
      description: The check output (evidence) and what the system really has.
      render: text
    validations:
      required: true
