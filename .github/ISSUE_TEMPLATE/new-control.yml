name: New control
description: Propose a control for an existing or new standard.
labels: [new-control]
body:
  - type: markdown
    attributes:
      value: |
        Write from primary sources only (vendor docs, man pages, RFCs, ANSSI, NIST, CISA).
        Never paste text from a proprietary benchmark, including CIS. Identifiers are fine.
  - type: input
    id: standard
    attributes:
      label: Standard
      placeholder: debian, m365...
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: Expected state
      description: The setting and its recommended value, in your own words.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Why it matters
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary sources
      description: Links you wrote this from.
    validations:
      required: true
  - type: textarea
    id: automation
    attributes:
      label: How to check and fix it
      description: Engine if one fits (sysctl, sshd-config, package, graph-api...), restart or lockout risk.
