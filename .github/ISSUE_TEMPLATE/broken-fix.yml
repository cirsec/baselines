name: Broken fix
description: A generated or handwritten fix fails, is not idempotent, or does more than declared.
labels: [fix]
body:
  - type: markdown
    attributes:
      value: |
        If the fix locked you out, broke a service beyond its declared `effects`, or weakened
        security, report it privately instead (see SECURITY.md).
  - type: input
    id: control
    attributes:
      label: Control and script
      placeholder: CB-DEB-NET-004 / forward
    validations:
      required: true
  - type: dropdown
    id: runner
    attributes:
      label: How it was applied
      options: [remediate.sh, Ansible role, controls/<ID>.sh, other]
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Standard release, profile, tailoring
      placeholder: debian 1.0.0, profile server, no tailoring
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Target
      placeholder: Debian 13.1
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output and what went wrong
      render: text
    validations:
      required: true
