# Test fixture, copied into categories/demo/lab by tools/tests. Exercises every generator.
id: lab
code: LAB
title: Generator test lab
description: Fixture standard used by the generator tests.
status: draft
version: 0.1.0
applies_to:
  - product: Lab
    versions: [a, b]
profiles:
  - key: base
    title: Base
    description: Base profile.
  - key: strict
    title: Strict
    description: Strict profile.
    extends: base
domains:
  - code: FILE
    title: Files
  - code: SYS
    title: System
facts:
  - key: has-tmp
    title: /tmp exists
    detect:
      engine: shell
      spec:
        script: test -d /tmp
  - key: never
    title: Never true
    detect:
      engine: shell
      spec:
        script: exit 1
maintainers:
  - name: Test
primary_sources:
  - title: Test
    url: https://example.org
