id: CB-LAB-FILE-001
title: A flag file exists
finding:
  title: The flag file is missing
status: active
profiles: [base]
risk:
  severity: low
assessment: automated
description: The file {{ target }} exists.
rationale: Test.
impact: None known.
parameters:
  - name: target
    type: string
    description: Path of the flag file.
    default: /nonexistent/flag
audit:
  manual: Look for {{ target }}.
  checks:
    - id: exists
      engine: shell
      spec:
        script: |
          ls "$CB_TARGET"
          test -f "$CB_TARGET"
    - id: only-on-b
      engine: shell
      versions: [b]
      spec:
        script: exit 1
remediation:
  manual: Create it.
  effects:
    restart: none
    disruption: none
  scripts:
    - id: create
      engine: shell
      content: |
        cat > "$CB_TARGET" <<'DOC'
        heredoc kept verbatim
        DOC
references:
  - title: Test
    url: https://example.org
authors:
  - name: Test
verified:
  - date: 2026-10-01
    by: test
    versions: [a, b]
introduced_in: 0.1.0
created: 2026-10-01
updated: 2026-10-01
