# yaml-language-server: $schema=./schema/baselines.schema.json
#
# Global settings for CIRSEC Baselines.
# The folder tree under categories/ is the source of truth for content.
# This file never lists categories, standards or controls.
schema_version: 1

project:
  name: CIRSEC Baselines
  url: https://baselines.cirsec.org
  repository: https://github.com/cirsec/baselines

licenses:
  content: CC-BY-4.0     # categories/** (see LICENSE-CONTENT)
  tooling: Apache-2.0    # schema/, tools/, site (see LICENSE)

locales:
  default: en            # language of the source control files
  available: [en, fr]

id_format:
  pattern: "^CB-[A-Z0-9]+-[A-Z0-9]+-[0-9]{3}$"
  template: "CB-<STANDARD>-<DOMAIN>-<NNN>"
  example: "CB-M365-AUTH-001"

# Engines usable in audit.checks[].engine and remediation.scripts[].engine.
engines:
  - key: graph-api
    title: Microsoft Graph API
    description: GET a Graph resource and compare a JSON path to an expected value.
    url: https://learn.microsoft.com/graph/api/overview
  - key: exchange-powershell
    title: Exchange Online PowerShell
    description: Run an Exchange Online PowerShell cmdlet and compare a property to an expected value.
  - key: powershell
    title: PowerShell
    description: Generic PowerShell script, for checks or remediation.
  - key: shell
    title: POSIX shell
    description: Shell command or script. For checks, exit code 0 means compliant.
  - key: osquery
    title: osquery
    description: osquery SQL query. For checks, a non-empty result means compliant unless the spec says otherwise.
    url: https://osquery.io
  - key: windows-registry
    title: Windows registry
    description: Read a registry value and compare it to an expected value.
  - key: file-content
    title: File content
    description: Match a regex against a configuration file.
  - key: demo-sensor
    title: "[DEMO] Buffet sensor"
    description: Demo engine used by categories/demo. Reads a sensor and compares it to a threshold.

# External references.
#   kind control-framework       -> usable in mappings
#   other kinds                  -> usable in threats
#   reference_policy id-only     -> only identifiers may appear in this repository
#   reference_policy id-title    -> identifiers and official titles allowed
frameworks:
  - key: cis-m365
    kind: control-framework
    name: CIS Microsoft 365 Foundations Benchmark
    publisher: Center for Internet Security
    url: https://www.cisecurity.org/benchmark/microsoft_365
    id_pattern: "^[0-9]+(\\.[0-9]+)*$"
    reference_policy: id-only
  - key: cis-debian
    kind: control-framework
    name: CIS Debian Linux Benchmark
    publisher: Center for Internet Security
    url: https://www.cisecurity.org/benchmark/debian_linux
    id_pattern: "^[0-9]+(\\.[0-9]+)*$"
    reference_policy: id-only
  - key: iso27001-2022
    kind: control-framework
    name: ISO/IEC 27001:2022 Annex A
    publisher: ISO/IEC
    url: https://www.iso.org/standard/27001
    id_pattern: "^A\\.[5-8]\\.[0-9]+$"
    reference_policy: id-only
  - key: nist-800-53r5
    kind: control-framework
    name: NIST SP 800-53 Rev. 5
    publisher: NIST
    url: https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final
    id_pattern: "^[A-Z]{2}-[0-9]+(\\([0-9]+\\))?$"
    reference_policy: id-title
  - key: cisa-scuba-m365
    kind: control-framework
    name: CISA SCuBA Microsoft 365 Secure Configuration Baselines
    publisher: CISA
    url: https://www.cisa.gov/resources-tools/services/secure-cloud-business-applications-scuba-project
    id_pattern: "^MS\\.[A-Z]+\\.[0-9]+\\.[0-9]+v[0-9]+$"
    reference_policy: id-title
  - key: anssi-linux
    kind: control-framework
    name: ANSSI - Recommandations de sécurité relatives à un système GNU/Linux
    publisher: ANSSI
    url: https://cyber.gouv.fr/publications/recommandations-de-securite-relatives-un-systeme-gnulinux
    id_pattern: "^R[0-9]+$"
    reference_policy: id-title
  - key: mitre-attack
    kind: threat-taxonomy
    name: MITRE ATT&CK
    publisher: MITRE
    url: https://attack.mitre.org
    id_pattern: "^T[0-9]{4}(\\.[0-9]{3})?$"
    reference_policy: id-title
  - key: cwe
    kind: weakness-taxonomy
    name: Common Weakness Enumeration
    publisher: MITRE
    url: https://cwe.mitre.org
    id_pattern: "^CWE-[0-9]+$"
    reference_policy: id-title
  - key: cve
    kind: vulnerability-database
    name: Common Vulnerabilities and Exposures
    publisher: CVE Program
    url: https://www.cve.org
    id_pattern: "^CVE-[0-9]{4}-[0-9]{4,}$"
    reference_policy: id-title
  # --- Demo only, used by categories/demo. Not real frameworks. ---
  - key: demo-food-code
    kind: control-framework
    name: "[DEMO] Imaginary Food Code"
    publisher: Demo
    id_pattern: "^FC-[0-9]+\\.[0-9]+$"
    reference_policy: id-title
  - key: demo-buffet-threats
    kind: threat-taxonomy
    name: "[DEMO] Buffet Threat Matrix"
    publisher: Demo
    id_pattern: "^BT-[0-9]{3}$"
    reference_policy: id-title
