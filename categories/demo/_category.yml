# yaml-language-server: $schema=../../schema/category.schema.json
#
# CATEGORY METADATA
# A category groups standards. It is just a folder + this file.
# This "demo" category exists only to show how the format works.
# It is excluded from releases and from the public site.

id: demo                     # must equal the folder name (categories/demo)
title: Demo
description: Example content showing every field of the format. Not a real baseline.
order: 999                   # display order, ascending: demo goes last

# Optional translations of this file, keyed by locale (must be in baselines.yml > locales.available)
i18n:
  fr:
    title: Démo
    description: Contenu d'exemple qui montre tous les champs du format. Pas un vrai référentiel.
