# yaml-language-server: $schema=../../../schema/standard.schema.json
#
# STANDARD METADATA
# A standard = one product family. Its controls live in ./controls/,
# their translations in ./i18n/<locale>/.

id: buffet                   # URL slug, must equal the folder name. Never changes.
code: BUF                    # used in every control ID: CB-BUF-<DOMAIN>-<NNN>. Unique, never changes.
title: All-you-can-eat buffet security
description: |
  Demo baseline protecting an all-you-can-eat buffet against food poisoning,
  sneezes and plate hoarders. Exists to illustrate the format.
status: draft                # draft | active | deprecated
version: 1.1.0               # SemVer of the current/next release. Release = git tag "buffet/v1.1.0"
released: 2026-10-16         # (optional) date of that release

# What the standard covers. "versions" is the list controls can narrow with applicability.versions.
# For a buffet, "versions" are the formats of buffet.
applies_to:
  - product: All-you-can-eat buffet
    vendor: Any restaurant
    versions: [classic, conveyor]   # classic = self-service tables, conveyor = sushi belt

# Profiles = named sets of controls. A control says which profiles it belongs to.
# "hardened" extends "baseline": applying hardened applies baseline + hardened controls,
# and uses the hardened parameter defaults.
profiles:
  - key: baseline
    title: Baseline
    description: What every buffet should do.
  - key: hardened
    title: Hardened
    description: For buffets during flu season or hosting a competitive eating club.
    extends: baseline

# Domains = the middle segment of control IDs. Frozen in the ID at creation.
domains:
  - code: HYG
    title: Hygiene & temperature
  - code: GUARD
    title: Physical protection
  - code: ABUSE
    title: Abuse prevention
    description: Protecting the buffet against its own customers.

maintainers:                 # one or more; github and affiliation are optional
  - name: Alice
    github: Sn0wAlice
  - name: Bob Martin           # fictional, demo only
    github: demo-bob-martin
    affiliation: Imaginary Bistro
  - name: Chloé Dupont         # fictional, demo only: no GitHub account
    affiliation: Imaginary Food Safety Lab

# Where the content comes from. Never a proprietary benchmark.
primary_sources:
  - title: "[DEMO] Imaginary Food Code"
    url: https://example.org/food-code
    publisher: Demo
    kind: standard           # vendor-doc | standard | rfc | guide | paper | tool | other

# Translations of this file. Control translations are separate files.
i18n:
  fr:
    title: Sécurité d'un buffet à volonté
    description: |
      Référentiel de démo qui protège un buffet à volonté contre les intoxications,
      les éternuements et les accumulateurs d'assiettes. Sert à illustrer le format.
    domains:
      HYG: Hygiène et température
      GUARD: Protection physique
      ABUSE: Prévention des abus
    profiles:
      baseline:
        title: Socle
        description: Ce que tout buffet devrait faire.
      hardened:
        title: Renforcé
        description: Pour les buffets en période de grippe ou qui accueillent un club de mangeurs compétitifs.
