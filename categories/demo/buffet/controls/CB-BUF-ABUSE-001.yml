# yaml-language-server: $schema=../../../../schema/control.schema.json
#
# DEMO CONTROL 4 - a DEPRECATED control.
# It is never deleted: old reports and links still resolve.
# Deprecation requires deprecated_in, deprecation_reason and superseded_by.

id: CB-BUF-ABUSE-001
title: Limit each customer to three trips to the buffet
finding:
  title: Customers can go to the buffet an unlimited number of times
status: deprecated
profiles: [baseline]
risk:
  severity: low
assessment: manual

description: |
  Staff count how many times each customer goes to the buffet and stop them after three.
rationale: |
  Limits waste from customers who take more than they eat.
impact: |
  Very unpopular. Staff spend their time counting instead of serving.

audit:
  manual: |
    Ask staff how trips are counted.

remediation:
  manual: |
    Give each customer three tokens at the entrance.

references:
  - title: "[DEMO] Imaginary Food Code, chapter 9: waste"
    url: https://example.org/food-code/chapter-9
    kind: standard

authors:
  - name: Alice
    github: Sn0wAlice

introduced_in: 1.0.0
deprecated_in: 1.1.0         # the release where it stopped being active
deprecation_reason: |
  Counting trips did not reduce waste and made the buffet no longer "all you can eat".
  Replaced by a plate size limit.
superseded_by: [CB-BUF-ABUSE-002]   # [] if retired with no replacement
created: 2026-10-01
updated: 2026-10-10
