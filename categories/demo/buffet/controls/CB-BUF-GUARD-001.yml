# yaml-language-server: $schema=../../../../schema/control.schema.json
#
# DEMO CONTROL 2 - MANUAL control with an APPLICABILITY block
# and a "requires" dependency on another control.

id: CB-BUF-GUARD-001
title: Install sneeze guards above open dishes
finding:
  title: Open dishes are exposed to customers' sneezes and coughs
status: active
profiles: [baseline]
risk:
  severity: medium           # no score: it is optional
assessment: manual           # manual -> audit.checks not required

# Applicability: WHEN this control applies.
applicability:
  versions: [classic]        # sushi belts have a closed dome, not concerned
  requires: [Sneeze guard hardware]          # prerequisites (in real life: licenses, editions, features)
  conditions: |
    Only for dishes customers serve themselves. Dishes served by staff are out of scope.

description: |
  A transparent screen sits between the customer's face and the food,
  low enough to block droplets, high enough to let people reach the dishes.
rationale: |
  Customers lean over dishes while choosing. A sneeze guard stops droplets
  from landing on food served to everyone after them.
impact: |
  None known.                # impact is required: say "None known." if there is none

audit:
  manual: |
    Walk along the buffet. Every self-service dish must have a screen above it,
    between 35 and 45 cm above the counter.

remediation:
  manual: |
    Install a screen above every self-service dish. Clean it at least every hour.

references:
  - title: "[DEMO] Imaginary Food Code, chapter 5: display protection"
    url: https://example.org/food-code/chapter-5
    kind: standard

mappings:
  - framework: demo-food-code
    id: FC-5.1
    relation: equivalent

threats:
  - framework: demo-buffet-threats
    id: BT-002

related_controls:
  - id: CB-BUF-HYG-002
    type: requires           # a sneeze guard is useless if nobody cleans it
    note: The cleaning control covers the screens too.

authors:
  - name: Alice
    github: Sn0wAlice
introduced_in: 1.0.0
created: 2026-10-01
updated: 2026-10-01
