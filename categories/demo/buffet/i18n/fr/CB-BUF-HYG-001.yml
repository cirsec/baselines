# yaml-language-server: $schema=../../../../../schema/control-i18n.schema.json
#
# DEMO TRANSLATION - French version of CB-BUF-HYG-001.
# Only TEXT fields. IDs, checks, parameter values, mappings... always come
# from the source control. Missing fields fall back to English.

id: CB-BUF-HYG-001           # must equal the file name and an existing control
locale: fr                   # must equal the folder (i18n/fr/)

# The source control's "updated" date when this was translated.
# If the source is updated later, this translation is reported as stale.
source_updated: 2026-10-16

translators:
  - name: Alice
    github: Sn0wAlice

title: Maintenir les plats chauds au-dessus de la température de sécurité
finding:
  title: Les plats chauds sont maintenus à une température dangereuse
  description: Les bactéries se multiplient vite dans les plats tièdes. Les clients peuvent tomber malades.
description: |
  Les plats chauds du buffet sont gardés dans des contenants chauffés (bain-marie,
  lampes chauffantes, plaques chauffantes du tapis) à une température à cœur minimale.
rationale: |
  Entre environ 5 et 60 °C, des bactéries comme *Salmonella* se multiplient vite.
  Garder les plats chauds bien chauds est la principale défense contre les intoxications.
impact: |
  Consommation d'énergie plus élevée. Certains plats délicats peuvent sécher.
notes: |
  Mesurer la température **à cœur** du plat, pas en surface ni celle du contenant.
setting:
  location: Thermostat du bain-marie, panneau avant
  recommended_value: "Au moins {{ min_temp_c }} °C à cœur"
parameters:
  min_temp_c: Température à cœur minimale des plats chauds.   # key = parameter name
audit:
  manual: |
    1. Choisir trois plats chauds au hasard.
    2. Mesurer la température à cœur avec une sonde.
    3. Chaque mesure doit être d'au moins {{ min_temp_c }} °C.
remediation:
  manual: |
    Régler le thermostat pour atteindre {{ min_temp_c }} °C à cœur.
    Jeter tout plat resté sous cette température plus de 2 heures.
  rollback: |
    Remettre le thermostat à sa valeur précédente.
