id: CB-M365-AUDIT-011
title: Connect Microsoft Defender for Cloud Apps to Microsoft 365 and enable its policies
finding:
  title: Microsoft Defender for Cloud Apps is not monitoring Microsoft 365 activity
  description: Without the Microsoft 365 app connector and active policies, anomalous activity such as mass downloads, impossible travel or suspicious OAuth apps is not detected.
status: active
profiles: [hardened]
risk:
  severity: medium
assessment: manual
tags: [defender-for-cloud-apps, casb, monitoring, anomaly-detection, oauth]

applicability:
  requires:
    - "Microsoft Defender for Cloud Apps"

description: |
  Microsoft Defender for Cloud Apps has the **Microsoft 365** app connector connected with all
  components (Microsoft Entra users and groups, Microsoft Entra management events, Microsoft 365
  activities, files). The built-in anomaly detection policies are on, and the organization adds at
  least policies for mass download, mass deletion and external sharing of sensitive files, and app
  governance policies for OAuth apps with high privileges or unusual activity. Alerts flow into
  Microsoft Defender XDR incidents handled by the security team.
rationale: |
  Defender for Cloud Apps adds behavioural detection on top of the audit log: it baselines each
  user and raises alerts for activity from unusual locations, ransomware-like file activity,
  suspicious inbox rules and risky OAuth apps. These detections cover attacker behaviour that
  static configuration controls cannot prevent.
impact: |
  Licence cost (included in Microsoft 365 E5 and E5 Security). Anomaly policies need a learning
  period of about seven days and some tuning to reduce false positives.

audit:
  manual: |
    1. Sign in to the Microsoft Defender portal (https://security.microsoft.com) as at least a
       Security Reader.
    2. Browse to **Settings** > **Cloud apps** > **Connected apps** > **App connectors** and check
       that **Microsoft 365** shows **Connected** with all components selected.
    3. Browse to **Cloud apps** > **Policies** > **Policy management** and check that the threat
       detection (anomaly) policies are on, and that file and activity policies exist for mass
       download, mass deletion and external sharing of sensitive files.
    4. Browse to **Cloud apps** > **App governance** and check that app governance is turned on with
       active policies.
    5. Fail if the connector is missing or partial, or if no anomaly or custom policy is active.

remediation:
  manual: |
    1. Sign in to the Microsoft Defender portal as at least a Security Administrator.
    2. Browse to **Settings** > **Cloud apps** > **Connected apps** > **App connectors** > **Connect an
       app** > **Microsoft 365**, select all components and connect.
    3. Browse to **Cloud apps** > **Policies** > **Policy management**, review the built-in anomaly
       detection policies and turn them on, then create activity and file policies from templates
       (for example **Mass download by a single user**, **File shared with personal email
       address**).
    4. Turn on app governance and its predefined policies.
    5. Route alerts through Microsoft Defender XDR incidents to the SOC.
  rollback: |
    Disable the policies or disconnect the app connector.

