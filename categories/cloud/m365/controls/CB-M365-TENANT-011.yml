id: CB-M365-TENANT-011
title: Restrict guest invitations to administrators and Guest Inviters
finding:
  title: Any user, or even guests, can invite external users
  description: Every member, and by default every guest, can bring external accounts into the tenant without any review.
status: active
profiles: [hardened]
risk:
  severity: medium
assessment: manual
tags: [entra-id, guests, invitations, external-identities]

setting:
  location: Microsoft Entra admin center > Entra ID > External Identities > External collaboration settings > Guest invite restrictions
  default_value: Anyone in the organization can invite guest users including guests and non-admins (most inclusive)
  recommended_value: Only users assigned to specific admin roles can invite guest users

description: |
  **Guest invite restrictions** is set to **Only users assigned to specific admin roles can invite
  guest users** (`allowInvitesFrom` = `adminsAndGuestInviters`), or to **No one in the
  organization can invite guest users including admins (most restrictive)** (`none`). Invitations
  come from User Administrators and from people given the Guest Inviter role, or from a governed
  process such as entitlement management.
rationale: |
  Each guest is an account whose authentication the organization does not control. When anyone
  can invite, guests accumulate without a sponsor, a purpose or a review, and an attacker with a
  compromised member account can invite their own external account to keep access.
impact: |
  Users who invite partners directly from Teams, SharePoint or Outlook can no longer do so: the
  request goes through a Guest Inviter, the service desk or an access package. With strong external
  collaboration, assign the Guest Inviter role to enough people per department.
notes: |
  SharePoint and OneDrive sharing with new external people also creates guests through Entra B2B
  integration, and is subject to this setting.

audit:
  manual: |
    1. Sign in to the Microsoft Entra admin center (https://entra.microsoft.com) as at least a
       Global Reader.
    2. Browse to **Entra ID** > **External Identities** > **External collaboration settings** and
       read **Guest invite restrictions**.
    3. Read-only PowerShell alternative (Microsoft Graph, scope `Policy.Read.All`):
       `(Get-MgPolicyAuthorizationPolicy).AllowInvitesFrom`.
    4. Fail if the value is `everyone` or `adminsGuestInvitersAndAllMembers`.

remediation:
  manual: |
    1. Assign the Guest Inviter role to the people who invite partners on behalf of their teams
       (**Entra ID** > **Roles & admins** > **Guest Inviter**).
    2. With an External Identity Provider Administrator or Global Administrator, browse to
       **Entra ID** > **External Identities** > **External collaboration settings**.
    3. Under **Guest invite restrictions**, select **Only users assigned to specific admin roles
       can invite guest users** and **Save**.
    4. Equivalent with Microsoft Graph PowerShell (scope `Policy.ReadWrite.Authorization`):
       `Update-MgPolicyAuthorizationPolicy -AllowInvitesFrom 'adminsAndGuestInviters'`.
  rollback: |
    Select **Member users and users assigned to specific admin roles can invite guest users
    including guests with member permissions**.

