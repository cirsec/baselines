id: CB-M365-TENANT-004
title: Restrict access to group features in My Groups
finding:
  title: Users can browse and manage groups in My Groups
  description: Any user can open My Groups to list the organization's groups and their members, which helps reconnaissance after an account compromise.
status: active
profiles: [hardened]
risk:
  severity: low
assessment: manual
tags: [entra-id, groups, my-groups, reconnaissance]

setting:
  location: Microsoft Entra admin center > Entra ID > Groups > General > Restrict user ability to access groups features in My Groups
  default_value: "No"
  recommended_value: "Yes"

description: |
  The group setting **Restrict user ability to access groups features in My Groups** is set to
  **Yes**: non-administrators cannot use the group features of the My Groups portal
  (https://myaccount.microsoft.com/groups). Group and User Administrators keep read-only access
  there.
rationale: |
  My Groups lets users discover groups, their owners and members, and request to join them. An
  attacker with a regular account uses it to map teams and pick targets. Restricting the portal
  reduces this exposure when groups are managed by administrators or by Teams.
impact: |
  Users no longer create or manage groups from My Groups; owners manage membership in Teams,
  Outlook or through the service desk. Self-service join requests stop working.
notes: |
  The setting has no public API.

audit:
  manual: |
    1. Sign in to the Microsoft Entra admin center (https://entra.microsoft.com) as at least a
       Global Reader.
    2. Browse to **Entra ID** > **Groups** > **General**, section **Self Service Group
       Management**.
    3. Fail if **Restrict user ability to access groups features in My Groups** is **No**.

remediation:
  manual: |
    1. Sign in to the Microsoft Entra admin center as at least a Groups Administrator.
    2. Browse to **Entra ID** > **Groups** > **General**.
    3. Set **Restrict user ability to access groups features in My Groups** to **Yes** and select
       **Save**.
  rollback: |
    Set the option back to **No**.

