id: CB-M365-TENANT-018
title: Disable external sharing of Sway content
finding:
  title: Users can share Sways outside the organization
  description: Sways can be shared with external people or anyone with the link, outside the sharing controls applied to SharePoint and OneDrive.
status: active
profiles: [hardened]
risk:
  severity: low
assessment: manual
tags: [microsoft-365, sway, external-sharing, data-exposure]

setting:
  location: Microsoft 365 admin center > Settings > Org settings > Services > Sway > Let people in your organization share their sways with people outside your organization
  default_value: Checked
  recommended_value: Cleared

description: |
  In the Sway settings, **Let people in your organization share their sways with people outside
  your organization** is cleared. Sways can only be shared with people in the organization.
rationale: |
  Sway has its own sharing model, not governed by the SharePoint and OneDrive sharing settings,
  sensitivity labels or DLP. Its external links can expose internal content to anyone who gets the
  link. When Sway is not needed for external communication, external sharing should be off.
impact: |
  Users can no longer publish Sways for customers or the public; they use approved channels
  instead. Existing external links stop working for external viewers.
notes: |
  The setting has no PowerShell or Graph equivalent. Sway can also be turned off entirely by
  removing the Sway service plan from licenses.

audit:
  manual: |
    1. Sign in to the Microsoft 365 admin center (https://admin.cloud.microsoft) as at least a
       Global Reader.
    2. Browse to **Settings** > **Org settings** > **Services** > **Sway**, section **Sharing**.
    3. Fail if **Let people in your organization share their sways with people outside your
       organization** is checked.

remediation:
  manual: |
    1. Sign in to the Microsoft 365 admin center as at least a Global Administrator (or Office
       Apps Administrator).
    2. Browse to **Settings** > **Org settings** > **Services** > **Sway**.
    3. Clear **Let people in your organization share their sways with people outside your
       organization** and **Save**.
  rollback: |
    Check the option again.

