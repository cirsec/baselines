# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-M365-COLLAB-020
title: Prevent unmanaged Teams accounts from starting conversations with users
finding:
  title: Unmanaged Teams accounts can find users and start chats with them
  description: An attacker with a free account can search users by email address and open a chat posing as support, which is a common Teams phishing technique.
status: active
profiles: [baseline]
risk:
  severity: high
assessment: manual
tags: [teams, external-access, unmanaged-accounts, phishing]

applicability:
  requires:
    - Microsoft Teams

description: |
  People using Teams accounts not managed by an organization cannot discover users or start
  conversations with them: **External users with Teams accounts not managed by an organization can
  contact users in my organization** is cleared (`AllowTeamsConsumerInbound` = `False`, and
  `EnableTeamsConsumerInbound` = `False` in external access policies). When communication with
  unmanaged accounts is off entirely (CB-M365-COLLAB-019), this control is met.
rationale: |
  Inbound contact from unmanaged accounts is the entry point of many Teams phishing campaigns: the
  attacker looks up the victim's address, sends a chat request with a support-themed display name and
  pushes a link, a file or a remote-assistance session. Blocking inbound discovery removes this
  channel while still allowing users to initiate contact if the organization needs it.
impact: |
  Unmanaged Teams users cannot look up users by email address or start chats; users in the
  organization can still start them if CB-M365-COLLAB-019 is relaxed. None known otherwise.

setting:
  location: Teams admin center > Users > External access > Organization settings > External users with Teams accounts not managed by an organization can contact users in my organization
  default_value: Selected (AllowTeamsConsumerInbound = True)
  recommended_value: Cleared (AllowTeamsConsumerInbound = False)

audit:
  manual: |
    1. Sign in to the Microsoft Teams admin center (https://admin.teams.microsoft.com) as at least a
       Global Reader.
    2. Browse to **Users** > **External access** (**External collaboration** > **External access** in
       the newer navigation) > **Organization settings**. Either **People in my organization can
       communicate with unmanaged Teams accounts** is **Off**, or **External users with Teams accounts
       not managed by an organization can contact users in my organization** is cleared.
    3. With Microsoft Teams PowerShell:
       `Get-CsTenantFederationConfiguration | Select-Object AllowTeamsConsumer, AllowTeamsConsumerInbound`
       and
       `Get-CsExternalAccessPolicy | Select-Object Identity, EnableTeamsConsumerAccess, EnableTeamsConsumerInbound`.
    4. Fail if `AllowTeamsConsumer` and `AllowTeamsConsumerInbound` are both `True`.

remediation:
  manual: |
    1. In the Teams admin center, browse to **Users** > **External access** (**External collaboration**
       > **External access** in the newer navigation) > **Organization settings**, clear **External
       users with Teams accounts not managed by an organization can contact users in my organization**
       (or turn communication with unmanaged accounts off) and **Save**. Role: Teams Administrator.
    2. PowerShell equivalent: `Set-CsTenantFederationConfiguration -AllowTeamsConsumerInbound $false`,
       and `Set-CsExternalAccessPolicy -Identity Global -EnableTeamsConsumerInbound $false`.

