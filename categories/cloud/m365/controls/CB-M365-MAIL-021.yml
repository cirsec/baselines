# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-M365-MAIL-021
title: Turn on the common attachments filter in every anti-malware policy
finding:
  title: Executable and script attachments are not blocked by file type
  description: Files such as .exe, .cmd or .vbe reach mailboxes as long as no malware signature matches them yet.
status: active
profiles: [baseline]
risk:
  severity: high
assessment: manual
tags: [exchange-online-protection, anti-malware, attachments, file-types]

description: |
  Every anti-malware policy that applies to users (the default policy, custom policies and the
  preset policies) has the **common attachments filter** turned on (`EnableFileFilter $true`) with
  at least Microsoft's default list of file types, which includes `exe`, `cmd` and `vbe`. Matching
  messages are rejected with an NDR (`FileTypeAction Reject`) or quarantined (`Quarantine`).

  The filter detects the real file type, not only the extension, for the types that support true
  type matching. Custom policies are enabled and their recipient conditions do not leave users
  without a policy other than the default one.
rationale: |
  Executables, scripts, installers and disk images have no place in normal email and are a classic
  first stage of malware delivery. Blocking them by type stops new samples that signature scanning
  does not know yet, at no cost to legitimate mail.
impact: |
  Users can no longer receive the listed file types by email, also from internal senders. Teams
  that exchange such files (developers, IT) use SharePoint, OneDrive or another approved channel.

audit:
  manual: |
    1. Sign in to the Microsoft Defender portal (https://security.microsoft.com) as at least a
       Security Reader.
    2. Browse to **Email & collaboration** > **Policies & rules** > **Threat policies** >
       **Anti-malware** and open each policy.
    3. Under **Protection settings**, check that **Enable the common attachments filter** is selected,
       that the file type list contains at least the default types, and that **When these file types
       are found** is **Reject the message with a non-delivery report (NDR)** or **Quarantine the
       message**.
    4. In Exchange Online PowerShell (read-only):
       ```powershell
       Get-MalwareFilterPolicy | Format-List Name, EnableFileFilter, FileTypeAction, FileTypes
       Get-MalwareFilterRule | Format-Table Name, State, Priority
       ```
    5. Fail if a policy that applies to users has `EnableFileFilter` set to `False`, if `FileTypes`
       lacks `exe`, `cmd` or `vbe` or other default types, or if a custom policy is disabled while
       users depend on it.

remediation:
  manual: |
    1. In the Defender portal, open the policy > **Edit protection settings**.
    2. Select **Enable the common attachments filter**, keep the default file types (select
       **Select file types** to add more), choose **Reject the message with a non-delivery report
       (NDR)** and save.
    3. PowerShell equivalent (Security Administrator):
       ```powershell
       Set-MalwareFilterPolicy -Identity Default -EnableFileFilter $true -FileTypeAction Reject
       ```
       Removing types from the list needs `-FileTypes` with the full list; do not remove default types.
  rollback: |
    `Set-MalwareFilterPolicy -Identity <policy> -EnableFileFilter $false` (not recommended).

