id: CB-M365-TENANT-002
title: Disable LinkedIn account connections
finding:
  title: Users can connect their work account to LinkedIn
  description: Users can share work contacts and profile data between Microsoft 365 and LinkedIn, outside the organization's control.
status: active
profiles: [hardened]
risk:
  severity: low
assessment: manual
tags: [entra-id, user-settings, linkedin, data-sharing, privacy]

setting:
  location: Microsoft Entra admin center > Entra ID > Users > User settings > LinkedIn account connections
  default_value: "Yes"
  recommended_value: "No"

description: |
  The user setting **LinkedIn account connections** is set to **No**: users cannot link their
  work account to a LinkedIn account, and LinkedIn profile information is not shown in Microsoft
  365 apps.
rationale: |
  Once connected, LinkedIn and Microsoft 365 exchange profile and contact data. This builds a
  picture of the organization's people and relations that attackers use for targeted phishing,
  and it moves personal data to a third-party service, which matters under GDPR.
impact: |
  Users no longer see LinkedIn profile cards in Outlook, Teams or other apps. Existing connections
  are removed.
notes: |
  The setting has no public API.

audit:
  manual: |
    1. Sign in to the Microsoft Entra admin center (https://entra.microsoft.com) as at least a
       Global Reader.
    2. Browse to **Entra ID** > **Users** > **User settings** and read **LinkedIn account
       connections**.
    3. Fail if it is **Yes** or **Selected group**.

remediation:
  manual: |
    1. Sign in to the Microsoft Entra admin center as at least a Global Administrator.
    2. Browse to **Entra ID** > **Users** > **User settings**.
    3. Set **LinkedIn account connections** to **No** and select **Save**.
  rollback: |
    Set the option back to **Yes** or **Selected group**.

