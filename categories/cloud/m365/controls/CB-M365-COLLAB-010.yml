# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-M365-COLLAB-010
title: Make Anyone links expire and grant view only
finding:
  title: Anyone links never expire or allow editing
  description: Links that need no sign-in stay valid indefinitely and may let unknown people modify or upload content.
status: active
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [anonymous-links, sharing-links, sharepoint, onedrive]

description: |
  Where **Anyone** links are allowed (an exception to CB-M365-COLLAB-003, for the tenant, a site or a
  OneDrive), they are constrained:

  - they expire after at most `{{ anyone_link_max_days }}` days (`RequireAnonymousLinksExpireInDays`);
  - they only give **View** permission, for files and for folders (`FileAnonymousLinkType` and
    `FolderAnonymousLinkType` = `View`).

  If neither SharePoint nor OneDrive allows **Anyone** links, the control is met.
rationale: |
  An **Anyone** link is a bearer credential. An expiry date bounds how long a leaked or forgotten link
  exposes the content. View-only stops unauthenticated people from altering documents, replacing them
  with malicious files, or using an upload folder to plant content in the tenant.
impact: |
  Users must recreate links after expiry. A shorter expiry also shortens existing links when the new
  value is lower. **File requests** and **View, edit, and upload** folder links stop working.

parameters:
  - name: anyone_link_max_days
    type: integer
    description: Maximum lifetime of an Anyone link.
    unit: days
    default: 30
    minimum: 1
    maximum: 730

audit:
  manual: |
    1. Sign in to the SharePoint admin center (https://admin.microsoft.com/sharepoint) as at least a
       Global Reader.
    2. Browse to **Policies** > **Sharing**. If both sliders are below **Anyone**, the control is met.
    3. Otherwise, under **Choose expiration and permissions options for Anyone links**, check that
       **These links must expire within this many days** is selected with at most
       `{{ anyone_link_max_days }}`, and that **These links can give these permissions** is **View** for
       **Files** and **Folders**.
    4. With the SharePoint Online Management Shell (SharePoint Administrator):
       `Get-SPOTenant | Select-Object SharingCapability, OneDriveSharingCapability, RequireAnonymousLinksExpireInDays, FileAnonymousLinkType, FolderAnonymousLinkType`.
    5. Fail if **Anyone** links are allowed and `RequireAnonymousLinksExpireInDays` is `0` or greater
       than `{{ anyone_link_max_days }}`, or if either link type is not `View`.

remediation:
  manual: |
    1. In the SharePoint admin center, browse to **Policies** > **Sharing** > **Choose expiration and
       permissions options for Anyone links**.
    2. Select **These links must expire within this many days** and enter `{{ anyone_link_max_days }}`
       or less.
    3. Set **Files** and **Folders** to **View**. Select **Save**. Role: SharePoint Administrator.
    4. PowerShell equivalent:
       `Set-SPOTenant -RequireAnonymousLinksExpireInDays {{ anyone_link_max_days }} -FileAnonymousLinkType View -FolderAnonymousLinkType View`.

