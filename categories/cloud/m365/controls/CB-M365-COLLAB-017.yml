id: CB-M365-COLLAB-017
title: Disable email delivery to Teams channels
finding:
  title: Teams channels accept messages sent to their email address
  description: Anyone who learns a channel address can post content and attachments into the channel, bypassing the sender checks applied to chat.
status: active
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [teams, email, phishing]

applicability:
  requires:
    - Microsoft Teams

description: |
  Users cannot send email to a channel email address (`AllowEmailIntoChannel` = `False`), and no SMTP
  domain is listed in **Accept channel email from these SMTP domains**.
rationale: |
  Channel addresses are static and often end up in mailing lists, forwarding rules or leaked
  documents. Mail posted into a channel appears as channel content that members trust, which makes it
  a phishing and malware delivery path into Teams that does not depend on external access settings.
impact: |
  Workflows that post to channels by email (alerts, newsletters, forwarding) stop working. Replace
  them with Power Automate flows, the Workflows app or incoming webhooks under app governance.

setting:
  location: Teams admin center > Teams > Teams settings > Email integration > Users can send emails to a channel email address
  default_value: "On"
  recommended_value: Off (AllowEmailIntoChannel = False)

audit:
  manual: |
    1. Sign in to the Microsoft Teams admin center (https://admin.teams.microsoft.com) as at least a
       Global Reader.
    2. Browse to **Teams** > **Teams settings** > **Email integration** and check that **Users can send
       emails to a channel email address** is **Off**.
    3. With Microsoft Teams PowerShell:
       `Get-CsTeamsClientConfiguration -Identity Global | Select-Object AllowEmailIntoChannel, RestrictedSenderList`.
    4. Fail if `AllowEmailIntoChannel` is `True`.

remediation:
  manual: |
    1. Identify channels that receive email (ask team owners, or look for mail flow to `*.teams.ms`
       addresses in the Exchange message trace) and plan replacements.
    2. In the Teams admin center, browse to **Teams** > **Teams settings** > **Email integration**, turn
       off **Users can send emails to a channel email address** and clear the accepted domains. Select
       **Save**. Role: Teams Administrator.
    3. PowerShell equivalent:
       `Set-CsTeamsClientConfiguration -Identity Global -AllowEmailIntoChannel $false`.

