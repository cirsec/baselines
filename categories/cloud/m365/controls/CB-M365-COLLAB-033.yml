# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-M365-COLLAB-033
title: Keep zero-hour auto purge enabled for Teams messages
finding:
  title: Malicious Teams messages are not removed after delivery
  description: A chat message later identified as malware or high-confidence phishing stays in the conversation, where users can still open it.
status: active
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [teams, zap, malware, phishing, defender-for-office-365]

applicability:
  requires:
    - Microsoft Teams
    - Microsoft Defender for Office 365 Plan 1

description: |
  Zero-hour auto purge (ZAP) is on in the Teams protection policy (`ZapEnabled` = `True`): when a
  Teams chat or channel message is identified as malware or high-confidence phishing after delivery,
  it is blocked for recipients and placed in quarantine. No Teams protection rule excludes users,
  groups or domains without a documented reason.
rationale: |
  Verdicts often arrive after delivery, once a URL is detonated or a campaign is recognized. ZAP
  removes the message retroactively, which is the only remediation that reaches every recipient before
  they click. It is on by default; the control guards against it being turned off or bypassed with
  broad exclusions.
impact: |
  Messages purged by ZAP disappear from the conversation for recipients and appear in quarantine,
  where admins can release false positives. None known otherwise.

setting:
  location: Microsoft Defender portal > Email & collaboration > Policies & rules > Threat policies > Teams protection > Zero-hour auto purge (ZAP)
  default_value: "On"
  recommended_value: On (ZapEnabled = True), no undocumented exclusions

audit:
  manual: |
    1. Sign in to the Microsoft Defender portal (https://security.microsoft.com) as at least a Security
       Reader.
    2. Browse to **Email & collaboration** > **Policies & rules** > **Threat policies** > **Teams
       protection**.
    3. Check that **Zero-hour auto purge (ZAP)** is **On** and review the **Exclude these participants**
       section.
    4. With Exchange Online PowerShell (View-Only Organization Management or Global Reader):
       `Get-TeamsProtectionPolicy | Format-List ZapEnabled` and
       `Get-TeamsProtectionPolicyRule | Format-List ExceptIfSentTo, ExceptIfSentToMemberOf, ExceptIfRecipientDomainIs`.
    5. Fail if `ZapEnabled` is `False`, or if exclusions cover users or groups without a documented
       reason.

remediation:
  manual: |
    1. In the Defender portal, browse to **Email & collaboration** > **Policies & rules** > **Threat
       policies** > **Teams protection**, select **Edit** in the ZAP section, turn **ZAP** on, remove
       unjustified exclusions and **Save**. Role: Security Administrator.
    2. PowerShell equivalent:
       `Set-TeamsProtectionPolicy -Identity "Teams Protection Policy" -ZapEnabled $true`.
    3. Check that the quarantine policies for Teams malware and phishing let admins review purged
       messages.

