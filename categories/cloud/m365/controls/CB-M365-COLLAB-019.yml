# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-M365-COLLAB-019
title: Block Teams communication with unmanaged Teams accounts
finding:
  title: Users can chat with personal Teams accounts not managed by any organization
  description: Anyone with a free Microsoft account can exchange messages and files with users, outside any tenant accountability.
status: active
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [teams, external-access, unmanaged-accounts, phishing]

applicability:
  requires:
    - Microsoft Teams

description: |
  Users cannot communicate with Teams accounts that no organization manages (Teams free, personal
  Microsoft accounts): **People in my organization can communicate with unmanaged Teams accounts** is
  off at organization level (`AllowTeamsConsumer` = `False`) and in the global external access policy
  (`EnableTeamsConsumerAccess` = `False`).
rationale: |
  Unmanaged accounts are free, anonymous and disposable, and no tenant administrator can be asked to
  act on abuse. They are a direct channel for phishing, malware delivery and exfiltration through
  chat, and they let insiders move data to a personal identity. Business partners have managed
  accounts and use federation instead.
impact: |
  Existing chats with personal Teams accounts stop working. Organizations that work with individuals
  (freelancers, citizens) must invite them as guests or use meetings with the lobby. Skype consumer
  interoperability (`AllowPublicUsers`) has no effect since Skype was retired in May 2025.

setting:
  location: Teams admin center > Users > External access > Organization settings > People in my organization can communicate with unmanaged Teams accounts
  default_value: "On"
  recommended_value: Off (AllowTeamsConsumer = False)

audit:
  manual: |
    1. Sign in to the Microsoft Teams admin center (https://admin.teams.microsoft.com) as at least a
       Global Reader.
    2. Browse to **Users** > **External access** (**External collaboration** > **External access** in
       the newer navigation) > **Organization settings** and check that **People in my organization can
       communicate with unmanaged Teams accounts** is **Off**.
    3. On the **Policies** tab, open each policy and check that communication with unmanaged Teams
       accounts is off.
    4. With Microsoft Teams PowerShell:
       `Get-CsTenantFederationConfiguration | Select-Object AllowTeamsConsumer` must return `False`, and
       `Get-CsExternalAccessPolicy | Select-Object Identity, EnableTeamsConsumerAccess` must show
       `False` for every policy assigned to users.
    5. Fail if the organization setting is on.

remediation:
  manual: |
    1. In the Teams admin center, browse to **Users** > **External access** (**External collaboration**
       > **External access** in the newer navigation) > **Organization settings**, turn off **People in
       my organization can communicate with unmanaged Teams accounts** and **Save**. Role: Teams
       Administrator.
    2. PowerShell equivalent: `Set-CsTenantFederationConfiguration -AllowTeamsConsumer $false`, and
       `Set-CsExternalAccessPolicy -Identity Global -EnableTeamsConsumerAccess $false`.
  rollback: |
    Run
    `Set-CsTenantFederationConfiguration -AllowTeamsConsumer $true -AllowTeamsConsumerInbound $false` to
    allow outbound contact only (CB-M365-COLLAB-020 still met).

