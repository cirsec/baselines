id: CB-M365-COLLAB-024
title: Prevent anonymous users and dial-in callers from starting Teams meetings
finding:
  title: Anonymous users and dial-in callers can start Teams meetings without an organizer
  description: Anyone holding a meeting link or dial-in number can use the organization's meeting at any time, with nobody from the organization present.
status: active
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [teams, meetings, anonymous-access, lobby]

applicability:
  requires:
    - Microsoft Teams

description: |
  Anonymous participants and people dialing in by phone wait in the lobby until an authenticated
  participant (someone from the organization, a guest or a trusted organization user) starts the
  meeting (`AllowAnonymousUsersToStartMeeting` = `False` in every meeting policy).
rationale: |
  Leaderless meetings let unverified people meet on the organization's bridge at unscheduled times,
  reuse old meeting links for their own purposes, and run up audio conferencing costs. Keeping them in
  the lobby until a verified participant arrives keeps control of the meeting with its organizer.
impact: |
  Recurring meetings where external dial-in participants used to start without the organizer must wait
  for an internal participant. None known otherwise; Off is the default.

setting:
  location: Teams admin center > Meetings > Meeting policies > Meeting join & lobby > Anonymous users and dial-in callers can start a meeting
  default_value: "Off"
  recommended_value: Off (AllowAnonymousUsersToStartMeeting = False)

audit:
  manual: |
    1. Sign in to the Microsoft Teams admin center (https://admin.teams.microsoft.com) as at least a
       Global Reader.
    2. Browse to **Meetings** > **Meeting policies** and open the **Global (Org-wide default)** policy,
       then every custom policy assigned to users.
    3. In the **Meeting join & lobby** section, check that **Anonymous users and dial-in callers can
       start a meeting** is **Off**.
    4. With Microsoft Teams PowerShell (Global Reader is enough):
       `Get-CsTeamsMeetingPolicy | Select-Object Identity, AllowAnonymousUsersToStartMeeting`.
    5. Fail if any policy returns `True`.

remediation:
  manual: |
    1. In the Teams admin center, browse to **Meetings** > **Meeting policies** and open the **Global
       (Org-wide default)** policy.
    2. In the **Meeting join & lobby** section, set **Anonymous users and dial-in callers can start a
       meeting** to **Off** and **Save**. Role: Teams Administrator.
    3. Repeat for each custom policy, unless a documented exception applies to its users.
    4. PowerShell equivalent:
       `Set-CsTeamsMeetingPolicy -Identity Global -AllowAnonymousUsersToStartMeeting $false` (repeat
       with `-Identity <policy>` for custom policies). Changes can take up to 24 hours to apply.

