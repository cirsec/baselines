id: CB-M365-AUDIT-005
title: Keep mailbox auditing on by default for the organization
finding:
  title: Mailbox auditing is turned off at the organization level
  description: With AuditDisabled set to True, no mailbox records owner, delegate or administrator actions, whatever its own settings say.
status: active
profiles: [baseline]
risk:
  severity: high
assessment: manual
tags: [audit, logging, exchange, mailbox-audit]

description: |
  Mailbox auditing on by default is in effect for the organization: `AuditDisabled` is `False` in
  the Exchange Online organization configuration, so every user, shared and resource mailbox
  records the default audit actions and sends them to the unified audit log.
rationale: |
  Mailbox audit records are the evidence of what happened inside a mailbox: messages moved or
  deleted, inbox rules created, delegate access, messages sent as another user. An attacker or an
  administrator can turn auditing off for the whole organization with one command; this setting
  overrides the `AuditEnabled` value of each mailbox.
impact: |
  None known. This is the Microsoft default.

setting:
  location: Exchange Online PowerShell, Get-OrganizationConfig AuditDisabled
  default_value: "False"
  recommended_value: "False"

audit:
  manual: |
    1. Connect to Exchange Online PowerShell as at least a member of View-Only Organization
       Management (or Global Reader).
    2. Run `Get-OrganizationConfig | Format-List AuditDisabled`.
    3. Fail if `AuditDisabled` is `True`.

remediation:
  manual: |
    1. Connect to Exchange Online PowerShell with the Organization Management role (or Audit Logs
       role).
    2. Run `Set-OrganizationConfig -AuditDisabled $false`.
    3. Alert on any later change (audit operation `Set-OrganizationConfig` with the `AuditDisabled`
       parameter).
  rollback: |
    Not recommended. `Set-OrganizationConfig -AuditDisabled $true` stops mailbox auditing for the
    whole organization.

