# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-M365-DATA-004
title: Enforce a DLP policy for Microsoft 365 Copilot
finding:
  title: Microsoft 365 Copilot can process and summarize the most sensitive content without restriction
  description: Without a Copilot DLP policy, prompts containing personal identifiers are processed and sent to web search, and highly confidential labelled files appear in AI summaries for anyone who can open them.
status: active
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [dlp, purview, copilot, ai, data-protection, sensitivity-labels]

applicability:
  requires:
    - "Microsoft 365 Copilot"

description: |
  A Microsoft Purview DLP policy on the **Microsoft 365 Copilot and Copilot Chat** location is
  turned on for all users, with at least two rules:

  - **Content contains** > **Sensitivity labels** with the organization's highest labels (for
    example *Highly confidential*, *Personal*) and the action **Prevent Copilot from processing
    content**;
  - **Content contains** > **Sensitive information types** with the types of CB-M365-DATA-001 and
    the action **Prevent Copilot from processing content** > **Performing Web Searches** (and
    **Processing prompts** where the business accepts it).
rationale: |
  Copilot works with the user's permissions, so oversharing problems become instantly visible
  through summaries and search. Excluding the most sensitive labelled content from Copilot
  processing limits that exposure, and blocking web grounding for prompts that contain personal
  identifiers prevents them from being sent to an external search provider.
impact: |
  Users cannot get Copilot answers based on excluded labelled items (they still appear in
  citations). The label rule needs a label taxonomy in place (CB-M365-DATA-005). Policy changes
  can take up to four hours to apply.
notes: |
  The Copilot location only exists in the **Custom** template and cannot be combined with other
  locations in the same policy. Blocking external email from Copilot grounding (preview) is a
  useful addition against prompt injection.

audit:
  manual: |
    1. Sign in to the Microsoft Purview portal (https://purview.microsoft.com) as at least a Global
       Reader.
    2. Browse to **Solutions** > **Data Loss Prevention** > **Policies**.
    3. Find a policy with the **Microsoft 365 Copilot and Copilot Chat** location for all users,
       **Status** = **On**, and check its rules against the description.
    4. Alternative in Security & Compliance PowerShell: `Get-DlpCompliancePolicy | Format-List
       Name,Mode,Locations` and `Get-DlpComplianceRule -Policy <policy> | Format-List
       Name,ContentContainsSensitiveInformation,AdvancedRule,RestrictAccess` (the Copilot location
       is exposed as an `Applications` location of type Copilot).
    5. Fail if no enforced policy targets the Copilot location, or if it has neither a label rule
       nor a sensitive information type rule.

remediation:
  manual: |
    1. Sign in to the Microsoft Purview portal with Purview Data Security AI Admin, Compliance
       Administrator or Compliance Data Administrator.
    2. Browse to **Solutions** > **Data Loss Prevention** > **Policies** > **Create policy** >
       **Custom** > **Custom policy**.
    3. On **Locations**, turn on **Microsoft 365 Copilot and Copilot Chat** only, for all users.
    4. Add a rule **Content contains** > **Sensitivity labels** (highest labels) with **Prevent
       Copilot from processing content**.
    5. Add a second rule **Content contains** > **Sensitive information types** (types of
       CB-M365-DATA-001) with **Prevent Copilot from processing content** > **Performing Web
       Searches**, and optionally **Processing prompts**.
    6. Turn on policy tips with a link to the internal data handling page, run in simulation, then
       turn the policy on.
  rollback: |
    Set the policy to simulation or off.

