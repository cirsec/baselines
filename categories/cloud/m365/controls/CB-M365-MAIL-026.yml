# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-M365-MAIL-026
title: Scan SharePoint, OneDrive and Teams files with Safe Attachments and block infected downloads
finding:
  title: Files stored in SharePoint, OneDrive and Teams are not scanned by Safe Attachments
  description: Malicious files uploaded or shared in collaboration sites are not detected, and users can still download a file once it is flagged.
status: active
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [defender-for-office-365, safe-attachments, sharepoint, onedrive, teams]

applicability:
  requires:
    - "Microsoft Defender for Office 365 Plan 1"

description: |
  Two settings are on:

  - **Turn on Defender for Office 365 for SharePoint, OneDrive, and Microsoft Teams** in the Safe
    Attachments global settings (`EnableATPForSPOTeamsODB $true`);
  - SharePoint prevents users from downloading files that Defender detected as malicious
    (`DisallowInfectedFileDownload $true`).
rationale: |
  Collaboration storage is a common way to spread malware inside the organization and to partners:
  a file shared from a trusted tenant does not go through email filtering. Scanning catches it, and
  blocking the download stops users from opening it anyway.
impact: |
  Users cannot download, open in the desktop app, copy or sync files flagged as malicious; they can
  still delete them. Administrators can release false positives from quarantine.

audit:
  manual: |
    1. Sign in to the Microsoft Defender portal (https://security.microsoft.com) as at least a
       Security Reader.
    2. Browse to **Email & collaboration** > **Policies & rules** > **Threat policies** > **Safe
       Attachments** > **Global settings** and check that **Turn on Defender for Office 365 for
       SharePoint, OneDrive, and Microsoft Teams** is on.
    3. In Exchange Online PowerShell (read-only):
       ```powershell
       Get-AtpPolicyForO365 | Format-List EnableATPForSPOTeamsODB
       ```
    4. In SharePoint Online Management Shell (`Get-SPOTenant` requires the SharePoint Administrator
       role; there is no read-only role for it):
       ```powershell
       Get-SPOTenant | Format-List DisallowInfectedFileDownload
       ```
    5. Fail if either value is `False`.

remediation:
  manual: |
    1. In the Defender portal, **Safe Attachments** > **Global settings**, turn on **Turn on
       Defender for Office 365 for SharePoint, OneDrive, and Microsoft Teams** and save. PowerShell
       equivalent (Security Administrator):
       ```powershell
       Set-AtpPolicyForO365 -EnableATPForSPOTeamsODB $true
       ```
    2. In SharePoint Online Management Shell (SharePoint Administrator):
       ```powershell
       Set-SPOTenant -DisallowInfectedFileDownload $true
       ```
  rollback: |
    `Set-SPOTenant -DisallowInfectedFileDownload $false`.

