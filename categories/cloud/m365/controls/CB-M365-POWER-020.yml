id: CB-M365-POWER-020
title: Restrict service principal profiles in Power BI to approved groups
finding:
  title: Any service principal can create and use Power BI profiles
  description: Every service principal can create profiles that hold their own workspace permissions, which multiplies identities that are hard to review.
status: active
profiles: [baseline]
risk:
  severity: low
assessment: manual
tags: [fabric, power-bi, service-principals, embedded, workload-identities]

applicability:
  requires:
    - "Power BI / Microsoft Fabric"

description: |
  The Fabric tenant setting **Allow service principals to create and use profiles** (Developer
  settings) is **Disabled**, or **Enabled** only for specific security groups containing the
  service principals of approved multitenant embedding applications.
rationale: |
  Service principal profiles let one application act as many isolated identities, one per
  customer, each with its own workspace access. They are useful for Power BI Embedded ISV scenarios
  and useless elsewhere. Leaving the feature open to every service principal creates identities and
  permissions that do not appear in the usual Entra reviews; restricting it keeps them to the
  applications designed for it.
impact: |
  Applications outside the allowed groups can no longer create or use profiles. Only multitenant
  Power BI Embedded applications normally rely on this feature.

setting:
  location: Fabric admin portal > Tenant settings > Developer settings > Allow service principals to create and use profiles
  recommended_value: Disabled, or Enabled for specific security groups

audit:
  manual: |
    1. Sign in to Microsoft Fabric (https://app.fabric.microsoft.com) as a Fabric Administrator.
    2. Open **Settings** > **Admin portal** > **Tenant settings** > **Developer settings** and
       expand **Allow service principals to create and use profiles**.
    3. Check that it is **Disabled**, or **Enabled** for **Specific security groups** only.
    4. Alternative, read only: in `GET https://api.fabric.microsoft.com/v1/admin/tenantsettings`,
       read the entry `AllowServicePrincipalsCreateAndUseProfiles`.
    5. Fail if the setting is enabled for the entire organization.

remediation:
  manual: |
    1. In **Tenant settings** > **Developer settings** > **Allow service principals to create and
       use profiles**, select **Disabled**, or **Enabled** with **Specific security groups**. Select
       **Apply**. Role: Fabric Administrator.
    2. API equivalent: `POST
       https://api.fabric.microsoft.com/v1/admin/tenantsettings/AllowServicePrincipalsCreateAndUseProfiles/update`
       with the target state.
  rollback: |
    Set the setting back to its previous scope.

