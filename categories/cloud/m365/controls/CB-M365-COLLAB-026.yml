id: CB-M365-COLLAB-026
title: Keep dial-in callers in the Teams meeting lobby
finding:
  title: People dialing in by phone join Teams meetings without passing through the lobby
  description: A caller with the dial-in number and conference ID enters the meeting directly, identified only by a phone number that can be spoofed.
status: active
profiles: [baseline]
risk:
  severity: low
assessment: manual
tags: [teams, meetings, lobby, pstn]

applicability:
  requires:
    - Microsoft Teams

description: |
  People who join a meeting by phone wait in the lobby until an organizer, co-organizer or presenter
  admits them (`AllowPSTNUsersToBypassLobby` = `False` in every meeting policy).
rationale: |
  Dial-in participants are not authenticated: their caller ID can be spoofed and conference IDs leak
  through forwarded invitations. Keeping them in the lobby lets the organizer decide before they hear
  the meeting.
impact: |
  Organizers must admit phone participants. The setting is a default that organizers can change in
  **Meeting options**. Off is the default.

setting:
  location: Teams admin center > Meetings > Meeting policies > Meeting join & lobby > People dialing in can bypass the lobby
  default_value: "Off"
  recommended_value: Off (AllowPSTNUsersToBypassLobby = False)

audit:
  manual: |
    1. Sign in to the Microsoft Teams admin center (https://admin.teams.microsoft.com) as at least a
       Global Reader.
    2. Browse to **Meetings** > **Meeting policies** and open the **Global (Org-wide default)** policy,
       then every custom policy assigned to users.
    3. In the **Meeting join & lobby** section, check that **People dialing in can bypass the lobby** is
       **Off**.
    4. With Microsoft Teams PowerShell (Global Reader is enough):
       `Get-CsTeamsMeetingPolicy | Select-Object Identity, AllowPSTNUsersToBypassLobby`.
    5. Fail if any policy returns `True`.

remediation:
  manual: |
    1. In the Teams admin center, browse to **Meetings** > **Meeting policies** and open the **Global
       (Org-wide default)** policy.
    2. In the **Meeting join & lobby** section, set **People dialing in can bypass the lobby** to
       **Off** and **Save**. Role: Teams Administrator.
    3. Repeat for each custom policy, unless a documented exception applies to its users.
    4. PowerShell equivalent:
       `Set-CsTeamsMeetingPolicy -Identity Global -AllowPSTNUsersToBypassLobby $false` (repeat with
       `-Identity <policy>` for custom policies). Changes can take up to 24 hours to apply.

