# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-M365-COLLAB-031
title: Turn off Teams meeting recording by default
finding:
  title: Every user can record Teams meetings
  description: Recordings and transcripts of confidential meetings are created freely and stored in OneDrive or SharePoint, where they can be shared further.
status: active
profiles: [hardened]
risk:
  severity: low
assessment: manual
tags: [teams, meetings, recording, data-protection]

applicability:
  requires:
    - Microsoft Teams

description: |
  Cloud recording is off in the Global meeting policy (`AllowCloudRecording` = `False`); only users
  assigned a custom policy for a documented need can record. For live events, **Record an event** is
  not **Always record** (`BroadcastRecordingMode` is not `AlwaysEnabled`).
rationale: |
  A recording captures everything said and shown, including content shared by external participants,
  and is stored as a file that follows the recorder's sharing habits and retention. Limiting recording
  to named users who need it reduces copies of sensitive discussions and makes each recording an
  expected, governed artifact.
impact: |
  Users without the custom policy cannot record or, depending on transcription settings, transcribe
  meetings; people who rely on recordings for absent colleagues or training need the custom policy.
  Recording for town halls and webinars is controlled separately in events policies
  (`RecordingForTownhall`, `RecordingForWebinar`); align them with this decision.

setting:
  location: Teams admin center > Meetings > Meeting policies > Recording & transcription > Meeting recording
  default_value: "On"
  recommended_value: Off in the Global policy (AllowCloudRecording = False)

audit:
  manual: |
    1. Sign in to the Microsoft Teams admin center (https://admin.teams.microsoft.com) as at least a
       Global Reader.
    2. Browse to **Meetings** > **Meeting policies** and open the **Global (Org-wide default)** policy,
       then every custom policy assigned to users.
    3. In the **Recording & transcription** section, check that **Meeting recording** is **Off** in the
       Global policy, and **On** only in custom policies assigned to approved users.
    4. With Microsoft Teams PowerShell (Global Reader is enough):
       `Get-CsTeamsMeetingPolicy | Select-Object Identity, AllowCloudRecording`. For live events:
       `Get-CsTeamsMeetingBroadcastPolicy | Select-Object Identity, BroadcastRecordingMode`.
    5. Fail if the Global policy returns `True`, or if `Get-CsTeamsMeetingBroadcastPolicy` returns
       `AlwaysEnabled` for any policy.

remediation:
  manual: |
    1. In the Teams admin center, browse to **Meetings** > **Meeting policies** and open the **Global
       (Org-wide default)** policy.
    2. In the **Recording & transcription** section, set **Meeting recording** to **Off** and **Save**.
       Role: Teams Administrator.
    3. Repeat for each custom policy, unless a documented exception applies to its users.
    4. PowerShell equivalent: `Set-CsTeamsMeetingPolicy -Identity Global -AllowCloudRecording $false`
       (repeat with `-Identity <policy>` for custom policies). Changes can take up to 24 hours to apply.
    5. Create a custom meeting policy with recording on and assign it only to approved users.
    6. If live events policies still exist, set **Record an event** to **Organizer can record** or
       **Never record** (`Set-CsTeamsMeetingBroadcastPolicy -Identity Global -BroadcastRecordingMode
       UserOverride`).
  rollback: |
    Run `Set-CsTeamsMeetingPolicy -Identity Global -AllowCloudRecording $true`.

