# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-M365-AUTH-006
title: Show application name and location in Microsoft Authenticator notifications
finding:
  title: Authenticator push notifications do not show the sign-in context
  description: Users approve MFA prompts without seeing which application asks or where the sign-in comes from, so a prompt triggered by an attacker looks like any other.
status: active
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [mfa, microsoft-authenticator, mfa-fatigue, authentication-methods]

description: |
  In the Authentication methods policy, Microsoft Authenticator is configured so that push and
  passwordless notifications show the name of the requesting application and the geographic
  location of the sign-in, for all users enabled for Authenticator. Number matching, which
  Microsoft now enforces on every Authenticator push notification, completes the prompt.

  Both **Show application name in push and passwordless notifications** and **Show geographic
  location in push and passwordless notifications** are set to **Enabled** (not **Microsoft
  managed**, whose current value is disabled) and target **All users** without exclusions.
rationale: |
  MFA fatigue attacks send repeated prompts until the user approves one. Number matching forces
  the user to look at the sign-in screen, and the application name and location give a reason to
  refuse: a sign-in from another country to an unknown application is easy to spot.
impact: |
  None known. The location comes from the IP address and can be approximate, especially behind a
  VPN or a mobile network; tell users so they do not report every mismatch. Context is not shown
  for the NPS extension and AD FS adapter.
setting:
  location: Microsoft Entra admin center > Entra ID > Authentication methods > Policies > Microsoft Authenticator > Configure
  default_value: Microsoft managed (disabled)
  recommended_value: Application name and geographic location both Enabled for All users

audit:
  manual: |
    1. Sign in to the Microsoft Entra admin center (https://entra.microsoft.com) as at least a
       Global Reader.
    2. Browse to **Entra ID** > **Authentication methods** > **Policies** and select **Microsoft
       Authenticator**.
    3. On the **Configure** tab, check **Show application name in push and passwordless
       notifications** and **Show geographic location in push and passwordless notifications**.
       **Require number matching for push notifications** shows **Enabled** and cannot be
       changed: Microsoft enforces it.
    4. Read-only alternative with Microsoft Graph PowerShell (scope `Policy.Read.All`):
       `(Get-MgPolicyAuthenticationMethodPolicyAuthenticationMethodConfiguration -AuthenticationMethodConfigurationId MicrosoftAuthenticator).AdditionalProperties.featureSettings`
       (Graph: `GET https://graph.microsoft.com/v1.0/policies/authenticationMethodsPolicy/authenticationMethodConfigurations/MicrosoftAuthenticator`).
       Look at `displayAppInformationRequiredState` and `displayLocationInformationRequiredState`.
    5. Fail if Microsoft Authenticator is enabled and either setting is **Disabled** or
       **Microsoft managed** (`default`), does not include all users, or excludes a group.

remediation:
  manual: |
    1. Sign in to the Microsoft Entra admin center as at least an Authentication Policy
       Administrator.
    2. Browse to **Entra ID** > **Authentication methods** > **Policies** > **Microsoft
       Authenticator**.
    3. On the **Configure** tab, set **Status** to **Enabled** for **Show application name in push
       and passwordless notifications**, target **All users**, and remove any exclusion.
    4. Do the same for **Show geographic location in push and passwordless notifications**.
    5. Select **Save**.
    Graph equivalent: `PATCH /policies/authenticationMethodsPolicy/authenticationMethodConfigurations/MicrosoftAuthenticator`
    with both `featureSettings` entries set to `"state": "enabled"` and `includeTarget` set to
    `all_users` (GET the configuration first and send it back whole).
  rollback: |
    Set the setting back to **Microsoft managed**.

