# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-M365-POWER-019
title: Restrict Fabric public API access by service principals to approved groups
finding:
  title: Any service principal can call Fabric public APIs
  description: Every application registered in the tenant can use its service principal to call Fabric APIs, within the permissions it is granted on workspaces and items.
status: active
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [fabric, power-bi, service-principals, api, workload-identities]

applicability:
  requires:
    - "Power BI / Microsoft Fabric"

description: |
  The Fabric tenant setting **Service principals can call Fabric public APIs** (Developer
  settings) is **Disabled**, or **Enabled** only for specific security groups that contain the
  service principals of approved applications. Credentials of those service principals are stored
  in a key vault and reviewed with the other workload identities.
rationale: |
  Service principals authenticate without MFA or Conditional Access for users, often with long-lived
  secrets. If any of them can call Fabric APIs, a leaked secret of an unrelated application becomes
  a way to read or change analytics content wherever that principal was granted access. Allowing
  only a named group keeps API access to the applications that were reviewed for it.
impact: |
  Applications whose service principal is outside the allowed groups receive authorization errors
  on Fabric APIs. Microsoft enables this setting by default for new tenants: inventory the
  applications that use Fabric APIs (sign-in logs, admin monitoring) and add their service
  principals to the group before restricting.

setting:
  location: Fabric admin portal > Tenant settings > Developer settings > Service principals can call Fabric public APIs
  default_value: Enabled for the entire organization (new tenants)
  recommended_value: Disabled, or Enabled for specific security groups

audit:
  manual: |
    1. Sign in to Microsoft Fabric (https://app.fabric.microsoft.com) as a Fabric Administrator.
    2. Open **Settings** > **Admin portal** > **Tenant settings** > **Developer settings** and
       expand **Service principals can call Fabric public APIs**.
    3. Check that it is **Disabled**, or **Enabled** for **Specific security groups** whose members
       are approved service principals.
    4. Alternative, read only: in `GET https://api.fabric.microsoft.com/v1/admin/tenantsettings`,
       read the entry `ServicePrincipalAccessPermissionAPIs`.
    5. Fail if the setting is enabled for the entire organization.

remediation:
  manual: |
    1. Create a security group for the service principals of approved applications and add them.
    2. In **Tenant settings** > **Developer settings** > **Service principals can call Fabric public
       APIs**, select **Disabled**, or **Enabled** with **Specific security groups** and the group.
       Select **Apply**. Role: Fabric Administrator.
    3. API equivalent: `POST
       https://api.fabric.microsoft.com/v1/admin/tenantsettings/ServicePrincipalAccessPermissionAPIs/update`
       with the target state.
  rollback: |
    Set the setting back to its previous scope.

