id: CB-M365-TENANT-012
title: Allow guest invitations only to approved domains
finding:
  title: Guests can be invited from any domain
  description: Invitations can be sent to any external address, including consumer mailboxes and lookalike domains, so data can be shared with any organization.
status: active
profiles: [hardened]
risk:
  severity: medium
assessment: manual
tags: [entra-id, guests, invitations, external-identities, allow-list]

parameters:
  - name: allowed_guest_domains
    type: list
    description: External domains whose users may be invited as guests (partners with a business relationship).
    default: []

description: |
  **Collaboration restrictions** is set to **Allow invitations only to the specified domains (most
  restrictive)**, and the list contains exactly the domains of `{{ allowed_guest_domains }}`.
  Invitations to any other domain, including consumer email providers, are refused.
rationale: |
  An allow list limits guest accounts, and therefore sharing through Entra B2B, to organizations
  with a business relationship. It blocks invitations to personal mailboxes used to exfiltrate
  data, and to lookalike domains set up by attackers.
impact: |
  Every new partner domain must be added before its users can be invited, which needs a request
  process. The list applies to new invitations; existing guests from other domains stay until they
  are reviewed (CB-M365-TENANT-013). Partners with several domains need each one listed.
notes: |
  Cross-tenant access settings (CB-M365-TENANT-014) can also allow or block B2B collaboration per
  Microsoft Entra tenant; the domain list here also covers external users without an Entra tenant.

audit:
  manual: |
    1. Sign in to the Microsoft Entra admin center (https://entra.microsoft.com) as at least a
       Global Reader.
    2. Browse to **Entra ID** > **External Identities** > **External collaboration settings**,
       section **Collaboration restrictions**.
    3. Check that **Allow invitations only to the specified domains (most restrictive)** is
       selected and that the domain list matches `{{ allowed_guest_domains }}`.
    4. Read-only alternative with Microsoft Graph (beta, scope `Policy.Read.All`):
       `GET https://graph.microsoft.com/beta/policies/b2bManagementPolicies` and read
       `InvitationsAllowedAndBlockedDomainsPolicy`.
    5. Fail if invitations are allowed to any domain, if a deny list is used instead, or if the
       list contains domains outside the parameter.

remediation:
  manual: |
    1. Collect the partner domains and set the parameter.
    2. With an External Identity Provider Administrator or Global Administrator, browse to
       **Entra ID** > **External Identities** > **External collaboration settings**.
    3. Under **Collaboration restrictions**, select **Allow invitations only to the specified
       domains (most restrictive)**, enter one domain per line and **Save**.
  rollback: |
    Select **Allow invitations to be sent to any domain (most inclusive)**.

