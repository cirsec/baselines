# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-M365-MAIL-016
title: Publish an enforcing DMARC policy with reporting for every domain
finding:
  title: Some domains have no DMARC policy, or one that does not quarantine or reject spoofed mail
  description: Messages that forge the organization's domains in the visible From address can still reach recipients, and nobody receives reports about the forgery.
status: active
profiles: [baseline]
risk:
  severity: high
assessment: manual
tags: [dns, dmarc, email-authentication, spoofing, domains]

description: |
  Every domain the organization owns publishes a DMARC TXT record at `_dmarc.<domain>` with:

  - `p={{ dmarc_policy }}` for domains that send mail, and `p=reject` for domains that never send
    mail (parked domains);
  - no `pct` tag, or `pct=100`;
  - a subdomain policy (`sp`) that is absent or not weaker than `p`;
  - aggregate reports (`rua`) sent to {{ dmarc_report_address }}.

  SPF (CB-M365-MAIL-014) and DKIM (CB-M365-MAIL-015) must pass and align for legitimate senders
  before the policy is enforced.
rationale: |
  DMARC is the only standard that protects the From address users actually see. With `p=none`,
  receivers only report forgeries; with `quarantine` or `reject` they stop them, which protects
  employees, customers and partners from phishing that uses the organization's name. Reports show
  forgery attempts and forgotten legitimate senders.
impact: |
  Legitimate senders that fail SPF and DKIM alignment (a forgotten marketing tool, a partner that
  sends on the organization's behalf) see their messages quarantined or rejected. Start with
  `p=none`, read the reports for a few weeks, fix the senders, then move to `quarantine` and
  `reject`. A third-party DMARC report service makes the reports usable.

parameters:
  - name: dmarc_policy
    type: enum
    description: DMARC policy required for domains that send mail.
    default: quarantine
    profile_defaults:
      hardened: reject
    allowed: [quarantine, reject]
  - name: dmarc_report_address
    type: string
    description: Mailbox or report service that receives DMARC aggregate reports.
    default: a mailbox or DMARC report service monitored by the organization

audit:
  manual: |
    1. List the domains as in CB-M365-MAIL-014 (Microsoft 365 admin center > **Settings** >
       **Domains**, plus registrar inventory).
    2. For each domain, query DNS (no tenant role needed):
       ```powershell
       Get-AcceptedDomain | ForEach-Object {
         Resolve-DnsName -Name "_dmarc.$($_.DomainName)" -Type TXT -ErrorAction SilentlyContinue | Select-Object Name, Strings
       }
       ```
    3. Fail if a domain has no DMARC record, if a sending domain's policy is weaker than
       `{{ dmarc_policy }}`, if a parked domain is not `p=reject`, if `pct` is below 100, if `sp` is
       weaker than the required policy, or if there is no `rua` address.

remediation:
  manual: |
    1. Publish a monitoring record first, for example
       `v=DMARC1; p=none; rua=mailto:dmarc@example.com`, and analyze the aggregate reports.
    2. Fix SPF and DKIM for every legitimate sender found in the reports.
    3. At the DNS hosting provider, update the TXT record at `_dmarc.<domain>`:
       ```text
       v=DMARC1; p=quarantine; rua=mailto:dmarc@example.com
       ```
       then `p=reject` where the parameter requires it.
    4. For parked domains, publish `v=DMARC1; p=reject` directly.
  rollback: |
    Lower the policy to `p=none` while a delivery problem is investigated.

