id: CB-M365-COLLAB-009
title: Set the default sharing link permission to view
finding:
  title: Sharing links grant edit permission by default
  description: Recipients of a default link can change or delete the shared content, including when the link was meant for reading.
status: active
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [sharing-links, sharepoint, onedrive, least-privilege]

description: |
  The permission selected by default when a user creates a sharing link in SharePoint or OneDrive is
  **View** (`DefaultLinkPermission` = `View`). It applies to **Specific people**, organization and
  **Anyone** links. Users can still choose **Can edit** when they need it.
rationale: |
  Edit is the vendor default, so most links grant more than the user intends. An edit link lets every
  recipient alter or delete the file, replace it with a malicious version that colleagues trust, or
  reshare it if resharing is allowed. A view default applies least privilege without blocking
  collaboration.
impact: |
  Users who want co-authoring must switch the link to **Can edit** in the sharing dialog. Sites with
  their own default (`Set-SPOSite -DefaultLinkPermission`) keep it.

setting:
  location: SharePoint admin center > Policies > Sharing > File and folder links > Choose the permission that's selected by default for sharing links
  default_value: Edit
  recommended_value: View (DefaultLinkPermission = View)

audit:
  manual: |
    1. Sign in to the SharePoint admin center (https://admin.microsoft.com/sharepoint) as at least a
       Global Reader.
    2. Browse to **Policies** > **Sharing** > **File and folder links** and check that the permission
       selected by default for sharing links is **View**.
    3. With the SharePoint Online Management Shell (SharePoint Administrator):
       `Get-SPOTenant | Select-Object DefaultLinkPermission` must return `View`.
    4. Fail if the default permission is `Edit`.

remediation:
  manual: |
    1. In the SharePoint admin center, browse to **Policies** > **Sharing** > **File and folder links**,
       set the default permission to **View** and **Save**. Role: SharePoint Administrator.
    2. PowerShell equivalent: `Set-SPOTenant -DefaultLinkPermission View`.

