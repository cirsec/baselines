    id: "R60"
    relation: related
    note: The contract terms are a prerequisite; the control checks that granted access matches them.
  - framework: anssi-admin
    framework_version: "3.0"
    id: "R64"
    relation: partial
    note: GDAP or named accounts give third parties dedicated access instead of shared accounts.
  - framework: anssi-admin
    framework_version: "3.0"
    id: "R66"
    relation: partial
    note: Time-bound relationships approximate on-demand activation; PIM for named accounts goes further.
