id: CB-M365-MAIL-008
title: Block additional storage providers in Outlook on the web
finding:
  title: Outlook on the web lets users attach and save files with personal cloud storage
  description: Users can attach files from, or save attachments to, Dropbox, Google Drive, Box or a personal OneDrive, outside the organization's control.
status: active
profiles: [hardened]
risk:
  severity: medium
assessment: manual
tags: [exchange-online, outlook, owa-policy, cloud-storage, data-leakage]

description: |
  Every Outlook on the web mailbox policy in use has `AdditionalStorageProvidersAvailable` set to
  `$false`. Users can then only attach files from the device or from the organization's OneDrive
  and SharePoint, and cannot connect third-party or personal storage accounts in Outlook on the web
  and the new Outlook.
rationale: |
  A connected personal storage account is an easy path to move work files out of the
  organization, outside data loss prevention, retention and audit. Files shared from third-party
  storage are also not scanned by Safe Attachments the way OneDrive and SharePoint files are.
impact: |
  Users who used Box, Dropbox or Google Drive in Outlook on the web lose that option. Teams that
  exchange files with partners through those services must download and re-attach them, or use
  SharePoint sharing.

audit:
  manual: |
    1. Connect to Exchange Online PowerShell as at least a Global Reader.
    2. Run (read-only):
       ```powershell
       Get-OwaMailboxPolicy | Format-Table Name, IsDefault, AdditionalStorageProvidersAvailable
       Get-CASMailbox -ResultSize Unlimited | Group-Object OwaMailboxPolicy | Select-Object Name, Count
       ```
    3. Fail if a policy used by at least one mailbox (an empty `OwaMailboxPolicy` means the default
       policy) has `AdditionalStorageProvidersAvailable` set to `True`.

remediation:
  manual: |
    1. Connect to Exchange Online PowerShell as an Exchange Administrator.
    2. For each policy in use:
       ```powershell
       Set-OwaMailboxPolicy -Identity OwaMailboxPolicy-Default -AdditionalStorageProvidersAvailable $false
       ```
  rollback: |
    Set `AdditionalStorageProvidersAvailable` back to `$true` on the policy.

references:
