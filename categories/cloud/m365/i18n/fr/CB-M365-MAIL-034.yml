id: CB-M365-MAIL-034
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Activer la correction automatique des groupes de messages malveillants dans AIR
finding:
  title: Les messages reconnus malveillants par les investigations automatisées attendent une approbation manuelle avant d'être retirés
  description: AIR identifie toutes les copies d'un fichier ou d'un lien malveillant dans les boîtes, mais elles y restent jusqu'à ce qu'un analyste approuve chaque action.
description: |
  Dans les paramètres d'automatisation de Defender pour Office 365, la correction automatique est
  sélectionnée pour les groupes de messages **Fichiers similaires** et **URL similaires** (et
  facultativement **Plusieurs attributs similaires**), avec l'action de correction **Suppression
  réversible**. Les messages de ces groupes qu'AIR juge malveillants sont retirés des boîtes sans
  attendre l'approbation SecOps ; les groupes de plus de 10 000 messages attendent toujours un
  examen.
rationale: |
  Après la détection d'une campagne, le temps pendant lequel les copies restent dans les boîtes est le
  temps pendant lequel les utilisateurs peuvent cliquer. La correction automatique ramène ce délai de
  quelques heures (attente d'un analyste) à quelques minutes, pour les groupes où l'entité malveillante
  est bien identifiée. La suppression réversible garde les messages récupérables si un verdict
  s'avère faux.
impact: |
  Des messages sont retirés des boîtes des utilisateurs sans examen par un analyste. Les messages
  supprimés de façon réversible peuvent être restaurés depuis le Centre de notifications (onglet
  **Historique**) ou l'Explorateur de menaces tant qu'ils sont conservés dans le dossier Éléments
  récupérables ; vérifier que la rétention des éléments supprimés respecte les obligations légales.
audit:
  manual: |
    1. Se connecter au portail Microsoft Defender (https://security.microsoft.com) avec au moins le
       rôle Lecteur Sécurité.
    2. Aller dans **Paramètres** > **E-mail et collaboration** > **Paramètres d'automatisation MDO**.
    3. Vérifier que **Fichiers similaires** et **URL similaires** sont cochés sous **Groupes de
       messages**, et que **Suppression réversible** est l'action de correction.
    4. Il n'existe pas de cmdlet PowerShell en lecture seule pour cette page.
    5. Échec si ni **Fichiers similaires** ni **URL similaires** n'est coché.
remediation:
  manual: |
    1. Dans le portail Defender, aller dans **Paramètres** > **E-mail et collaboration** > **Paramètres
       d'automatisation MDO** (Administrateur de la sécurité).
    2. Cocher **Fichiers similaires** et **URL similaires** (et **Plusieurs attributs similaires** si le
       SOC est d'accord), garder **Suppression réversible**, et sélectionner **Enregistrer**.
    3. Vérifier les résultats dans le **Centre de notifications** > onglet **Historique** avec le filtre
       **Décidé par** réglé sur **Automatisation**.
  rollback: |
    Décocher les types de groupes sur la page **Paramètres d'automatisation** ; les actions repassent
    en attente d'approbation.
