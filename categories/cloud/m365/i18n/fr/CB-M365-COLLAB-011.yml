# yaml-language-server: $schema=../../../../../schema/control-i18n.schema.json
id: CB-M365-COLLAB-011
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Faire expirer automatiquement l'accès des invités aux sites et à OneDrive
finding:
  title: L'accès des invités aux sites SharePoint et à OneDrive n'expire jamais
  description: Les invités gardent l'accès aux sites et fichiers partagés longtemps après la fin de la collaboration, sauf si quelqu'un pense à les retirer.
description: |
  L'accès d'un invité à un site SharePoint ou à un OneDrive expire automatiquement après
  `{{ guest_access_expiration_days }}` jours (`ExternalUserExpirationRequired` = `True`,
  `ExternalUserExpireInDays`). L'expiration est fixée quand l'invité rejoint le site, par un lien de
  partage ou un accès direct ; les propriétaires du site peuvent la prolonger pour un invité qui en a
  encore besoin.
rationale: |
  L'accès des invités est rarement retiré à la fin d'un projet. Les autorisations d'invités périmées
  sont une exposition permanente : le compte externe peut être compromis, son titulaire avoir changé
  d'employeur, et personne ne le revoit. Une expiration automatique rend l'accès limité dans le temps
  par défaut et impose un renouvellement délibéré.
impact: |
  Les invités perdent l'accès au site ou au OneDrive après la période, sauf prolongation par un
  propriétaire depuis la page des autorisations du site (**Gérer l'expiration des invités**). Les
  dates d'expiration sont fixées à l'arrivée des invités : ceux présents avant la stratégie ne sont
  pas couverts tant qu'ils ne rejoignent pas à nouveau. Le compte invité reste dans Entra ; supprimer
  les invités inactifs par des revues d'accès (CB-M365-TENANT-013).
setting:
  location: Centre d'administration SharePoint > Stratégies > Partage > Plus de paramètres de partage externe > L'accès invité à un site ou à OneDrive expirera automatiquement après ce nombre de jours
  recommended_value: "Activé, {{ guest_access_expiration_days }} jours ou moins"
parameters:
  guest_access_expiration_days: Nombre de jours après lequel l'accès d'un invité à un site ou à OneDrive expire (SharePoint accepte de 30 à 730).
audit:
  manual: |
    1. Se connecter au centre d'administration SharePoint (https://admin.microsoft.com/sharepoint) avec
       au moins le rôle Lecteur général.
    2. Aller dans **Stratégies** > **Partage** > **Plus de paramètres de partage externe** et vérifier
       que **L'accès invité à un site ou à OneDrive expirera automatiquement après ce nombre de jours**
       est coché avec au plus `{{ guest_access_expiration_days }}`.
    3. Avec SharePoint Online Management Shell (Administrateur SharePoint) :
       `Get-SPOTenant | Select-Object ExternalUserExpirationRequired, ExternalUserExpireInDays`.
    4. Échec si le partage externe est autorisé et que `ExternalUserExpirationRequired` vaut `False` ou
       que `ExternalUserExpireInDays` dépasse `{{ guest_access_expiration_days }}`.
remediation:
  manual: |
    1. Prévenir les propriétaires de sites que les invités expireront et leur expliquer comment
       prolonger.
    2. Dans le centre d'administration SharePoint, aller dans **Stratégies** > **Partage** > **Plus de
       paramètres de partage externe**, cocher **L'accès invité à un site ou à OneDrive expirera
       automatiquement après ce nombre de jours**, saisir `{{ guest_access_expiration_days }}` puis
       **Enregistrer**. Rôle : Administrateur SharePoint.
    3. Équivalent PowerShell :
       `Set-SPOTenant -ExternalUserExpirationRequired $true -ExternalUserExpireInDays {{ guest_access_expiration_days }}`.
  rollback: |
    Exécuter `Set-SPOTenant -ExternalUserExpirationRequired $false`. Les dates d'expiration déjà fixées
    sur les invités ne sont pas effacées automatiquement ; les propriétaires peuvent les prolonger.
