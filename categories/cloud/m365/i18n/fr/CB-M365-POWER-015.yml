id: CB-M365-POWER-015
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Activer les étiquettes de confidentialité pour le contenu Fabric et Power BI
finding:
  title: Les utilisateurs ne peuvent pas appliquer d'étiquettes de confidentialité au contenu Fabric
  description: Les rapports, modèles sémantiques et autres éléments Fabric ne portent aucune classification ; la protection par étiquette ne suit pas les données exportées en fichiers Office ou PDF.
description: |
  Le paramètre du locataire Fabric **Allow users to apply sensitivity labels for content** (autoriser
  les utilisateurs à appliquer des étiquettes de confidentialité au contenu), dans la protection des
  informations, est **Activé**, pour toute l'organisation ou pour les groupes qui créent et gèrent le
  contenu. Les étiquettes de confidentialité Microsoft Purview sont déjà publiées pour ces
  utilisateurs. Les paramètres associés sont revus ensemble : héritage des étiquettes depuis les
  sources de données et vers le contenu en aval, et **Restrict content with protected labels from
  being shared via link with everyone in your organization**.
rationale: |
  Fabric contient des données métier agrégées souvent plus sensibles que les documents sources. Les
  étiquettes rendent cette sensibilité visible, alimentent la prévention des pertes de données et
  l'audit, et appliquent le chiffrement aux fichiers exportés vers Excel, PowerPoint ou PDF. Sans le
  paramètre du locataire, les étiquettes publiées dans Purview ne peuvent pas du tout s'appliquer aux
  éléments Fabric.
impact: |
  Les utilisateurs voient un menu de confidentialité sur les éléments Fabric ; l'étiquetage
  obligatoire ou les étiquettes par défaut, s'ils sont configurés dans Purview, s'appliquent au
  nouveau contenu. Les fichiers exportés peuvent être chiffrés et lisibles uniquement par les
  utilisateurs couverts par l'étiquette. Appliquer des étiquettes demande une licence Power BI Pro ou
  Premium par utilisateur et une licence Purview Information Protection.
setting:
  location: Portail d'administration Fabric > Paramètres du locataire > Protection des informations > Allow users to apply sensitivity labels for content
  recommended_value: Activé
audit:
  manual: |
    1. Se connecter à Microsoft Fabric (https://app.fabric.microsoft.com) en tant qu'administrateur
       Fabric.
    2. Ouvrir **Paramètres** > **Portail d'administration** > **Paramètres du locataire** >
       **Protection des informations** et développer **Allow users to apply sensitivity labels for
       content**.
    3. Vérifier qu'il est **Activé** (toute l'organisation, ou les groupes qui publient du contenu).
    4. Alternative en lecture seule : dans `GET https://api.fabric.microsoft.com/v1/admin/tenantsettings`,
       lire l'entrée `EimInformationProtectionEdit`.
    5. Échec si le paramètre est désactivé.
remediation:
  manual: |
    1. Vérifier que les étiquettes de confidentialité sont publiées dans Microsoft Purview pour les
       utilisateurs qui étiquetteront le contenu Fabric.
    2. Dans **Paramètres du locataire** > **Protection des informations** > **Allow users to apply
       sensitivity labels for content**, sélectionner **Activé**, choisir l'étendue et **Appliquer**.
       Rôle : administrateur Fabric.
    3. Revoir les paramètres d'héritage (**Apply sensitivity labels from data sources to their data in
       Power BI**, **Automatically apply sensitivity labels to downstream content**) et activer
       **Restrict content with protected labels from being shared via link with everyone in your
       organization**.
    4. Équivalent API : `POST
       https://api.fabric.microsoft.com/v1/admin/tenantsettings/EimInformationProtectionEdit/update`
       avec `{"enabled": true}`.
  rollback: |
    Remettre le paramètre sur **Désactivé**. Les étiquettes déjà appliquées restent sur les éléments.
