id: CB-M365-DATA-009
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Détecter l'usage risqué de l'IA avec la gestion des risques internes
finding:
  title: L'usage risqué des assistants IA par des utilisateurs internes passe inaperçu
  description: Les utilisateurs qui soumettent des données sensibles à Copilot ou à des sites d'IA générative tiers, ou qui tentent une injection de prompt, ne déclenchent aucun signal pour l'équipe sécurité.
description: |
  Une stratégie de gestion des risques internes Microsoft Purview construite à partir du modèle
  **Usage risqué de l'IA** est active et couvre tous les utilisateurs (ou les populations définies
  avec le CSE). Elle détecte les invites et réponses risquées dans Microsoft 365 Copilot et d'autres
  applications d'IA, comme des informations sensibles dans les invites, l'accès à du contenu protégé
  via l'IA, ou des tentatives d'injection de prompt. La pseudonymisation des utilisateurs dans les
  alertes reste activée.
rationale: |
  L'IA générative crée de nouveaux chemins de fuite de données que les règles DLP sur la messagerie
  et les fichiers ne voient pas. Le modèle Usage risqué de l'IA corrèle les interactions IA avec
  d'autres indicateurs de risque interne, ce qui permet d'enquêter sur des comportements plutôt que
  sur des événements isolés.
impact: |
  La surveillance des risques internes traite des données personnelles sur les salariés. En France,
  ne la déployer qu'après une analyse d'impact relative à la protection des données, l'information
  des salariés et la consultation du comité social et économique (CSE). Limiter l'accès aux alertes à
  une petite équipe nommément désignée.
notes: |
  La collecte des interactions IA hors Microsoft 365 (sites d'IA tiers) exige l'intégration des
  appareils et l'extension de navigateur ou l'intégration réseau décrites par Microsoft.
audit:
  manual: |
    1. Se connecter au portail Microsoft Purview (https://purview.microsoft.com) en tant que membre du
       groupe de rôles Insider Risk Management Analysts ou Insider Risk Management Auditors (rôles en
       lecture pour cette solution).
    2. Aller dans **Solutions** > **Gestion des risques internes** > **Stratégies**.
    3. Vérifier qu'une stratégie fondée sur le modèle **Usage risqué de l'IA** existe, que son état
       est actif (ni en pause ni en test), et que son étendue couvre les utilisateurs prévus.
    4. Aller dans **Gestion des risques internes** > **Paramètres** > **Confidentialité** et vérifier
       que les noms d'utilisateurs pseudonymisés sont affichés.
    5. Échec si aucune stratégie Usage risqué de l'IA active n'existe.
remediation:
  manual: |
    1. Mener l'analyse d'impact relative à la protection des données et la consultation du CSE.
    2. Se connecter au portail Microsoft Purview en tant qu'Insider Risk Management Admin.
    3. Configurer **Gestion des risques internes** > **Paramètres** (confidentialité, indicateurs de
       stratégie pour Microsoft 365 Copilot et les applications d'IA).
    4. Aller dans **Stratégies** > **Créer une stratégie**, choisir le modèle **Usage risqué de
       l'IA**, définir les utilisateurs concernés, les indicateurs et les seuils, puis créer la
       stratégie.
    5. Confier le tri des alertes au groupe de rôles Insider Risk Management Investigators.
  rollback: |
    Mettre en pause ou supprimer la stratégie dans **Gestion des risques internes** > **Stratégies**.
