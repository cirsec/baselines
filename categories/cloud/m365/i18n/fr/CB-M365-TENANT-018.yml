id: CB-M365-TENANT-018
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Désactiver le partage externe des contenus Sway
finding:
  title: Les utilisateurs peuvent partager des Sway hors de l'organisation
  description: Les Sway peuvent être partagés avec des personnes externes ou toute personne disposant du lien, hors des contrôles de partage appliqués à SharePoint et OneDrive.
setting:
  location: Centre d'administration Microsoft 365 > Paramètres > Paramètres de l'organisation > Services > Sway > Autoriser les personnes de votre organisation à partager leurs Sway avec des personnes extérieures à votre organisation
  recommended_value: Décochée
description: |
  Dans les paramètres Sway, **Autoriser les personnes de votre organisation à partager leurs Sway
  avec des personnes extérieures à votre organisation** est décochée. Les Sway ne peuvent être
  partagés qu'avec des personnes de l'organisation.
rationale: |
  Sway a son propre modèle de partage, non régi par les paramètres de partage SharePoint et
  OneDrive, les étiquettes de confidentialité ni la DLP. Ses liens externes peuvent exposer du
  contenu interne à quiconque obtient le lien. Quand Sway n'est pas nécessaire à la communication
  externe, le partage externe doit être désactivé.
impact: |
  Les utilisateurs ne peuvent plus publier de Sway pour des clients ou le public ; ils utilisent les
  canaux approuvés. Les liens externes existants cessent de fonctionner pour les lecteurs externes.
notes: |
  Le paramètre n'a pas d'équivalent PowerShell ni Graph. Sway peut aussi être désactivé
  complètement en retirant le plan de service Sway des licences.
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft 365 (https://admin.cloud.microsoft) avec
       au moins le rôle Lecteur général.
    2. Aller dans **Paramètres** > **Paramètres de l'organisation** > **Services** > **Sway**,
       section **Partage**.
    3. Échec si **Autoriser les personnes de votre organisation à partager leurs Sway avec des
       personnes extérieures à votre organisation** est cochée.
remediation:
  manual: |
    1. Se connecter au centre d'administration Microsoft 365 avec au moins le rôle Administrateur
       général (ou Administrateur des applications Office).
    2. Aller dans **Paramètres** > **Paramètres de l'organisation** > **Services** > **Sway**.
    3. Décocher **Autoriser les personnes de votre organisation à partager leurs Sway avec des
       personnes extérieures à votre organisation** et **Enregistrer**.
  rollback: |
    Recocher l'option.
