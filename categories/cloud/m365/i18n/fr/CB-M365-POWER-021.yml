id: CB-M365-POWER-021
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Empêcher les principaux de service de créer des espaces de travail, connexions et pipelines de déploiement Fabric
finding:
  title: Tout principal de service peut créer des espaces de travail, connexions et pipelines de déploiement Fabric
  description: Les principaux de service peuvent appeler des API Fabric qu'aucune autorisation d'élément ne protège et créer de nouveaux espaces de travail, connexions de données ou pipelines.
description: |
  Le paramètre du locataire Fabric **Service principals can create workspaces, connections, and
  deployment pipelines** (les principaux de service peuvent créer des espaces de travail, connexions
  et pipelines de déploiement), dans les paramètres du développeur, est **Désactivé**, ou **Activé**
  uniquement pour des groupes de sécurité précis contenant les principaux de service
  d'automatisations approuvées (par exemple une chaîne CI/CD).
rationale: |
  Les API Create Workspace, Create Connection et Create Deployment Pipeline ne sont protégées par
  aucun modèle d'autorisation Fabric : dès que le paramètre autorise un principal de service, il peut
  créer librement ces objets. Un secret d'application compromis permet alors de créer des espaces de
  travail hors gouvernance ou des connexions vers des magasins de données externes avec des
  identifiants enregistrés. Limiter le paramètre à un groupe d'automatisations revu ferme ce chemin.
impact: |
  Les automatisations dont le principal de service est hors des groupes autorisés ne peuvent plus
  créer d'espaces de travail, de connexions ni de pipelines de déploiement. Microsoft désactive ce
  paramètre par défaut pour les nouveaux tenants ; vérifier les scripts CI/CD et de provisionnement
  existants avant de le restreindre dans les tenants plus anciens.
setting:
  location: Portail d'administration Fabric > Paramètres du locataire > Paramètres du développeur > Service principals can create workspaces, connections, and deployment pipelines
  recommended_value: Désactivé, ou Activé pour des groupes de sécurité précis
audit:
  manual: |
    1. Se connecter à Microsoft Fabric (https://app.fabric.microsoft.com) en tant qu'administrateur
       Fabric.
    2. Ouvrir **Paramètres** > **Portail d'administration** > **Paramètres du locataire** >
       **Paramètres du développeur** et développer **Service principals can create workspaces,
       connections, and deployment pipelines**.
    3. Vérifier qu'il est **Désactivé**, ou **Activé** pour des **Groupes de sécurité spécifiques**
       seulement.
    4. Alternative en lecture seule : dans `GET https://api.fabric.microsoft.com/v1/admin/tenantsettings`,
       lire l'entrée `ServicePrincipalAccessGlobalAPIs`.
    5. Échec si le paramètre est activé pour toute l'organisation.
remediation:
  manual: |
    1. Dans **Paramètres du locataire** > **Paramètres du développeur** > **Service principals can
       create workspaces, connections, and deployment pipelines**, sélectionner **Désactivé**, ou
       **Activé** avec **Groupes de sécurité spécifiques**. Sélectionner **Appliquer**. Rôle :
       administrateur Fabric.
    2. Équivalent API : `POST
       https://api.fabric.microsoft.com/v1/admin/tenantsettings/ServicePrincipalAccessGlobalAPIs/update`
       avec l'état cible.
  rollback: |
    Remettre le paramètre à son étendue précédente.
