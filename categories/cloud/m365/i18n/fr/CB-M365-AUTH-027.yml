id: CB-M365-AUTH-027
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Masquer l'option « Rester connecté » à la connexion
finding:
  title: Les utilisateurs peuvent choisir de garder une session de connexion persistante dans le navigateur
  description: Répondre oui à « Rester connecté ? » écrit un cookie persistant, et la session survit aux redémarrages du navigateur sur n'importe quel appareil, y compris partagé.
description: |
  Le réglage de tenant **Afficher l'option permettant de rester connecté** est sur **Non**. Les
  utilisateurs ne voient plus l'invite **Rester connecté ?** après la connexion, et Microsoft Entra ID
  émet un cookie de session qui expire à la fermeture du navigateur au lieu d'un cookie persistant.
rationale: |
  Un cookie de connexion persistant est la session la plus facile à voler ou à réutiliser : il reste
  sur le disque de l'appareil où l'utilisateur s'est connecté, y compris un ordinateur personnel ou
  partagé, et il contourne le délai d'expiration de session inactive (CB-M365-AUTH-026). Supprimer
  ce choix garantit qu'un navigateur fermé termine la session.
impact: |
  Les utilisateurs doivent se reconnecter plus souvent dans le navigateur sur les appareils sans
  authentification unique. Microsoft indique que certaines anciennes fonctions de SharePoint et
  d'Office 2010 dépendent de cette option et peuvent afficher des invites supplémentaires.
  L'authentification unique sur les appareils joints à Microsoft Entra ou joints hybrides n'est pas
  affectée.
notes: |
  Pour un périmètre plus fin, le contrôle de session d'accès conditionnel **Session de navigateur
  persistante** réglé sur **Jamais persistante** supprime l'invite pour certains utilisateurs
  seulement ; CB-M365-AUTH-024 l'utilise pour les administrateurs.
setting:
  location: Centre d'administration Microsoft Entra > Entra ID > Utilisateurs > Paramètres utilisateur > Afficher l'option permettant de rester connecté
  recommended_value: "Non"
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra (https://entra.microsoft.com) avec au
       moins le rôle Lecteur général.
    2. Aller dans **Entra ID** > **Utilisateurs** > **Paramètres utilisateur**.
    3. Vérifier que **Afficher l'option permettant de rester connecté** est sur **Non**.
    4. Échec si le réglage est sur **Oui**.
remediation:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra en tant qu'Administrateur général
       (rôle documenté par Microsoft pour ce réglage).
    2. Aller dans **Entra ID** > **Utilisateurs** > **Paramètres utilisateur**.
    3. Régler **Afficher l'option permettant de rester connecté** sur **Non** et sélectionner
       **Enregistrer**.
    4. Prévenir les utilisateurs que l'invite disparaît et qu'ils pourront devoir se reconnecter plus
       souvent dans le navigateur.
  rollback: |
    Remettre **Afficher l'option permettant de rester connecté** sur **Oui**.
