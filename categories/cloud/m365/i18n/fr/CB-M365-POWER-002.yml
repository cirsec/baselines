id: CB-M365-POWER-002
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Réserver aux administrateurs la création d'environnements d'essai
finding:
  title: Tout utilisateur peut créer des environnements Power Platform d'essai
  description: Les utilisateurs peuvent créer des environnements d'essai, avec leur propre base Dataverse et leurs connecteurs, hors de la gouvernance de l'équipe plateforme.
description: |
  Le paramètre du locataire Power Platform **Affectations d'environnements d'évaluation** (*Trial
  environment assignments*) vaut **Seulement des administrateurs spécifiques**. Un utilisateur qui
  veut évaluer un produit s'adresse à l'équipe plateforme, qui crée l'essai de façon encadrée.
rationale: |
  Les environnements d'essai sont souvent créés sur un coup de tête, remplis de données réelles pour
  tester un scénario, puis oubliés. Ils échappent aux stratégies de données limitées aux
  environnements connus et à l'inventaire jusqu'à leur expiration. Réserver leur création aux
  administrateurs évite des copies non gérées de données métier et de connecteurs.
impact: |
  Les utilisateurs ne peuvent plus lancer eux-mêmes d'essais d'environnements Power Apps, Power
  Automate ou Dynamics 365. Prévoir un processus de demande. Les environnements d'essai existants ne
  sont pas affectés.
setting:
  location: Centre d'administration Power Platform > Gérer > Paramètres du locataire > Affectations d'environnements d'évaluation
  recommended_value: Seulement des administrateurs spécifiques
audit:
  manual: |
    1. Se connecter au centre d'administration Power Platform
       (https://admin.powerplatform.microsoft.com) avec au moins le rôle Lecteur général.
    2. Aller dans **Gérer** > **Paramètres du locataire** et ouvrir **Affectations d'environnements
       d'évaluation**.
    3. Vérifier qu'il vaut **Seulement des administrateurs spécifiques**.
    4. Alternative en lecture seule (administrateur Power Platform) :
       `(Get-TenantSettings).disableTrialEnvironmentCreationByNonAdminUsers` après
       `Add-PowerAppsAccount`.
    5. Échec si le paramètre vaut **Tout le monde** (`disableTrialEnvironmentCreationByNonAdminUsers`
       à `False`).
remediation:
  manual: |
    1. Dans le centre d'administration Power Platform, aller dans **Gérer** > **Paramètres du
       locataire** > **Affectations d'environnements d'évaluation**. Rôle : administrateur Power
       Platform.
    2. Sélectionner **Seulement des administrateurs spécifiques** et **Enregistrer**.
    3. Équivalent PowerShell : `Set-TenantSettings -RequestBody @{
       disableTrialEnvironmentCreationByNonAdminUsers = $true }`.
  rollback: |
    Remettre **Affectations d'environnements d'évaluation** sur **Tout le monde**.
