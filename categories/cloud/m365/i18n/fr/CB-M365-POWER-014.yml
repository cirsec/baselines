id: CB-M365-POWER-014
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Désactiver les visuels R et Python dans Power BI
finding:
  title: Les utilisateurs peuvent interagir avec des visuels R et Python et les partager
  description: Des rapports peuvent exécuter des scripts R ou Python écrits par n'importe quel auteur, un chemin d'exécution de code que l'organisation ne revoit pas.
description: |
  Le paramètre du locataire Fabric **Interact with and share R and Python visuals** (interagir avec
  les visuels R et Python et les partager), dans les paramètres des visuels R et Python, est
  **Désactivé**. Le paramètre s'applique à toute l'organisation et ne peut pas être limité à des
  groupes.
rationale: |
  Les visuels R et Python exécutent des scripts arbitraires sur le service, sur les données du
  rapport. Les scripts peuvent embarquer des bibliothèques et une logique que l'organisation ne revoit
  pas, et permettent de traiter ou déplacer des données hors des contrôles Power BI habituels. Faute
  de cas d'usage revu, désactiver la fonction supprime ce chemin de code non maîtrisé.
impact: |
  Les rapports qui contiennent des visuels R ou Python les affichent comme indisponibles dans le
  service. Les équipes de data science qui en ont besoin doivent utiliser des notebooks Fabric dans
  des espaces de travail gouvernés, ou l'organisation doit accepter l'exception pour tout le tenant.
setting:
  location: Portail d'administration Fabric > Paramètres du locataire > Paramètres des visuels R et Python > Interact with and share R and Python visuals
  recommended_value: Désactivé
audit:
  manual: |
    1. Se connecter à Microsoft Fabric (https://app.fabric.microsoft.com) en tant qu'administrateur
       Fabric.
    2. Ouvrir **Paramètres** > **Portail d'administration** > **Paramètres du locataire** >
       **Paramètres des visuels R et Python** et développer **Interact with and share R and Python
       visuals**.
    3. Vérifier qu'il est **Désactivé**.
    4. Alternative en lecture seule : dans `GET https://api.fabric.microsoft.com/v1/admin/tenantsettings`,
       lire l'entrée `RScriptVisual` (`enabled` doit valoir `false`).
    5. Échec si le paramètre est activé.
remediation:
  manual: |
    1. Repérer avec leurs propriétaires les rapports qui utilisent des visuels R ou Python.
    2. Dans **Paramètres du locataire** > **Paramètres des visuels R et Python** > **Interact with and
       share R and Python visuals**, sélectionner **Désactivé** puis **Appliquer**. Rôle :
       administrateur Fabric.
    3. Équivalent API : `POST
       https://api.fabric.microsoft.com/v1/admin/tenantsettings/RScriptVisual/update` avec
       `{"enabled": false}`.
  rollback: |
    Remettre le paramètre sur **Activé**.
