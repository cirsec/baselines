id: CB-M365-AUTH-040
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Exiger deux méthodes pour réinitialiser un mot de passe avec le SSPR
finding:
  title: Une seule méthode suffit pour réinitialiser le mot de passe d'un utilisateur
  description: Un attaquant qui contrôle un seul facteur, comme un numéro de téléphone détourné par échange de SIM ou une boîte aux lettres, peut réinitialiser le mot de passe et prendre le compte.
description: |
  Dans les réglages de réinitialisation de mot de passe en libre-service, **Nombre de méthodes
  requises pour la réinitialisation** vaut **2**. Les utilisateurs prouvent leur identité avec deux
  méthodes inscrites différentes (par exemple une notification Authenticator et une adresse e-mail
  secondaire) avant de définir un nouveau mot de passe.
rationale: |
  Une réinitialisation de mot de passe est une voie de prise de contrôle : celui qui la mène à bien
  possède le compte jusqu'à ce que l'utilisateur s'en aperçoive. Avec une seule méthode, compromettre
  un numéro de téléphone ou une boîte personnelle suffit. Deux méthodes indépendantes placent la
  barre au niveau attendu d'une connexion avec MFA.
impact: |
  Les utilisateurs doivent inscrire au moins deux méthodes de réinitialisation, sinon ils ne peuvent
  pas utiliser le SSPR. Ceux qui perdent une méthode ont plus souvent besoin du support.
notes: |
  Depuis le passage à la stratégie unifiée des méthodes d'authentification, les méthodes disponibles
  pour le SSPR suivent cette stratégie ; éviter de compter sur les SMS et la voix là où ils sont
  désactivés (CB-M365-AUTH-011). Les administrateurs ont déjà besoin de deux méthodes avec la
  stratégie administrateur de Microsoft.
setting:
  location: Centre d'administration Microsoft Entra > Entra ID > Réinitialisation du mot de passe > Méthodes d'authentification > Nombre de méthodes requises pour la réinitialisation
  recommended_value: "2"
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra (https://entra.microsoft.com) avec au
       moins le rôle Lecteur général.
    2. Aller dans **Entra ID** > **Réinitialisation du mot de passe** > **Méthodes d'authentification**.
    3. Vérifier que **Nombre de méthodes requises pour la réinitialisation** vaut **2**.
    4. Échec s'il vaut **1**.
remediation:
  manual: |
    1. Vérifier dans **Entra ID** > **Méthodes d'authentification** > **Détails de l'inscription des
       utilisateurs** combien d'utilisateurs ont moins de deux méthodes ; lancer d'abord une campagne
       d'inscription si nécessaire.
    2. Se connecter au centre d'administration Microsoft Entra avec au moins le rôle Administrateur
       de la stratégie d'authentification.
    3. Aller dans **Entra ID** > **Réinitialisation du mot de passe** > **Méthodes d'authentification**.
    4. Régler **Nombre de méthodes requises pour la réinitialisation** sur **2** et **Enregistrer**.
  rollback: |
    Remettre **Nombre de méthodes requises pour la réinitialisation** sur **1**.
