id: CB-M365-POWER-001
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Réserver aux administrateurs la création d'environnements de production et de bac à sable
finding:
  title: Tout utilisateur sous licence peut créer des environnements Power Platform de production et de bac à sable
  description: Les utilisateurs peuvent créer de nouveaux environnements hors des stratégies de données et des réglages de sécurité gérés par les administrateurs.
description: |
  Le paramètre du locataire Power Platform **Affectations d'environnements de production**
  (*Production environment assignments*) vaut **Seulement des administrateurs spécifiques**. Seuls
  les administrateurs généraux, administrateurs Dynamics 365 et administrateurs Power Platform
  peuvent alors créer des environnements de production et de bac à sable ; les utilisateurs
  demandent les nouveaux environnements à l'équipe plateforme.
rationale: |
  Un environnement créé par un concepteur échappe à la revue de l'équipe plateforme : les stratégies
  de données limitées à une liste d'environnements ne le couvrent pas, ses rôles de sécurité et son
  partage sont fixés par le créateur, et il peut héberger une base Dataverse avec des données métier
  que personne n'inventorie. Restreindre la création garde chaque environnement de production ou de
  bac à sable connu, doté d'un propriétaire et couvert par des stratégies de données.
impact: |
  Les concepteurs ne peuvent plus créer eux-mêmes d'environnements de production ou de bac à sable.
  Prévoir un processus de demande (par exemple un formulaire traité par l'équipe plateforme, ou des
  groupes d'environnements avec règles). Les environnements créés avant le changement restent gérables
  par leurs créateurs.
setting:
  location: Centre d'administration Power Platform > Gérer > Paramètres du locataire > Affectations d'environnements de production
  recommended_value: Seulement des administrateurs spécifiques
audit:
  manual: |
    1. Se connecter au centre d'administration Power Platform
       (https://admin.powerplatform.microsoft.com) avec au moins le rôle Lecteur général.
    2. Aller dans **Gérer** > **Paramètres du locataire** et ouvrir **Affectations d'environnements de
       production**.
    3. Vérifier qu'il vaut **Seulement des administrateurs spécifiques**.
    4. Alternative en lecture seule (administrateur Power Platform) : avec le module
       `Microsoft.PowerApps.Administration.PowerShell`, exécuter `Add-PowerAppsAccount`, puis
       `(Get-TenantSettings).disableEnvironmentCreationByNonAdminUsers`.
    5. Échec si le paramètre vaut **Tout le monde** (`disableEnvironmentCreationByNonAdminUsers` à
       `False`).
remediation:
  manual: |
    1. Dans le centre d'administration Power Platform, aller dans **Gérer** > **Paramètres du
       locataire** > **Affectations d'environnements de production**. Rôle : administrateur Power
       Platform.
    2. Sélectionner **Seulement des administrateurs spécifiques** et **Enregistrer**.
    3. Équivalent PowerShell : `Set-TenantSettings -RequestBody @{
       disableEnvironmentCreationByNonAdminUsers = $true }`.
    4. Examiner les environnements existants (**Gérer** > **Environnements**) et attribuer à chacun
       un propriétaire et une stratégie de données.
  rollback: |
    Remettre **Affectations d'environnements de production** sur **Tout le monde**.
