id: CB-M365-TENANT-020
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Restreindre la recherche web, les agents et les fournisseurs d'IA tiers de Copilot
finding:
  title: Copilot peut accéder au web, exécuter n'importe quel agent et utiliser des modèles d'IA tiers sans revue
  description: Les requêtes et les données d'ancrage peuvent partir vers Bing ou vers des fournisseurs de modèles tiers, et les utilisateurs peuvent installer ou partager des agents non évalués.
description: |
  Les paramètres de Microsoft 365 Copilot suivent une décision consignée par l'organisation
  (délégué à la protection des données et équipe sécurité) et, par défaut dans ce profil :

  - la **recherche web** (ancrage web dans Microsoft 365 Copilot et Copilot Chat) est désactivée,
    ou limitée à des groupes dont le cas d'usage a été évalué ;
  - **agents** : l'accès est limité à des groupes choisis, le partage d'agents avec toute
    l'organisation est réservé aux administrateurs, et seuls les agents créés par l'organisation ou
    approuvés dans **Applications intégrées** peuvent être installés ;
  - les **fournisseurs d'IA opérant comme sous-traitants de Microsoft** (comme les modèles
    Anthropic) sont désactivés tant qu'une évaluation ne couvre pas la localisation des données et
    les conditions de traitement ;
  - les **essais et achats en libre-service** de Copilot ne sont pas autorisés.
rationale: |
  L'ancrage web envoie à Bing des requêtes de recherche générées à partir des prompts et du contenu
  de travail, hors de la frontière de service Microsoft 365. Les fournisseurs de modèles tiers
  traitent les prompts selon des conditions distinctes, ce qui compte au regard du RGPD et de la
  souveraineté des données. Les agents et leurs connecteurs agissent avec les permissions de
  l'utilisateur et peuvent atteindre des services externes. Chacune de ces fonctions élargit la
  destination des données de travail : elle doit être activée par décision, pas par défaut.
impact: |
  Les utilisateurs perdent les réponses web dans Copilot et l'accès aux agents non approuvés ; ils
  en font la demande. Les fonctions de Copilot évoluent souvent : revoir ces paramètres à chaque
  annonce majeure.
notes: |
  Ce contrôle est tiré de l'ASD Blueprint et sera revu quand CIS ou SCuBA publieront des règles
  Copilot. Les agents Copilot Studio sont traités dans le domaine POWER, les identités d'agents
  dans le domaine APPS.
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft 365 (https://admin.cloud.microsoft) avec
       au moins le rôle Lecteur général (Administrateur IA pour les paramètres Copilot).
    2. Aller dans **Copilot** > **Paramètres** et ouvrir :
       - **Recherche web** : vérifier comment la recherche web est contrôlée (paramètre de stratégie
         cloud **Allow web search in Copilot** dans le centre d'administration des applications
         Microsoft 365, https://config.office.com) et qu'elle est désactivée ou limitée à des
         groupes évalués ;
       - **Accès aux données** > **Fournisseurs d'IA opérant comme sous-traitants de Microsoft** :
         les fournisseurs tiers sont désactivés ;
       - **Accès utilisateur** > **Achats en libre-service de Microsoft 365 Copilot** : **Ne pas
         autoriser**.
    3. Aller dans **Agents** > **Paramètres** (ou **Copilot** > **Agents**) : **Types d'agents
       autorisés**, **Partage** et **Accès utilisateur** sont limités comme décrit.
    4. Aller dans **Paramètres** > **Applications intégrées** et vérifier que chaque agent
       disponible est approuvé.
    5. Échec si l'un de ces paramètres est ouvert à tous les utilisateurs sans décision consignée.
remediation:
  manual: |
    1. Avec un Administrateur IA ou un Administrateur général, consigner la décision de
       l'organisation pour chaque fonction.
    2. Dans le centre d'administration des applications Microsoft 365 (https://config.office.com) >
       **Personnalisation** > **Gestion des stratégies**, créer ou modifier une stratégie avec
       **Allow web search in Copilot** sur **Désactivé** (ou activé uniquement pour un groupe
       évalué), avec un Administrateur des applications Office.
    3. Dans le centre d'administration Microsoft 365, **Copilot** > **Paramètres** > **Accès aux
       données**, désactiver les sous-traitants d'IA tiers ; **Accès utilisateur**, régler les
       achats en libre-service sur **Ne pas autoriser**.
    4. Dans **Agents** > **Paramètres**, limiter les types d'agents autorisés à ceux créés par
       l'organisation et à ceux approuvés, le partage aux administrateurs, et l'accès à des groupes
       choisis.
    5. Bloquer ou retirer les agents non approuvés dans **Paramètres** > **Applications
       intégrées**.
  rollback: |
    Réactiver les fonctions dans les mêmes pages.
