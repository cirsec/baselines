id: CB-M365-COLLAB-014
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Empêcher les utilisateurs d'ajouter des applications depuis le SharePoint Store
finding:
  title: Les utilisateurs peuvent ajouter des applications tierces depuis le SharePoint Store
  description: Les propriétaires de sites peuvent installer des applications de la place de marché qui reçoivent des autorisations sur le contenu du site sans revue par un administrateur.
description: |
  Les utilisateurs ne peuvent pas obtenir d'applications depuis le SharePoint Store (la place de
  marché publique accessible depuis un site). Le paramètre du mode de sécurité de base **Désactiver
  l'accès au Microsoft Store pour SharePoint** est activé, ce qui correspond à
  `DisableSharePointStoreAccess` = `True` ; dans les paramètres classiques du store, **Achats
  d'applications** vaut **Non**. Les utilisateurs peuvent toujours parcourir le store et demander une
  application ; les demandes arrivent dans la liste **Demandes d'applications** du site
  d'applications, où un administrateur décide.
rationale: |
  Les applications du store s'exécutent avec des autorisations accordées sur le site où elles sont
  ajoutées, et leurs éditeurs échappent à l'évaluation des fournisseurs de l'organisation. Laisser les
  propriétaires de sites les installer contourne la gouvernance appliquée au consentement Entra et aux
  applications Teams. Passer par des demandes garde un seul point de décision.
impact: |
  Les propriétaires de sites doivent demander les applications au lieu de les installer. Les
  applications déjà installées continuent de fonctionner ; les revoir dans le site d'applications.
setting:
  location: Centre d'administration Microsoft 365 > Paramètres > Paramètres de l'organisation > Sécurité et confidentialité > Mode de sécurité de base > Désactiver l'accès au Microsoft Store pour SharePoint
  recommended_value: Activé (DisableSharePointStoreAccess = True)
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft 365 (https://admin.microsoft.com) avec au moins
       le rôle Lecteur général.
    2. Aller dans **Paramètres** > **Paramètres de l'organisation** > **Sécurité et confidentialité** >
       **Mode de sécurité de base** et vérifier que **Désactiver l'accès au Microsoft Store pour
       SharePoint** est activé.
    3. Sinon, dans le centre d'administration SharePoint, ouvrir **Plus de fonctionnalités** >
       **Applications** > **Ouvrir** > **Configurer les paramètres du Store** et vérifier que **Achats
       d'applications** vaut **Non**.
    4. Avec SharePoint Online Management Shell (Administrateur SharePoint) :
       `Get-SPOTenant | Select-Object DisableSharePointStoreAccess` doit renvoyer `True`.
    5. Échec si les utilisateurs peuvent obtenir des applications depuis le SharePoint Store.
remediation:
  manual: |
    1. Lister les applications déjà ajoutées depuis le store (site d'applications, **Applications pour
       SharePoint** et **Demandes d'applications**) et décider lesquelles garder.
    2. Dans le centre d'administration Microsoft 365, aller dans **Paramètres** > **Paramètres de
       l'organisation** > **Sécurité et confidentialité** > **Mode de sécurité de base** et activer
       **Désactiver l'accès au Microsoft Store pour SharePoint**. Rôle : Administrateur SharePoint.
    3. Équivalent PowerShell : `Set-SPOTenant -DisableSharePointStoreAccess $true`. Dans les paramètres
       classiques du store, régler **Achats d'applications** sur **Non**.
    4. Désigner une personne chargée de traiter la liste **Demandes d'applications**.
