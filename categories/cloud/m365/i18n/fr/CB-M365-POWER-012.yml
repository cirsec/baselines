id: CB-M365-POWER-012
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Empêcher les invités de parcourir le contenu Fabric
finding:
  title: Les invités peuvent parcourir le contenu Fabric comme des utilisateurs internes
  description: Les invités disposent de toute la navigation dans Fabric et peuvent découvrir des espaces de travail, applications et éléments au-delà des liens partagés avec eux.
description: |
  Le paramètre du locataire Fabric **Guest users can browse and access Fabric content** (les
  invités peuvent parcourir et accéder au contenu Fabric), dans les paramètres d'exportation et de
  partage, est **Désactivé**, ou **Activé** uniquement pour des groupes de sécurité précis d'invités
  qui travaillent comme des membres (par exemple des prestataires de longue durée). Les autres
  invités n'atteignent le contenu que par des liens directs et les autorisations qui leur sont
  accordées.
rationale: |
  Avec la navigation complète, un invité voit le volet de gauche, les espaces de travail et les
  applications qui lui sont accessibles, et peut trouver du contenu partagé avec des groupes larges
  qui ne lui était pas destiné. Cantonner les invités aux liens directs limite la découverte et
  l'exposition accidentelle, tandis que les rôles d'espace de travail et les autorisations
  d'éléments continuent de fonctionner.
impact: |
  Les invités hors des groupes autorisés perdent le volet de navigation et doivent utiliser les
  liens qu'ils reçoivent. Leurs rôles d'espace de travail et autorisations d'éléments sont
  conservés.
setting:
  location: Portail d'administration Fabric > Paramètres du locataire > Paramètres d'exportation et de partage > Guest users can browse and access Fabric content
  recommended_value: Désactivé, ou Activé pour des groupes de sécurité précis
audit:
  manual: |
    1. Se connecter à Microsoft Fabric (https://app.fabric.microsoft.com) en tant qu'administrateur
       Fabric.
    2. Ouvrir **Paramètres** > **Portail d'administration** > **Paramètres du locataire** >
       **Paramètres d'exportation et de partage** et développer **Guest users can browse and access
       Fabric content**.
    3. Vérifier qu'il est **Désactivé**, ou **Activé** pour des **Groupes de sécurité spécifiques**
       seulement.
    4. Alternative en lecture seule : dans `GET https://api.fabric.microsoft.com/v1/admin/tenantsettings`,
       lire l'entrée `ElevatedGuestsTenant`.
    5. Échec si le paramètre est activé pour toute l'organisation.
remediation:
  manual: |
    1. Dans **Paramètres du locataire** > **Paramètres d'exportation et de partage** > **Guest users
       can browse and access Fabric content**, sélectionner **Désactivé**, ou **Activé** avec
       **Groupes de sécurité spécifiques**. Sélectionner **Appliquer**. Rôle : administrateur
       Fabric.
    2. Équivalent API : `POST
       https://api.fabric.microsoft.com/v1/admin/tenantsettings/ElevatedGuestsTenant/update` avec
       l'état cible.
  rollback: |
    Remettre le paramètre à son étendue précédente.
