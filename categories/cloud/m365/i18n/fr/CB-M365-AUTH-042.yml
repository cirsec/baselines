id: CB-M365-AUTH-042
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Avertir les utilisateurs lorsque leur mot de passe est réinitialisé
finding:
  title: Les utilisateurs ne sont pas avertis quand leur mot de passe est réinitialisé via le SSPR
  description: Un attaquant qui réinitialise le mot de passe d'une victime peut utiliser le compte jusqu'à ce que la victime remarque par hasard que sa connexion échoue.
description: |
  Dans les réglages de réinitialisation de mot de passe en libre-service, **Avertir les utilisateurs
  lors des réinitialisations de mot de passe ?** vaut **Oui**. Après chaque réinitialisation,
  Microsoft Entra ID envoie un e-mail aux adresses principale et secondaire de l'utilisateur (ou à
  son nom d'utilisateur principal à défaut).
rationale: |
  La notification est souvent le premier signe d'une prise de contrôle via la réinitialisation. Un
  utilisateur qui n'a rien demandé peut le signaler aussitôt, et le compte peut être récupéré avant
  que l'attaquant n'en fasse grand-chose.
impact: |
  Aucun connu. Les messages proviennent de msonlineservicesteam@microsoft.com ou
  msonlineservicesteam@microsoftonline.com ; vérifier qu'ils ne sont pas filtrés comme courrier
  indésirable.
setting:
  location: Centre d'administration Microsoft Entra > Entra ID > Réinitialisation du mot de passe > Notifications > Avertir les utilisateurs lors des réinitialisations de mot de passe ?
  recommended_value: "Oui"
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra (https://entra.microsoft.com) avec au
       moins le rôle Lecteur général.
    2. Aller dans **Entra ID** > **Réinitialisation du mot de passe** > **Notifications**.
    3. Vérifier que **Avertir les utilisateurs lors des réinitialisations de mot de passe ?** vaut
       **Oui**.
    4. Échec s'il vaut **Non**.
remediation:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra avec au moins le rôle Administrateur
       de la stratégie d'authentification.
    2. Aller dans **Entra ID** > **Réinitialisation du mot de passe** > **Notifications**.
    3. Régler **Avertir les utilisateurs lors des réinitialisations de mot de passe ?** sur **Oui** et
       **Enregistrer**.
    4. Demander aux utilisateurs de signaler toute notification de réinitialisation inattendue.
  rollback: |
    Régler l'option sur **Non**.
