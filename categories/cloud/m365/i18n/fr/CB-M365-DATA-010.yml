id: CB-M365-DATA-010
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Valider une analyse de risque avant d'héberger des données sensibles dans Microsoft 365
finding:
  title: Des données sensibles sont hébergées dans Microsoft 365 sans analyse de risque documentée et validée
  description: L'organisation n'a pas évalué formellement si la sensibilité de ses données, le niveau de menace et les lois extraterritoriales permettent de les héberger dans un cloud public commercial.
description: |
  Avant d'héberger dans Microsoft 365 des systèmes d'information ou des données sensibles,
  l'organisation réalise une étude d'impact métier et juridique et une analyse de risque, validées et
  signées par la plus haute autorité de l'entité (ou son délégataire). L'analyse couvre au moins :

  - la sensibilité des données et traitements (confidentialité, intégrité, disponibilité), et les
    systèmes concernés (par exemple SI de niveau Diffusion Restreinte, SI sensibles des opérateurs
    d'importance vitale ou de services essentiels, données de santé, données personnelles) ;
  - le niveau de menace maximal auquel ces systèmes sont exposés ;
  - les risques propres à un cloud public mutualisé (exposition à internet, infrastructure partagée,
    accès du personnel du fournisseur, voir CB-M365-DATA-008) ;
  - le risque juridique lié aux lois extraterritoriales qui peuvent contraindre le fournisseur à
    transmettre les données ;
  - la décision : données autorisées dans Microsoft 365, autorisées avec mesures complémentaires
    (par exemple clés de chiffrement gérées par le client, double chiffrement à clé, étiquettes de
    confidentialité chiffrantes), ou à héberger sur une offre qualifiée comme SecNumCloud.

  L'analyse est revue quand les données, la menace ou le contexte juridique changent, et au moins
  tous les trois ans. Elle définit aussi un plan de réversibilité.
rationale: |
  Le durcissement technique ne répond pas à la question de savoir si certaines données doivent se
  trouver dans un cloud public commercial. L'ANSSI recommande que la décision de migrer des systèmes
  d'information vers le cloud soit prise au plus haut niveau de l'entité, éclairée par une étude
  d'impact et une analyse de risque qui pèsent la sensibilité des données, la menace et l'exposition
  aux lois extraterritoriales. Pour certaines catégories de systèmes, la réglementation ou la
  doctrine imposent une offre qualifiée SecNumCloud.
impact: |
  Mobilise les responsables métier, le service juridique, le DPO et la sécurité. Peut conduire à
  sortir certaines données de Microsoft 365 ou à ajouter un chiffrement avec clés détenues par le
  client, ce qui limite certaines fonctions (recherche, Copilot, eDiscovery sur le contenu chiffré).
notes: |
  Contrôle organisationnel : la preuve est un document, pas un paramètre du tenant. Il n'a pas
  d'équivalent dans CIS ni SCuBA.
audit:
  manual: |
    1. Demander au RSSI l'analyse de risque d'hébergement cloud couvrant Microsoft 365.
    2. Vérifier qu'elle traite les quatre sujets de la description (sensibilité des données, niveau de
       menace, risques du cloud public, lois extraterritoriales) et consigne une décision par
       catégorie de données.
    3. Vérifier qu'elle est signée par la direction de l'entité ou son délégataire formel, date de
       moins de trois ans, et correspond à l'usage actuel de Microsoft 365 (nouveaux usages comme
       Copilot inclus).
    4. Échantillonner quelques catégories de données sensibles et vérifier que les mesures décidées
       (par exemple étiquettes chiffrantes, données conservées sur une autre plateforme) sont
       appliquées.
    5. Échec si aucune analyse n'existe, si elle n'est pas signée ou est périmée, ou si des
       catégories sensibles sont hébergées contrairement à sa décision.
remediation:
  manual: |
    1. Recenser les catégories de données et systèmes d'information hébergés ou prévus dans
       Microsoft 365.
    2. Avec les responsables métier, le service juridique et le DPO, mener l'étude d'impact et
       l'analyse de risque (par exemple avec la méthode EBIOS Risk Manager), en s'appuyant sur les
       recommandations ANSSI d'hébergement cloud pour décider du type d'offre exigé par chaque
       catégorie.
    3. Définir les mesures complémentaires (chiffrement avec clés gérées par le client ou double
       chiffrement à clé, étiquettes, Customer Lockbox) ou une migration vers une offre qualifiée si
       nécessaire, ainsi qu'un plan de réversibilité.
    4. Faire signer la décision par la direction et planifier sa revue périodique.
  rollback: |
    Sans objet.
