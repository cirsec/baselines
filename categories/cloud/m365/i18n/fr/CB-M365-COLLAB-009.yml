id: CB-M365-COLLAB-009
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Régler l'autorisation par défaut des liens de partage sur Afficher
finding:
  title: Les liens de partage accordent la modification par défaut
  description: Les destinataires d'un lien par défaut peuvent modifier ou supprimer le contenu partagé, même quand le lien devait servir à la lecture.
description: |
  L'autorisation sélectionnée par défaut quand un utilisateur crée un lien de partage dans SharePoint
  ou OneDrive est **Afficher** (`DefaultLinkPermission` = `View`). Elle s'applique aux liens
  **Personnes spécifiques**, organisation et **Tout le monde**. Les utilisateurs peuvent toujours
  choisir **Modification** quand ils en ont besoin.
rationale: |
  La modification est la valeur par défaut de l'éditeur : la plupart des liens accordent plus que ce
  que l'utilisateur veut. Un lien de modification permet à chaque destinataire de changer ou supprimer
  le fichier, de le remplacer par une version malveillante à laquelle les collègues font confiance, ou
  de le repartager si le repartage est autorisé. Un défaut en lecture applique le moindre privilège
  sans bloquer la collaboration.
impact: |
  Les utilisateurs qui veulent coéditer doivent passer le lien en **Modification** dans la boîte de
  partage. Les sites qui ont leur propre valeur par défaut (`Set-SPOSite -DefaultLinkPermission`) la
  conservent.
setting:
  location: Centre d'administration SharePoint > Stratégies > Partage > Liens vers des fichiers et des dossiers > Choisir l'autorisation sélectionnée par défaut pour les liens de partage
  recommended_value: Afficher (DefaultLinkPermission = View)
audit:
  manual: |
    1. Se connecter au centre d'administration SharePoint (https://admin.microsoft.com/sharepoint) avec
       au moins le rôle Lecteur général.
    2. Aller dans **Stratégies** > **Partage** > **Liens vers des fichiers et des dossiers** et vérifier
       que l'autorisation sélectionnée par défaut pour les liens de partage est **Afficher**.
    3. Avec SharePoint Online Management Shell (Administrateur SharePoint) :
       `Get-SPOTenant | Select-Object DefaultLinkPermission` doit renvoyer `View`.
    4. Échec si l'autorisation par défaut est `Edit`.
remediation:
  manual: |
    1. Dans le centre d'administration SharePoint, aller dans **Stratégies** > **Partage** > **Liens
       vers des fichiers et des dossiers**, régler l'autorisation par défaut sur **Afficher** puis
       **Enregistrer**. Rôle : Administrateur SharePoint.
    2. Équivalent PowerShell : `Set-SPOTenant -DefaultLinkPermission View`.
