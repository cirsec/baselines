id: CB-M365-POWER-011
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Restreindre les invitations d'invités via le partage Fabric
finding:
  title: Les utilisateurs peuvent inviter de nouveaux invités en partageant des éléments Fabric
  description: Tout utilisateur autorisé à inviter des invités dans Entra ID peut faire entrer un nouveau compte externe dans le tenant en partageant un élément Fabric ou Power BI.
description: |
  Le paramètre du locataire Fabric **Users can invite guest users to collaborate through item
  sharing and permissions** (les utilisateurs peuvent inviter des invités via le partage et les
  autorisations d'éléments), dans les paramètres d'exportation et de partage, anciennement **Share
  content with external users**, est **Désactivé**, ou **Activé** uniquement pour des groupes de
  sécurité précis d'utilisateurs autorisés à partager du contenu analytique à l'extérieur.
rationale: |
  Partager un rapport avec une adresse externe crée un compte invité B2B dans l'annuaire. Si
  n'importe quel utilisateur peut le faire, des comptes externes apparaissent via Power BI sans la
  revue appliquée aux autres invitations, et reçoivent aussitôt l'accès à des données métier.
  Restreindre le paramètre garde la création d'invités entre les mains des personnes et processus
  qui gèrent la collaboration externe.
impact: |
  Les utilisateurs hors des groupes autorisés ne peuvent plus inviter de nouveaux utilisateurs
  externes depuis Fabric. Les invités existants gardent leur accès et apparaissent toujours dans les
  sélecteurs de personnes. Les paramètres d'invitation Entra (rôle Inviteur d'invités, restrictions
  de collaboration) s'appliquent en plus de ce paramètre.
setting:
  location: Portail d'administration Fabric > Paramètres du locataire > Paramètres d'exportation et de partage > Users can invite guest users to collaborate through item sharing and permissions
  recommended_value: Désactivé, ou Activé pour des groupes de sécurité précis
audit:
  manual: |
    1. Se connecter à Microsoft Fabric (https://app.fabric.microsoft.com) en tant qu'administrateur
       Fabric.
    2. Ouvrir **Paramètres** > **Portail d'administration** > **Paramètres du locataire** >
       **Paramètres d'exportation et de partage** et développer **Users can invite guest users to
       collaborate through item sharing and permissions**.
    3. Vérifier qu'il est **Désactivé**, ou **Activé** pour des **Groupes de sécurité spécifiques**
       seulement.
    4. Alternative en lecture seule : dans la réponse de `GET
       https://api.fabric.microsoft.com/v1/admin/tenantsettings`, lire l'entrée `ExternalSharingV2`.
    5. Échec si le paramètre est activé pour toute l'organisation.
remediation:
  manual: |
    1. Dans **Paramètres du locataire** > **Paramètres d'exportation et de partage** > **Users can
       invite guest users to collaborate through item sharing and permissions**, sélectionner
       **Désactivé**, ou **Activé** avec **Groupes de sécurité spécifiques**. Sélectionner
       **Appliquer**. Rôle : administrateur Fabric.
    2. Équivalent API : `POST
       https://api.fabric.microsoft.com/v1/admin/tenantsettings/ExternalSharingV2/update` avec l'état
       cible.
  rollback: |
    Remettre le paramètre à son étendue précédente.
