id: CB-M365-AUDIT-010
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Prévenir les administrateurs quand des utilisateurs à risque élevé sont détectés
finding:
  title: Personne n'est prévenu quand Microsoft Entra ID Protection signale un utilisateur à risque élevé
  description: Un compte probablement compromis peut rester actif des jours parce que la détection de risque reste dans un rapport que personne ne consulte.
description: |
  L'alerte e-mail **Utilisateurs à risque détectés** de Microsoft Entra ID Protection est configurée
  avec le niveau de risque **Élevé** (ou inférieur) et des destinataires qui incluent la boîte
  supervisée de l'équipe sécurité, pas seulement les titulaires de rôles ajoutés par défaut. L'e-mail
  **Synthèse hebdomadaire** est activé avec les mêmes destinataires.
rationale: |
  L'accès conditionnel basé sur le risque (CB-M365-AUTH-030) bloque ou remédie un utilisateur à
  risque, mais l'équipe sécurité doit encore enquêter sur ce que l'attaquant a fait avant le blocage
  et sur l'implication d'autres comptes. Par défaut, l'alerte ne part qu'aux administrateurs
  généraux, administrateurs de la sécurité et lecteurs sécurité actifs disposant d'une boîte aux
  lettres ; avec PIM, ils ne reçoivent souvent rien.
impact: |
  Aucun connu. Les destinataires doivent avoir le droit de consulter les rapports ID Protection
  associés.
notes: |
  Les utilisateurs à risque peuvent aussi être transmis au SIEM via les catégories de diagnostic
  `RiskyUsers` et `UserRiskEvents` (CB-M365-AUDIT-002), canal à privilégier quand un SOC existe.
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra (https://entra.microsoft.com) avec au
       moins le rôle Lecteur Sécurité.
    2. Aller dans **ID Protection** > **Tableau de bord** > **Alertes Utilisateurs à risque
       détectés**.
    3. Vérifier que l'alerte est réglée sur **Élevé** (ou un niveau inférieur) et que la liste des
       destinataires inclut une boîte ou une liste de distribution sécurité supervisée.
    4. Aller dans **ID Protection** > **Tableau de bord** > **Synthèse hebdomadaire** et vérifier
       qu'elle est activée avec les mêmes destinataires.
    5. Échec si l'alerte n'a aucun destinataire supervisé autre que des titulaires de rôles
       individuels, ou si la synthèse hebdomadaire est désactivée.
remediation:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra avec au moins le rôle Administrateur
       de la sécurité.
    2. Aller dans **ID Protection** > **Tableau de bord** > **Alertes Utilisateurs à risque
       détectés**, régler le niveau de risque sur **Élevé** (ou **Moyen**), ajouter la boîte de
       l'équipe sécurité dans **Ajouter un e-mail personnalisé ici**, puis enregistrer.
    3. Aller dans **Synthèse hebdomadaire**, l'activer, ajouter la même boîte, puis enregistrer.
  rollback: |
    Retirer le destinataire personnalisé ou désactiver la synthèse hebdomadaire.
