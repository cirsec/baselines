id: CB-M365-ADMIN-013
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Réserver le centre d'administration Microsoft Entra aux administrateurs
finding:
  title: Tout utilisateur peut parcourir le centre d'administration Microsoft Entra
  description: Des non-administrateurs peuvent ouvrir le centre d'administration et parcourir utilisateurs, groupes et informations du tenant, ce qui facilite la reconnaissance après la compromission d'un compte.
setting:
  location: Centre d'administration Microsoft Entra > Entra ID > Utilisateurs > Paramètres utilisateur > Restreindre l'accès au centre d'administration Microsoft Entra (Restrict access to Microsoft Entra admin center)
  recommended_value: "Oui"
description: |
  Le paramètre utilisateur **Restreindre l'accès au centre d'administration Microsoft Entra** vaut
  **Oui** : les utilisateurs sans rôle d'administration ne peuvent pas charger les pages courantes
  du centre d'administration Microsoft Entra et du portail Azure (accueil, vue d'ensemble du
  tenant, liste des utilisateurs).
rationale: |
  Un attaquant muni d'un compte utilisateur ordinaire commence souvent par lister utilisateurs,
  groupes et rôles pour choisir sa prochaine cible. Ce paramètre ajoute de la friction à cette
  exploration pour un coût minime.
impact: |
  Les non-administrateurs qui possèdent des groupes ou des applications ne peuvent plus les gérer
  depuis le centre d'administration ; ils utilisent Mes groupes, Mes applications, ou reçoivent un
  rôle de lecture. Le paramètre ne s'applique pas aux utilisateurs qui ont un rôle
  d'administration, y compris personnalisé.
notes: |
  Microsoft précise qu'il ne s'agit pas d'une frontière de sécurité : il ne bloque ni Microsoft
  Graph, ni PowerShell, ni les liens directs vers la plupart des pages. L'accès en lecture des
  membres à l'annuaire se réduit par d'autres paramètres ; bloquer l'accès des non-administrateurs
  à la gestion Azure passe par une stratégie d'accès conditionnel sur **Windows Azure Service
  Management API**.
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra (https://entra.microsoft.com) avec au
       moins le rôle Lecteur général.
    2. Aller dans **Entra ID** > **Utilisateurs** > **Paramètres utilisateur**.
    3. Échec si **Restreindre l'accès au centre d'administration Microsoft Entra** vaut **Non**. Il
       n'existe pas d'API publique pour ce paramètre.
remediation:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra avec au moins le rôle Administrateur
       de rôle privilégié (ou Administrateur général).
    2. Aller dans **Entra ID** > **Utilisateurs** > **Paramètres utilisateur**.
    3. Régler **Restreindre l'accès au centre d'administration Microsoft Entra** sur **Oui** et
       sélectionner **Enregistrer**.
    4. Donner un rôle de lecture (par exemple Lecteur général ou Lecteurs d'annuaire) aux
       non-administrateurs qui ont un besoin documenté du portail.
  rollback: |
    Repasser l'option sur **Non**.
