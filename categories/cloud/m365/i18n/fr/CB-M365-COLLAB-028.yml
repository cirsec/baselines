id: CB-M365-COLLAB-028
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Ne faire présenter par défaut que les organisateurs et coorganisateurs
finding:
  title: Chaque participant d'une réunion Teams peut présenter par défaut
  description: Tout participant, y compris externe ou anonyme, peut partager son écran ou du contenu à toute la réunion sans que l'organisateur l'ait accordé.
description: |
  Dans les réunions organisées par les utilisateurs de l'organisation, seuls l'organisateur et les
  coorganisateurs sont présentateurs par défaut ; les autres participants sont des assistants jusqu'à
  leur promotion (**Qui peut présenter** = **Uniquement les organisateurs et coorganisateurs**,
  `DesignatedPresenterRoleMode` = `OrganizerOnlyUserOverride`). Les organisateurs peuvent changer la
  valeur dans les **Options de réunion**.
rationale: |
  Les présentateurs peuvent partager leur écran, couper le micro des participants et les retirer,
  admettre depuis la salle d'attente et démarrer l'enregistrement. Accorder ces droits à tous par
  défaut permet à un participant non invité ou malveillant de diffuser du contenu choquant ou
  trompeur, ou de perturber la réunion, avant que l'organisateur ne réagisse.
impact: |
  Les organisateurs doivent promouvoir les présentateurs avant ou pendant la réunion, ce qui ajoute
  une étape aux réunions collaboratives. Ceux qui préfèrent l'ancien comportement peuvent le changer
  par réunion.
setting:
  location: Centre d'administration Teams > Réunions > Stratégies de réunion > Partage de contenu > Qui peut présenter
  recommended_value: Uniquement les organisateurs et coorganisateurs (OrganizerOnlyUserOverride)
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft Teams (https://admin.teams.microsoft.com) avec
       au moins le rôle Lecteur général.
    2. Aller dans **Réunions** > **Stratégies de réunion** et ouvrir la stratégie **Global (par défaut à
       l'échelle de l'organisation)**, puis chaque stratégie personnalisée attribuée.
    3. Dans la section **Partage de contenu**, vérifier que **Qui peut présenter** est **Uniquement les
       organisateurs et coorganisateurs**.
    4. Avec Microsoft Teams PowerShell (le rôle Lecteur général suffit) :
       `Get-CsTeamsMeetingPolicy | Select-Object Identity, DesignatedPresenterRoleMode`.
    5. Échec si une stratégie renvoie une autre valeur que `OrganizerOnlyUserOverride`.
remediation:
  manual: |
    1. Dans le centre d'administration Teams, aller dans **Réunions** > **Stratégies de réunion** et
       ouvrir la stratégie **Global (par défaut à l'échelle de l'organisation)**.
    2. Dans la section **Partage de contenu**, régler **Qui peut présenter** sur **Uniquement les
       organisateurs et coorganisateurs** puis **Enregistrer**. Rôle : Administrateur Teams.
    3. Répéter pour chaque stratégie personnalisée, sauf exception documentée pour ses utilisateurs.
    4. Équivalent PowerShell :
       `Set-CsTeamsMeetingPolicy -Identity Global -DesignatedPresenterRoleMode OrganizerOnlyUserOverride`
       (répéter avec `-Identity <stratégie>` pour les stratégies personnalisées). Les changements
       peuvent prendre jusqu'à 24 heures.
