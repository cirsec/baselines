id: CB-M365-COLLAB-024
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Empêcher les utilisateurs anonymes et les appelants téléphoniques de démarrer les réunions Teams
finding:
  title: Les utilisateurs anonymes et les appelants téléphoniques peuvent démarrer des réunions Teams sans organisateur
  description: Quiconque détient un lien de réunion ou un numéro d'appel peut utiliser la réunion de l'organisation à tout moment, sans personne de l'organisation présente.
description: |
  Les participants anonymes et les personnes qui appellent par téléphone attendent dans la salle
  d'attente qu'un participant authentifié (quelqu'un de l'organisation, un invité ou un utilisateur
  d'une organisation approuvée) démarre la réunion (`AllowAnonymousUsersToStartMeeting` = `False` dans
  chaque stratégie de réunion).
rationale: |
  Les réunions sans responsable permettent à des personnes non vérifiées de se réunir sur le pont de
  l'organisation à des heures non prévues, de réutiliser d'anciens liens de réunion pour leurs propres
  besoins et de générer des coûts d'audioconférence. Les garder en salle d'attente jusqu'à l'arrivée
  d'un participant vérifié laisse la maîtrise de la réunion à son organisateur.
impact: |
  Les réunions récurrentes où des participants externes par téléphone démarraient sans l'organisateur
  doivent attendre un participant interne. Aucun autre impact connu ; Désactivé est la valeur par
  défaut.
setting:
  location: Centre d'administration Teams > Réunions > Stratégies de réunion > Participation à la réunion et salle d'attente > Les utilisateurs anonymes et les appelants entrants peuvent démarrer une réunion
  recommended_value: Désactivé (AllowAnonymousUsersToStartMeeting = False)
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft Teams (https://admin.teams.microsoft.com) avec
       au moins le rôle Lecteur général.
    2. Aller dans **Réunions** > **Stratégies de réunion** et ouvrir la stratégie **Global (par défaut à
       l'échelle de l'organisation)**, puis chaque stratégie personnalisée attribuée.
    3. Dans la section **Participation à la réunion et salle d'attente**, vérifier que **Les
       utilisateurs anonymes et les appelants entrants peuvent démarrer une réunion** est **Désactivé**.
    4. Avec Microsoft Teams PowerShell (le rôle Lecteur général suffit) :
       `Get-CsTeamsMeetingPolicy | Select-Object Identity, AllowAnonymousUsersToStartMeeting`.
    5. Échec si une stratégie renvoie `True`.
remediation:
  manual: |
    1. Dans le centre d'administration Teams, aller dans **Réunions** > **Stratégies de réunion** et
       ouvrir la stratégie **Global (par défaut à l'échelle de l'organisation)**.
    2. Dans la section **Participation à la réunion et salle d'attente**, régler **Les utilisateurs
       anonymes et les appelants entrants peuvent démarrer une réunion** sur **Désactivé** puis
       **Enregistrer**. Rôle : Administrateur Teams.
    3. Répéter pour chaque stratégie personnalisée, sauf exception documentée pour ses utilisateurs.
    4. Équivalent PowerShell :
       `Set-CsTeamsMeetingPolicy -Identity Global -AllowAnonymousUsersToStartMeeting $false` (répéter
       avec `-Identity <stratégie>` pour les stratégies personnalisées). Les changements peuvent prendre
       jusqu'à 24 heures.
