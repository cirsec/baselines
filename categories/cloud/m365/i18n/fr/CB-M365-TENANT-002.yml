# yaml-language-server: $schema=../../../../../schema/control-i18n.schema.json
id: CB-M365-TENANT-002
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Désactiver les connexions de compte LinkedIn
finding:
  title: Les utilisateurs peuvent connecter leur compte professionnel à LinkedIn
  description: Les utilisateurs peuvent partager contacts professionnels et données de profil entre Microsoft 365 et LinkedIn, hors du contrôle de l'organisation.
setting:
  location: Centre d'administration Microsoft Entra > Entra ID > Utilisateurs > Paramètres utilisateur > Connexions de compte LinkedIn (LinkedIn account connections)
  recommended_value: "Non"
description: |
  Le paramètre utilisateur **Connexions de compte LinkedIn** vaut **Non** : les utilisateurs ne
  peuvent pas lier leur compte professionnel à un compte LinkedIn, et les informations de profil
  LinkedIn ne s'affichent pas dans les applications Microsoft 365.
rationale: |
  Une fois connectés, LinkedIn et Microsoft 365 échangent données de profil et de contacts. Cela
  dresse une cartographie des personnes et des relations de l'organisation, utile aux attaquants
  pour l'hameçonnage ciblé, et transfère des données personnelles vers un service tiers, ce qui
  compte au regard du RGPD.
impact: |
  Les utilisateurs ne voient plus les cartes de profil LinkedIn dans Outlook, Teams ou les autres
  applications. Les connexions existantes sont supprimées.
notes: |
  Le paramètre n'a pas d'API publique.
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra (https://entra.microsoft.com) avec au
       moins le rôle Lecteur général.
    2. Aller dans **Entra ID** > **Utilisateurs** > **Paramètres utilisateur** et lire **Connexions
       de compte LinkedIn**.
    3. Échec si la valeur est **Oui** ou **Groupe sélectionné**.
remediation:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra avec au moins le rôle Administrateur
       général.
    2. Aller dans **Entra ID** > **Utilisateurs** > **Paramètres utilisateur**.
    3. Régler **Connexions de compte LinkedIn** sur **Non** et sélectionner **Enregistrer**.
  rollback: |
    Repasser l'option sur **Oui** ou **Groupe sélectionné**.
