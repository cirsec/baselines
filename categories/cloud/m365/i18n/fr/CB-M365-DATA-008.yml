# yaml-language-server: $schema=../../../../../schema/control-i18n.schema.json
id: CB-M365-DATA-008
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Activer Customer Lockbox
finding:
  title: Les ingénieurs Microsoft peuvent accéder au contenu du tenant lors du support sans l'accord de l'organisation
  description: Sans Customer Lockbox, l'accès aux données par les ingénieurs du support Microsoft est approuvé uniquement en interne chez Microsoft, sans avis de l'organisation ni trace explicite de la demande.
description: |
  Customer Lockbox est activé pour l'organisation. Quand un ingénieur Microsoft a besoin d'accéder au
  contenu client pour résoudre un incident de support, la demande est envoyée aux approbateurs de
  l'organisation (rôle Approbateur d'accès Customer Lockbox), qui l'approuvent ou la rejettent dans
  le délai imparti, et chaque demande est enregistrée dans le journal d'audit.
rationale: |
  L'accès par le personnel du fournisseur cloud est l'un des risques propres à l'hébergement de
  données sensibles dans un cloud public. Customer Lockbox soumet cet accès à l'approbation
  explicite et tracée de l'organisation, ce qui alimente l'analyse de risque de CB-M365-DATA-010 et
  les exigences contractuelles ou réglementaires sur l'accès des tiers.
impact: |
  Les incidents de support qui nécessitent un accès au contenu attendent un approbateur. Désigner au
  moins deux approbateurs et intégrer l'étape d'approbation à la procédure de support. Customer
  Lockbox ne couvre pas tous les cas (par exemple les réquisitions légales traitées hors support).
setting:
  location: Centre d'administration Microsoft 365 > Paramètres > Paramètres de l'organisation > Sécurité et confidentialité > Customer Lockbox (Exchange Online Get-OrganizationConfig CustomerLockBoxEnabled)
  recommended_value: Exiger une approbation pour toutes les demandes d'accès aux données
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft 365 (https://admin.microsoft.com) avec au
       moins le rôle Lecteur général.
    2. Aller dans **Paramètres** > **Paramètres de l'organisation** > **Sécurité et
       confidentialité** > **Customer Lockbox** et vérifier que **Exiger une approbation pour toutes
       les demandes d'accès aux données** est sélectionné.
    3. Dans le centre d'administration Microsoft Entra, aller dans **Entra ID** > **Rôles et
       administrateurs** et vérifier que **Approbateur d'accès Customer Lockbox** a au moins deux
       membres actifs ou éligibles.
    4. Alternative en PowerShell Exchange Online : `Get-OrganizationConfig | Select-Object
       CustomerLockBoxEnabled`.
    5. Échec si `CustomerLockBoxEnabled` vaut `False` ou si aucun approbateur n'est attribué.
remediation:
  manual: |
    1. Attribuer le rôle **Approbateur d'accès Customer Lockbox** à au moins deux personnes
       (éligibles via PIM si disponible).
    2. Se connecter au centre d'administration Microsoft 365 en tant qu'Administrateur général.
    3. Aller dans **Paramètres** > **Paramètres de l'organisation** > **Sécurité et
       confidentialité** > **Customer Lockbox**, sélectionner **Exiger une approbation pour toutes
       les demandes d'accès aux données** puis **Enregistrer**.
    4. Alternative en PowerShell Exchange Online (Organization Management) :
       `Set-OrganizationConfig -CustomerLockBoxEnabled $true`.
  rollback: |
    Décocher **Exiger une approbation pour toutes les demandes d'accès aux données**, ou
    `Set-OrganizationConfig -CustomerLockBoxEnabled $false`.
