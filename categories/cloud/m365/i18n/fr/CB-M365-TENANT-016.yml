id: CB-M365-TENANT-016
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Activer la protection contre l'hameçonnage interne dans Microsoft Forms
finding:
  title: Microsoft Forms n'analyse pas les formulaires à la recherche d'hameçonnage
  description: Un compte interne compromis ou malveillant peut publier un formulaire qui collecte des mots de passe ou des données personnelles sous le domaine de confiance de l'organisation.
setting:
  location: Centre d'administration Microsoft 365 > Paramètres > Paramètres de l'organisation > Services > Microsoft Forms > Ajouter une protection contre l'hameçonnage interne (Add internal phishing protection)
  recommended_value: Cochée
description: |
  L'option Microsoft Forms **Ajouter une protection contre l'hameçonnage interne** est cochée
  (`isInOrgFormsPhishingScanEnabled` = `true`). Les formulaires sont analysés à la recherche de
  questions qui demandent des mots de passe ou d'autres informations sensibles ; les formulaires
  suspects et leurs auteurs sont bloqués et signalés aux administrateurs.
rationale: |
  Les formulaires hébergés sur forms.office.com portent la marque Microsoft et paraissent
  légitimes. Les attaquants s'en servent, depuis des comptes internes compromis, pour récolter les
  identifiants de collègues. L'analyse arrête les formulaires de collecte d'identifiants les plus
  courants avant leur diffusion.
impact: |
  Un formulaire légitime qui demande des identifiants peut être bloqué ; les administrateurs le
  revoient et le débloquent dans l'administration de Forms.
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft 365 (https://admin.cloud.microsoft) avec
       au moins le rôle Lecteur général.
    2. Aller dans **Paramètres** > **Paramètres de l'organisation** > **Services** > **Microsoft
       Forms**, section **Protection contre l'hameçonnage**.
    3. Alternative en lecture seule avec Microsoft Graph (bêta, étendue `OrgSettings-Forms.Read.All`) :
       `GET https://graph.microsoft.com/beta/admin/forms` et lire
       `settings.isInOrgFormsPhishingScanEnabled`.
    4. Échec si **Ajouter une protection contre l'hameçonnage interne** est décochée (`false`).
remediation:
  manual: |
    1. Se connecter au centre d'administration Microsoft 365 avec au moins le rôle Administrateur
       général.
    2. Aller dans **Paramètres** > **Paramètres de l'organisation** > **Services** > **Microsoft
       Forms**.
    3. Cocher **Ajouter une protection contre l'hameçonnage interne** et **Enregistrer**.
    4. Équivalent avec Microsoft Graph (bêta, étendue `OrgSettings-Forms.ReadWrite.All`) :
       `PATCH https://graph.microsoft.com/beta/admin/forms` avec
       `{"settings": {"isInOrgFormsPhishingScanEnabled": true}}`.
  rollback: |
    Décocher l'option.
