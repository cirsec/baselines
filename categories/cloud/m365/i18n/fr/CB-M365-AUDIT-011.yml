id: CB-M365-AUDIT-011
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Connecter Microsoft Defender for Cloud Apps à Microsoft 365 et activer ses stratégies
finding:
  title: Microsoft Defender for Cloud Apps ne surveille pas l'activité Microsoft 365
  description: Sans le connecteur d'application Microsoft 365 ni stratégies actives, les activités anormales comme les téléchargements massifs, les voyages impossibles ou les applications OAuth suspectes ne sont pas détectées.
description: |
  Microsoft Defender for Cloud Apps a le connecteur d'application **Microsoft 365** connecté avec
  tous les composants (utilisateurs et groupes Microsoft Entra, événements de gestion Microsoft
  Entra, activités Microsoft 365, fichiers). Les stratégies intégrées de détection d'anomalies sont
  activées, et l'organisation ajoute au moins des stratégies pour le téléchargement massif, la
  suppression massive et le partage externe de fichiers sensibles, ainsi que des stratégies de
  gouvernance des applications pour les applications OAuth très privilégiées ou à l'activité
  inhabituelle. Les alertes alimentent les incidents Microsoft Defender XDR traités par l'équipe
  sécurité.
rationale: |
  Defender for Cloud Apps ajoute une détection comportementale au journal d'audit : il établit une
  référence pour chaque utilisateur et alerte sur l'activité depuis des lieux inhabituels, l'activité
  de fichiers typique d'un rançongiciel, les règles de boîte de réception suspectes et les
  applications OAuth à risque. Ces détections couvrent des comportements d'attaquant que les
  contrôles de configuration statiques ne peuvent pas empêcher.
impact: |
  Coût de licence (inclus dans Microsoft 365 E5 et E5 Security). Les stratégies d'anomalie
  demandent une période d'apprentissage d'environ sept jours et un peu d'ajustement pour réduire les
  faux positifs.
audit:
  manual: |
    1. Se connecter au portail Microsoft Defender (https://security.microsoft.com) avec au moins le
       rôle Lecteur Sécurité.
    2. Aller dans **Paramètres** > **Applications cloud** > **Applications connectées** >
       **Connecteurs d'applications** et vérifier que **Microsoft 365** indique **Connecté** avec tous
       les composants sélectionnés.
    3. Aller dans **Applications cloud** > **Stratégies** > **Gestion des stratégies** et vérifier
       que les stratégies de détection des menaces (anomalies) sont activées, et que des stratégies
       de fichier et d'activité existent pour le téléchargement massif, la suppression massive et le
       partage externe de fichiers sensibles.
    4. Aller dans **Applications cloud** > **Gouvernance des applications** et vérifier que la
       gouvernance des applications est activée avec des stratégies actives.
    5. Échec si le connecteur est absent ou partiel, ou si aucune stratégie d'anomalie ou
       personnalisée n'est active.
remediation:
  manual: |
    1. Se connecter au portail Microsoft Defender avec au moins le rôle Administrateur de la
       sécurité.
    2. Aller dans **Paramètres** > **Applications cloud** > **Applications connectées** >
       **Connecteurs d'applications** > **Connecter une application** > **Microsoft 365**,
       sélectionner tous les composants et connecter.
    3. Aller dans **Applications cloud** > **Stratégies** > **Gestion des stratégies**, revoir les
       stratégies intégrées de détection d'anomalies et les activer, puis créer des stratégies
       d'activité et de fichier à partir des modèles (par exemple **Téléchargement massif par un seul
       utilisateur**, **Fichier partagé avec une adresse e-mail personnelle**).
    4. Activer la gouvernance des applications et ses stratégies prédéfinies.
    5. Diriger les alertes vers le SOC via les incidents Microsoft Defender XDR.
  rollback: |
    Désactiver les stratégies ou déconnecter le connecteur d'application.
