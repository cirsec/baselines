id: CB-M365-DEVICE-016
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Bloquer Microsoft Publisher
finding:
  title: Microsoft Publisher peut encore être lancé
  description: Publisher, retiré de Microsoft 365 et doté d'une large surface d'attaque, s'exécute encore sur les appareils où il est installé.
description: |
  Le paramètre du mode de sécurité de base (*Baseline security mode*) **Block Microsoft Publisher**
  est activé dans le centre d'administration Microsoft 365 (stratégie Cloud Policy **Disable
  Publisher** réglée sur **Activé**). Publisher ne démarre sur aucun appareil qui reçoit les
  stratégies des applications Microsoft 365, et l'utilisateur voit un message indiquant qu'une
  stratégie de sécurité de l'organisation l'en empêche.
rationale: |
  Les fichiers Publisher (.pub) sont rarement utilisés, mal inspectés par les filtres de
  messagerie, et l'analyseur de Publisher présente une large surface d'attaque. Microsoft n'inclut
  plus Publisher dans Microsoft 365 depuis octobre 2026 : il ne reçoit plus de nouvelles fonctions et
  sort du support. Le bloquer supprime un vecteur d'attaque dont presque personne n'a besoin.
impact: |
  Les utilisateurs ne peuvent plus ouvrir ni modifier de fichiers .pub. Convertir les publications
  restantes en Word ou PDF (ou passer la mise en page sur un autre outil) avant d'activer le
  paramètre. Ce sont les appareils avec d'anciennes versions des applications Microsoft 365 ou des
  versions perpétuelles d'Office qui contiennent encore Publisher qui comptent : le blocage ne
  s'applique qu'aux applications qui reçoivent les paramètres Cloud Policy.
notes: |
  Microsoft a annoncé que Publisher n'est plus inclus dans Microsoft 365 à partir d'octobre 2026.
  Garder le contrôle tant que l'inventaire montre une installation de Publisher ; il pourra ensuite
  être retiré.
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft 365 (https://admin.cloud.microsoft) avec au
       moins le rôle Lecteur général.
    2. Aller dans **Paramètres** > **Paramètres de l'organisation** > **Sécurité et confidentialité**
       > **Baseline security mode**.
    3. Vérifier que **Block Microsoft Publisher** est activé.
    4. Dans le service Office Cloud Policy (https://config.office.com), vérifier qu'aucune
       configuration de stratégie de priorité plus haute ne règle **Disable Publisher** sur
       **Désactivé**.
    5. Échec si le paramètre est désactivé ou contourné pour un groupe d'utilisateurs.
remediation:
  manual: |
    1. Repérer les derniers utilisateurs de Publisher avec le rapport d'impact du paramètre et
       convertir leurs fichiers.
    2. Dans **Paramètres** > **Paramètres de l'organisation** > **Sécurité et confidentialité** >
       **Baseline security mode**, activer **Block Microsoft Publisher**. Rôle : administrateur des
       applications Office.
    3. Alternative : régler **Disable Publisher** sur **Activé** dans une configuration Office Cloud
       Policy ciblant tous les utilisateurs. Aucune cmdlet PowerShell n'existe.
    4. Retirer Publisher des configurations de déploiement (Office Deployment Tool `ExcludeApp
       ID="Publisher"`) pour les anciennes versions.
  rollback: |
    Désactiver le paramètre, ou remettre **Disable Publisher** à l'état non configuré.
