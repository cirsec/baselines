id: CB-M365-POWER-017
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Restreindre qui peut activer le partage externe des modèles sémantiques
finding:
  title: Tout utilisateur peut partager des modèles sémantiques sur place avec d'autres tenants
  description: Les propriétaires de modèles sémantiques peuvent laisser des invités d'autres tenants se connecter aux données et construire dessus depuis leur propre tenant.
description: |
  Le paramètre du locataire Fabric **Allow specific users to turn on external data sharing**
  (autoriser des utilisateurs précis à activer le partage externe de données), dans les paramètres
  d'exportation et de partage, est **Désactivé**, ou **Activé** uniquement pour des groupes de
  sécurité précis de propriétaires autorisés à partager des modèles sémantiques avec d'autres
  organisations.

  Les paramètres OneLake associés **External data sharing** et **Users can accept external data
  shares** suivent la même règle : désactivés, ou limités à des groupes approuvés.
rationale: |
  Le partage sur place permet à des invités B2B de découvrir et d'utiliser un modèle sémantique
  depuis leur tenant d'origine, avec leurs propres rapports et leur capacité. Les données entrent
  alors dans l'environnement d'une autre organisation, hors de l'audit et du cycle de vie de ce
  tenant. Limiter qui peut l'activer réserve le partage inter-tenant aux cas revus.
impact: |
  Les propriétaires hors des groupes autorisés ne peuvent plus activer le partage externe de leurs
  modèles sémantiques. Les partages externes existants sont à revoir avec leurs propriétaires.
setting:
  location: Portail d'administration Fabric > Paramètres du locataire > Paramètres d'exportation et de partage > Allow specific users to turn on external data sharing
  recommended_value: Désactivé, ou Activé pour des groupes de sécurité précis
audit:
  manual: |
    1. Se connecter à Microsoft Fabric (https://app.fabric.microsoft.com) en tant qu'administrateur
       Fabric.
    2. Ouvrir **Paramètres** > **Portail d'administration** > **Paramètres du locataire** >
       **Paramètres d'exportation et de partage** et développer **Allow specific users to turn on
       external data sharing**. Contrôler aussi **External data sharing** et **Users can accept
       external data shares**.
    3. Vérifier que chacun est **Désactivé**, ou **Activé** pour des **Groupes de sécurité
       spécifiques** seulement.
    4. Alternative en lecture seule : dans `GET https://api.fabric.microsoft.com/v1/admin/tenantsettings`,
       lire l'entrée `EnableDatasetInPlaceSharing`.
    5. Échec si l'un de ces paramètres est activé pour toute l'organisation.
remediation:
  manual: |
    1. Dans **Paramètres du locataire** > **Paramètres d'exportation et de partage** > **Allow
       specific users to turn on external data sharing**, sélectionner **Désactivé**, ou **Activé**
       avec **Groupes de sécurité spécifiques**. Sélectionner **Appliquer**. Rôle : administrateur
       Fabric.
    2. Appliquer la même étendue à **External data sharing** et **Users can accept external data
       shares**.
    3. Équivalent API : `POST
       https://api.fabric.microsoft.com/v1/admin/tenantsettings/EnableDatasetInPlaceSharing/update`
       avec l'état cible.
  rollback: |
    Remettre les paramètres à leur étendue précédente.
