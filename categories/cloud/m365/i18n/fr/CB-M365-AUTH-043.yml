id: CB-M365-AUTH-043
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Avertir tous les administrateurs généraux lorsqu'un administrateur réinitialise son mot de passe
finding:
  title: Les réinitialisations de mot de passe d'administrateurs via le SSPR ne sont pas signalées aux autres administrateurs
  description: Une prise de contrôle d'un compte privilégié via la réinitialisation passe inaperçue des personnes les mieux placées pour réagir.
description: |
  Dans les réglages de réinitialisation de mot de passe en libre-service, **Avertir tous les
  administrateurs lorsque d'autres administrateurs réinitialisent leur mot de passe ?** vaut **Oui**.
  Quand un administrateur réinitialise son propre mot de passe avec le SSPR, chaque Administrateur
  général reçoit un e-mail à son adresse principale.
rationale: |
  La réinitialisation d'un mot de passe administrateur est rare et sensible. En informer les autres
  administrateurs ajoute un second regard : une réinitialisation inattendue du compte d'un collègue
  est un signal fort de prise de contrôle, vérifiable en quelques minutes.
impact: |
  Les Administrateurs généraux reçoivent un e-mail pour chaque réinitialisation en libre-service d'un
  administrateur. S'ils n'ont pas de boîte surveillée, router les notifications vers l'équipe sécurité
  avec le lien de personnalisation du SSPR ou une règle de flux de messagerie.
notes: |
  Seuls les Administrateurs généraux sont avertis. Une alerte du SOC sur l'événement d'audit
  correspondant (**Reset password (self-service)** sur un compte privilégié) donne un signal plus
  fiable ; elle relève du domaine audit.
setting:
  location: Centre d'administration Microsoft Entra > Entra ID > Réinitialisation du mot de passe > Notifications > Avertir tous les administrateurs lorsque d'autres administrateurs réinitialisent leur mot de passe ?
  recommended_value: "Oui"
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra (https://entra.microsoft.com) avec au
       moins le rôle Lecteur général.
    2. Aller dans **Entra ID** > **Réinitialisation du mot de passe** > **Notifications**.
    3. Vérifier que **Avertir tous les administrateurs lorsque d'autres administrateurs réinitialisent
       leur mot de passe ?** vaut **Oui**.
    4. Échec s'il vaut **Non**.
remediation:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra avec au moins le rôle Administrateur
       de la stratégie d'authentification.
    2. Aller dans **Entra ID** > **Réinitialisation du mot de passe** > **Notifications**.
    3. Régler **Avertir tous les administrateurs lorsque d'autres administrateurs réinitialisent leur
       mot de passe ?** sur **Oui** et **Enregistrer**.
  rollback: |
    Régler l'option sur **Non**.
