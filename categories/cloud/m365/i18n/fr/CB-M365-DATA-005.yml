id: CB-M365-DATA-005
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Publier des étiquettes de confidentialité pour tous les utilisateurs
finding:
  title: Aucune étiquette de confidentialité n'est publiée pour les utilisateurs
  description: Les utilisateurs n'ont aucun moyen de classifier documents et e-mails ; les règles de protection, DLP et Copilot fondées sur les étiquettes n'ont donc rien sur quoi s'appuyer.
description: |
  L'organisation dispose d'une taxonomie d'étiquettes de confidentialité alignée sur sa politique de
  classification (par exemple *Public*, *Interne*, *Confidentiel*, *Hautement confidentiel*, avec des
  sous-étiquettes chiffrantes si besoin). Au moins une stratégie de publication rend ces étiquettes
  disponibles pour tous les utilisateurs dans les applications Office, Outlook et les applications
  web Microsoft 365, avec un lien vers le guide interne de classification.
rationale: |
  Les étiquettes sont la base de la protection fondée sur le contenu dans Microsoft 365 : chiffrement
  qui suit le fichier, règles DLP, exclusions Copilot et audit de qui manipule des données
  classifiées. Sans étiquettes publiées, les utilisateurs ne peuvent pas marquer ce qui est sensible
  et la plupart des contrôles de protection des informations restent théoriques.
impact: |
  Les utilisateurs voient un bouton Confidentialité dans les applications Office. Les étiquettes avec
  chiffrement peuvent bloquer l'accès de partenaires externes ou de clients anciens : commencer par
  des étiquettes sans chiffrement et tester le chiffrement sur un groupe pilote. Une formation est
  nécessaire pour un étiquetage cohérent.
audit:
  manual: |
    1. Se connecter au portail Microsoft Purview (https://purview.microsoft.com) avec au moins le
       rôle Lecteur général.
    2. Aller dans **Solutions** > **Protection des informations** > **Étiquettes de confidentialité**
       et vérifier que des étiquettes existent et sont actives.
    3. Aller dans **Solutions** > **Protection des informations** > **Stratégies de publication** et
       vérifier qu'une stratégie publie ces étiquettes pour **Tous les utilisateurs et groupes** (ou
       pour des groupes qui couvrent ensemble tous les utilisateurs).
    4. Alternative en PowerShell Sécurité et conformité : `Get-Label | Format-Table
       DisplayName,Priority,ContentType,Disabled` et `Get-LabelPolicy | Format-List
       Name,Labels,ExchangeLocation,ModernGroupLocation,Enabled,Mode`.
    5. Échec si aucune étiquette n'est publiée, ou si les stratégies de publication laissent des
       utilisateurs de côté.
remediation:
  manual: |
    1. Définir la taxonomie d'étiquettes avec les propriétaires de données et l'équipe sécurité.
    2. Se connecter au portail Microsoft Purview avec au moins le rôle Administrateur Information
       Protection (ou Administrateur de conformité).
    3. Aller dans **Solutions** > **Protection des informations** > **Étiquettes de confidentialité**
       > **Créer une étiquette** pour chaque niveau, avec l'étendue **Fichiers et autres ressources de
       données** et **E-mails**.
    4. Aller dans **Stratégies de publication** > **Publier une étiquette**, sélectionner les
       étiquettes, cibler **Tous les utilisateurs et groupes**, renseigner **Fournir aux utilisateurs
       un lien vers une page d'aide personnalisée**, et publier.
    5. Alternative PowerShell : `New-Label` et `New-LabelPolicy -Labels <étiquettes> -ExchangeLocation All`.
  rollback: |
    Retirer les étiquettes de la stratégie de publication ou supprimer la stratégie. Ne pas supprimer
    des étiquettes déjà appliquées à du contenu.
