id: CB-M365-TENANT-004
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Restreindre l'accès aux fonctions de groupes dans Mes groupes
finding:
  title: Les utilisateurs peuvent parcourir et gérer les groupes dans Mes groupes
  description: Tout utilisateur peut ouvrir Mes groupes pour lister les groupes de l'organisation et leurs membres, ce qui facilite la reconnaissance après la compromission d'un compte.
setting:
  location: Centre d'administration Microsoft Entra > Entra ID > Groupes > Général > Restreindre la capacité des utilisateurs à accéder aux fonctionnalités de groupes dans Mes groupes (Restrict user ability to access groups features in My Groups)
  recommended_value: "Oui"
description: |
  Le paramètre de groupes **Restreindre la capacité des utilisateurs à accéder aux fonctionnalités
  de groupes dans Mes groupes** vaut **Oui** : les non-administrateurs ne peuvent pas utiliser les
  fonctions de groupes du portail Mes groupes (https://myaccount.microsoft.com/groups). Les
  Administrateurs de groupes et d'utilisateurs y gardent un accès en lecture seule.
rationale: |
  Mes groupes permet de découvrir les groupes, leurs propriétaires et leurs membres, et de demander
  à les rejoindre. Un attaquant muni d'un compte ordinaire s'en sert pour cartographier les équipes
  et choisir ses cibles. Restreindre le portail réduit cette exposition quand les groupes sont gérés
  par les administrateurs ou par Teams.
impact: |
  Les utilisateurs ne créent ni ne gèrent plus de groupes depuis Mes groupes ; les propriétaires
  gèrent l'appartenance dans Teams, Outlook ou via le support. Les demandes d'adhésion en
  libre-service ne fonctionnent plus.
notes: |
  Le paramètre n'a pas d'API publique.
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra (https://entra.microsoft.com) avec au
       moins le rôle Lecteur général.
    2. Aller dans **Entra ID** > **Groupes** > **Général**, section **Gestion des groupes en
       libre-service**.
    3. Échec si **Restreindre la capacité des utilisateurs à accéder aux fonctionnalités de groupes
       dans Mes groupes** vaut **Non**.
remediation:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra avec au moins le rôle Administrateur
       de groupes.
    2. Aller dans **Entra ID** > **Groupes** > **Général**.
    3. Régler **Restreindre la capacité des utilisateurs à accéder aux fonctionnalités de groupes
       dans Mes groupes** sur **Oui** et sélectionner **Enregistrer**.
  rollback: |
    Repasser l'option sur **Non**.
