# yaml-language-server: $schema=../../../../../schema/control-i18n.schema.json
id: CB-M365-AUTH-019
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Protéger l'inscription des informations de sécurité par un appareil géré ou la MFA
finding:
  title: Les utilisateurs peuvent enregistrer des méthodes MFA avec le seul mot de passe
  description: Sans stratégie d'accès conditionnel sur l'inscription des informations de sécurité, un attaquant qui détient le mot de passe d'un utilisateur sans méthode peut enregistrer la sienne.
description: |
  Une stratégie d'accès conditionnel cible l'action utilisateur **Inscrire les informations de
  sécurité** pour **Tous les utilisateurs** et n'accorde l'accès que si **l'un** de ces contrôles
  est satisfait : **Exiger que l'appareil soit marqué comme conforme**, **Exiger un appareil joint
  hybride Microsoft Entra**, ou **Exiger la force d'authentification** réglée sur
  **Authentification multifacteur** (un Temporary Access Pass la satisfait).

  La stratégie n'exclut que les comptes d'accès d'urgence et, si c'est documenté, les invités (le
  Temporary Access Pass ne fonctionne pas pour eux). Elle n'exclut pas les emplacements approuvés.
rationale: |
  L'inscription est le moment où une méthode MFA est liée à un compte. Les utilisateurs qui ont
  déjà une méthode doivent la prouver ; le trou concerne les comptes sans méthode, où le mot de
  passe suffit à n'importe qui pour s'inscrire. Exiger un appareil géré ou un Temporary Access Pass
  remis par le support le ferme. Depuis juillet 2026, la même stratégie s'applique aussi à
  l'inscription de Windows Hello Entreprise et de l'authentification unique de plateforme macOS.
impact: |
  Les nouveaux utilisateurs sans appareil géré ont besoin d'un Temporary Access Pass pour leur
  premier enregistrement ; le processus d'arrivée doit en émettre un. Les utilisateurs qui
  remplacent un téléphone perdu depuis un appareil personnel en ont aussi besoin.
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra (https://entra.microsoft.com) avec au
       moins le rôle Lecteur Sécurité.
    2. Aller dans **Entra ID** > **Accès conditionnel** > **Stratégies**.
    3. Trouver une stratégie à l'**État** **Activé** où :
       - **Utilisateurs** > **Inclure** vaut **Tous les utilisateurs**, et **Exclure** ne contient
         que les comptes d'accès d'urgence (et les invités si c'est documenté) ;
       - **Ressources cibles** vaut **Actions utilisateur** > **Inscrire les informations de
         sécurité** ;
       - **Réseau** n'exclut pas les emplacements approuvés ;
       - **Accorder** exige un appareil conforme, un appareil joint hybride ou une force
         d'authentification MFA (l'un d'eux, ou une partie).
    4. Alternative en lecture seule avec Microsoft Graph PowerShell (étendue `Policy.Read.All`) :
       `Get-MgIdentityConditionalAccessPolicy | Where-Object { $_.Conditions.Applications.IncludeUserActions -contains 'urn:user:registersecurityinfo' } | Select-Object DisplayName, State, @{n='Grant';e={$_.GrantControls.BuiltInControls}}, @{n='Op';e={$_.GrantControls.Operator}}`
    5. Échec si aucune stratégie de ce type n'existe, si elle est en Rapport seul ou Désactivée, si
       elle exclut les emplacements approuvés, ou si son octroi peut être satisfait sans appareil
       géré ni MFA.
remediation:
  manual: |
    1. Activer la méthode Temporary Access Pass (usage unique, CB-M365-AUTH-017) et l'intégrer au
       processus d'arrivée.
    2. Avec au moins le rôle Administrateur de l'accès conditionnel, aller dans **Entra ID** >
       **Accès conditionnel** > **Stratégies** et sélectionner **Nouvelle stratégie**.
    3. La nommer, par exemple `ALL - Secure security info registration`.
    4. **Utilisateurs** > **Inclure** : **Tous les utilisateurs**. **Exclure** : les comptes d'accès
       d'urgence, et **Tous les invités et utilisateurs externes** si les invités sont couverts
       autrement.
    5. **Ressources cibles** > **Actions utilisateur** : **Inscrire les informations de sécurité**.
    6. **Accorder** > **Accorder l'accès** : cocher **Exiger la force d'authentification**
       (Authentification multifacteur), **Exiger que l'appareil soit marqué comme conforme** et
       **Exiger un appareil joint hybride Microsoft Entra**, puis **Exiger un des contrôles
       sélectionnés**.
    7. Régler **Activer la stratégie** sur **Rapport seul**, enregistrer, examiner les journaux de
       connexion, puis passer à **Activé**.
    Équivalent Graph : `New-MgIdentityConditionalAccessPolicy` avec
    `conditions.applications.includeUserActions` à `urn:user:registersecurityinfo` et
    `grantControls` avec l'opérateur `OR`.
  rollback: |
    Passer la stratégie en **Rapport seul** ou **Désactivé**.
