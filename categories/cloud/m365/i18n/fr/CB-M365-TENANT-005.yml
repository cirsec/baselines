id: CB-M365-TENANT-005
locale: fr
source_updated: 2026-10-24
translators:
  - name: Alice
    github: Sn0wAlice
title: Empêcher les propriétaires de gérer les demandes d'adhésion dans Mes groupes
finding:
  title: Les propriétaires de groupes approuvent les demandes d'adhésion dans Mes groupes
  description: Les propriétaires de groupes peuvent approuver des demandes d'adhésion dans Mes groupes sans intervention d'un administrateur, si bien que l'accès accordé par les groupes croît hors gouvernance.
setting:
  location: Centre d'administration Microsoft Entra > Entra ID > Groupes > Général > Les propriétaires peuvent gérer les demandes d'appartenance aux groupes dans Mes groupes (Owners can manage group membership requests in My Groups)
  recommended_value: "Non"
description: |
  Le paramètre de groupes **Les propriétaires peuvent gérer les demandes d'appartenance aux groupes
  dans Mes groupes** vaut **Non** : les utilisateurs ne peuvent pas demander à rejoindre des groupes
  dans Mes groupes et les propriétaires ne peuvent pas y approuver de telles demandes. Les
  changements d'appartenance passent par les processus que l'organisation maîtrise (gestion des
  droits d'utilisation, support, Teams).
rationale: |
  Les demandes d'adhésion en libre-service permettent aux utilisateurs d'accumuler des appartenances
  à des groupes, et donc des accès, sur décision d'un propriétaire qui ne sait pas toujours ce que
  le groupe accorde. Les désactiver maintient les décisions d'accès par groupe dans des processus
  gouvernés.
impact: |
  Les utilisateurs qui rejoignaient des groupes via Mes groupes doivent demander à un propriétaire
  de les ajouter directement, ou utiliser des packages d'accès quand ils existent.
notes: |
  Le paramètre n'a pas d'API publique.
audit:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra (https://entra.microsoft.com) avec au
       moins le rôle Lecteur général.
    2. Aller dans **Entra ID** > **Groupes** > **Général**, section **Gestion des groupes en
       libre-service**.
    3. Échec si **Les propriétaires peuvent gérer les demandes d'appartenance aux groupes dans Mes
       groupes** vaut **Oui**.
remediation:
  manual: |
    1. Se connecter au centre d'administration Microsoft Entra avec au moins le rôle Administrateur
       de groupes.
    2. Aller dans **Entra ID** > **Groupes** > **Général**.
    3. Régler **Les propriétaires peuvent gérer les demandes d'appartenance aux groupes dans Mes
       groupes** sur **Non** et sélectionner **Enregistrer**.
  rollback: |
    Repasser l'option sur **Oui**.
