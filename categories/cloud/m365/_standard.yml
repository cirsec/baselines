# yaml-language-server: $schema=../../../schema/standard.schema.json
id: m365
code: M365
title: Microsoft 365 tenant
description: Secure configuration baseline for Microsoft 365 tenants (Entra ID, Exchange Online, Defender for Office 365, SharePoint, OneDrive, Teams, Purview, Intune tenant settings, Power Platform and Fabric). Every control is checked and applied by hand.
status: draft
version: 0.1.0
applies_to:
  - product: Microsoft 365
    vendor: Microsoft
profiles:
  - key: baseline
    title: Baseline
    description: Settings every tenant should apply. Low operational impact.
  - key: hardened
    title: Hardened
    description: Stronger settings for sensitive environments. May require user communication or licenses.
    extends: baseline
domains:
  - code: AUTH
    title: Identity & authentication
  - code: ADMIN
    title: Privileged access & administration
  - code: TENANT
    title: Directory, guests & tenant settings
  - code: APPS
    title: Applications, consent & AI agents
  - code: MAIL
    title: Exchange Online, Defender for Office 365 & mail DNS
  - code: COLLAB
    title: SharePoint, OneDrive & Teams
  - code: DATA
    title: Data protection
  - code: AUDIT
    title: Logging & monitoring
  - code: DEVICE
    title: Devices, Intune tenant settings & Microsoft 365 Apps
  - code: POWER
    title: Power Platform, Fabric & Copilot Studio
maintainers:
  - name: Alice
    github: Sn0wAlice
primary_sources:
  - title: Microsoft Entra ID documentation
    url: https://learn.microsoft.com/entra/identity/
    publisher: Microsoft
    kind: vendor-doc
  - title: Microsoft Graph API reference
    url: https://learn.microsoft.com/graph/api/overview
    publisher: Microsoft
    kind: vendor-doc
  - title: Exchange Online documentation
    url: https://learn.microsoft.com/exchange/exchange-online
    publisher: Microsoft
    kind: vendor-doc
  - title: Baseline security mode settings
    url: https://learn.microsoft.com/microsoft-365/baseline-security-mode/baseline-security-mode-settings
    publisher: Microsoft
    kind: vendor-doc
  - title: CISA SCuBA Microsoft 365 Secure Configuration Baselines (ScubaGear 2.0.0)
    url: https://github.com/cisagov/ScubaGear/tree/main/PowerShell/ScubaGear/baselines
    publisher: CISA
    kind: standard
  - title: Recommandations relatives à l'authentification multifacteur et aux mots de passe
    url: https://messervices.cyber.gouv.fr/documents-guides/anssi-guide-authentification_multifacteur_et_mots_de_passe.pdf
    publisher: ANSSI
    kind: guide
  - title: Recommandations relatives à l'administration sécurisée des systèmes d'information
    url: https://messervices.cyber.gouv.fr/documents-guides/anssi-guide-admin_securisee_si_v3-0.pdf
    publisher: ANSSI
    kind: guide
i18n:
  fr:
    title: Tenant Microsoft 365
    description: Référentiel de configuration sécurisée pour les tenants Microsoft 365 (Entra ID, Exchange Online, Defender for Office 365, SharePoint, OneDrive, Teams, Purview, réglages tenant d'Intune, Power Platform et Fabric). Chaque contrôle se vérifie et s'applique à la main.
    domains:
      AUTH: Identité et authentification
      ADMIN: Accès à privilèges et administration
      TENANT: Annuaire, invités et réglages du tenant
      APPS: Applications, consentement et agents IA
      MAIL: Exchange Online, Defender for Office 365 et DNS de messagerie
      COLLAB: SharePoint, OneDrive et Teams
      DATA: Protection des données
      AUDIT: Journalisation et supervision
      DEVICE: Appareils, réglages tenant d'Intune et Microsoft 365 Apps
      POWER: Power Platform, Fabric et Copilot Studio
    profiles:
      baseline:
        title: Socle
        description: Paramètres que tout tenant devrait appliquer. Impact opérationnel faible.
      hardened:
        title: Renforcé
        description: Paramètres plus stricts pour les environnements sensibles. Peut nécessiter de la communication aux utilisateurs ou des licences.
