# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-SVC-013
title: Remove clear-text network clients (NIS, rsh, talk, telnet, LDAP tools, FTP)
finding:
  title: Clients for clear-text or obsolete network protocols are installed
  description: These clients send credentials in clear text or help an intruder move to other systems.
status: draft
profiles: [core]
risk:
  severity: low
assessment: automated
tags: [packages, clients, telnet, rsh, ftp, nis, ldap]

description: |
  Client packages for protocols that are obsolete or that send credentials without encryption:

  - NIS client: `nis` (ypbind);
  - rsh, rlogin and rcp: `rsh-client`, `rsh-redone-client` (up to 24.04);
  - talk: `talk`, `inetutils-talk`;
  - telnet: `telnet`, `inetutils-telnet`;
  - LDAP command-line tools: `ldap-utils`;
  - FTP: `ftp`, `tnftp`, `inetutils-ftp`.

  The control passes when none of them is installed.
rationale: |
  Using these clients exposes passwords and data on the network. An intruder who lands on the
  system can also use them to reach or probe other hosts. SSH, SFTP and LDAP over TLS libraries
  replace them.
impact: |
  Removes the listed packages, and any package that depends on them. On a stock Ubuntu image this
  includes the `ubuntu-standard` metapackage (and `ubuntu-server` on 20.04), which depends on
  `telnet` and `ftp`: the packages it pulled in stay installed, but packages added to it by later
  updates are no longer installed automatically. Administrators who use
  `ldapsearch` or `telnet` for troubleshooting lose them; `nc` or `openssl s_client` cover most
  of these uses. Systems that really need one of them must exclude this control in their
  tailoring file.
notes: |
  The NIS client also needs CB-UBU-SVC-003 (rpcbind); LDAP authentication through SSSD does not
  need `ldap-utils`.

audit:
  manual: |
    Run `dpkg-query -W -f='${Package} ${Status}\n' nis rsh-client rsh-redone-client talk
    inetutils-talk telnet inetutils-telnet ldap-utils ftp tnftp inetutils-ftp`. No line may end
    with `install ok installed`.
  logic: all
  checks:
    - id: nis
      engine: package
      description: NIS client.
      spec: { name: nis, state: absent }
    - id: rsh-client
      engine: package
      description: rsh client.
      spec: { name: rsh-client, state: absent }
    - id: rsh-redone-client
      engine: package
      description: rsh-redone client.
      spec: { name: rsh-redone-client, state: absent }
    - id: talk
      engine: package
      description: talk client.
      spec: { name: talk, state: absent }
    - id: inetutils-talk
      engine: package
      description: GNU inetutils talk client.
      spec: { name: inetutils-talk, state: absent }
    - id: telnet
      engine: package
      description: telnet client.
      spec: { name: telnet, state: absent }
    - id: inetutils-telnet
      engine: package
      description: GNU inetutils telnet client.
      spec: { name: inetutils-telnet, state: absent }
    - id: ldap-utils
      engine: package
      description: OpenLDAP command-line tools.
      spec: { name: ldap-utils, state: absent }
    - id: ftp
      engine: package
      description: ftp client.
      spec: { name: ftp, state: absent }
    - id: tnftp
      engine: package
      description: tnftp client.
      spec: { name: tnftp, state: absent }
    - id: inetutils-ftp
      engine: package
      description: GNU inetutils ftp client.
      spec: { name: inetutils-ftp, state: absent }

remediation:
  manual: |
    Run `apt purge nis rsh-client rsh-redone-client talk inetutils-talk telnet inetutils-telnet
    ldap-utils ftp tnftp inetutils-ftp`, after checking the list of packages apt will remove.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Reinstall the needed package with `apt install <package>`.
  scripts:
    - id: nis
      from_check: nis
    - id: rsh-client
      from_check: rsh-client
    - id: rsh-redone-client
      from_check: rsh-redone-client
    - id: talk
      from_check: talk
    - id: inetutils-talk
      from_check: inetutils-talk
    - id: telnet
      from_check: telnet
    - id: inetutils-telnet
      from_check: inetutils-telnet
    - id: ldap-utils
      from_check: ldap-utils
    - id: ftp
      from_check: ftp
    - id: tnftp
      from_check: tnftp
    - id: inetutils-ftp
      from_check: inetutils-ftp

