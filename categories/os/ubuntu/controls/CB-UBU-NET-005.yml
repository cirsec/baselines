# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-NET-005
title: Run exactly one host firewall
finding:
  title: No host firewall is active, or several firewall tools compete for the same rules
  description: Without a host firewall every listening service is reachable from the network; with several, rules overwrite each other in ways nobody planned.
status: active
profiles: [core]
risk:
  severity: high
assessment: automated
tags: [firewall, ufw, nftables, network]

description: |
  The Linux kernel filters packets with netfilter. On Ubuntu, its rules are managed by one of
  these tools, each started at boot by its own service:

  - `ufw`, a simple front end, active when `ufw status` shows `Status: active`;
  - `nftables`, rules loaded from `/etc/nftables.conf` by `nftables.service`;
  - `firewalld`;
  - `iptables-persistent`, rules restored by `netfilter-persistent.service`.

  This control requires exactly one of them to be enabled. Its default policy is covered by
  CB-UBU-NET-006.
rationale: |
  A host firewall limits the services reachable from the network to the ones that are meant to
  be, even when a package starts a new listener or a service binds to all addresses by mistake.
  Two firewall tools flush or reorder each other's rules on reload, which leaves the host either
  wide open or cut off after a restart.
impact: |
  The automatic fix installs and enables ufw when no firewall is active. It allows the SSH ports
  first, but ufw then drops every other incoming connection: services such as web or database
  servers become unreachable until they are allowed with `ufw allow <port>/<protocol>`. It is
  disabled by default; list the listening services with `ss -tulpn` and allow them before
  enabling it.
notes: |
  ufw is installed by default on every Ubuntu release but left inactive (`ENABLED=no` in
  `/etc/ufw/ufw.conf`); `ufw.service` is enabled anyway, which is why the check reads `ufw status`
  rather than the unit state. Ubuntu documents ufw and the CIS Benchmarks favour it; nftables,
  firewalld and iptables-persistent are accepted too. On 22.04 and later, iptables is the
  `iptables-nft` variant, so ufw rules also show in `nft list ruleset`: that does not count as a
  second firewall as long as `nftables.service` is not enabled. 20.04 uses the legacy iptables
  back end. Docker and libvirt add their own rules beside the host firewall; they are not counted.
  The fix reads the SSH ports from `sshd -T`; on 24.04 and later, where sshd is started by
  `ssh.socket`, it first creates `/run/sshd` if no connection has started the service yet, and
  stops without enabling ufw if it cannot find any port.

audit:
  manual: |
    1. `ufw status` (if installed): `Status: active` counts as one.
    2. `systemctl is-enabled nftables.service firewalld.service netfilter-persistent.service`:
       each `enabled` counts as one.
    Exactly one must be counted.
  checks:
    - id: single-firewall
      engine: shell
      description: Firewall tools enabled at boot.
      spec:
        script: |
          active=
          if command -v ufw >/dev/null 2>&1 && ufw status 2>/dev/null | grep -q '^Status: active'; then
            active="$active ufw"
          fi
          for u in nftables firewalld netfilter-persistent; do
            [ "$(systemctl is-enabled "$u.service" 2>/dev/null)" = enabled ] && active="$active $u"
          done
          echo "active firewall tools:${active:- none}"
          set -- $active
          [ "$#" -eq 1 ]

remediation:
  manual: |
    - No firewall: ufw is installed by default (otherwise `apt install ufw`). Allow SSH and the
      other services that must stay reachable, then enable it:
      ```
      ufw allow 22/tcp
      ufw enable
      ```
      Or write `/etc/nftables.conf` (see CB-UBU-NET-006) and run `systemctl enable --now nftables`.
    - Several tools: keep one, then disable the others, for example `ufw disable`,
      `systemctl disable --now nftables` or `apt purge iptables-persistent`.
  effects:
    restart: none
    disruption: high
    lockout_risk: true
  rollback: |
    Run `ufw disable`. Installed packages can stay.
  scripts:
    - id: enable-ufw
      engine: shell
      file: fix.sh

