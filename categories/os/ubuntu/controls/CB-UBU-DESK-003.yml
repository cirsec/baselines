# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-DESK-003
title: Lock GNOME sessions after a short inactivity delay
finding:
  title: Users can extend or disable the GNOME inactivity lock
  description: An unattended GNOME session stays usable by anyone in front of the screen for as long as the user configured.
status: draft
profiles: [desktop]
risk:
  severity: medium
assessment: automated
tags: [gnome, dconf, session-lock]

applicability:
  facts: [desktop-gnome]

description: |
  Two GNOME keys control when an idle session gets locked:

  - `org.gnome.desktop.session idle-delay`: seconds of inactivity before the session is
    considered idle and the screen blanks;
  - `org.gnome.desktop.screensaver lock-delay`: seconds between the screen blanking and the
    lock.

  Both are set in the system dconf database `local` and locked. The lock itself requires
  `lock-enabled`, set by CB-UBU-DESK-009.
rationale: |
  A session left open on an unattended machine gives its access to anyone passing by. Locking
  after a short delay limits that window, and locking the keys stops users from disabling it.
impact: |
  Sessions lock after {{ idle_delay }} seconds of inactivity, plus {{ lock_delay }} seconds.
  Users cannot change these delays. Presentations and video calls inhibit the idle delay while
  they run.
notes: |
  Ubuntu's defaults (GNOME 3.36 to 50) are already 300 and 0 seconds, but users can change
  them. The check expects exactly the configured values. `dconf read` as root reads the system
  database, which wins over user values for locked keys.

setting:
  location: /etc/dconf/db/local.d/, keys /org/gnome/desktop/session/idle-delay and /org/gnome/desktop/screensaver/lock-delay
  default_value: 300 and 0 seconds, not locked
  recommended_value: "idle-delay=uint32 {{ idle_delay }}, lock-delay=uint32 {{ lock_delay }}, locked"

parameters:
  - name: idle_delay
    type: integer
    description: Seconds of inactivity before the screen blanks. 0 would disable the lock.
    unit: seconds
    default: 300
    minimum: 1
    maximum: 900
  - name: lock_delay
    type: integer
    description: Seconds between the screen blanking and the lock.
    unit: seconds
    default: 0
    minimum: 0
    maximum: 5

audit:
  manual: |
    1. `dconf read /org/gnome/desktop/session/idle-delay` must print `uint32 {{ idle_delay }}`.
    2. `dconf read /org/gnome/desktop/screensaver/lock-delay` must print `uint32 {{ lock_delay }}`.
    3. Both keys must be listed in a file of `/etc/dconf/db/local.d/locks/`.
  checks:
    - id: idle-delay
      engine: dconf
      description: Inactivity delay before the screen blanks.
      facts: [desktop-gnome]
      spec:
        key: /org/gnome/desktop/session/idle-delay
        value: "uint32 {{ idle_delay }}"
    - id: lock-delay
      engine: dconf
      description: Delay between blanking and locking.
      facts: [desktop-gnome]
      spec:
        key: /org/gnome/desktop/screensaver/lock-delay
        value: "uint32 {{ lock_delay }}"

remediation:
  manual: |
    1. Make sure `/etc/dconf/profile/user` contains `user-db:user` and `system-db:local`.
    2. Create `/etc/dconf/db/local.d/00-screen-lock`:
       ```
       [org/gnome/desktop/session]
       idle-delay=uint32 {{ idle_delay }}

       [org/gnome/desktop/screensaver]
       lock-delay=uint32 {{ lock_delay }}
       ```
    3. List `/org/gnome/desktop/session/idle-delay` and `/org/gnome/desktop/screensaver/lock-delay`
       in `/etc/dconf/db/local.d/locks/00-screen-lock`.
    4. Run `dconf update`.
  effects:
    restart: session
    disruption: low
    lockout_risk: false
  rollback: |
    Delete the files written in `/etc/dconf/db/local.d/` and its `locks/` directory, then run
    `dconf update`.
  scripts:
    - id: idle-delay
      from_check: idle-delay
    - id: lock-delay
      from_check: lock-delay

references:
