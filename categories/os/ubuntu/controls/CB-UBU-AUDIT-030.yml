# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-AUDIT-030
title: Restrict access to the audit logs
finding:
  title: Audit logs can be read or changed by users other than root
  description: The audit log records the actions of every user and must not be readable by them, nor writable by anyone but auditd.
status: active
profiles: [server-hardened, desktop-hardened]
risk:
  severity: medium
assessment: automated
tags: [auditd, permissions]

description: |
  auditd writes its logs to `/var/log/audit/`. This control requires:

  - the directory owned by root, mode `0750` or stricter;
  - every file in it owned by root, mode `0640` or stricter;
  - every file in it owned by group root or by the `log_group` of `/etc/audit/auditd.conf`
    (`adm` on Ubuntu), so that only that group can read them.
rationale: |
  The audit trail is evidence of what users did. If users can read it they learn what is
  monitored; if anyone but auditd can write it, it can be falsified.
impact: |
  None known. Ubuntu already creates the directory and files with these permissions.
notes: |
  The control assumes the default `log_file = /var/log/audit/audit.log`.

setting:
  location: /var/log/audit/
  default_value: "Directory root:adm 0750, files root:adm 0640"
  recommended_value: "Directory root 0750, files root:<log_group> 0640 or stricter"

audit:
  manual: |
    1. Run `stat -c '%n %U:%G %a' /var/log/audit /var/log/audit/*`.
    2. The directory must be owned by root with mode 0750 or stricter; each file owned by root with
       mode 0640 or stricter, and group root or the `log_group` of `/etc/audit/auditd.conf`.
  checks:
    - id: directory
      engine: file-perms
      description: Owner and mode of /var/log/audit.
      spec: { path: /var/log/audit, owner: root, mode: "0750" }
    - id: files
      engine: file-perms
      description: Owner and mode of the audit log files.
      spec: { path: /var/log/audit/*, owner: root, mode: "0640" }
    - id: group
      engine: shell
      description: Group of the audit log files, compared with log_group.
      spec:
        script: |
          [ -d /var/log/audit ] || exit 2
          g=$(sed -n 's/^[[:space:]]*log_group[[:space:]]*=[[:space:]]*\([^[:space:]]*\).*/\1/p' /etc/audit/auditd.conf 2>/dev/null | tail -n 1)
          g=${g:-root}
          bad=$(find /var/log/audit -type f ! -group root ! -group "$g" 2>/dev/null)
          echo "log_group=$g${bad:+, other group on: $bad}"
          [ -z "$bad" ]

remediation:
  manual: |
    Run `chown root /var/log/audit /var/log/audit/*`, `chmod 750 /var/log/audit`,
    `chmod 640 /var/log/audit/*` and `chgrp <log_group> /var/log/audit/*`.
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  rollback: |
    No rollback needed; these are the Ubuntu defaults.
  scripts:
    - id: directory
      from_check: directory
    - id: files
      from_check: files
    - id: group
      engine: shell
      content: |
        g=$(sed -n 's/^[[:space:]]*log_group[[:space:]]*=[[:space:]]*\([^[:space:]]*\).*/\1/p' /etc/audit/auditd.conf 2>/dev/null | tail -n 1)
        g=${g:-root}
        [ -d /var/log/audit ] || exit 0
        find /var/log/audit -type f ! -group root ! -group "$g" -exec chgrp "$g" {} +

references:
  - title: auditd.conf(5), Ubuntu manual pages
    url: https://manpages.ubuntu.com/manpages/noble/man5/auditd.conf.5.html
    publisher: Canonical
    kind: vendor-doc
    accessed: 2026-10-19
