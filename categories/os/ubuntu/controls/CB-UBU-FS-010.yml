# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-FS-010
title: Review setuid and setgid programs and keep only those that are needed
finding:
  title: Unexpected setuid or setgid programs are present
  description: Each setuid or setgid program runs with extra privileges for any user, so one flaw or one planted binary gives those privileges away.
status: draft
profiles: [core]
risk:
  severity: medium
assessment: partial
tags: [permissions, setuid, setgid, privilege-escalation]

description: |
  A program with the setuid (or setgid) bit runs with the rights of its owner (or group), usually
  root, whoever starts it. Every such program on local filesystems is known and needed. The
  check lists the ones that do not match `{{ allowed }}`, a list of shell patterns that holds the
  setuid and setgid programs shipped by common Ubuntu packages. A human still reviews the full list.
rationale: |
  Setuid root programs are the main way for a local user to escalate privileges: a bug in any of
  them (pkexec, sudo and others have had several) gives root. Attackers also leave a setuid copy
  of a shell behind as a backdoor. Fewer such programs mean less attack surface, and a reviewed
  list makes a new one stand out.
impact: |
  Removing the setuid bit from a program stops non-root users from using it (for example `chfn`,
  `chsh` or `newgrp`). Check who needs each program before removing it.
notes: |
  Fresh Ubuntu cloud images have 20 to 25 such programs. They are all in the default list except
  `/usr/bin/ntfs-3g` on 26.04, which the image ships setuid root: NTFS support is rarely needed on
  a server, and its FUSE driver running as root has had several privilege escalation flaws, so it
  is reported for review rather than accepted. On 26.04 `sudo` is sudo-rs
  (`/usr/lib/cargo/bin/sudo` and `su`), with the original sudo kept as `/usr/bin/sudo.ws`.
  Graphical workstations add a few more (for example `Xorg.wrap`, `pppd`): add the ones that are
  needed to the tailoring file.
  `dpkg-statoverride` keeps a removed bit across package upgrades; a plain `chmod` is undone at
  the next upgrade of the package. The check passes as "review": it confirms there is nothing
  unexpected, not that every listed program is needed.

parameters:
  - name: allowed
    type: list
    description: Shell patterns of setuid and setgid programs accepted without review.
    default:
      - /usr/bin/at
      - /usr/bin/chage
      - /usr/bin/chfn
      - /usr/bin/chsh
      - /usr/bin/crontab
      - /usr/bin/dotlockfile
      - /usr/bin/expiry
      - /usr/bin/fusermount
      - /usr/bin/fusermount3
      - /usr/bin/gpasswd
      - /usr/bin/mount
      - /usr/bin/newgrp
      - /usr/bin/passwd
      - /usr/bin/pkexec
      - /usr/bin/ssh-agent
      - /usr/bin/su
      - /usr/bin/sudo
      - /usr/bin/sudo.ws
      - /usr/bin/umount
      - /usr/bin/wall
      - /usr/bin/write
      - /usr/bin/bsd-write
      - /usr/lib/dbus-1.0/dbus-daemon-launch-helper
      - /usr/lib/openssh/ssh-keysign
      - /usr/lib/polkit-1/polkit-agent-helper-1
      - /usr/lib/*/utempter/utempter
      - /usr/lib/cargo/bin/su
      - /usr/lib/cargo/bin/sudo
      - /usr/lib/eject/dmcrypt-get-device
      - /usr/lib/policykit-1/polkit-agent-helper-1
      - /usr/lib/snapd/snap-confine
      - /usr/libexec/polkit-agent-helper-1
      - /usr/lib/xorg/Xorg.wrap
      - /usr/sbin/exim4
      - /usr/sbin/pam_extrausers_chkpwd
      - /usr/sbin/unix_chkpwd

audit:
  manual: |
    1. For each local filesystem listed by `findmnt -knr -o TARGET -t ext2,ext3,ext4,xfs,btrfs,jfs,f2fs,vfat,exfat,tmpfs`, run
       `find <mount point> -xdev -type f -perm /6000 -exec ls -l {} +`.
    2. For each program, check that it comes from a package (`dpkg -S <program>`), that
       `dpkg --verify <package>` reports no change, and that it is needed on this system.
  checks:
    - id: unexpected
      engine: shell
      description: Setuid and setgid files on local filesystems that match none of the allowed patterns.
      spec:
        script: |
          all=$(for m in $(findmnt -knr -o TARGET -t ext2,ext3,ext4,xfs,btrfs,jfs,f2fs,vfat,exfat,tmpfs); do
            find "$m" -xdev -type f -perm /6000 -print 2>/dev/null
          done | sort -u)
          set -f
          rc=0 n=0
          for f in $all; do
            n=$((n + 1))
            ok=0
            for p in $CB_ALLOWED; do
              # shellcheck disable=SC2254 # the pattern is the point
              case $f in $p) ok=1; break ;; esac
            done
            [ "$ok" = 1 ] && continue
            echo "unexpected: $(stat -c '%A %U:%G' "$f") $f"
            rc=1
          done
          echo "$n setuid/setgid file(s) in total"
          exit $rc

remediation:
  manual: |
    For each unexpected program, and for listed programs that this system does not need:
    1. If it belongs to no package (`dpkg -S` finds nothing) or `dpkg --verify` reports it as
       changed, treat it as a possible compromise and investigate before deleting it.
    2. If its package is not needed, purge the package.
    3. Otherwise remove the bit in a way that survives upgrades:
       `dpkg-statoverride --update --add root root 0755 <program>`.
    4. Add programs that are needed and reviewed to `{{ allowed }}` in the tailoring file.

references:
