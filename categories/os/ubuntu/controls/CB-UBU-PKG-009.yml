verified:
  - date: 2026-10-19
    by: Sn0wAlice
    versions: ["20.04"]
    environment: Proxmox VM, Ubuntu 20.04 cloud image, kernel 5.4.0-216-generic
    notes: "Fails on stock (past standard support, not attached to Ubuntu Pro); passes with a shimmed Pro client reporting esm-infra enabled (no Pro token in the lab)."
  - date: 2026-10-19
    by: Sn0wAlice
    versions: ["22.04"]
    environment: Proxmox VM, Ubuntu 22.04 cloud image, kernel 5.15.0-198-generic
    notes: "Passes with the default lists; with the release moved to esm_versions, fails without esm-infra and passes with a shimmed Pro client reporting it enabled."
  - date: 2026-10-19
    by: Sn0wAlice
    versions: ["24.04"]
    environment: Proxmox VM, Ubuntu 24.04 cloud image, kernel 6.8.0-147-generic
    notes: "Passes with the default lists; with the release moved to esm_versions, fails without esm-infra and passes with a shimmed Pro client reporting it enabled."
  - date: 2026-10-19
    by: Sn0wAlice
    versions: ["26.04"]
    environment: Proxmox VM, Ubuntu 26.04 cloud image, kernel 7.0.0-38-generic
    notes: "Passes with the default lists; with the release moved to esm_versions, fails without esm-infra and passes with a shimmed Pro client reporting it enabled."
