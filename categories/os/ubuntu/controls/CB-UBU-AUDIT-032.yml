# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-AUDIT-032
title: Install the AIDE file integrity checker
finding:
  title: No file integrity checker is installed
  description: Changes to system binaries and configuration files, such as a replaced program or a planted backdoor, go unnoticed.
status: active
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [aide, integrity]

description: |
  AIDE (Advanced Intrusion Detection Environment) records the checksums and attributes of
  system files in a database, then compares the files with it. Ubuntu splits it into `aide`
  (the program) and `aide-common` (configuration in `/etc/aide/`, `aideinit`, daily check).
  Neither is installed by default.
rationale: |
  An integrity checker is the simplest way to detect that files which should never change
  (binaries, libraries, configuration) have been modified, whether by an intruder or by mistake.
impact: |
  Installing AIDE alone does nothing until its database is built (CB-UBU-AUDIT-034).
notes: |
  The fix installs without recommended packages: `aide` recommends a mail transport agent, which
  `apt-get` would otherwise install (exim4). Reports of the daily check are written to
  `/var/log/aide/`; install and configure a mail transport if they must be mailed.

setting:
  location: aide and aide-common packages
  default_value: Not installed
  recommended_value: Installed

audit:
  manual: |
    Run `dpkg-query -W -f='${Package} ${Status}\n' aide aide-common`. Both must end with `installed`.
  checks:
    - id: aide
      engine: package
      description: aide is installed.
      spec: { name: aide, state: installed }
    - id: aide-common
      engine: package
      description: aide-common is installed.
      spec: { name: aide-common, state: installed }

remediation:
  manual: |
    Run `apt-get install --no-install-recommends aide aide-common`.
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  rollback: |
    Run `apt-get purge aide aide-common`.
  scripts:
    - id: install
      engine: shell
      content: |
        DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install -y -q --no-install-recommends aide aide-common

references:
  - title: aide(1), Ubuntu manual pages
    url: https://manpages.ubuntu.com/manpages/noble/man1/aide.1.html
    publisher: Canonical
    kind: vendor-doc
    accessed: 2026-10-19
  - title: ANSSI-BP-028 v2.0 - Recommandations de configuration d'un système GNU/Linux (R76)
    url: https://messervices.cyber.gouv.fr/documents-guides/fr_np_linux_configuration-v2.0.pdf
    publisher: ANSSI
    kind: guide
    accessed: 2026-10-19
