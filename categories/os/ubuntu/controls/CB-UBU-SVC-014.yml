# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-SVC-014
title: Run exactly one time synchronization daemon
finding:
  title: The system clock is not synchronized, or several daemons fight over it
  description: Wrong timestamps break log correlation, certificate checks and Kerberos; two daemons make the clock jump.
status: draft
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [time, ntp, chrony, timesyncd]

description: |
  Ubuntu ships several NTP clients: `systemd-timesyncd` (the default up to 24.04), `chrony` (the
  default from 26.04, with `chronyd-restricted` as an alternative unit from 24.04), `ntp` (20.04
  and 22.04), `ntpsec` (from 22.04) and `openntpd`. Exactly one of them must be active.
rationale: |
  Logs, audit trails and authentication protocols rely on accurate time. With no daemon the
  clock drifts; with two, each corrects the other and the clock jumps, which corrupts timelines
  during an investigation.
impact: |
  None known when one daemon is already active, which is the Ubuntu default.
notes: |
  The check counts units by their real name, so an alias (`chronyd.service`, `ntp.service` provided
  by `ntpsec`) is not counted twice. The packages conflict with each other, so two daemons rarely
  coexist; the usual failure
  is no daemon at all, for example in a container where `systemd-timesyncd` does not start
  (the host keeps the time). Containers can exclude this control in their tailoring file. The
  daemon's own settings are checked by CB-UBU-SVC-015 (timesyncd) and CB-UBU-SVC-016 (chrony).

audit:
  manual: |
    Run `systemctl is-active chrony chronyd-restricted systemd-timesyncd ntp ntpsec openntpd`.
    Exactly one line must print `active` (an alias of an active unit prints `active` too: check
    `systemctl show -p Id <unit>`).
  checks:
    - id: single-daemon
      engine: shell
      description: Number of active time synchronization daemons.
      spec:
        script: |
          act=
          for u in chrony chronyd-restricted systemd-timesyncd ntp ntpsec openntpd; do
            systemctl is-active --quiet "$u.service" 2>/dev/null || continue
            id=$(systemctl show -p Id --value "$u.service" 2>/dev/null)
            case " $act " in *" ${id:-$u.service} "*) ;; *) act="$act ${id:-$u.service}" ;; esac
          done
          echo "active:${act:- none}"
          [ "$(echo $act | wc -w)" -eq 1 ]

remediation:
  manual: |
    - No daemon: run `systemctl enable --now systemd-timesyncd` (20.04 to 24.04) or
      `systemctl enable --now chrony` (26.04), or `apt install chrony`.
    - Several daemons: keep one, then `systemctl mask --now <unit>` for the others or purge their
      packages.

