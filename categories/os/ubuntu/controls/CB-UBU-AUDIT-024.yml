# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-AUDIT-024
title: Audit changes to the AppArmor configuration
finding:
  title: Changes to the mandatory access control policy are not recorded
  description: AppArmor profiles can be weakened or removed without a record.
status: draft
profiles: [server-hardened, desktop-hardened]
risk:
  severity: low
assessment: automated
tags: [auditd, apparmor]

description: |
  auditd rules in `/etc/audit/rules.d/60-cirsec-mac.rules`, key `MAC-policy`: writes to
  `/etc/apparmor/` and `/etc/apparmor.d/`, where the AppArmor parser settings and profiles live.
rationale: |
  Turning a profile to complain mode or deleting it removes the confinement of a service. Recording
  these changes shows when the protection was lowered and by whom.
impact: |
  Package upgrades that ship AppArmor profiles produce `MAC-policy` records.

setting:
  location: /etc/audit/rules.d/60-cirsec-mac.rules
  default_value: No audit rules
  recommended_value: "Rules loaded (auditctl -l) and present in /etc/audit/rules.d/60-cirsec-mac.rules"

audit:
  manual: |
    1. Run `auditctl -l` as root. It must list the rules shown below (keys `MAC-policy`).
    2. Run `grep -h . /etc/audit/rules.d/*.rules`. The same rules must be present, so they load at boot.

    Expected rules, as `auditctl -l` prints them:
    ```
    -w /etc/apparmor -p wa -k MAC-policy
    -w /etc/apparmor.d -p wa -k MAC-policy
    ```
  checks:
    - id: rules
      engine: shell
      description: Rules loaded in the kernel and present in /etc/audit/rules.d.
      spec:
        script: |
          command -v auditctl >/dev/null 2>&1 || { echo "auditctl not found: auditd is not installed"; exit 1; }
          want() {
          cat <<'RULES'
          -w /etc/apparmor -p wa -k MAC-policy
          -w /etc/apparmor.d -p wa -k MAC-policy
          RULES
          }
          loaded=$(auditctl -l 2>&1) || { echo "$loaded"; exit 3; }
          disk=$(cat /etc/audit/rules.d/*.rules 2>/dev/null)
          n=0 rc=0
          while IFS= read -r r; do
            [ -n "$r" ] || continue
            n=$((n + 1))
            printf '%s\n' "$loaded" | grep -Fxq -- "$r" || { echo "not loaded: $r"; rc=1; }
            printf '%s\n' "$disk" | grep -Fxq -- "$r" || { echo "not in /etc/audit/rules.d: $r"; rc=1; }
          done <<EOF
          $(want)
          EOF
          [ "$rc" = 1 ] || echo "$n rules loaded and present in /etc/audit/rules.d"
          exit "$rc"

remediation:
  manual: |
    1. Write the expected rules to `/etc/audit/rules.d/60-cirsec-mac.rules` (mode 0640).
    2. Run `augenrules --load`. If `auditctl -s` shows `enabled 2`, the configuration is locked:
       reboot to load the new rules.
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  rollback: |
    Delete `/etc/audit/rules.d/60-cirsec-mac.rules` and run `augenrules --load` (or reboot if the configuration is locked).
  scripts:
    - id: rules-file
      engine: shell
      content: |
        command -v augenrules >/dev/null 2>&1 || { echo "auditd is not installed" >&2; exit 1; }
        want() {
        cat <<'RULES'
        -w /etc/apparmor -p wa -k MAC-policy
        -w /etc/apparmor.d -p wa -k MAC-policy
        RULES
        }
        f=/etc/audit/rules.d/60-cirsec-mac.rules
        t=$(mktemp)
        { echo '# Written by CIRSEC Baselines CB-UBU-AUDIT-024'; want; } >"$t"
        if ! cmp -s "$t" "$f"; then
          cb_backup "$f"
          cat "$t" >"$f"
        fi
        rm -f "$t"
        chmod 640 "$f"
        if auditctl -s | grep -q '^enabled 2'; then
          echo "audit rules are locked (-e 2): reboot to load $f"
        else
          augenrules --load >/dev/null
        fi

