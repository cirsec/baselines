# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-SVC-018
title: Restrict the system crontab and cron directories to root
finding:
  title: Users can read the system cron jobs
  description: The system crontab and cron directories reveal which scripts run as root and when.
status: draft
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [cron, permissions]

applicability:
  facts: [cron]

description: |
  The system cron jobs live in `/etc/crontab`, `/etc/cron.d/` and the `/etc/cron.hourly`,
  `cron.daily`, `cron.weekly`, `cron.monthly` and `cron.yearly` directories. They must belong to
  `root:root`, with mode `0600` for the file and `0700` for the directories, or stricter.
rationale: |
  These jobs run as root. Reading them tells an attacker which scripts to target and when they
  run; a writable job or directory is a direct path to root.
impact: |
  Users can no longer list the system cron jobs. cron runs as root and is not affected.
notes: |
  Ubuntu ships these paths with mode `0644` and `0755`, so the control fails on a fresh install
  of cron. A missing directory (`/etc/cron.yearly` is not created by every version) makes its
  check not applicable.

setting:
  location: /etc/crontab, /etc/cron.d, /etc/cron.hourly, /etc/cron.daily, /etc/cron.weekly, /etc/cron.monthly, /etc/cron.yearly
  default_value: "root:root, 0644 (file) and 0755 (directories)"
  recommended_value: "root:root, 0600 (file) and 0700 (directories) or stricter"

audit:
  manual: |
    Run `stat -Lc '%n %U:%G %a' /etc/crontab /etc/cron.d /etc/cron.hourly /etc/cron.daily
    /etc/cron.weekly /etc/cron.monthly /etc/cron.yearly`. Each must be `root:root`, with mode
    `600` for `/etc/crontab` and `700` for the directories, or stricter.
  logic: all
  checks:
    - id: crontab
      engine: file-perms
      description: /etc/crontab.
      spec: { path: /etc/crontab, owner: root, group: root, mode: "0600" }
    - id: cron-hourly
      engine: file-perms
      description: /etc/cron.hourly.
      spec: { path: /etc/cron.hourly, owner: root, group: root, mode: "0700" }
    - id: cron-daily
      engine: file-perms
      description: /etc/cron.daily.
      spec: { path: /etc/cron.daily, owner: root, group: root, mode: "0700" }
    - id: cron-weekly
      engine: file-perms
      description: /etc/cron.weekly.
      spec: { path: /etc/cron.weekly, owner: root, group: root, mode: "0700" }
    - id: cron-monthly
      engine: file-perms
      description: /etc/cron.monthly.
      spec: { path: /etc/cron.monthly, owner: root, group: root, mode: "0700" }
    - id: cron-yearly
      engine: file-perms
      description: /etc/cron.yearly.
      spec: { path: /etc/cron.yearly, owner: root, group: root, mode: "0700" }
    - id: cron-d
      engine: file-perms
      description: /etc/cron.d.
      spec: { path: /etc/cron.d, owner: root, group: root, mode: "0700" }

remediation:
  manual: |
    Run `chown root:root /etc/crontab /etc/cron.d /etc/cron.hourly /etc/cron.daily
    /etc/cron.weekly /etc/cron.monthly /etc/cron.yearly`, `chmod 600 /etc/crontab` and
    `chmod 700 /etc/cron.d /etc/cron.hourly /etc/cron.daily /etc/cron.weekly /etc/cron.monthly
    /etc/cron.yearly`.
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  rollback: |
    Run `chmod 644 /etc/crontab` and `chmod 755` on the directories.
  scripts:
    - id: crontab
      from_check: crontab
    - id: cron-hourly
      from_check: cron-hourly
    - id: cron-daily
      from_check: cron-daily
    - id: cron-weekly
      from_check: cron-weekly
    - id: cron-monthly
      from_check: cron-monthly
    - id: cron-yearly
      from_check: cron-yearly
    - id: cron-d
      from_check: cron-d

references:
  - title: cron(8), Ubuntu manual pages
    url: https://manpages.ubuntu.com/manpages/noble/man8/cron.8.html
    publisher: Canonical
    kind: vendor-doc
    accessed: 2026-10-19
