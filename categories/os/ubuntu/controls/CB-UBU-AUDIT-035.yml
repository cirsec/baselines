# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-AUDIT-035
title: Keep a protected copy of the AIDE database
finding:
  title: The AIDE reference database is only stored on the system it protects
  description: An intruder with root access can update the database to accept their changes, and AIDE will then report nothing.
status: draft
profiles: [server-hardened, desktop-hardened]
risk:
  severity: medium
assessment: manual
tags: [aide, integrity]

description: |
  The AIDE database (`/var/lib/aide/aide.db`) and its configuration are the reference of the
  integrity check. A copy must be kept where the system cannot write: read-only media, a backup
  server, or an integrity platform that pulls it. Checks should be run against that copy, or the
  local database compared with it, and its own checksum recorded.
rationale: |
  An integrity check is only as trustworthy as its reference. A database that root can rewrite
  does not resist an attacker who already has root.
impact: |
  Every legitimate update of the database (after upgrades) must also update the protected copy.

audit:
  manual: |
    1. Find where the protected copy of `/var/lib/aide/aide.db` is kept, and check that the system
       cannot modify it.
    2. Compare it with the local database: `sha512sum /var/lib/aide/aide.db` must match the
       checksum recorded with the copy, unless a reviewed update has been made since.

remediation:
  manual: |
    1. After each reviewed database build or update, copy `/var/lib/aide/aide.db` and
       `/etc/aide/` to a read-only medium or a backup server the system cannot write to, and record
       `sha512sum /var/lib/aide/aide.db` with it.
    2. For a trusted check, run AIDE from the copy, for example
       `aide --check -c /etc/aide/aide.conf -B 'database_in=file:/mnt/ro/aide.db'`.
  rollback: |
    Not applicable.

references:
  - title: aide.conf(5), Ubuntu manual pages
    url: https://manpages.ubuntu.com/manpages/noble/man5/aide.conf.5.html
    publisher: Canonical
    kind: vendor-doc
