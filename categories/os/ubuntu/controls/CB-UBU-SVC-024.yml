# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-SVC-024
title: Remove the X Window System server and the GNOME display manager from servers
finding:
  title: An X Window System server or a graphical login manager is installed on a server
  description: A graphical server stack adds a large amount of privileged, rarely needed code.
status: active
profiles: [server-hardened]
risk:
  severity: low
assessment: automated
tags: [packages, x11, attack-surface]

description: |
  `xserver-common` holds the files shared by every X.Org server (Xorg, Xvfb, Xephyr, and Xwayland
  on Ubuntu). When it is absent, no X server is installed. `gdm3`, the GNOME display manager of
  Ubuntu Desktop, starts a graphical login screen as soon as it is installed.
rationale: |
  An X server is complex software, historically run with root privileges, with a long record of
  local privilege escalation flaws. A display manager adds a graphical login on the console and
  its own services (accessibility, network manager applets, remote login). A server administered
  over SSH needs neither.
impact: |
  Removes `gdm3`, `xserver-common` and every package that depends on them: X servers, and the
  graphical desktop if one is installed (the `ubuntu-desktop` metapackages go with it). X client applications forwarded over SSH (`ssh -X`) still work,
  since they use the X server of the administrator's workstation.
notes: |
  The control is only in the hardened server profile; desktops need an X server or Xwayland.

audit:
  manual: |
    Run `dpkg-query -W -f='${Status}\n' gdm3 xserver-common`. It must not print
    `install ok installed`.
  checks:
    - id: gdm3
      engine: package
      description: GNOME display manager.
      spec: { name: gdm3, state: absent }
    - id: xserver-common
      engine: package
      description: X.Org server common files.
      spec: { name: xserver-common, state: absent }

remediation:
  manual: |
    Run `apt purge gdm3 xserver-common` after checking the list of packages apt will remove.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Reinstall the needed X server, for example `apt install xserver-xorg-core`.
  scripts:
    - id: gdm3
      from_check: gdm3
    - id: xserver-common
      from_check: xserver-common

references:
  - title: Xserver(1), Ubuntu manual pages
    url: https://manpages.ubuntu.com/manpages/noble/man1/Xserver.1.html
    publisher: Canonical
    kind: vendor-doc
    accessed: 2026-10-19
