# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-AUDIT-007
title: Rotate log files with logrotate
finding:
  title: Text log files are never rotated
  description: Without logrotate, files such as /var/log/dpkg.log grow forever and old entries are never archived or removed.
status: active
profiles: [core]
risk:
  severity: low
assessment: automated
tags: [logrotate, logging]

description: |
  `logrotate` renames, compresses and removes the text log files under `/var/log/` following
  `/etc/logrotate.conf` and the files that packages drop in `/etc/logrotate.d/`. Ubuntu installs it
  by default and starts it every day with `logrotate.timer`.

  This control requires the `logrotate` package and its timer to be enabled.
rationale: |
  Logs that are never rotated end up filling the file system, which stops the services that need
  to write, or are deleted by hand in a hurry. Rotation keeps a predictable history.
impact: |
  Old rotated files are deleted after the number of rotations set in each logrotate file (4 weeks
  by default in `/etc/logrotate.conf`). Keep a remote copy when a longer history is required.
notes: |
  The systemd journal rotates itself (CB-UBU-AUDIT-001) and auditd rotates its own logs
  (CB-UBU-AUDIT-013); logrotate handles the remaining text files.

setting:
  location: logrotate package, logrotate.timer
  default_value: Not installed on cloud images
  recommended_value: Installed, timer enabled

audit:
  manual: |
    1. Run `dpkg-query -W -f='${Status}\n' logrotate`. It must end with `installed`.
    2. Run `systemctl is-enabled logrotate.timer`. It must print `enabled`.
    3. Review `/etc/logrotate.conf` and `/etc/logrotate.d/` against the site retention policy.
  checks:
    - id: package
      engine: package
      description: logrotate is installed.
      spec: { name: logrotate, state: installed }
    - id: timer
      engine: systemd-unit
      description: logrotate.timer is enabled.
      spec: { unit: logrotate.timer, state: enabled }

remediation:
  manual: |
    Run `apt-get install logrotate`, then `systemctl enable --now logrotate.timer`.
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  rollback: |
    Run `apt-get purge logrotate`.
  scripts:
    - id: package
      from_check: package
    - id: timer
      from_check: timer

