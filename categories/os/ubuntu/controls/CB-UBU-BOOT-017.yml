    framework_version: "2.0"
    id: R14
    relation: partial
    note: R14 asks for 2 on both keys among other filesystem settings; core profiles accept 1, hardened profiles require 2.
  - framework: nist-800-53r5
    framework_version: "5.1.1"
    id: AC-6
    relation: related
threats:
