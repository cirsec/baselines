# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-SVC-003
title: Remove the NFS server and disable rpcbind when the system does not provide them
finding:
  title: The NFS server or rpcbind can run on a system that does not need them
  description: NFS exports and the RPC port mapper are reachable from the network and have a long record of remote vulnerabilities.
status: draft
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [services, nfs, rpc, attack-surface]

description: |
  The NFS server (package `nfs-kernel-server`) exports local directories over NFS.
  `rpcbind` maps ONC RPC program numbers to ports; it listens on port 111 through
  `rpcbind.socket` and `rpcbind.service`, and is needed by NFSv3 and NIS.

  The control requires `nfs-kernel-server` to be absent, and the rpcbind units to be masked or not
  installed at all.
rationale: |
  NFS trusts client addresses and user IDs, so a misconfigured export gives remote access to
  files. rpcbind tells any host which RPC services run, and has been abused for traffic
  amplification and remote code execution.
impact: |
  Removing the NFS server stops every export. Masking `rpcbind` breaks NFSv3 client mounts and file locking (`rpc.statd`) and NIS. NFSv4
  mounts do not need it. NFS servers, and clients that still mount NFSv3 shares, must exclude this
  control in their tailoring file.
notes: |
  The NFS server is removed rather than masked: its maintainer scripts manage the unit through
  the `nfs-kernel-server.service` alias, and with `nfs-server.service` masked, removing or
  upgrading the package fails. A rpcbind unit that does not exist
  counts as compliant. The NFS client package `nfs-common` is handled by CB-UBU-SVC-027 in the
  hardened server profile.

audit:
  manual: |
    1. `dpkg-query -W -f='${Status}\n' nfs-kernel-server` must not print `install ok installed`.
    2. `systemctl is-enabled rpcbind.service rpcbind.socket` must print `masked`, or fail because
       the units do not exist.
  logic: all
  checks:
    - id: nfs-server
      engine: package
      description: NFS kernel server package.
      spec: { name: nfs-kernel-server, state: absent }
    - id: rpcbind
      engine: systemd-unit
      description: rpcbind service.
      spec: { unit: rpcbind.service, state: masked }
    - id: rpcbind-socket
      engine: systemd-unit
      description: rpcbind socket activation.
      spec: { unit: rpcbind.socket, state: masked }

remediation:
  manual: |
    Run `apt purge nfs-kernel-server`, then `systemctl mask --now rpcbind.socket rpcbind.service`
    (or `apt purge rpcbind` if nothing depends on it).
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Run `systemctl unmask rpcbind.socket rpcbind.service`, `systemctl enable --now rpcbind.socket`,
    and reinstall the NFS server with `apt install nfs-kernel-server`.
  scripts:
    - id: nfs-server
      from_check: nfs-server
    - id: rpcbind-socket
      from_check: rpcbind-socket
    - id: rpcbind
      from_check: rpcbind

