# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-AUDIT-003
title: Do not accept logs from other hosts
finding:
  title: The system listens for log messages from the network
  description: A log receiver opens a network port and lets any host write into the local logs, unless the system is a dedicated log server.
status: draft
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [journald, rsyslog, logging, network]

description: |
  Two services can receive logs from other hosts:

  - `systemd-journal-remote` (package `systemd-journal-remote`), started by its socket unit
    `systemd-journal-remote.socket` or its service;
  - rsyslog, when an input module for the network is loaded: `imtcp`, `imudp` or `imrelp`.

  This control requires both to be off: the journal-remote units disabled or masked (or absent),
  and no network input in `/etc/rsyslog.conf` or `/etc/rsyslog.d/*.conf`.
rationale: |
  A receiver is a network service that parses untrusted input, and lets anyone who can reach the
  port inject false entries or flood the disk. Only a dedicated log server should run one.
impact: |
  Systems that are central log servers must be excluded from this control in the tailoring file.
notes: |
  `systemd-journal-upload`, which sends the local journal to a remote server, ships in the same
  package and is not affected.

setting:
  location: systemd units systemd-journal-remote.socket/.service, /etc/rsyslog.conf, /etc/rsyslog.d/
  default_value: Not installed, rsyslog network inputs commented out
  recommended_value: Units disabled or absent, no imtcp/imudp/imrelp input

audit:
  manual: |
    1. Run `systemctl is-enabled systemd-journal-remote.socket systemd-journal-remote.service`. Each
       must print `disabled`, `masked` or report that the unit does not exist.
    2. If rsyslog is installed, run
       `grep -E '^\s*(module\(load="?im(tcp|udp|relp)|input\(type="?im(tcp|udp|relp)|\$ModLoad\s+im(tcp|udp|relp))' /etc/rsyslog.conf /etc/rsyslog.d/*.conf`.
       It must print nothing.
  checks:
    - id: journal-remote-socket
      engine: systemd-unit
      description: systemd-journal-remote.socket is not enabled.
      spec: { unit: systemd-journal-remote.socket, state: disabled }
    - id: journal-remote-service
      engine: systemd-unit
      description: systemd-journal-remote.service is not enabled.
      spec: { unit: systemd-journal-remote.service, state: disabled }
    - id: rsyslog-conf
      engine: file-content
      description: No network input module in /etc/rsyslog.conf.
      facts: [rsyslog]
      spec:
        path: /etc/rsyslog.conf
        pattern: '^\s*(module\(load="?im(tcp|udp|relp)|input\(type="?im(tcp|udp|relp)|\$ModLoad\s+im(tcp|udp|relp))'
        expect: no_match
    - id: rsyslog-dropins
      engine: file-content
      description: No network input module in /etc/rsyslog.d/*.conf.
      facts: [rsyslog]
      spec:
        path: /etc/rsyslog.d/*.conf
        pattern: '^\s*(module\(load="?im(tcp|udp|relp)|input\(type="?im(tcp|udp|relp)|\$ModLoad\s+im(tcp|udp|relp))'
        expect: no_match

remediation:
  manual: |
    1. Run `systemctl disable --now systemd-journal-remote.socket systemd-journal-remote.service`, or
       remove the `systemd-journal-remote` package if `systemd-journal-upload` is not used.
    2. In `/etc/rsyslog.conf` and `/etc/rsyslog.d/*.conf`, comment out the `module(load="imtcp")`,
       `module(load="imudp")`, `module(load="imrelp")` and matching `input(...)` lines, then run
       `systemctl restart rsyslog`.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Run `systemctl enable --now systemd-journal-remote.socket`, and restore the rsyslog input lines.
  scripts:
    - id: journal-remote-socket
      from_check: journal-remote-socket
    - id: journal-remote-service
      from_check: journal-remote-service

references:
  - title: systemd-journal-remote.service(8), Ubuntu manual pages
    url: https://manpages.ubuntu.com/manpages/noble/man8/systemd-journal-remote.service.8.html
    publisher: Canonical
    kind: vendor-doc
