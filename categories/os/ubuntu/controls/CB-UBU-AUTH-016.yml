# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-AUTH-016
title: Keep root the only superuser account and protect its password
finding:
  title: Another account has superuser identity, or root has no password protection
  description: A second UID 0 account is a hidden root backdoor; a root account with an empty password needs no secret.
status: draft
profiles: [core]
risk:
  severity: high
assessment: automated
tags: [accounts, root]

description: |
  The kernel grants full privileges to UID 0, whatever the account name. Group ID 0 grants
  access to every file owned by the `root` group. This control checks that:

  - `root` is the only account with UID 0 and the only one with primary GID 0;
  - `root` is the only group with GID 0;
  - the `root` account either has a password or is locked (`passwd -S root` shows `P` or `L`).
rationale: |
  Attackers who gain root often add a second UID 0 account under an innocent name to keep
  access. A root account without any password, or with an empty one, can be used by anyone who
  reaches a login prompt.
impact: |
  None for a standard system.
notes: |
  Ubuntu locks root (`L`) on every installation and cloud image; administrators use sudo. A
  root password set later shows `P`. Both are fine.

audit:
  manual: |
    1. `awk -F: '$3 == 0' /etc/passwd` lists only `root`.
    2. `awk -F: '$4 == 0' /etc/passwd` lists only `root` (and `sync`, `shutdown`, `halt` if present).
    3. `awk -F: '$3 == 0' /etc/group` lists only `root`.
    4. `passwd -S root` shows `P` or `L` in the second field.
  checks:
    - id: uid0
      engine: shell
      spec:
        script: |
          u=$(awk -F: '$3 == 0 {print $1}' /etc/passwd | tr '\n' ' ')
          echo "UID 0: $u"
          [ "$u" = "root " ]
    - id: gid0
      engine: shell
      spec:
        script: |
          u=$(awk -F: '$4 == 0 && $1 !~ /^(root|sync|shutdown|halt|operator)$/ {print $1}' /etc/passwd | tr '\n' ' ')
          g=$(awk -F: '$3 == 0 {print $1}' /etc/group | tr '\n' ' ')
          echo "other users with GID 0: ${u:-none}; groups with GID 0: $g"
          [ -z "$u" ] && [ "$g" = "root " ]
    - id: root-password
      engine: shell
      spec:
        script: |
          s=$(passwd -S root | cut -d' ' -f2)
          echo "root status: $s"
          [ "$s" = P ] || [ "$s" = L ]

remediation:
  manual: |
    1. Investigate any other UID 0 or GID 0 account: it may be a backdoor. Remove it with
       `userdel`, or give it its own IDs with `usermod -u` and `usermod -g`.
    2. Set a strong root password with `passwd root`, or lock it with `passwd -l root` if
       administrators use sudo.

references:
  - title: passwd(5), Ubuntu manual pages
    url: https://manpages.ubuntu.com/manpages/noble/man5/passwd.5.html
    publisher: Canonical
    kind: vendor-doc
    accessed: 2026-10-19
