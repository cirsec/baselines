# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-FS-003
title: Mount /tmp as a separate filesystem with nodev, nosuid and noexec
finding:
  title: Programs can be run, or device files and setuid programs used, from /tmp
  description: Every user can write to /tmp, so it is the usual place to drop and run attack tools, and filling it can fill the root filesystem.
status: draft
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [mount, tmp, tmpfs]

description: |
  `/tmp` is a separate filesystem mounted with:

  - `nodev`: device files on it are not usable;
  - `nosuid`: setuid and setgid bits on it are ignored;
  - `noexec`: programs on it cannot be executed directly.

  On Ubuntu the simplest way is the `tmp.mount` unit of systemd, which mounts a tmpfs (in memory,
  emptied at each boot). Ubuntu 26.04 enables it by default with `nodev` and `nosuid`; Ubuntu 20.04,
  22.04 and 24.04 keep `/tmp` on the root filesystem and ship the unit as an example in
  `/usr/share/systemd/`.
rationale: |
  `/tmp` is writable by every user and every service. Attackers drop their tools there and run
  them, and a setuid file or device node placed there by a compromised account can be abused.
  `noexec`, `nosuid` and `nodev` stop these uses. A separate filesystem also keeps a user or a
  runaway process that fills `/tmp` from filling the root filesystem.
impact: |
  Scripts and binaries in `/tmp` cannot be run directly (`./script`); `sh /tmp/script` still works,
  so `noexec` is a hurdle, not a barrier. A few installers and build tools that run helpers from
  `/tmp` fail: point their `TMPDIR` elsewhere. A tmpfs `/tmp` uses memory (up to half of the RAM)
  and loses its content at reboot.
notes: |
  The fix uses `tmp.mount` and a drop-in that adds `noexec`. On Ubuntu 20.04 to 24.04, `/tmp`
  becomes a tmpfs at the next reboot only: mounting it on a running system would hide files that programs are using.
  Files left in the old on-disk `/tmp` are then hidden under the mount. When `/tmp` is a partition
  declared in `/etc/fstab`, the fix stops and the options must be added by hand. On 26.04 the
  drop-in replaces the options of the shipped unit, which drops its optional per-user quota
  (`usrquota`); add it back in the drop-in if user quotas on `/tmp` are wanted.

  Snaps get their own private `/tmp` inside the host `/tmp`, so they follow the same options.

setting:
  location: /etc/systemd/system/tmp.mount.d/60-cirsec.conf, or /etc/fstab
  default_value: "20.04 to 24.04: directory of the root filesystem. 26.04: tmpfs with nodev,nosuid"
  recommended_value: Separate filesystem (tmpfs) with nodev,nosuid,noexec

audit:
  manual: |
    Run `findmnt -kn /tmp`. It must print a line (separate filesystem) whose options contain
    `nodev`, `nosuid` and `noexec`.
  checks:
    - id: mount
      engine: shell
      description: /tmp is a mount point and its options include nodev, nosuid and noexec.
      spec:
        script: |
          o=$(findmnt -kn -o SOURCE,FSTYPE,OPTIONS --mountpoint /tmp | tail -n 1)
          [ -n "$o" ] || { echo "/tmp is not a separate filesystem"; exit 1; }
          echo "/tmp $o"
          rc=0
          for opt in nodev nosuid noexec; do
            case ,${o##* }, in *,$opt,*) ;; *) echo "missing $opt"; rc=1 ;; esac
          done
          exit $rc

remediation:
  manual: |
    With a tmpfs (recommended):
    1. On Ubuntu 20.04 to 24.04 only: `cp /usr/share/systemd/tmp.mount /etc/systemd/system/` then
       `systemctl enable tmp.mount`.
    2. Create `/etc/systemd/system/tmp.mount.d/60-cirsec.conf`:
       ```
       [Mount]
       Options=mode=1777,strictatime,nosuid,nodev,noexec,size=50%%,nr_inodes=1m
       ```
    3. Run `systemctl daemon-reload`. If `/tmp` is already a tmpfs, run
       `mount -o remount,nodev,nosuid,noexec /tmp`; otherwise reboot.

    With a partition declared in `/etc/fstab`: add `nodev,nosuid,noexec` to the options of the
    `/tmp` line, then run `mount -o remount /tmp`.
  effects:
    restart: reboot
    disruption: low
    lockout_risk: false
  rollback: |
    Delete `/etc/systemd/system/tmp.mount.d/60-cirsec.conf` (and, on Ubuntu 20.04 to 24.04, run
    `systemctl disable tmp.mount` and delete `/etc/systemd/system/tmp.mount`), run
    `systemctl daemon-reload` and reboot.
  scripts:
    - id: tmp-mount
      engine: shell
      file: fix.sh

