id: CB-UBU-SVC-021
title: Disable the autofs automounter
finding:
  title: The autofs automounter can mount file systems on demand
  description: Removable media or network shares get mounted whenever someone accesses a path.
status: draft
profiles: [server, desktop-hardened]
risk:
  severity: medium
assessment: automated
tags: [services, autofs, removable-media]

description: |
  `autofs` mounts file systems (local devices, NFS or SMB shares) when a path under its maps is
  accessed, and unmounts them when idle.

  The control passes when `autofs.service` is masked or not installed at all.
rationale: |
  Automatic mounting of removable media lets anyone with physical access bring in files or
  malicious file system images; automatic network mounts reach shares that the administrator may
  not expect.
impact: |
  File systems listed in the autofs maps are no longer mounted on demand: mount them through
  `/etc/fstab` instead. Systems that rely on autofs, such as home directories on NFS, must exclude
  this control in their tailoring file.
notes: |
  The control is in the server profile and in the hardened desktop profile: on standard
  desktops, on-demand mounts are an expected feature.

audit:
  manual: |
    Run `systemctl is-enabled autofs.service`. It must print `masked`, or fail because the unit does
    not exist.
  checks:
    - id: autofs
      engine: systemd-unit
      description: autofs automounter.
      spec: { unit: autofs.service, state: masked }

remediation:
  manual: |
    Run `systemctl mask --now autofs.service`, or `apt purge autofs` if the package is not needed.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Run `systemctl unmask autofs.service` then `systemctl enable --now autofs.service`.
  scripts:
    - id: autofs
      from_check: autofs

references:
  - title: autofs(8), Ubuntu manual pages
    url: https://manpages.ubuntu.com/manpages/noble/man8/autofs.8.html
    publisher: Canonical
    kind: vendor-doc
    accessed: 2026-10-19
