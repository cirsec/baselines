# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-AUDIT-016
title: Audit changes to sudo rights and commands run as another user
finding:
  title: Changes to administrator rights and use of other identities are not recorded
  description: Without these records, nobody can tell who granted sudo rights or who acted under another account.
status: active
profiles: [server-hardened, desktop-hardened]
risk:
  severity: medium
assessment: automated
tags: [auditd, sudo]

description: |
  Three groups of auditd rules, written to `/etc/audit/rules.d/60-cirsec-scope.rules`:

  - writes and attribute changes on `/etc/sudoers` and `/etc/sudoers.d/` (key `scope`);
  - every program started with an effective user different from the real user, by a user who
    logged in (`execve` with `uid!=euid`, 64 and 32-bit calls, key `user_emulation`), which covers
    `sudo`, `su` and other setuid programs;
  - writes to the sudo log file `{{ sudo_log_file }}` (key `sudo_log_file`).
rationale: |
  Granting oneself sudo rights is a classic persistence and privilege escalation step. Recording
  each change to the sudo policy, each command run under another identity and each attempt to
  edit the sudo log keeps administrative actions attributable to the person who logged in.
impact: |
  Busy systems where users run many setuid programs produce more audit records.
notes: |
  For each system call the kernel keeps the key of the first matching rule. Running `sudo` or `su` is usually recorded with the key `privileged` (CB-UBU-AUDIT-026), whose rules load first; `user_emulation` catches the other cases.

setting:
  location: /etc/audit/rules.d/60-cirsec-scope.rules
  default_value: No audit rules
  recommended_value: "Rules loaded (auditctl -l) and present in /etc/audit/rules.d/60-cirsec-scope.rules"
parameters:
  - name: sudo_log_file
    type: string
    description: Path of the sudo log file to watch (the logfile option of sudoers, see CB-UBU-AUTH-005).
    default: /var/log/sudo.log

audit:
  manual: |
    1. Run `auditctl -l` as root. It must list the rules shown below (keys `scope`, `sudo_log_file`, `user_emulation`).
    2. Run `grep -h . /etc/audit/rules.d/*.rules`. The same rules must be present, so they load at boot.

    Expected rules, as `auditctl -l` prints them:
    ```
    -w /etc/sudoers -p wa -k scope
    -w /etc/sudoers.d -p wa -k scope
    -a always,exit -F arch=b64 -S execve -C uid!=euid -F auid!=-1 -F key=user_emulation
    -a always,exit -F arch=b32 -S execve -C uid!=euid -F auid!=-1 -F key=user_emulation
    ```
  checks:
    - id: rules
      engine: shell
      description: Rules loaded in the kernel and present in /etc/audit/rules.d.
      spec:
        script: |
          command -v auditctl >/dev/null 2>&1 || { echo "auditctl not found: auditd is not installed"; exit 1; }
          want() {
          cat <<'RULES'
          -w /etc/sudoers -p wa -k scope
          -w /etc/sudoers.d -p wa -k scope
          -a always,exit -F arch=b64 -S execve -C uid!=euid -F auid!=-1 -F key=user_emulation
          -a always,exit -F arch=b32 -S execve -C uid!=euid -F auid!=-1 -F key=user_emulation
          RULES
          printf -- '-w %s -p wa -k sudo_log_file\n' "$CB_SUDO_LOG_FILE"
          }
          loaded=$(auditctl -l 2>&1) || { echo "$loaded"; exit 3; }
          disk=$(cat /etc/audit/rules.d/*.rules 2>/dev/null)
          n=0 rc=0
          while IFS= read -r r; do
            [ -n "$r" ] || continue
            n=$((n + 1))
            printf '%s\n' "$loaded" | grep -Fxq -- "$r" || { echo "not loaded: $r"; rc=1; }
            printf '%s\n' "$disk" | grep -Fxq -- "$r" || { echo "not in /etc/audit/rules.d: $r"; rc=1; }
          done <<EOF
          $(want)
          EOF
          [ "$rc" = 1 ] || echo "$n rules loaded and present in /etc/audit/rules.d"
          exit "$rc"

remediation:
  manual: |
    1. Write the expected rules to `/etc/audit/rules.d/60-cirsec-scope.rules` (mode 0640).
    2. Run `augenrules --load`. If `auditctl -s` shows `enabled 2`, the configuration is locked:
       reboot to load the new rules.
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  rollback: |
    Delete `/etc/audit/rules.d/60-cirsec-scope.rules` and run `augenrules --load` (or reboot if the configuration is locked).
  scripts:
    - id: rules-file
      engine: shell
      content: |
        command -v augenrules >/dev/null 2>&1 || { echo "auditd is not installed" >&2; exit 1; }
        want() {
        cat <<'RULES'
        -w /etc/sudoers -p wa -k scope
        -w /etc/sudoers.d -p wa -k scope
        -a always,exit -F arch=b64 -S execve -C uid!=euid -F auid!=-1 -F key=user_emulation
        -a always,exit -F arch=b32 -S execve -C uid!=euid -F auid!=-1 -F key=user_emulation
        RULES
        printf -- '-w %s -p wa -k sudo_log_file\n' "$CB_SUDO_LOG_FILE"
        }
        f=/etc/audit/rules.d/60-cirsec-scope.rules
        t=$(mktemp)
        { echo '# Written by CIRSEC Baselines CB-UBU-AUDIT-016'; want; } >"$t"
        if ! cmp -s "$t" "$f"; then
          cb_backup "$f"
          cat "$t" >"$f"
        fi
        rm -f "$t"
        chmod 640 "$f"
        if auditctl -s | grep -q '^enabled 2'; then
          echo "audit rules are locked (-e 2): reboot to load $f"
        else
          augenrules --load >/dev/null
        fi

