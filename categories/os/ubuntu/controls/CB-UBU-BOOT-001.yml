# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-BOOT-001
title: Enable full address space layout randomization
finding:
  title: Memory layout of processes is predictable
  description: Without full randomization, an attacker exploiting a memory bug can guess where code and data live.
status: draft
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [kernel, sysctl, memory]

description: |
  The `kernel.randomize_va_space` sysctl controls address space layout randomization (ASLR).
  With the value `2`, the kernel randomizes the positions of the stack, the virtual dynamic
  shared object page, shared memory regions and the data segment (heap) of every process.
rationale: |
  Most memory corruption exploits need to know the address of the code or data they target.
  Randomizing the layout at every execution turns a reliable exploit into a guess, and makes
  return-oriented programming much harder.
impact: |
  None known. `2` is the kernel default and the Ubuntu default.
notes: |
  `1` randomizes everything except the heap, `0` disables ASLR. A program that needs ASLR off
  for debugging can be started with `setarch -R` instead of changing the system setting.

setting:
  location: sysctl `kernel.randomize_va_space`, persisted in `/etc/sysctl.d/`
  default_value: "2"
  recommended_value: "2"

audit:
  manual: |
    Run `sysctl kernel.randomize_va_space`. The value must be `2`.
    Then check that no file in `/etc/sysctl.conf`, `/etc/sysctl.d/`, `/run/sysctl.d/`
    or `/usr/lib/sysctl.d/` sets it to another value.
  checks:
    - id: running
      engine: sysctl
      description: Running value of kernel.randomize_va_space.
      spec: { key: kernel.randomize_va_space, value: 2 }

remediation:
  manual: |
    Create `/etc/sysctl.d/60-cirsec.conf` containing `kernel.randomize_va_space = 2`,
    remove any other assignment of this key, then run `sysctl --system`.
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  rollback: |
    Remove the line from `/etc/sysctl.d/60-cirsec.conf` and run `sysctl --system`.
  scripts:
    - id: set
      from_check: running

