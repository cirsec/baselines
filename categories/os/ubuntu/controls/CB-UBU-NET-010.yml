# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-NET-010
title: Ignore ICMP redirects and source-routed packets, and send no redirects
finding:
  title: The kernel accepts route changes or routing instructions from the network
  description: ICMP redirects and source routing let a host on the local network divert or steer the system's traffic.
status: draft
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [sysctl, network, routing, ipv6]

description: |
  These kernel settings decide whether the network may change how the system routes its traffic:

  - `accept_redirects` (IPv4 and IPv6) and `secure_redirects` (IPv4, redirects from known
    gateways): whether ICMP redirect messages update the routing table;
  - `accept_source_route` (IPv4 and IPv6): whether packets carrying their own route are accepted;
  - `send_redirects` (IPv4): whether the system sends redirects, which only routers should do.

  This control sets them all to `0`, for `all` and for `default` (interfaces created later).
rationale: |
  An attacker on the local network can send forged ICMP redirects to make the system send its
  traffic through the attacker's host (man in the middle). Source routing lets a packet choose its
  own path, which can bypass filtering. A host that sends redirects is acting as a router and
  gives away information about the network.
impact: |
  None known for hosts. Routers that must send redirects are covered by tailoring this control
  out together with CB-UBU-NET-009.
notes: |
  Ubuntu ships `accept_redirects`, `secure_redirects` and `send_redirects` enabled. ufw, when
  active, also sets the `accept_redirects` keys to `0` from `/etc/ufw/sysctl.conf`. IPv6 checks
  only run when the IPv6 stack is present.

setting:
  location: sysctl `net.ipv4.conf.{all,default}.{accept_redirects,secure_redirects,accept_source_route,send_redirects}`, `net.ipv6.conf.{all,default}.{accept_redirects,accept_source_route}`, persisted in `/etc/sysctl.d/`
  default_value: accept_redirects, secure_redirects and send_redirects 1
  recommended_value: "0"

audit:
  manual: |
    Run `sysctl -a 2>/dev/null | grep -E 'conf\.(all|default)\.(accept_redirects|secure_redirects|accept_source_route|send_redirects) '`.
    Every listed value must be `0`, for IPv4 and IPv6. Then check that no file in
    `/etc/sysctl.d/`, `/run/sysctl.d/`, `/usr/lib/sysctl.d/` or `/etc/sysctl.conf` sets another value.
  checks:
    - id: ipv4-all-accept-redirects
      engine: sysctl
      description: net.ipv4.conf.all.accept_redirects.
      spec: { key: net.ipv4.conf.all.accept_redirects, value: 0 }
    - id: ipv4-default-accept-redirects
      engine: sysctl
      description: net.ipv4.conf.default.accept_redirects.
      spec: { key: net.ipv4.conf.default.accept_redirects, value: 0 }
    - id: ipv4-all-secure-redirects
      engine: sysctl
      description: net.ipv4.conf.all.secure_redirects.
      spec: { key: net.ipv4.conf.all.secure_redirects, value: 0 }
    - id: ipv4-default-secure-redirects
      engine: sysctl
      description: net.ipv4.conf.default.secure_redirects.
      spec: { key: net.ipv4.conf.default.secure_redirects, value: 0 }
    - id: ipv4-all-send-redirects
      engine: sysctl
      description: net.ipv4.conf.all.send_redirects.
      spec: { key: net.ipv4.conf.all.send_redirects, value: 0 }
    - id: ipv4-default-send-redirects
      engine: sysctl
      description: net.ipv4.conf.default.send_redirects.
      spec: { key: net.ipv4.conf.default.send_redirects, value: 0 }
    - id: ipv4-all-source-route
      engine: sysctl
      description: net.ipv4.conf.all.accept_source_route.
      spec: { key: net.ipv4.conf.all.accept_source_route, value: 0 }
    - id: ipv4-default-source-route
      engine: sysctl
      description: net.ipv4.conf.default.accept_source_route.
      spec: { key: net.ipv4.conf.default.accept_source_route, value: 0 }
    - id: ipv6-all-accept-redirects
      engine: sysctl
      description: net.ipv6.conf.all.accept_redirects.
      facts: [ipv6]
      spec: { key: net.ipv6.conf.all.accept_redirects, value: 0 }
    - id: ipv6-default-accept-redirects
      engine: sysctl
      description: net.ipv6.conf.default.accept_redirects.
      facts: [ipv6]
      spec: { key: net.ipv6.conf.default.accept_redirects, value: 0 }
    - id: ipv6-all-source-route
      engine: sysctl
      description: net.ipv6.conf.all.accept_source_route.
      facts: [ipv6]
      spec: { key: net.ipv6.conf.all.accept_source_route, value: 0 }
    - id: ipv6-default-source-route
      engine: sysctl
      description: net.ipv6.conf.default.accept_source_route.
      facts: [ipv6]
      spec: { key: net.ipv6.conf.default.accept_source_route, value: 0 }

remediation:
  manual: |
    Add to `/etc/sysctl.d/60-cirsec.conf`, for `all` and `default`, IPv4 and IPv6:
    ```
    net.ipv4.conf.all.accept_redirects = 0
    net.ipv4.conf.all.secure_redirects = 0
    net.ipv4.conf.all.send_redirects = 0
    net.ipv4.conf.all.accept_source_route = 0
    net.ipv6.conf.all.accept_redirects = 0
    net.ipv6.conf.all.accept_source_route = 0
    ```
    (and the same lines with `default`), remove other assignments, then run `sysctl --system`.
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  rollback: |
    Remove the lines from `/etc/sysctl.d/60-cirsec.conf` and set the previous values with `sysctl -w`.
  scripts:
    - id: ipv4-all-accept-redirects
      from_check: ipv4-all-accept-redirects
    - id: ipv4-default-accept-redirects
      from_check: ipv4-default-accept-redirects
    - id: ipv4-all-secure-redirects
      from_check: ipv4-all-secure-redirects
    - id: ipv4-default-secure-redirects
      from_check: ipv4-default-secure-redirects
    - id: ipv4-all-send-redirects
      from_check: ipv4-all-send-redirects
    - id: ipv4-default-send-redirects
      from_check: ipv4-default-send-redirects
    - id: ipv4-all-source-route
      from_check: ipv4-all-source-route
    - id: ipv4-default-source-route
      from_check: ipv4-default-source-route
    - id: ipv6-all-accept-redirects
      from_check: ipv6-all-accept-redirects
    - id: ipv6-default-accept-redirects
      from_check: ipv6-default-accept-redirects
    - id: ipv6-all-source-route
      from_check: ipv6-all-source-route
    - id: ipv6-default-source-route
      from_check: ipv6-default-source-route

