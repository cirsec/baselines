    framework_version: "2.0"
    id: R59
    relation: partial
    note: R59 asks for trusted repositories only; this control enforces that each one is authenticated with its own key.
  - framework: nist-800-53r5
    framework_version: "5.1.1"
    id: CM-14
    relation: related
  - framework: nist-800-53r5
    framework_version: "5.1.1"
    id: SI-7
    relation: related
  - framework: cis-ubuntu-2004
    framework_version: "3.0.0"
    id: "1.2.1.1"
    relation: related
    note: This version asks for the GPG keys to be configured; ours binds each repository to its key and rejects options that weaken signature checks.
  - framework: cis-ubuntu-2204
    framework_version: "3.0.0"
    id: "1.2.1.1"
    relation: related
    note: This version asks for the GPG keys to be configured; ours binds each repository to its key and rejects options that weaken signature checks.
  - framework: cis-ubuntu-2404
    framework_version: "2.0.0"
    id: "1.2.1.1"
    relation: stricter
    note: Also rejects per-source options that disable or weaken signature checks.
  - framework: cis-ubuntu-2604
    framework_version: "1.0.0"
    id: "1.2.1.1"
    relation: stricter
    note: Also rejects per-source options that disable or weaken signature checks.
