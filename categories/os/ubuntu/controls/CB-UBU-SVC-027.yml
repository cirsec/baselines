# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-SVC-027
title: Remove the NFS client utilities when no NFS share is mounted
finding:
  title: NFS client utilities are installed on a system that mounts no NFS share
  description: The NFS client stack adds setuid helpers and RPC daemons that are not needed.
status: active
profiles: [server-hardened]
risk:
  severity: low
assessment: automated
tags: [packages, nfs, attack-surface]

description: |
  `nfs-common` provides the NFS client tools: the `mount.nfs` setuid helper, `rpc.statd` (NFSv3
  locking), `rpc.gssd` and `rpc.idmapd`. It is only needed to mount NFS shares.
rationale: |
  Unneeded software is extra code to patch. `mount.nfs` runs with root privileges, and
  `rpc.statd` listens for RPC requests when it is started.
impact: |
  NFS shares can no longer be mounted. Removing `nfs-common` also removes `nfs-kernel-server` if it
  is installed. Systems that mount NFS shares must exclude this control in their tailoring file.
notes: |
  Not installed on Ubuntu cloud images; often pulled in by full server installs or by `autofs`. The NFS server
  and rpcbind are handled by CB-UBU-SVC-003.

audit:
  manual: |
    Run `dpkg-query -W -f='${Status}\n' nfs-common`. It must not print `install ok installed`.
  checks:
    - id: nfs-common
      engine: package
      description: NFS client utilities.
      spec: { name: nfs-common, state: absent }

remediation:
  manual: |
    Check that `findmnt -t nfs,nfs4` lists nothing and that no NFS entry remains in `/etc/fstab`,
    then run `apt purge nfs-common`.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Run `apt install nfs-common`.
  scripts:
    - id: nfs-common
      from_check: nfs-common

references:
  - title: nfs(5), Ubuntu manual pages
    url: https://manpages.ubuntu.com/manpages/noble/man5/nfs.5.html
    publisher: Canonical
    kind: vendor-doc
    accessed: 2026-10-19
  - title: ANSSI-BP-028 v2.0 - Recommandations de configuration d'un système GNU/Linux (R58)
    url: https://messervices.cyber.gouv.fr/documents-guides/fr_np_linux_configuration-v2.0.pdf
    publisher: ANSSI
    kind: guide
    accessed: 2026-10-19
