# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-PKG-007
title: Install security updates automatically
finding:
  title: Security updates are not installed automatically
  description: Fixes wait for a human to apply them, often for weeks, while the vulnerabilities they close are public.
status: active
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [apt, updates, unattended-upgrades]

description: |
  `unattended-upgrades` installs available updates without human action. Two systemd timers drive
  it: `apt-daily.timer` refreshes the package lists and `apt-daily-upgrade.timer` installs the
  updates, when `APT::Periodic::Update-Package-Lists` and `APT::Periodic::Unattended-Upgrade` are
  not `0`. Which updates are installed is set by `Unattended-Upgrade::Allowed-Origins` (or
  `Origins-Pattern`); Ubuntu's default allows the `<codename>-security` pocket and the ESM
  security pockets (`<codename>-infra-security`, `<codename>-apps-security`), which are used
  once the system is attached to Ubuntu Pro.
rationale: |
  Most compromises exploit vulnerabilities for which a fix already exists. Installing security
  fixes daily and automatically closes that window without depending on a manual process. Ubuntu
  security updates are minimal backported fixes, designed to be installed without review.
impact: |
  Services are restarted by their package when updated, which can cause a short interruption. The
  system is not rebooted (`Unattended-Upgrade::Automatic-Reboot` is false by default), so kernel
  and libc fixes still need a planned reboot. Organisations that deploy updates with a central
  patch management tool can exclude this control in their tailoring file and document it.
notes: |
  Installed and enabled by default on every Ubuntu release, server, desktop and cloud images
  (`/etc/apt/apt.conf.d/20auto-upgrades` with both options set to `1`). The control fails when
  someone disabled it. Snaps are not updated by unattended-upgrades: see CB-UBU-PKG-012.

setting:
  location: /etc/apt/apt.conf.d/20auto-upgrades, /etc/apt/apt.conf.d/50unattended-upgrades
  default_value: Enabled, security and ESM pockets allowed
  recommended_value: unattended-upgrades installed, both APT::Periodic options set to 1, security origin allowed, timers enabled

audit:
  manual: |
    1. `dpkg -s unattended-upgrades` shows `Status: install ok installed`.
    2. `apt-config dump APT::Periodic` shows `Update-Package-Lists` and `Unattended-Upgrade` set
       to `1` (or another non-zero value).
    3. `apt-config dump Unattended-Upgrade::Allowed-Origins Unattended-Upgrade::Origins-Pattern`
       contains `${distro_id}:${distro_codename}-security` or another `-security` origin.
    4. `systemctl is-enabled apt-daily.timer apt-daily-upgrade.timer` prints `enabled` twice.
    5. `unattended-upgrade --dry-run --debug` lists the security origin among the allowed ones.
  checks:
    - id: package
      engine: package
      description: unattended-upgrades package.
      spec: { name: unattended-upgrades, state: installed }
    - id: periodic
      engine: shell
      description: APT::Periodic options, as merged by apt-config.
      spec:
        script: |
          eval "$(apt-config shell L APT::Periodic::Update-Package-Lists U APT::Periodic::Unattended-Upgrade)" || exit 3
          echo "Update-Package-Lists=${L:-unset} Unattended-Upgrade=${U:-unset}"
          case ${L:-0}:${U:-0} in 0:* | *:0 | false:* | *:false | no:* | *:no) exit 1 ;; esac
    - id: origins
      engine: shell
      description: Origins allowed to unattended-upgrades.
      spec:
        script: |
          o=$(apt-config dump Unattended-Upgrade::Origins-Pattern Unattended-Upgrade::Allowed-Origins 2>/dev/null | grep -E '::(Origins-Pattern|Allowed-Origins):: ')
          printf '%s\n' "$o" | grep -Ei -- '-security' || { echo "no security origin allowed"; exit 1; }
    - id: lists-timer
      engine: systemd-unit
      description: Timer that refreshes the package lists.
      spec: { unit: apt-daily.timer, state: enabled }
    - id: upgrade-timer
      engine: systemd-unit
      description: Timer that installs the updates.
      spec: { unit: apt-daily-upgrade.timer, state: enabled }

remediation:
  manual: |
    1. `apt-get install unattended-upgrades`.
    2. Write `/etc/apt/apt.conf.d/20auto-upgrades` with
       `APT::Periodic::Update-Package-Lists "1";` and `APT::Periodic::Unattended-Upgrade "1";`
       (this is what `dpkg-reconfigure -plow unattended-upgrades` does), and remove any setting
       to `0` in a file read later (`apt-config dump APT::Periodic` shows the result). The
       automated fix comments such settings out.
    3. If `Unattended-Upgrade::Allowed-Origins` was customised, add back
       `"${distro_id}:${distro_codename}-security";` (and the ESM origins
       `"${distro_id}ESMApps:${distro_codename}-apps-security";` and
       `"${distro_id}ESM:${distro_codename}-infra-security";`) in
       `/etc/apt/apt.conf.d/50unattended-upgrades`.
    4. `systemctl enable --now apt-daily.timer apt-daily-upgrade.timer`.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Set both `APT::Periodic` options to `0` in `/etc/apt/apt.conf.d/20auto-upgrades`, or purge
    `unattended-upgrades`.
  scripts:
    - id: package
      from_check: package
    - id: periodic
      engine: shell
      content: |
        f=/etc/apt/apt.conf.d/20auto-upgrades
        cb_backup "$f"
        printf '%s\n' 'APT::Periodic::Update-Package-Lists "1";' 'APT::Periodic::Unattended-Upgrade "1";' >"$f"
        # Any other file setting either option to 0 can override 20auto-upgrades: comment it out.
        r='^[^#/]*APT::Periodic::(Update-Package-Lists|Unattended-Upgrade)[[:space:]]+"?(0|false|no|off)"?'
        for g in /etc/apt/apt.conf.d/* /etc/apt/apt.conf; do
          [ -f "$g" ] && [ "$g" != "$f" ] && grep -Eqi "$r" "$g" || continue
          cb_backup "$g"
          sed -E -i "s@($r.*)@// disabled by CB-UBU-PKG-007: \1@I" "$g"
        done
    - id: lists-timer
      from_check: lists-timer
    - id: upgrade-timer
      from_check: upgrade-timer

