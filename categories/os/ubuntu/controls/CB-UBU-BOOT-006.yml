# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-BOOT-006
title: Protect symbolic links in world-writable sticky directories
finding:
  title: Symbolic links in shared temporary directories are followed for any user
  description: An attacker can plant a symlink in /tmp and make a privileged program overwrite an arbitrary file.
status: active
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [kernel, sysctl, filesystem, toctou]

description: |
  With `fs.protected_symlinks = 1`, the kernel only follows a symbolic link located in a
  world-writable sticky directory (such as `/tmp`) when the process following it owns the link,
  or when the link owner also owns the directory.
rationale: |
  A classic attack plants a symbolic link in `/tmp` with the name a privileged program is about
  to create, pointing to a sensitive file. When the program writes "its" file, it overwrites the
  target instead. This setting blocks the whole class of time-of-check to time-of-use races
  based on symlinks in shared directories.
impact: |
  None known for normal use. Programs that rely on following other users' symlinks in `/tmp`
  are rare and already unsafe.
notes: |
  Ubuntu enables it by default, through `/usr/lib/sysctl.d/99-protect-links.conf` (procps) or
  `/usr/lib/sysctl.d/50-default.conf` (systemd), and `/etc/sysctl.d/10-link-restrictions.conf` on 20.04.

setting:
  location: sysctl `fs.protected_symlinks`, persisted in `/etc/sysctl.d/`
  default_value: "1"
  recommended_value: "1"

audit:
  manual: |
    Run `sysctl fs.protected_symlinks`. The value must be `1`.
    Then check that no sysctl configuration file sets it to `0`.
  checks:
    - id: running
      engine: sysctl
      description: Running value of fs.protected_symlinks.
      spec: { key: fs.protected_symlinks, value: 1 }

remediation:
  manual: |
    Create `/etc/sysctl.d/60-cirsec.conf` containing `fs.protected_symlinks = 1`,
    remove any other assignment of this key, then run `sysctl --system`.
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  rollback: |
    Remove the line from `/etc/sysctl.d/60-cirsec.conf` and run `sysctl --system`.
  scripts:
    - id: set
      from_check: running

