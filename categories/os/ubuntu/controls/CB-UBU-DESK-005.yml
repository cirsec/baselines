# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-DESK-005
title: Disable XDMCP in the display manager
finding:
  title: The display manager accepts XDMCP remote logins
  description: XDMCP sends the login screen, passwords and the whole session unencrypted over the network.
status: active
profiles: [desktop]
risk:
  severity: high
assessment: automated
tags: [gdm, lightdm, xdmcp, network]

description: |
  XDMCP (X Display Manager Control Protocol) lets a remote X terminal request a login screen
  from the display manager. It is off by default in GDM (`[xdmcp] Enable` in
  `/etc/gdm3/custom.conf`) and in LightDM (`[XDMCPServer] enabled`). This control checks that
  nobody turned it on.

  From Ubuntu 26.04 (GDM 50), GDM is built without XDMCP and the Ubuntu desktop session runs on
  Wayland only, so the GDM check applies to 20.04, 22.04 and 24.04. LightDM, used with
  desktops that still run on Xorg, is checked on every version.
rationale: |
  XDMCP and the X11 session it opens are not encrypted or authenticated: anyone on the network
  path can read the password typed at login and every keystroke after. Remote graphical access
  should go through an encrypted channel such as SSH or a VPN.
impact: |
  None with the defaults. Thin clients that rely on XDMCP stop working.
notes: |
  Ubuntu's GDM reads `/etc/gdm3/custom.conf`, not `daemon.conf` as on Debian: a
  `daemon.conf` file is ignored. SDDM has no XDMCP server. The LightDM check reads
  `/usr/share/lightdm/lightdm.conf.d/`, `/etc/xdg/lightdm/lightdm.conf.d/`,
  `/etc/lightdm/lightdm.conf.d/` and `/etc/lightdm/lightdm.conf` in that order; the last value
  wins. The automated fix covers GDM only; the LightDM check was written from its documentation and not tested in a lab.

setting:
  location: /etc/gdm3/custom.conf [xdmcp] Enable; LightDM [XDMCPServer] enabled
  default_value: "false"
  recommended_value: false or unset

audit:
  manual: |
    1. GDM: in `/etc/gdm3/custom.conf`, the `[xdmcp]` section must not set `Enable=true`.
    2. LightDM: no file of `/etc/lightdm/lightdm.conf.d/` or `/etc/lightdm/lightdm.conf` may set
       `enabled=true` in an `[XDMCPServer]` section.
  checks:
    - id: gdm
      engine: shell
      description: GDM does not enable XDMCP.
      versions: ["20.04", "22.04", "24.04"]
      facts: [gdm]
      spec:
        script: |
          [ -f /etc/gdm3/custom.conf ] || { echo "no /etc/gdm3/custom.conf"; exit 0; }
          v=$(awk '/^[ \t]*\[/ { h = $0; gsub(/^[ \t]+|[ \t]+$/, "", h); s = (h == "[xdmcp]"); next }
            s && /^[ \t]*Enable[ \t]*=/ { v = $0; sub(/^[^=]*=[ \t]*/, "", v); sub(/[ \t]+$/, "", v) }
            END { print v }' /etc/gdm3/custom.conf)
          echo "[xdmcp] Enable=${v:-unset}"
          case $v in [Tt][Rr][Uu][Ee] | 1) exit 1 ;; esac
    - id: lightdm
      engine: shell
      description: LightDM does not enable its XDMCP server.
      facts: [lightdm]
      spec:
        script: |
          set -- /usr/share/lightdm/lightdm.conf.d/*.conf /etc/xdg/lightdm/lightdm.conf.d/*.conf \
            /etc/lightdm/lightdm.conf.d/*.conf /etc/lightdm/lightdm.conf
          files=
          for f in "$@"; do [ -f "$f" ] && files="$files $f"; done
          [ -n "$files" ] || { echo "no LightDM configuration file"; exit 0; }
          # shellcheck disable=SC2086 # one word per file
          v=$(awk 'FNR == 1 { s = 0 } /^[ \t]*\[/ { h = $0; gsub(/^[ \t]+|[ \t]+$/, "", h); s = (h == "[XDMCPServer]"); next }
            s && /^[ \t]*enabled[ \t]*=/ { v = $0; sub(/^[^=]*=[ \t]*/, "", v); sub(/[ \t]+$/, "", v) }
            END { print v }' $files)
          echo "[XDMCPServer] enabled=${v:-unset}"
          case $v in [Tt][Rr][Uu][Ee] | 1) exit 1 ;; esac

remediation:
  manual: |
    - GDM: in `/etc/gdm3/custom.conf`, set `Enable=false` in the `[xdmcp]` section (or remove the
      line), then restart GDM at a convenient time (`systemctl restart gdm` closes every
      graphical session).
    - LightDM: remove `enabled=true` from the `[XDMCPServer]` sections, then restart LightDM.
  effects:
    restart: reboot
    disruption: low
    lockout_risk: false
  rollback: |
    Restore `/etc/gdm3/custom.conf` from the backup directory.
  scripts:
    - id: gdm
      engine: shell
      versions: ["20.04", "22.04", "24.04"]
      facts: [gdm]
      file: fix.sh

