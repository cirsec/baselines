    url: https://messervices.cyber.gouv.fr/documents-guides/fr_np_linux_configuration-v2.0.pdf
    publisher: ANSSI
    kind: guide
    accessed: 2026-10-19
  - title: NIST IR 7966 - Security of Interactive and Automated Access Management Using Secure Shell (SSH)
