# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-AUDIT-036
title: Audit administrative commands that are not setuid
finding:
  title: Use of administrative commands is not recorded
  description: Commands that partition disks, load AppArmor profiles, create accounts or hold SSH keys run without a record of who used them.
status: active
profiles: [server-hardened, desktop-hardened]
risk:
  severity: medium
assessment: automated
tags: [auditd, privileged]

description: |
  Some administrative commands are not setuid or setgid, so CB-UBU-AUDIT-026 does not cover them,
  yet their use matters in an investigation. This control adds one auditd rule per command in
  `{{ commands }}`, key `privileged`, in `/etc/audit/rules.d/60-cirsec-admin-cmds.rules`. Each
  rule records every run of the program by a user who logged in. By default:

  - `fdisk`: changes to disk partitions;
  - `apparmor_parser`: loading, replacing or removing AppArmor profiles;
  - `useradd`: account creation;
  - `ssh-agent`: an agent that holds private keys for the session;
  - `unix_update`: the PAM helper that changes local passwords.

  Each command is looked up in `/usr/sbin`, `/usr/bin`, `/sbin` and `/bin`, and its real path is
  used. Commands that are not installed are skipped, and so are setuid or setgid ones, which
  CB-UBU-AUDIT-026 already audits (`ssh-agent` is setgid on Ubuntu 20.04 and 22.04).
rationale: |
  Repartitioning a disk, unloading an AppArmor profile, creating a back-door account or reusing a
  forwarded SSH agent are steps of an intrusion that leave no other trace. Recording each run,
  with the identity of the person who logged in, keeps them attributable.
impact: |
  Few records: these commands are rarely run. Once the audit configuration is locked
  (CB-UBU-AUDIT-029), a changed rule only loads at the next reboot.
notes: |
  `ssh-agent` is started at each graphical login on desktops, which adds one record per session.

setting:
  location: /etc/audit/rules.d/60-cirsec-admin-cmds.rules
  default_value: No audit rules
  recommended_value: "Rules loaded (auditctl -l) and present in /etc/audit/rules.d/60-cirsec-admin-cmds.rules"
parameters:
  - name: commands
    type: list
    description: Names of the administrative commands to audit, looked up in /usr/sbin, /usr/bin, /sbin and /bin.
    default: [fdisk, apparmor_parser, useradd, ssh-agent, unix_update]

audit:
  manual: |
    1. For each command, find its real path with `readlink -f /usr/sbin/<command>` (or
       `/usr/bin/<command>`), and skip it if `stat -c %A` shows an `s` (CB-UBU-AUDIT-026 covers it).
    2. Run `auditctl -l` as root. It must list, for each remaining command:
       ```
       -a always,exit -S all -F path=<real path> -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged
       ```
    3. Run `grep -h . /etc/audit/rules.d/*.rules`. The same rules must be present, so they load at boot.
  checks:
    - id: rules
      engine: shell
      description: Rules loaded in the kernel and present in /etc/audit/rules.d.
      spec:
        script: |
          command -v auditctl >/dev/null 2>&1 || { echo "auditctl not found: auditd is not installed"; exit 1; }
          want() {
          for c in $CB_COMMANDS; do
            for d in /usr/sbin /usr/bin /sbin /bin; do
              [ -f "$d/$c" ] && { readlink -f "$d/$c"; break; }
            done
          done | sort -u | while IFS= read -r p; do
            # setuid and setgid programs are audited by CB-UBU-AUDIT-026
            [ -u "$p" ] || [ -g "$p" ] || echo "-a always,exit -S all -F path=$p -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged"
          done
          }
          loaded=$(auditctl -l 2>&1) || { echo "$loaded"; exit 3; }
          disk=$(cat /etc/audit/rules.d/*.rules 2>/dev/null)
          n=0 rc=0
          while IFS= read -r r; do
            [ -n "$r" ] || continue
            n=$((n + 1))
            printf '%s\n' "$loaded" | grep -Fxq -- "$r" || { echo "not loaded: $r"; rc=1; }
            printf '%s\n' "$disk" | grep -Fxq -- "$r" || { echo "not in /etc/audit/rules.d: $r"; rc=1; }
          done <<EOF
          $(want)
          EOF
          [ "$rc" = 1 ] || echo "$n rules loaded and present in /etc/audit/rules.d"
          exit "$rc"

remediation:
  manual: |
    1. Write the expected rules to `/etc/audit/rules.d/60-cirsec-admin-cmds.rules` (mode 0640).
    2. Run `augenrules --load`. If `auditctl -s` shows `enabled 2`, the configuration is locked:
       reboot to load the new rules.
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  rollback: |
    Delete `/etc/audit/rules.d/60-cirsec-admin-cmds.rules` and run `augenrules --load` (or reboot if the configuration is locked).
  scripts:
    - id: rules-file
      engine: shell
      content: |
        command -v augenrules >/dev/null 2>&1 || { echo "auditd is not installed" >&2; exit 1; }
        want() {
        for c in $CB_COMMANDS; do
          for d in /usr/sbin /usr/bin /sbin /bin; do
            [ -f "$d/$c" ] && { readlink -f "$d/$c"; break; }
          done
        done | sort -u | while IFS= read -r p; do
          # setuid and setgid programs are audited by CB-UBU-AUDIT-026
          [ -u "$p" ] || [ -g "$p" ] || echo "-a always,exit -S all -F path=$p -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged"
        done
        }
        f=/etc/audit/rules.d/60-cirsec-admin-cmds.rules
        t=$(mktemp)
        { echo '# Written by CIRSEC Baselines CB-UBU-AUDIT-036'; want; } >"$t"
        if ! cmp -s "$t" "$f"; then
          cb_backup "$f"
          cat "$t" >"$f"
        fi
        rm -f "$t"
        chmod 640 "$f"
        if auditctl -s | grep -q '^enabled 2'; then
          echo "audit rules are locked (-e 2): reboot to load $f"
        else
          augenrules --load >/dev/null
        fi

