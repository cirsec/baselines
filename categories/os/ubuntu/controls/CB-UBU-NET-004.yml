# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-NET-004
title: Disable the Bluetooth service
finding:
  title: The Bluetooth service can be started
  description: Bluetooth accepts connections from devices in radio range, outside any network control.
status: draft
profiles: [server, desktop-hardened]
risk:
  severity: medium
assessment: automated
tags: [bluetooth, wireless, service]

description: |
  On Ubuntu, Bluetooth is handled by `bluetoothd` from the `bluez` package, run by
  `bluetooth.service`. The package is installed on desktops and absent from server and cloud
  images; when it is installed, the service starts as soon as an adapter is present. This
  control requires the service to be masked, or `bluez` to be absent.
rationale: |
  Bluetooth stacks have had remotely exploitable flaws reachable without pairing (BlueBorne,
  BleedingTooth). A server never needs Bluetooth, and a hardened workstation should not expose a
  radio interface that can be reached from a nearby room or car park.
impact: |
  Bluetooth keyboards, mice, headsets and file transfer stop working.

audit:
  manual: |
    Run `systemctl is-enabled bluetooth.service`. It must print `masked`, or fail because the unit
    does not exist (`bluez` not installed).
  checks:
    - id: service
      engine: systemd-unit
      description: State of bluetooth.service.
      spec: { unit: bluetooth.service, state: masked }

remediation:
  manual: |
    Run `systemctl mask --now bluetooth.service`, or remove the package with `apt purge bluez` when
    nothing depends on it.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Run `systemctl unmask bluetooth.service` and `systemctl start bluetooth.service`.
  scripts:
    - id: mask
      from_check: service

references:
  - title: bluetoothd(8), Ubuntu manual pages
    url: https://manpages.ubuntu.com/manpages/noble/man8/bluetoothd.8.html
    publisher: Canonical
    kind: vendor-doc
    accessed: 2026-10-19
