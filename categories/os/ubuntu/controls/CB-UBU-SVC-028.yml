# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-SVC-028
title: Disable cloud-init once the server is provisioned
finding:
  title: cloud-init still runs at every boot on a provisioned server
  description: Whoever can change the instance metadata or attach a configuration disk can run commands as root at the next boot.
status: active
profiles: [server-hardened]
risk:
  severity: medium
assessment: automated
tags: [services, cloud-init, provisioning, attack-surface]

applicability:
  facts: [cloud-init]

description: |
  cloud-init configures a new instance from its datasource: the metadata service of the cloud
  provider (IMDS), or a configuration disk such as a NoCloud `cidata` volume or an OpenStack
  config drive. It is installed on every Ubuntu cloud image and on servers installed with
  Subiquity, and it starts at every boot: it detects the datasource again, runs its per-boot
  modules (`bootcmd`, `scripts-per-boot`, hostname and `/etc/hosts` updates), and when the
  instance ID changes it runs every first-boot module again (users, SSH keys, packages, user-data
  scripts).

  Once the server is provisioned and managed by the organization's own tools, the file
  `/etc/cloud/cloud-init.disabled` (or `cloud-init=disabled` on the kernel command line) stops
  cloud-init from running at boot. `cloud-init status` then prints `disabled`.
rationale: |
  The datasource is a root-level configuration channel that is not covered by the server's own
  change management. A person who can edit the user-data in the cloud console, answer as the
  metadata service on a network without IMDS protection, or attach a disk labelled `cidata` to the
  machine can add an SSH key, create an account or run a script as root at the next boot. Stopping
  cloud-init after provisioning closes that channel and keeps the network, users and keys under
  configuration management only.
impact: |
  From the next boot, cloud-init no longer applies changes coming from the platform:

  - **network**: `/etc/netplan/50-cloud-init.yaml` stays as written at provisioning and is no
    longer regenerated. When it matches the interface by MAC address, a new or replaced network
    card (another MAC address, a VM moved to a new network) comes up without network;
  - **disk**: the root partition and file system are no longer grown after the disk is enlarged
    (`growpart`, `resizefs`): run `growpart` and `resize2fs` by hand;
  - **identity**: hostname, SSH keys and users from the metadata are no longer updated, and a
    cloned VM keeps the SSH host keys of its source.

  Re-enable cloud-init (remove the file and reboot) before resizing, moving or cloning the server
  through the cloud platform. Do not apply this control to images or templates, and keep it off
  for autoscaled instances that the platform must be able to rebuild.
notes: |
  The fix only writes the file when `cloud-init status` reports `done`, so that it never stops a
  provisioning that is still running or failed. The fix is disabled by default (`lockout_risk`):
  a server whose network depends on cloud-init can become unreachable after a hardware change.
  Removing the `cloud-init` package also meets the goal, but it is harder to undo and some
  platforms (Azure, Proxmox templates) expect it to be present. The QEMU guest agent and the SSH
  server keep working: they do not depend on cloud-init once the system is provisioned.

setting:
  location: /etc/cloud/cloud-init.disabled
  default_value: Absent (cloud-init runs at every boot)
  recommended_value: Present

audit:
  manual: |
    1. Check that `/etc/cloud/cloud-init.disabled` exists, or that `/proc/cmdline` contains
       `cloud-init=disabled`.
    2. After a reboot, `cloud-init status` must print `status: disabled`.
  checks:
    - id: disabled
      engine: shell
      description: cloud-init is disabled by /etc/cloud/cloud-init.disabled or the kernel command line.
      spec:
        script: |
          if [ -e /etc/cloud/cloud-init.disabled ]; then
            echo "/etc/cloud/cloud-init.disabled present"
            exit 0
          fi
          if grep -qw 'cloud-init=disabled' /proc/cmdline; then
            echo "cloud-init=disabled on the kernel command line"
            exit 0
          fi
          s=$(cloud-init status 2>/dev/null | sed -n 's/^status: //p')
          echo "cloud-init enabled (status: ${s:-unknown})"
          exit 1

remediation:
  manual: |
    1. Check that provisioning is over: `cloud-init status` must print `status: done`.
    2. Check that `/etc/netplan/` holds the network configuration the server needs without
       cloud-init (and adapt any `match: macaddress` if the hardware may change).
    3. Run `touch /etc/cloud/cloud-init.disabled`, reboot, and check that `cloud-init status`
       prints `status: disabled` and that the network and SSH access still work.
  effects:
    restart: reboot
    disruption: low
    lockout_risk: true
  rollback: |
    Delete `/etc/cloud/cloud-init.disabled` and reboot. If the instance ID has not changed,
    cloud-init only runs its per-boot modules again.
  scripts:
    - id: disable
      engine: shell
      content: |
        f=/etc/cloud/cloud-init.disabled
        [ -e "$f" ] && exit 0
        s=$(cloud-init status 2>/dev/null | sed -n 's/^status: //p')
        if [ "$s" != done ]; then
          echo "cloud-init provisioning is not done (status: ${s:-unknown}), not disabling it" >&2
          exit 1
        fi
        printf '# Written by CIRSEC Baselines CB-UBU-SVC-028: cloud-init does not run at boot.\n' >"$f"

