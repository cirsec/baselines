# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-SVC-004
title: Disable LDAP and NIS directory server services the system does not provide
finding:
  title: An LDAP or NIS directory server can run on a system that does not provide one
  description: A forgotten directory server can leak account data or let an attacker publish accounts.
status: active
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [services, ldap, nis, attack-surface]

description: |
  Directory servers packaged by Ubuntu:

  - OpenLDAP: `slapd`;
  - NIS: `ypserv`, with its companions `yppasswdd` (password changes) and `ypxfrd` (map
    transfers).

  The control passes when each unit is masked or not installed at all.
rationale: |
  A directory server holds account and group data that other systems trust. NIS sends password
  hashes to any client that asks and has no real authentication; an unattended OpenLDAP server
  can expose or accept changes to that data.
impact: |
  Masking a unit stops it and prevents it from starting again. LDAP and NIS clients are not
  affected. Directory servers must exclude this control in their tailoring file.
notes: |
  A unit that does not exist counts as compliant. On Ubuntu, `slapd` only ships a System V init
  script; systemd still masks the generated `slapd.service`.

audit:
  manual: |
    For each unit, run `systemctl is-enabled <unit>`. It must print `masked`, or fail because the
    unit does not exist: `slapd.service`, `ypserv.service`, `yppasswdd.service`, `ypxfrd.service`.
  logic: all
  checks:
    - id: slapd
      engine: systemd-unit
      description: OpenLDAP server.
      spec: { unit: slapd.service, state: masked }
    - id: ypserv
      engine: systemd-unit
      description: NIS server.
      spec: { unit: ypserv.service, state: masked }
    - id: yppasswdd
      engine: systemd-unit
      description: NIS password update server.
      spec: { unit: yppasswdd.service, state: masked }
    - id: ypxfrd
      engine: systemd-unit
      description: NIS map transfer server.
      spec: { unit: ypxfrd.service, state: masked }

remediation:
  manual: |
    Stop and mask each unit that is installed: `systemctl mask --now <unit>`. If the package is not
    needed at all, remove it instead: `apt purge slapd ypserv`.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Run `systemctl unmask <unit>` then `systemctl enable --now <unit>`.
  scripts:
    - id: slapd
      from_check: slapd
    - id: ypserv
      from_check: ypserv
    - id: yppasswdd
      from_check: yppasswdd
    - id: ypxfrd
      from_check: ypxfrd

