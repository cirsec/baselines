# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-AUTH-026
title: Store every password hash in shadow and leave no account without a password
finding:
  title: An account has its password hash in /etc/passwd, or an empty password
  description: /etc/passwd is readable by every user; an empty password field opens the account to anyone.
status: draft
profiles: [core]
risk:
  severity: high
assessment: automated
tags: [accounts, password, shadow]

description: |
  `/etc/passwd` is world-readable and must only contain `x` in the password field; the hashes
  belong in `/etc/shadow`, readable by root and the `shadow` group only. In `/etc/shadow`, each
  password field holds a hash, or `!`/`*` for locked accounts, but is never empty.
rationale: |
  A hash left in `/etc/passwd` can be copied and cracked by any local user. An empty password
  field lets anyone log in to the account where empty passwords are accepted.
impact: |
  None for a standard system.

audit:
  manual: |
    1. `awk -F: '$2 != "x"' /etc/passwd` prints nothing.
    2. `awk -F: '$2 == ""' /etc/shadow` prints nothing.
  checks:
    - id: shadowed
      engine: shell
      spec:
        script: |
          u=$(awk -F: '$2 != "x" {print $1}' /etc/passwd | tr '\n' ' ')
          echo "not shadowed: ${u:-none}"
          [ -z "$u" ]
    - id: not-empty
      engine: shell
      spec:
        script: |
          u=$(awk -F: '$2 == "" {print $1}' /etc/shadow | tr '\n' ' ')
          echo "empty password: ${u:-none}"
          [ -z "$u" ]

remediation:
  manual: |
    1. Run `pwconv` to move any hash from `/etc/passwd` to `/etc/shadow`.
    2. Lock each account with an empty password (`passwd -l <user>`) or give it one (`passwd <user>`).
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Restore `/etc/passwd` and `/etc/shadow` from the backup.
  scripts:
    - id: fix
      engine: shell
      content: |
        cb_backup /etc/passwd
        cb_backup /etc/shadow
        pwconv
        for u in $(awk -F: '$2 == "" {print $1}' /etc/shadow); do passwd -l "$u" >/dev/null; done

references:
