# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-BOOT-012
title: Restrict access to the boot loader configuration
finding:
  title: Users can read the boot loader configuration
  description: The GRUB configuration can hold the boot password hash and reveals the boot parameters of the system.
status: draft
profiles: [core]
risk:
  severity: low
assessment: automated
tags: [grub, boot, permissions]

applicability:
  facts: [grub]

description: |
  `/boot/grub/grub.cfg` is the configuration GRUB reads at boot. It is generated by `update-grub`
  and contains every boot entry, the kernel command lines and, when one is set, the PBKDF2 hash
  of the boot password.
rationale: |
  A readable password hash can be attacked offline. Restricting the file to root also hides the
  boot parameters from local users and stops them from learning which protections are enabled.
impact: |
  None known. GRUB reads the file before the operating system starts.
notes: |
  Ubuntu 24.04 and 26.04 already create the file with mode `0600`; 22.04 ships it `0644` and
  20.04 `0444`. From 22.04 on, `update-grub` keeps the mode of the existing file. On 20.04 it
  replaces the file and sets `0444` again whenever no GRUB password is configured, which happens
  at every kernel update: there, the restricted mode only lasts with CB-UBU-BOOT-011 applied.

setting:
  location: /boot/grub/grub.cfg
  default_value: "root:root 0444 (20.04), 0644 (22.04), 0600 (24.04, 26.04)"
  recommended_value: "root:root, mode 0600 or stricter"

audit:
  manual: |
    Run `stat -c '%U:%G %a' /boot/grub/grub.cfg`. It must print `root:root` and a mode of `600` or stricter.
  checks:
    - id: perms
      engine: file-perms
      description: Owner, group and mode of /boot/grub/grub.cfg.
      spec: { path: /boot/grub/grub.cfg, owner: root, group: root, mode: "0600" }

remediation:
  manual: |
    Run `chown root:root /boot/grub/grub.cfg` and `chmod 600 /boot/grub/grub.cfg`.
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  rollback: |
    Run `chmod 644 /boot/grub/grub.cfg`.
  scripts:
    - id: perms
      from_check: perms

references:
  - title: GNU GRUB Manual - Authentication and authorisation
    url: https://www.gnu.org/software/grub/manual/grub/html_node/Authentication-and-authorisation.html
    publisher: GNU Project
    kind: vendor-doc
    accessed: 2026-10-19
  - title: ANSSI-BP-028 v2.0 - Recommandations de configuration d'un système GNU/Linux (R29)
    url: https://messervices.cyber.gouv.fr/documents-guides/fr_np_linux_configuration-v2.0.pdf
    publisher: ANSSI
    kind: guide
    accessed: 2026-10-19
mappings:
  - framework: anssi-linux
    framework_version: "2.0"
    id: R29
    relation: partial
    note: R29 restricts the whole /boot directory; this control covers the GRUB configuration.
  - framework: nist-800-53r5
    framework_version: "5.1.1"
    id: AC-3
    relation: related
