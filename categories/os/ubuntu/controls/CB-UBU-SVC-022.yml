# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-UBU-SVC-022
title: Disable the Avahi mDNS/DNS-SD daemon
finding:
  title: Avahi announces the system and its services on the local network
  description: Zero-configuration discovery tells every host on the segment what this system is and offers.
status: draft
profiles: [server, desktop-hardened]
risk:
  severity: medium
assessment: automated
tags: [services, avahi, mdns, attack-surface]

description: |
  `avahi-daemon` implements multicast DNS and DNS service discovery (Zeroconf, Bonjour) on UDP
  port 5353. It is started by `avahi-daemon.service` and by `avahi-daemon.socket`.

  The control passes when both units are masked or not installed at all.
rationale: |
  Avahi publishes the host name, the services it offers and sometimes the operating system to
  the local network, and accepts multicast packets from any host there. Servers have fixed names
  and addresses and do not need it.
impact: |
  `.local` names are no longer resolved or published, and automatic discovery of printers and
  file shares stops. Desktops that rely on it keep it through the standard desktop profile; only
  the hardened desktop profile disables it.
notes: |
  Masking both the service and the socket is needed: either one can start the daemon. The
  `libnss-mdns` resolver stays installed and simply gets no answers.

audit:
  manual: |
    Run `systemctl is-enabled avahi-daemon.service avahi-daemon.socket`. Each must print `masked`,
    or the command must fail because the units do not exist.
  logic: all
  checks:
    - id: avahi-socket
      engine: systemd-unit
      description: Avahi socket activation.
      spec: { unit: avahi-daemon.socket, state: masked }
    - id: avahi-daemon
      engine: systemd-unit
      description: Avahi daemon.
      spec: { unit: avahi-daemon.service, state: masked }

remediation:
  manual: |
    Run `systemctl mask --now avahi-daemon.socket avahi-daemon.service`, or `apt purge avahi-daemon`
    if nothing depends on it.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Run `systemctl unmask avahi-daemon.socket avahi-daemon.service` then
    `systemctl enable --now avahi-daemon.service`.
  scripts:
    - id: avahi-socket
      from_check: avahi-socket
    - id: avahi-daemon
      from_check: avahi-daemon

references:
