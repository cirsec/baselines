id: CB-UBU-FS-012
locale: fr
source_updated: 2026-10-19
translators:
  - name: Alice
    github: Sn0wAlice
title: Chiffrer les disques qui portent le système et les données
finding:
  title: Des systèmes de fichiers ou le swap sont stockés en clair sur disque
  description: Quiconque détient le disque ou l'appareil, perdu, volé ou mis au rebut, peut lire ses données et modifier le système hors ligne.
description: |
  Avec LUKS (dm-crypt), chaque partition ou groupe de volumes LVM est chiffré par une clé
  déverrouillée au démarrage, par une phrase de passe, un TPM ou un serveur de clés. Les
  installeurs Ubuntu le mettent en place sur demande : l'installeur de bureau avec son option LVM
  et chiffrement (ou, depuis 23.10, le chiffrement expérimental adossé au TPM), l'installeur
  serveur en chiffrant le groupe de volumes LVM du partitionnement guidé. Seuls `/boot` et la partition système EFI restent en clair.
rationale: |
  Les portables et les postes de travail se perdent et se volent, et les disques partent avec le
  matériel rendu ou mis au rebut. Sans chiffrement, les données, les empreintes de mots de passe
  et les clés du disque peuvent être lues, et le système modifié hors ligne (par exemple pour y
  installer une porte dérobée) sans laisser de trace.
impact: |
  Une phrase de passe doit être saisie à chaque démarrage, sauf si un déverrouillage par TPM ou
  par le réseau est mis en place, ce qui complique les redémarrages sans surveillance. Chiffrer un
  système existant demande une réinstallation ou une conversion hors ligne. Le coût en
  performances est négligeable sur les processeurs avec instructions AES.
notes: |
  La vérification couvre chaque système de fichiers ext2/3/4, XFS, Btrfs, F2FS et JFS monté, sauf
  `/boot` et ce qui est en dessous, et chaque partition ou fichier de swap ; le swap zram est en
  mémoire et ignoré. Un périphérique qui n'est pas un périphérique bloc (jeu de données ZFS,
  système de fichiers réseau) fait remonter une erreur, à examiner à la main.

  Les postes Ubuntu utilisent comme swap le fichier `/swap.img` du système de fichiers racine, qui
  est donc chiffré avec lui. Le chiffrement adossé au TPM utilise aussi des volumes LUKS2, et le
  contrôle l'accepte de la même façon.
setting:
  location: Partitionnement des disques, /etc/crypttab
  recommended_value: Tous les systèmes de fichiers sauf /boot, et le swap, sur un périphérique dm-crypt
audit:
  manual: |
    Lancer `lsblk -o NAME,TYPE,FSTYPE,MOUNTPOINTS`. Chaque système de fichiers monté sauf `/boot`
    et `/boot/efi`, et chaque swap, doit se trouver sous un périphérique de type `crypt`.
remediation:
  manual: |
    Le chiffrement ne peut pas être ajouté sans risque par un script à un système en marche.

    1. Pour un nouveau système, activer le chiffrement dans l'installeur Ubuntu (bureau : LVM et
       chiffrement, ou chiffrement adossé au TPM ; serveur : chiffrer le groupe de volumes LVM),
       renseigner `storage` avec un `password` dans un fichier autoinstall, ou créer des volumes LUKS2 avec `cryptsetup luksFormat` et les
       déclarer dans `/etc/crypttab`.
    2. Pour un système existant, sauvegarder les données, réinstaller avec chiffrement et
       restaurer ; ou convertir hors ligne avec `cryptsetup reencrypt --encrypt` depuis un système
       live, après une sauvegarde complète.
    3. Chiffrer aussi le swap (dans le LVM chiffré, ou avec une clé aléatoire dans `/etc/crypttab`).
    4. Conserver une phrase de passe de secours en lieu sûr, séparément de l'appareil.
