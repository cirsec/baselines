# yaml-language-server: $schema=../../../../../schema/control-i18n.schema.json
id: CB-UBU-AUDIT-032
locale: fr
source_updated: 2026-10-19
translators:
  - name: Alice
    github: Sn0wAlice
title: Installer le contrôleur d'intégrité AIDE
finding:
  title: Aucun contrôleur d'intégrité des fichiers n'est installé
  description: Les modifications des binaires et des fichiers de configuration du système, comme un programme remplacé ou une porte dérobée, passent inaperçues.
description: |
  AIDE (Advanced Intrusion Detection Environment) enregistre les sommes de contrôle et les attributs
  des fichiers système dans une base, puis compare les fichiers avec elle. Ubuntu le découpe en
  `aide` (le programme) et `aide-common` (configuration dans `/etc/aide/`, `aideinit`, vérification
  quotidienne). Aucun des deux n'est installé par défaut.
rationale: |
  Un contrôleur d'intégrité est le moyen le plus simple de détecter que des fichiers qui ne devraient
  jamais changer (binaires, bibliothèques, configuration) ont été modifiés, par un intrus ou par
  erreur.
impact: |
  Installer AIDE seul ne fait rien tant que sa base n'est pas construite (CB-UBU-AUDIT-034).
notes: |
  La correction installe sans les paquets recommandés : `aide` recommande un agent de transport de
  courrier, qu'`apt-get` installerait sinon (exim4). Les rapports de la vérification quotidienne sont
  écrits dans `/var/log/aide/` ; installer et configurer un transport de courrier s'ils doivent être
  envoyés par courriel.
setting:
  location: paquets aide et aide-common
  recommended_value: Installés
audit:
  manual: |
    Lancer `dpkg-query -W -f='${Package} ${Status}\n' aide aide-common`. Les deux lignes doivent se
    terminer par `installed`.
remediation:
  manual: |
    Lancer `apt-get install --no-install-recommends aide aide-common`.
  rollback: |
    Lancer `apt-get purge aide aide-common`.
