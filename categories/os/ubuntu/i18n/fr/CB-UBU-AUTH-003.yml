# yaml-language-server: $schema=../../../../../schema/control-i18n.schema.json
id: CB-UBU-AUTH-003
locale: fr
source_updated: 2026-10-19
translators:
  - name: Alice
    github: Sn0wAlice
title: Protéger les fichiers de bannière contre la modification
finding:
  title: Les fichiers de bannière peuvent être modifiés par d'autres utilisateurs que root
  description: Qui peut réécrire les bannières peut retirer l'avertissement légal ou afficher de fausses instructions.
description: |
  `/etc/issue`, `/etc/issue.net` et `/etc/motd` sont affichés aux utilisateurs avant ou après la
  connexion. Ils doivent appartenir à root et n'être modifiables que par root.
rationale: |
  Une bannière modifiable permet de retirer l'avertissement légal, ou d'afficher de fausses
  instructions qui poussent les utilisateurs à lancer des commandes ou à donner leurs identifiants.
impact: |
  Aucun connu. Ce sont les valeurs par défaut d'Ubuntu quand les fichiers existent ; Ubuntu ne fournit pas de `/etc/motd`.
setting:
  location: /etc/issue, /etc/issue.net, /etc/motd
  recommended_value: "root:root, mode 0644 ou plus strict"
audit:
  manual: |
    Lancer `stat -c '%n %U:%G %a' /etc/issue /etc/issue.net /etc/motd`.
    Chaque fichier doit être `root:root` avec un mode `644` ou plus strict.
remediation:
  manual: |
    Lancer `chown root:root /etc/issue /etc/issue.net /etc/motd` et
    `chmod 644 /etc/issue /etc/issue.net /etc/motd`.
