# yaml-language-server: $schema=../../../../../schema/control-i18n.schema.json
id: CB-UBU-BOOT-014
locale: fr
source_updated: 2026-10-19
translators:
  - name: Alice
    github: Sn0wAlice
title: Désinstaller prelink
finding:
  title: prelink est installé
  description: prelink réécrit les binaires et bibliothèques du système, ce qui annule la randomisation des adresses des bibliothèques et casse les contrôles d'intégrité des fichiers.
description: |
  `prelink` modifie sur place les binaires ELF et les bibliothèques partagées pour que les
  bibliothèques se chargent à des adresses fixes calculées à l'avance, afin de gagner un peu de
  temps au lancement des programmes. Il est dans la composante `universe` d'Ubuntu jusqu'à 24.04 et
  n'est plus dans l'archive à partir de 26.04.
rationale: |
  Les bibliothèques prélinkées se chargent toujours à la même adresse, ce qui retire une partie du
  bénéfice de la randomisation de l'espace d'adressage (CB-UBU-BOOT-001). Prelink réécrit aussi les
  binaires de façon périodique : les outils d'intégrité comme AIDE signalent des changements qui ne
  sont pas des attaques, ce qui habitue les administrateurs à ignorer leurs alertes. Le gain au
  démarrage est négligeable sur le matériel actuel.
impact: |
  Aucun connu. Avant la désinstallation, la correction lance `prelink -ua` pour rendre à chaque
  binaire son contenu d'origine, ce qui peut prendre quelques minutes sur un gros système.
notes: |
  En 26.04 le paquet ne peut pas être installé depuis l'archive : le contrôle passe, sauf s'il vient
  d'une autre source.
setting:
  location: Paquet `prelink`
  recommended_value: Non installé
audit:
  manual: |
    Lancer `dpkg -s prelink`. Le paquet ne doit pas être installé.
remediation:
  manual: |
    1. Restaurer les binaires d'origine : `prelink -ua`.
    2. Désinstaller le paquet : `apt purge prelink`.
  rollback: |
    Réinstaller le paquet avec `apt install prelink` ; les binaires sont de nouveau prélinkés au
    prochain passage de sa tâche quotidienne.
