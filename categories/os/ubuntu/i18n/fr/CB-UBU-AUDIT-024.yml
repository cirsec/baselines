id: CB-UBU-AUDIT-024
locale: fr
source_updated: 2026-10-19
translators:
  - name: Alice
    github: Sn0wAlice
title: Auditer les changements de la configuration AppArmor
finding:
  title: Les changements de la politique de contrôle d'accès obligatoire ne sont pas enregistrés
  description: Les profils AppArmor peuvent être affaiblis ou supprimés sans trace.
description: |
  Règles auditd dans `/etc/audit/rules.d/60-cirsec-mac.rules`, clé `MAC-policy` : les écritures dans
  `/etc/apparmor/` et `/etc/apparmor.d/`, où se trouvent les réglages du parseur AppArmor et les profils.
rationale: |
  Passer un profil en mode complain ou le supprimer retire le confinement d'un service. Enregistrer ces
  changements montre quand la protection a été abaissée et par qui.
impact: |
  Les mises à jour de paquets qui livrent des profils AppArmor produisent des événements `MAC-policy`.
setting:
  location: /etc/audit/rules.d/60-cirsec-mac.rules
  recommended_value: "Règles chargées (auditctl -l) et présentes dans /etc/audit/rules.d/60-cirsec-mac.rules"
audit:
  manual: |
    1. Lancer `auditctl -l` en root. La commande doit lister les règles ci-dessous (clés `MAC-policy`).
    2. Lancer `grep -h . /etc/audit/rules.d/*.rules`. Les mêmes règles doivent y figurer, pour être chargées au démarrage.

    Règles attendues, telles que `auditctl -l` les affiche :
    ```
    -w /etc/apparmor -p wa -k MAC-policy
    -w /etc/apparmor.d -p wa -k MAC-policy
    ```
remediation:
  manual: |
    1. Écrire les règles attendues dans `/etc/audit/rules.d/60-cirsec-mac.rules` (mode 0640).
    2. Lancer `augenrules --load`. Si `auditctl -s` affiche `enabled 2`, la configuration est
       verrouillée : redémarrer pour charger les nouvelles règles.
  rollback: |
    Supprimer `/etc/audit/rules.d/60-cirsec-mac.rules` et lancer `augenrules --load` (ou redémarrer si la configuration est verrouillée).
