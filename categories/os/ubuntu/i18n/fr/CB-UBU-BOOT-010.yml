id: CB-UBU-BOOT-010
locale: fr
source_updated: 2026-10-19
translators:
  - name: Alice
    github: Sn0wAlice
title: Ne garder aucun profil AppArmor en mode complain
finding:
  title: Certains profils AppArmor journalisent les violations au lieu de les bloquer
  description: Un profil en mode complain ne confine rien ; le programme qu'il couvre tourne comme s'il n'avait pas de profil.
description: |
  Chaque profil AppArmor chargé fonctionne dans un mode. En mode `enforce`, les accès hors profil
  sont bloqués et journalisés. En mode `complain`, ils sont seulement journalisés. Les profils
  marqués `unconfined` sont un troisième cas : ils ne restreignent pas le programme mais lui
  attachent des droits précis (Ubuntu 24.04 et suivantes en livrent beaucoup pour la médiation des
  espaces de noms utilisateur), et ne sont pas concernés ici.

  Les applications snap reçoivent des profils générés par snapd (`snap.<nom>.<app>`). Un snap
  installé avec `--devmode` tourne avec ses profils en mode complain.
rationale: |
  Le mode complain sert à écrire et tester des profils. Un profil laissé en mode complain en
  production donne une fausse impression de confinement : le programme n'est pas restreint du tout.
impact: |
  Passer un profil en mode enforce peut casser le programme qu'il couvre si le profil est incomplet.
  Ubuntu livre volontairement quelques profils en mode complain (les profils `transmission-*` en
  24.04, `Xorg` et `Xorg_wrap` en 26.04, sur une image serveur) ; les passer en enforce un par un, en
  surveillant les refus dans les journaux (`journalctl -k | grep apparmor`). Sur un poste, passer
  `Xorg` en enforce peut casser une session Xorg : le tester avant de le déployer.
audit:
  manual: |
    Lancer `aa-status --complaining`. La commande doit afficher `0`.
    `aa-status` liste par nom les profils en mode complain.
remediation:
  manual: |
    1. Lister les profils en mode complain : `aa-status`.
    2. Pour chacun, installer `apparmor-utils` et lancer `aa-enforce /etc/apparmor.d/<profil>`.
    3. Surveiller les refus avec `journalctl -k | grep apparmor` et corriger ou annuler le profil.
    4. Les profils des snaps ne se changent pas avec `aa-enforce` : snapd les régénère. Réinstaller
       un snap devmode en confinement strict (`snap refresh --jailmode <snap>` ou sans `--devmode`),
       ou le supprimer.
  rollback: |
    Remettre un profil en mode complain avec `aa-complain /etc/apparmor.d/<profil>`.
