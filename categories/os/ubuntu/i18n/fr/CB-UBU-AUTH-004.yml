id: CB-UBU-AUTH-004
locale: fr
source_updated: 2026-10-19
translators:
  - name: Alice
    github: Sn0wAlice
title: Installer sudo pour l'administration
finding:
  title: sudo n'est pas installé
  description: Sans sudo, les administrateurs partagent le mot de passe root ou se connectent en root, et leurs actions ne sont pas attribuables.
description: |
  `sudo` permet aux utilisateurs autorisés de lancer des commandes en root (ou sous un autre
  utilisateur) avec leur propre mot de passe, selon les règles de `/etc/sudoers` et
  `/etc/sudoers.d/`. Chaque commande est journalisée avec le nom de l'utilisateur.
rationale: |
  L'administration par comptes nominatifs et sudo remplace un mot de passe root partagé, donne à
  chacun les seuls droits nécessaires et laisse une trace de qui a fait quoi.
impact: |
  Aucun connu. Ubuntu installe sudo sur tous les serveurs, postes et images cloud.
notes: |
  Depuis Ubuntu 25.10, la commande `sudo` est fournie par `sudo-rs`, une réécriture en Rust,
  choisie par l'alternative `sudo` ; le paquet `sudo` d'origine reste installé. L'un ou l'autre
  paquet satisfait ce contrôle.
audit:
  manual: |
    Lancer `dpkg -s sudo sudo-rs`. Au moins un des deux paquets doit être installé.
remediation:
  manual: |
    Lancer `apt install sudo`, puis donner l'accès aux administrateurs en les ajoutant au groupe `sudo`.
