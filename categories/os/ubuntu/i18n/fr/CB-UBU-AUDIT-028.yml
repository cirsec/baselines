id: CB-UBU-AUDIT-028
locale: fr
source_updated: 2026-10-19
translators:
  - name: Alice
    github: Sn0wAlice
title: Auditer les changements des tâches planifiées et du journal systemd
finding:
  title: Les changements des tâches planifiées et des fichiers du journal ne sont pas enregistrés
  description: Une tâche planifiée est un mécanisme de persistance courant, et les fichiers du journal peuvent être supprimés pour effacer des traces.
description: |
  Règles auditd dans `/etc/audit/rules.d/60-cirsec-cron.rules` :

  - les écritures dans `/etc/crontab`, `/etc/cron.d/`, `/etc/cron.hourly/`, `/etc/cron.daily/`,
    `/etc/cron.weekly/`, `/etc/cron.monthly/` et les crontabs utilisateur de `/var/spool/cron/`
    (clé `cron`) ;
  - les écritures et suppressions dans le journal persistant `/var/log/journal/` (clé `journal`).
rationale: |
  Ajouter une tâche cron est l'un des moyens les plus simples de garder du code actif sur un système.
  Supprimer ou tronquer les fichiers du journal permet d'effacer ce qui s'est passé. Les deux doivent
  laisser un événement d'audit.
impact: |
  journald ouvre, fait tourner et supprime lui-même les fichiers du journal, ce qui produit des événements `journal` venant du processus `systemd-journald`.
notes: |
  Ces règles viennent des référentiels ANSSI et STIG ; CIS n'a pas d'équivalent. Les surveillances de chemins encore absents (cron n'est pas installé par défaut) sont acceptées.
setting:
  location: /etc/audit/rules.d/60-cirsec-cron.rules
  recommended_value: "Règles chargées (auditctl -l) et présentes dans /etc/audit/rules.d/60-cirsec-cron.rules"
audit:
  manual: |
    1. Lancer `auditctl -l` en root. La commande doit lister les règles ci-dessous (clés `cron`, `journal`).
    2. Lancer `grep -h . /etc/audit/rules.d/*.rules`. Les mêmes règles doivent y figurer, pour être chargées au démarrage.

    Règles attendues, telles que `auditctl -l` les affiche :
    ```
    -w /etc/crontab -p wa -k cron
    -w /etc/cron.d -p wa -k cron
    -w /etc/cron.hourly -p wa -k cron
    -w /etc/cron.daily -p wa -k cron
    -w /etc/cron.weekly -p wa -k cron
    -w /etc/cron.monthly -p wa -k cron
    -w /var/spool/cron -p wa -k cron
    -w /var/log/journal -p wa -k journal
    ```
remediation:
  manual: |
    1. Écrire les règles attendues dans `/etc/audit/rules.d/60-cirsec-cron.rules` (mode 0640).
    2. Lancer `augenrules --load`. Si `auditctl -s` affiche `enabled 2`, la configuration est
       verrouillée : redémarrer pour charger les nouvelles règles.
  rollback: |
    Supprimer `/etc/audit/rules.d/60-cirsec-cron.rules` et lancer `augenrules --load` (ou redémarrer si la configuration est verrouillée).
