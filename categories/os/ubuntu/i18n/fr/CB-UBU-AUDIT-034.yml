id: CB-UBU-AUDIT-034
locale: fr
source_updated: 2026-10-19
translators:
  - name: Alice
    github: Sn0wAlice
title: Construire la base AIDE et vérifier l'intégrité des fichiers chaque jour
finding:
  title: L'intégrité des fichiers n'est jamais vérifiée
  description: Sans base de référence ni vérification régulière, AIDE ne peut signaler aucun fichier système modifié.
description: |
  AIDE a besoin d'une base de référence, `/var/lib/aide/aide.db`, construite avec `aideinit` à partir
  de l'état actuel du système. `aide-common` lance ensuite une vérification quotidienne, qui compare
  les fichiers avec la base et écrit un rapport dans `/var/log/aide/` (et l'envoie par courriel quand
  un transport de courrier est installé) :

  - à partir d'Ubuntu 24.04 (AIDE 0.18 et suivants), avec `dailyaidecheck.timer` ;
  - sur Ubuntu 20.04 et 22.04 (AIDE 0.16 et 0.17), avec la tâche cron `/etc/cron.daily/aide`, que
    `CRON_DAILY_RUN=no` dans `/etc/default/aide` désactive.

  Ce contrôle exige que la base existe et que la vérification quotidienne soit activée.
rationale: |
  La base est la référence de confiance ; la vérification quotidienne en fait un moyen de détection.
  Sans l'une ou l'autre, un AIDE installé donne une fausse impression de protection.
impact: |
  Construire la base lit chaque fichier couvert : quelques minutes et une brève charge disque. La
  vérification quotidienne fait de même. Après des changements légitimes (mises à jour,
  configuration), relire le rapport et mettre à jour la base (`aide --update`, puis remplacer
  `aide.db` par `aide.db.new`).
notes: |
  Construire la base une fois le système dans son état voulu : lancer cette correction après les
  autres corrections de durcissement, ou reconstruire la base ensuite avec `aideinit -y -f`, sinon les
  premiers rapports listent chaque changement fait par le durcissement.
setting:
  location: /var/lib/aide/aide.db, dailyaidecheck.timer (20.04 et 22.04 - /etc/cron.daily/aide)
  recommended_value: Base présente, vérification quotidienne activée
audit:
  manual: |
    1. Lancer `ls -l /var/lib/aide/aide.db`. Le fichier doit exister et ne pas être vide.
    2. Ubuntu 24.04 et suivants : lancer `systemctl is-enabled dailyaidecheck.timer`. La commande
       doit afficher `enabled`. Ubuntu 20.04 et 22.04 : `/etc/cron.daily/aide` doit être exécutable
       et `/etc/default/aide` ne doit pas contenir `CRON_DAILY_RUN=no`.
    3. Lire le dernier rapport dans `/var/log/aide/` et vérifier que les différences sont expliquées.
remediation:
  manual: |
    1. Lancer `aideinit -y -f` et attendre la fin (quelques minutes).
    2. Ubuntu 24.04 et suivants : lancer `systemctl enable --now dailyaidecheck.timer`. Ubuntu 20.04
       et 22.04 : lancer `chmod 755 /etc/cron.daily/aide` et régler `CRON_DAILY_RUN=yes` (ou retirer
       la ligne) dans `/etc/default/aide`.
  rollback: |
    Lancer `systemctl disable --now dailyaidecheck.timer` (20.04 et 22.04 : régler `CRON_DAILY_RUN=no` dans `/etc/default/aide`) et supprimer `/var/lib/aide/aide.db`.
