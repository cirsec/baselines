# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-SVC-007
title: Remove telnet, rsh and talk servers and disable inetd super-servers
finding:
  title: Clear-text remote access servers or an inetd super-server are present
  description: telnet and rsh send passwords and whole sessions in clear text; inetd starts such servers on demand.
status: draft
profiles: [core]
risk:
  severity: high
assessment: automated
tags: [services, telnet, rsh, talk, inetd, attack-surface]

description: |
  The historical remote access servers are started by an inetd super-server, not by systemd units
  of their own:

  - telnet servers: `telnetd`, `inetutils-telnetd`, `telnetd-ssl`;
  - rsh, rlogin and rexec servers: `rsh-server`, `rsh-redone-server` (Debian 12 only);
  - talk servers: `talkd`, `inetutils-talkd`.

  The control requires these packages to be absent, and the super-servers that would launch them
  (`xinetd.service`, `inetd.service` from `openbsd-inetd`, `inetutils-inetd.service`) to be masked
  or not installed.
rationale: |
  telnet and rsh carry passwords and every keystroke in clear text, and rsh trusts the client's
  address and user name. SSH replaces all of them. A super-server accepts connections for every
  service listed in its configuration, which makes it easy to expose one by mistake.
impact: |
  Removes the listed server packages. Masking an inetd super-server stops every service it
  launches; check `/etc/inetd.conf` and `/etc/xinetd.d/` before applying.
notes: |
  `telnetd` is a transitional package that pulls in `inetutils-telnetd`; both are checked. SSH
  access is not affected.

audit:
  manual: |
    1. `dpkg-query -W -f='${Status}\n' telnetd inetutils-telnetd telnetd-ssl rsh-server
       rsh-redone-server talkd inetutils-talkd` must not show any `install ok installed`.
    2. `systemctl is-enabled xinetd.service inetd.service inetutils-inetd.service` must print
       `masked` or fail because the unit does not exist.
  logic: all
  checks:
    - id: telnetd
      engine: package
      description: telnetd transitional package.
      spec: { name: telnetd, state: absent }
    - id: inetutils-telnetd
      engine: package
      description: GNU inetutils telnet server.
      spec: { name: inetutils-telnetd, state: absent }
    - id: telnetd-ssl
      engine: package
      description: telnet server with SSL.
      spec: { name: telnetd-ssl, state: absent }
    - id: rsh-server
      engine: package
      description: rsh, rlogin and rexec servers.
      spec: { name: rsh-server, state: absent }
    - id: rsh-redone-server
      engine: package
      description: rsh-redone rsh and rlogin servers.
      spec: { name: rsh-redone-server, state: absent }
    - id: talkd
      engine: package
      description: talk server.
      spec: { name: talkd, state: absent }
    - id: inetutils-talkd
      engine: package
      description: GNU inetutils talk server.
      spec: { name: inetutils-talkd, state: absent }
    - id: xinetd
      engine: systemd-unit
      description: xinetd super-server.
      spec: { unit: xinetd.service, state: masked }
    - id: openbsd-inetd
      engine: systemd-unit
      description: OpenBSD inetd super-server.
      spec: { unit: inetd.service, state: masked }
    - id: inetutils-inetd
      engine: systemd-unit
      description: GNU inetutils inetd super-server.
      spec: { unit: inetutils-inetd.service, state: masked }

remediation:
  manual: |
    1. Run `apt purge telnetd inetutils-telnetd telnetd-ssl rsh-server rsh-redone-server talkd
       inetutils-talkd`.
    2. Run `systemctl mask --now <unit>` for each installed super-server, or remove its package
       (`apt purge xinetd openbsd-inetd inetutils-inetd`) when nothing else depends on it.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Reinstall the needed package with `apt install`, and `systemctl unmask` the super-server.
  scripts:
    - id: telnetd
      from_check: telnetd
    - id: inetutils-telnetd
      from_check: inetutils-telnetd
    - id: telnetd-ssl
      from_check: telnetd-ssl
    - id: rsh-server
      from_check: rsh-server
    - id: rsh-redone-server
      from_check: rsh-redone-server
    - id: talkd
      from_check: talkd
    - id: inetutils-talkd
      from_check: inetutils-talkd
    - id: xinetd
      from_check: xinetd
    - id: openbsd-inetd
      from_check: openbsd-inetd
    - id: inetutils-inetd
      from_check: inetutils-inetd

