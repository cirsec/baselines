# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-FS-007
title: Protect the user, group and password database files
finding:
  title: The account database files have weak ownership or permissions
  description: Password hashes can be read for offline cracking, or account files can be changed to add a user or gain root.
status: active
profiles: [core]
risk:
  severity: high
assessment: automated
tags: [permissions, accounts, shadow]

description: |
  The files that define local accounts, and the backups that the shadow tools keep with a `-`
  suffix, have the Debian ownership and at most these modes:

  | Files | Owner:group | Maximum mode |
  |---|---|---|
  | `/etc/passwd`, `/etc/passwd-`, `/etc/group`, `/etc/group-` | `root:root` | `644` |
  | `/etc/shadow`, `/etc/shadow-`, `/etc/gshadow`, `/etc/gshadow-` | `root:shadow` | `640` |
  | `/etc/shells` | `root:root` | `644` |
  | `/etc/security/opasswd`, `/etc/security/opasswd.old` | `root:root` | `600` |

  Files that do not exist are skipped.
rationale: |
  `passwd` and `group` must stay readable by everyone for name lookups, but only root may change
  them: write access means creating a UID 0 account. `shadow` and `gshadow` hold password hashes;
  on Debian the `shadow` group lets `unix_chkpwd` and screen lockers check a password without
  being root, and nobody else may read them. `opasswd` holds the previous password hashes kept by
  `pam_pwhistory`. The `-` backups contain the same data as the live files.
impact: |
  None known: these are the Debian defaults, and the fix only removes extra access.
notes: |
  Debian uses group `shadow` for `shadow` and `gshadow`, not `root` as on other distributions.
  Setting them to `root:root` breaks password checks by `unix_chkpwd` for non-root programs
  (screen lockers, some PAM services).

setting:
  location: /etc/passwd, /etc/group, /etc/shadow, /etc/gshadow, /etc/shells, /etc/security/opasswd
  default_value: Compliant on a fresh install
  recommended_value: See the table in the description

audit:
  manual: |
    Run `stat -c '%n %U:%G %a' /etc/passwd* /etc/group* /etc/shadow* /etc/gshadow* /etc/shells /etc/security/opasswd*`
    and compare each line with the table above.
  checks:
    - id: passwd
      engine: file-perms
      description: /etc/passwd and its backup are root:root, mode 644 or stricter.
      spec: { path: "/etc/passwd*", owner: root, group: root, mode: "0644" }
    - id: group
      engine: file-perms
      description: /etc/group and its backup are root:root, mode 644 or stricter.
      spec: { path: "/etc/group*", owner: root, group: root, mode: "0644" }
    - id: shadow
      engine: file-perms
      description: /etc/shadow and its backup are root:shadow, mode 640 or stricter.
      spec: { path: "/etc/shadow*", owner: root, group: shadow, mode: "0640" }
    - id: gshadow
      engine: file-perms
      description: /etc/gshadow and its backup are root:shadow, mode 640 or stricter.
      spec: { path: "/etc/gshadow*", owner: root, group: shadow, mode: "0640" }
    - id: shells
      engine: file-perms
      description: /etc/shells is root:root, mode 644 or stricter.
      spec: { path: /etc/shells, owner: root, group: root, mode: "0644" }
    - id: opasswd
      engine: file-perms
      description: /etc/security/opasswd and its backup are root:root, mode 600 or stricter.
      spec: { path: "/etc/security/opasswd*", owner: root, group: root, mode: "0600" }

remediation:
  manual: |
    ```
    chown root:root /etc/passwd /etc/passwd- /etc/group /etc/group- /etc/shells
    chmod u-x,go-wx /etc/passwd /etc/passwd- /etc/group /etc/group- /etc/shells
    chown root:shadow /etc/shadow /etc/shadow- /etc/gshadow /etc/gshadow-
    chmod u-x,g-wx,o-rwx /etc/shadow /etc/shadow- /etc/gshadow /etc/gshadow-
    chown root:root /etc/security/opasswd*
    chmod 600 /etc/security/opasswd*
    ```
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  rollback: |
    Not needed: the fix only restores the Debian ownership and removes extra permissions.
  scripts:
    - id: passwd
      from_check: passwd
    - id: group
      from_check: group
    - id: shadow
      from_check: shadow
    - id: gshadow
      from_check: gshadow
    - id: shells
      from_check: shells
    - id: opasswd
      from_check: opasswd

