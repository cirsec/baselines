# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-SVC-008
title: Disable web server services on systems that do not serve web content
finding:
  title: A web server can run on a system that does not serve web content
  description: A forgotten web server publishes default pages, modules and files that nobody maintains.
status: active
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [services, http, attack-surface]

description: |
  Web servers packaged by Debian: Apache (`apache2.service`), nginx (`nginx.service`) and
  lighttpd (`lighttpd.service`). They are often pulled in as dependencies of other software.

  The control passes when each unit is masked or not installed at all.
rationale: |
  A web server that nobody expects is not patched, monitored or hardened, and may publish
  directories or status pages that reveal information. It is remotely reachable code.
impact: |
  Masking a unit stops it and prevents it from starting again. **Web servers and reverse proxies
  must exclude this control in their tailoring file**, with the reason, for example:

  ```yaml
  exclude:
    - control: CB-DEB-SVC-008
      reason: Web server role (nginx serves the intranet).
  ```
notes: |
  A unit that does not exist counts as compliant, so removing the package is an equally valid fix.

audit:
  manual: |
    For each unit, run `systemctl is-enabled <unit>`. It must print `masked`, or fail because the
    unit does not exist: `apache2.service`, `nginx.service`, `lighttpd.service`.
  logic: all
  checks:
    - id: apache2
      engine: systemd-unit
      description: Apache HTTP server.
      spec: { unit: apache2.service, state: masked }
    - id: nginx
      engine: systemd-unit
      description: nginx web server.
      spec: { unit: nginx.service, state: masked }
    - id: lighttpd
      engine: systemd-unit
      description: lighttpd web server.
      spec: { unit: lighttpd.service, state: masked }

remediation:
  manual: |
    Stop and mask each unit that is installed: `systemctl mask --now <unit>`. If the package is not
    needed at all, remove it instead: `apt purge apache2 nginx lighttpd`.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Run `systemctl unmask <unit>` then `systemctl enable --now <unit>`.
  scripts:
    - id: apache2
      from_check: apache2
    - id: nginx
      from_check: nginx
    - id: lighttpd
      from_check: lighttpd

references:
