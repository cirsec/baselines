id: CB-DEB-AUTH-007
title: Never disable authentication for sudo globally
finding:
  title: sudo is configured to skip authentication
  description: With authentication disabled, every sudo rule works without a password, for every user it applies to.
status: active
profiles: [core]
risk:
  severity: high
assessment: automated
tags: [sudo, privilege-escalation]

applicability:
  facts: [sudo]

description: |
  The `!authenticate` default turns off password checks for every rule it applies to. Unlike a
  `NOPASSWD:` tag on one rule, it is easy to miss because it sits in a `Defaults` line.
rationale: |
  A global `!authenticate` silently turns every administrator account into a password-less root
  account: stealing any of their sessions is enough to control the system.
impact: |
  None for a standard configuration. Debian does not set it.

audit:
  manual: |
    Run `grep -r '!authenticate' /etc/sudoers /etc/sudoers.d/`. There must be no match.
  checks:
    - id: sudoers
      engine: file-content
      description: No !authenticate in /etc/sudoers.
      spec: { path: /etc/sudoers, pattern: "^[^#]*!\\s*authenticate", expect: no_match }
    - id: sudoers-d
      engine: file-content
      description: No !authenticate in /etc/sudoers.d/.
      spec: { path: /etc/sudoers.d/*, pattern: "^[^#]*!\\s*authenticate", expect: no_match }

remediation:
  manual: |
    Remove every `Defaults ... !authenticate` entry with `visudo` (or `visudo -f` for files in
    `/etc/sudoers.d/`).
  rollback: |
    Add the entry back with `visudo`.

references:
  - title: sudoers(5), Debian manual pages
    url: https://manpages.debian.org/trixie/sudo/sudoers.5.en.html
    publisher: Debian
    kind: vendor-doc
