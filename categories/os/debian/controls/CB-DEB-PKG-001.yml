    by: Sn0wAlice
    versions: ["12"]
    environment: Proxmox VM, Debian 12 genericcloud image, kernel 6.1.0-54-cloud-amd64
    notes: "Passes on stock cloud images (deb822 with Signed-By); one-line and deb822 entries without Signed-By, trusted=yes (both formats) detected, disabled stanzas skipped; fix adds the Debian keyring, apt-get update works, idempotent, kept after reboot."
