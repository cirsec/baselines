# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-NET-018
title: Disable SSH forwarding
finding:
  title: SSH sessions can forward ports, sockets, X11 and the SSH agent
  description: Forwarding turns any SSH account into a tunnel through the firewall, in either direction.
status: active
profiles: [server-hardened, desktop-hardened]
risk:
  severity: medium
assessment: automated
tags: [ssh, forwarding, tunneling]

applicability:
  facts: [openssh-server]

description: |
  `DisableForwarding yes` in the OpenSSH server turns off every kind of forwarding at once: TCP
  port forwarding (`ssh -L`, `-R`, `-D`), Unix socket forwarding, X11 forwarding and SSH agent
  forwarding, whatever the other `*Forwarding` options say.
rationale: |
  With forwarding, a user or an attacker holding any SSH account can open tunnels to internal
  services that the firewall does not expose, or expose the server's network to the outside
  (reverse tunnels). X11 and agent forwarding let a compromised server act on the client's
  display or reuse its keys.
impact: |
  Administrators lose `ssh -L/-R/-D` tunnels, `ssh -A` (agent forwarding, used to hop to other
  hosts or to `git` with the local key) and `ssh -X`. To reach other hosts, use `ProxyJump`
  (`ssh -J`) through a dedicated bastion instead of agent forwarding. Bastions need TCP forwarding
  for `ProxyJump`: exclude this control there, or allow it for a group of users with a
  `Match Group` block.

setting:
  location: /etc/ssh/sshd_config.d/00-cirsec.conf
  default_value: "no"
  recommended_value: "yes"

audit:
  manual: |
    Run `sshd -T | grep '^disableforwarding '`. It must print `disableforwarding yes`.
  checks:
    - id: disable-forwarding
      engine: sshd-config
      description: DisableForwarding.
      spec: { key: disableforwarding, value: "yes" }

remediation:
  manual: |
    Add `DisableForwarding yes` to `/etc/ssh/sshd_config.d/00-cirsec.conf`, check with `sshd -t`,
    then run `systemctl reload ssh`.
  effects:
    restart: service
    services: [ssh]
    disruption: low
    lockout_risk: true
  rollback: |
    Remove the line and run `systemctl reload ssh`.
  scripts:
    - id: disable-forwarding
      from_check: disable-forwarding

references:
  - title: sshd_config(5), Debian manual pages
    url: https://manpages.debian.org/trixie/openssh-server/sshd_config.5.en.html
    publisher: Debian
    kind: vendor-doc
    accessed: 2026-10-18
  - title: NIST IR 7966 - Security of Interactive and Automated Access Management Using Secure Shell (SSH)
    url: https://csrc.nist.gov/pubs/ir/7966/final
    publisher: NIST
    kind: guide
    accessed: 2026-10-18
