# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-NET-012
title: Harden ICMP and TCP handling against floods and bogus packets
finding:
  title: The kernel ICMP and TCP settings leave the system open to simple floods and protocol abuse
  description: Broadcast pings, bogus ICMP errors and SYN floods can be used to exhaust the system or to amplify attacks against others.
status: draft
profiles: [core]
risk:
  severity: low
assessment: automated
tags: [sysctl, network, icmp, tcp, denial-of-service]

description: |
  These kernel settings make the IPv4 stack resist common abuse:

  - `net.ipv4.icmp_echo_ignore_broadcasts = 1`: do not answer pings sent to broadcast or
    multicast addresses;
  - `net.ipv4.icmp_ignore_bogus_error_responses = 1`: do not log ICMP errors that violate
    RFC 1122;
  - `net.ipv4.tcp_syncookies = 1`: answer with SYN cookies when the queue of half-open
    connections is full;
  - `net.ipv4.tcp_rfc1337 = 1`: protect sockets in TIME-WAIT state from being reset by stray
    packets (RFC 1337);
  - `net.ipv4.ip_local_port_range = 32768 65535`: use the widest range of ephemeral ports, which
    makes source ports harder to guess.
rationale: |
  Answering broadcast pings turns the host into an amplifier for smurf attacks. Bogus error
  messages can fill the logs. SYN cookies keep the host reachable during a SYN flood (RFC 4987).
  RFC 1337 protection and a wide ephemeral port range make connection hijacking and blind
  spoofing harder.
impact: |
  None known. The wider port range can collide with a service listening on a port between 61000
  and 65535; reserve such ports with `net.ipv4.ip_local_reserved_ports`.
notes: |
  Debian already ships the first three values. The last two come from ANSSI.

setting:
  location: sysctl `net.ipv4.icmp_echo_ignore_broadcasts`, `net.ipv4.icmp_ignore_bogus_error_responses`, `net.ipv4.tcp_syncookies`, `net.ipv4.tcp_rfc1337`, `net.ipv4.ip_local_port_range`, persisted in `/etc/sysctl.d/`
  default_value: 1, 1, 1, 0, 32768 60999
  recommended_value: 1, 1, 1, 1, 32768 65535

audit:
  manual: |
    Run `sysctl net.ipv4.icmp_echo_ignore_broadcasts net.ipv4.icmp_ignore_bogus_error_responses net.ipv4.tcp_syncookies net.ipv4.tcp_rfc1337 net.ipv4.ip_local_port_range`
    and compare with the recommended values. Check that no sysctl file sets other values.
  checks:
    - id: echo-ignore-broadcasts
      engine: sysctl
      description: net.ipv4.icmp_echo_ignore_broadcasts.
      spec: { key: net.ipv4.icmp_echo_ignore_broadcasts, value: 1 }
    - id: ignore-bogus-errors
      engine: sysctl
      description: net.ipv4.icmp_ignore_bogus_error_responses.
      spec: { key: net.ipv4.icmp_ignore_bogus_error_responses, value: 1 }
    - id: syncookies
      engine: sysctl
      description: net.ipv4.tcp_syncookies.
      spec: { key: net.ipv4.tcp_syncookies, value: 1 }
    - id: rfc1337
      engine: sysctl
      description: net.ipv4.tcp_rfc1337.
      spec: { key: net.ipv4.tcp_rfc1337, value: 1 }
    - id: local-port-range
      engine: sysctl
      description: net.ipv4.ip_local_port_range.
      spec: { key: net.ipv4.ip_local_port_range, value: "32768 65535" }

remediation:
  manual: |
    Add to `/etc/sysctl.d/60-cirsec.conf`:
    ```
    net.ipv4.icmp_echo_ignore_broadcasts = 1
    net.ipv4.icmp_ignore_bogus_error_responses = 1
    net.ipv4.tcp_syncookies = 1
    net.ipv4.tcp_rfc1337 = 1
    net.ipv4.ip_local_port_range = 32768 65535
    ```
    remove other assignments, then run `sysctl --system`.
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  rollback: |
    Remove the lines from `/etc/sysctl.d/60-cirsec.conf` and set the previous values with `sysctl -w`.
  scripts:
    - id: echo-ignore-broadcasts
      from_check: echo-ignore-broadcasts
    - id: ignore-bogus-errors
      from_check: ignore-bogus-errors
    - id: syncookies
      from_check: syncookies
    - id: rfc1337
      from_check: rfc1337
    - id: local-port-range
      from_check: local-port-range

