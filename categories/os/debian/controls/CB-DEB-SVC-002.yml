# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-SVC-002
title: Disable file transfer and file sharing server services the system does not provide
finding:
  title: FTP, TFTP, rsync or Samba servers can run on a system that does not provide them
  description: An unneeded file server exposes data and often sends credentials in clear text.
status: active
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [services, ftp, tftp, rsync, samba, attack-surface]

description: |
  File transfer and sharing daemons packaged by Debian:

  - FTP: `vsftpd`, `proftpd` (service and socket), `pure-ftpd`;
  - TFTP: `tftpd-hpa`, `atftpd` (service and socket);
  - rsync in daemon mode: `rsync`;
  - Samba: `smbd`, `nmbd`, `samba-ad-dc`.

  The control passes when each unit is masked or not installed at all.
rationale: |
  FTP and TFTP send data, and FTP also passwords, without encryption. TFTP has no authentication
  at all. rsync and Samba daemons publish directories on the network. Each of them is remotely
  reachable code and a path for data to leave the system.
impact: |
  Masking a unit stops it and prevents it from starting again. Client tools are not affected:
  `rsync` over SSH and `smbclient` keep working. File servers must exclude this control in their
  tailoring file.
notes: |
  A unit that does not exist counts as compliant, so removing the package is an equally valid
  fix. The rsync package ships `rsync.service` disabled; it still fails this control until masked,
  because any package or administrator can enable it.

audit:
  manual: |
    For each unit, run `systemctl is-enabled <unit>`. It must print `masked`, or fail because the
    unit does not exist: `vsftpd.service`, `proftpd.service`, `proftpd.socket`,
    `pure-ftpd.service`, `tftpd-hpa.service`, `atftpd.service`, `atftpd.socket`,
    `rsync.service`, `smbd.service`, `nmbd.service`, `samba-ad-dc.service`.
  logic: all
  checks:
    - id: vsftpd
      engine: systemd-unit
      description: vsftpd FTP server.
      spec: { unit: vsftpd.service, state: masked }
    - id: proftpd
      engine: systemd-unit
      description: ProFTPD FTP server.
      spec: { unit: proftpd.service, state: masked }
    - id: proftpd-socket
      engine: systemd-unit
      description: ProFTPD socket activation.
      spec: { unit: proftpd.socket, state: masked }
    - id: pure-ftpd
      engine: systemd-unit
      description: Pure-FTPd FTP server.
      spec: { unit: pure-ftpd.service, state: masked }
    - id: tftpd-hpa
      engine: systemd-unit
      description: tftp-hpa TFTP server.
      spec: { unit: tftpd-hpa.service, state: masked }
    - id: atftpd
      engine: systemd-unit
      description: atftpd TFTP server.
      spec: { unit: atftpd.service, state: masked }
    - id: atftpd-socket
      engine: systemd-unit
      description: atftpd socket activation.
      spec: { unit: atftpd.socket, state: masked }
    - id: rsync
      engine: systemd-unit
      description: rsync daemon.
      spec: { unit: rsync.service, state: masked }
    - id: smbd
      engine: systemd-unit
      description: Samba file server.
      spec: { unit: smbd.service, state: masked }
    - id: nmbd
      engine: systemd-unit
      description: Samba NetBIOS name server.
      spec: { unit: nmbd.service, state: masked }
    - id: samba-ad-dc
      engine: systemd-unit
      description: Samba Active Directory domain controller.
      spec: { unit: samba-ad-dc.service, state: masked }

remediation:
  manual: |
    Stop and mask each unit that is installed: `systemctl mask --now <unit>`. If the package is not
    needed at all, remove it instead, for example `apt purge vsftpd tftpd-hpa samba`.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Run `systemctl unmask <unit>` then `systemctl enable --now <unit>`.
  scripts:
    - id: vsftpd
      from_check: vsftpd
    - id: proftpd
      from_check: proftpd
    - id: proftpd-socket
      from_check: proftpd-socket
    - id: pure-ftpd
      from_check: pure-ftpd
    - id: tftpd-hpa
      from_check: tftpd-hpa
    - id: atftpd
      from_check: atftpd
    - id: atftpd-socket
      from_check: atftpd-socket
    - id: rsync
      from_check: rsync
    - id: smbd
      from_check: smbd
    - id: nmbd
      from_check: nmbd
    - id: samba-ad-dc
      from_check: samba-ad-dc

