id: CB-DEB-AUTH-004
title: Install sudo for administrative access
finding:
  title: sudo is not installed
  description: Without sudo, administrators share the root password or log in as root, and their actions cannot be traced to a person.
status: active
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [sudo, privilege-escalation, accountability]

description: |
  `sudo` lets authorized users run commands as root (or another user) with their own password,
  according to rules in `/etc/sudoers` and `/etc/sudoers.d/`. Every command is logged with the
  name of the user who ran it.
rationale: |
  Administration through personal accounts and sudo replaces a shared root password, gives each
  administrator only the rights they need, and leaves an audit trail that names who did what.
impact: |
  None known. Debian installs sudo when no root password is set during installation, and the
  cloud images ship it.

audit:
  manual: |
    Run `dpkg -s sudo`. The package must be installed.
  checks:
    - id: package
      engine: package
      description: The sudo package is installed.
      spec: { name: sudo, state: installed }

remediation:
  manual: |
    Run `apt install sudo`, then grant administrators access by adding them to the `sudo` group.
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  scripts:
    - id: install
      from_check: package

references:
  - title: sudo(8), Debian manual pages
    url: https://manpages.debian.org/trixie/sudo/sudo.8.en.html
    publisher: Debian
    kind: vendor-doc
    accessed: 2026-10-18
  - title: ANSSI-BP-028 v2.0 - Recommandations de configuration d'un système GNU/Linux (R33)
    url: https://messervices.cyber.gouv.fr/documents-guides/fr_np_linux_configuration-v2.0.pdf
    publisher: ANSSI
    kind: guide
    accessed: 2026-10-18
