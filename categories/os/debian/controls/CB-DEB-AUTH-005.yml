# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-AUTH-005
title: Configure sudo to use a pseudo-terminal, a log file and a short credential cache
finding:
  title: sudo defaults allow terminal hijacking, keep no local log or cache credentials too long
  description: Commands run with sudo can escape to the user's terminal, leave traces only in syslog, and a forgotten session stays privileged.
status: active
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [sudo, privilege-escalation, logging]

applicability:
  facts: [sudo]

description: |
  Three sudo defaults, set with `Defaults` lines in `/etc/sudoers` or `/etc/sudoers.d/`:

  - `use_pty`: run each command in a new pseudo-terminal, so it cannot inject input into the
    user's terminal after sudo exits;
  - `logfile`: write every sudo command to a dedicated file, in addition to syslog;
  - `timestamp_timeout`: how many minutes a successful authentication is cached before sudo asks
    for the password again.
rationale: |
  Without `use_pty`, a malicious program run through sudo can keep running in the background and
  push keystrokes into the user's shell. A dedicated log file keeps a readable record of
  privileged commands even if syslog is lost or flooded. A short cache limits how long an
  unattended terminal can run privileged commands without a password.
impact: |
  Some interactive programs behave differently in a pseudo-terminal (rare). Users type their
  password again after {{ timestamp_timeout }} minutes of not using sudo.
notes: |
  Debian already sets `use_pty` in `/etc/sudoers` and caches credentials for 15 minutes. The
  effective values are read with `sudo -V` as root, which merges every sudoers file.

setting:
  location: /etc/sudoers.d/60-cirsec
  default_value: use_pty, no log file, 15 minutes
  recommended_value: "use_pty, logfile={{ log_file }}, timestamp_timeout at most {{ timestamp_timeout }}"

parameters:
  - name: log_file
    type: string
    description: Path of the sudo log file.
    default: /var/log/sudo.log
  - name: timestamp_timeout
    type: integer
    description: Maximum number of minutes sudo caches credentials.
    unit: minutes
    default: 15
    profile_defaults:
      server-hardened: 5
      desktop-hardened: 5
    minimum: 0
    maximum: 15

audit:
  manual: |
    Run `sudo -V` as root and check that:
    1. it prints `Always run commands in a pseudo-tty`;
    2. `Path to log file:` is set;
    3. `Authentication timestamp timeout:` is at most {{ timestamp_timeout }} minutes.
  checks:
    - id: use-pty
      engine: shell
      description: sudo runs commands in a pseudo-terminal.
      spec:
        script: |
          sudo -V 2>/dev/null | grep -q 'Always run commands in a pseudo-tty' || { echo "use_pty not set"; exit 1; }
          echo "use_pty set"
    - id: logfile
      engine: shell
      description: sudo writes to a log file.
      spec:
        script: |
          f=$(sudo -V 2>/dev/null | sed -n 's/^Path to log file: //p')
          echo "logfile=${f:-none}"
          [ -n "$f" ]
    - id: timeout
      engine: shell
      description: sudo credential cache lifetime.
      spec:
        script: |
          t=$(sudo -V 2>/dev/null | sed -n 's/^Authentication timestamp timeout: \([0-9-]*\).*/\1/p')
          echo "timestamp_timeout=${t:-unknown} minutes"
          [ -n "$t" ] || exit 3
          [ "$t" -ge 0 ] && [ "$t" -le "$CB_TIMESTAMP_TIMEOUT" ]

remediation:
  manual: |
    Create `/etc/sudoers.d/60-cirsec` with `visudo -f /etc/sudoers.d/60-cirsec`:
    ```
    Defaults use_pty
    Defaults logfile="{{ log_file }}"
    Defaults timestamp_timeout={{ timestamp_timeout }}
    ```
    Remove any `timestamp_timeout` with a higher value from other sudoers files.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Delete `/etc/sudoers.d/60-cirsec`.
  scripts:
    - id: dropin
      engine: shell
      content: |
        f=/etc/sudoers.d/60-cirsec
        t=$(mktemp)
        printf '%s\n' '# Written by CIRSEC Baselines CB-DEB-AUTH-005' 'Defaults use_pty' \
          "Defaults logfile=\"$CB_LOG_FILE\"" "Defaults timestamp_timeout=$CB_TIMESTAMP_TIMEOUT" >"$t"
        if ! visudo -cqf "$t"; then rm -f "$t"; echo "invalid sudoers drop-in" >&2; exit 1; fi
        cb_backup "$f"
        install -m 0440 -o root -g root "$t" "$f"
        rm -f "$t"

references:
