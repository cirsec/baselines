    relation: related
  - framework: cis-debian-12
    framework_version: "2.0.0"
    id: "6.1.1.1.3"
    relation: stricter
    note: Ours also turns forwarding off when rsyslog is absent.
  - framework: cis-debian-13
    framework_version: "1.1.0"
    id: "6.1.1.1.3"
    relation: stricter
    note: Ours also turns forwarding off when rsyslog is absent.
