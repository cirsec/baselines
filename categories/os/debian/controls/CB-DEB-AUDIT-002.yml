    github: Sn0wAlice
verified:
  - date: 2026-10-18
    by: Sn0wAlice
    versions: ["12"]
    environment: Proxmox VM, Debian 12 genericcloud image, kernel 6.1.0-54-cloud-amd64, BIOS boot
    notes: "Passes on fresh install (no rsyslog, default no); after installing rsyslog fails, fix writes ForwardToSyslog=yes and passes."
  - date: 2026-10-18
    by: Sn0wAlice
    versions: ["13"]
    environment: Proxmox VM, Debian 13 genericcloud image, kernel 6.12.113+deb13-cloud-amd64, BIOS boot
    notes: "Fails on fresh install (vendor syslog.conf sets yes without rsyslog); fix masks it with no; with rsyslog installed the fix sets yes."
introduced_in: 0.1.0
