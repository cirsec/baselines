# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-NET-022
title: Protect the SSH server configuration and host keys
finding:
  title: SSH server configuration or host keys can be read or changed by non-root users
  description: A readable host private key lets an attacker impersonate the server; a writable configuration lets anyone open it wider.
status: draft
profiles: [core]
risk:
  severity: high
assessment: automated
tags: [ssh, permissions, keys]

applicability:
  facts: [openssh-server]

description: |
  The OpenSSH server reads its configuration from `/etc/ssh/sshd_config` and the drop-in files
  of `/etc/ssh/sshd_config.d/`, and proves its identity with the host private keys
  `/etc/ssh/ssh_host_*_key`. This control requires all of them to belong to `root:root`, the
  configuration and private keys with mode `0600` at most, the drop-in directory `0755` at most,
  and the public keys `0644` at most.
rationale: |
  A copy of a host private key lets an attacker on the network path pose as the server without
  any warning on the clients, and collect passwords or hijack sessions. Write access to the
  configuration is equivalent to root access at the next reload. Read access shows which
  accounts and methods are allowed, which helps target an attack.
impact: |
  Users other than root can no longer read `sshd_config`; `sshd -T` already needs root.
notes: |
  Debian creates host private keys with mode `0600` and `sshd_config` with `0644`. Files written
  by the other SSH fixes of this standard (`00-cirsec.conf`) are covered too, which is why this
  control comes last among them.

setting:
  location: /etc/ssh/
  default_value: sshd_config 0644, private keys 0600, public keys 0644
  recommended_value: root:root; sshd_config and drop-ins 0600, private keys 0600, public keys 0644

audit:
  manual: |
    Run `stat -c '%n %U:%G %a' /etc/ssh/sshd_config /etc/ssh/sshd_config.d /etc/ssh/sshd_config.d/*.conf /etc/ssh/ssh_host_*`.
    Every entry must be `root:root`; `sshd_config`, the `.conf` drop-ins and the private keys at
    most `600`, the directory at most `755`, the `.pub` files at most `644`.
  checks:
    - id: sshd-config
      engine: file-perms
      description: Main SSH server configuration.
      spec: { path: /etc/ssh/sshd_config, owner: root, group: root, mode: "0600" }
    - id: dropin-dir
      engine: file-perms
      description: Drop-in configuration directory.
      spec: { path: /etc/ssh/sshd_config.d, owner: root, group: root, mode: "0755" }
    - id: dropins
      engine: file-perms
      description: Drop-in configuration files.
      spec: { path: /etc/ssh/sshd_config.d/*.conf, owner: root, group: root, mode: "0600" }
    - id: private-keys
      engine: file-perms
      description: Host private keys.
      spec: { path: /etc/ssh/ssh_host_*_key, owner: root, group: root, mode: "0600" }
    - id: public-keys
      engine: file-perms
      description: Host public keys.
      spec: { path: /etc/ssh/ssh_host_*_key.pub, owner: root, group: root, mode: "0644" }

remediation:
  manual: |
    ```
    chown root:root /etc/ssh/sshd_config /etc/ssh/sshd_config.d /etc/ssh/sshd_config.d/*.conf /etc/ssh/ssh_host_*
    chmod 600 /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf /etc/ssh/ssh_host_*_key
    chmod go-w /etc/ssh/sshd_config.d
    chmod 644 /etc/ssh/ssh_host_*_key.pub
    ```
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  rollback: |
    Restore the previous modes with `chmod 644 /etc/ssh/sshd_config` (Debian default).
  scripts:
    - id: sshd-config
      from_check: sshd-config
    - id: dropin-dir
      from_check: dropin-dir
    - id: dropins
      from_check: dropins
    - id: private-keys
      from_check: private-keys
    - id: public-keys
      from_check: public-keys

references:
