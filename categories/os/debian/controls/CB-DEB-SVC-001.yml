# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-SVC-001
title: Disable DHCP and DNS server services the system does not provide
finding:
  title: DHCP or DNS server services can run on a system that does not provide them
  description: An unneeded DHCP or DNS server answers on the network and can hand out wrong addresses or names.
status: active
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [services, dhcp, dns, attack-surface]

description: |
  Debian packages several network infrastructure servers:

  - DHCP: `isc-dhcp-server` (`isc-dhcp-server`, `isc-dhcp-server6`) and Kea (`kea-dhcp4-server`,
    `kea-dhcp6-server`, `kea-dhcp-ddns-server`);
  - DNS: BIND (`named`);
  - dnsmasq, a combined DNS forwarder and DHCP server (`dnsmasq`).

  The control passes when each unit is masked or not installed at all.
rationale: |
  These daemons answer requests from any host on the network. A rogue or forgotten DHCP or DNS
  server can redirect clients to an attacker, and every running daemon is code that can be
  exploited remotely.
impact: |
  Masking a unit stops it and prevents it from starting again, even as a dependency. Systems
  whose role is to provide DHCP or DNS must exclude this control in their tailoring file.
  The dnsmasq binary used by libvirt or NetworkManager (`dnsmasq-base`) is not affected: only the
  stand-alone `dnsmasq` service is masked.
notes: |
  The check reads `systemctl is-enabled`: a unit that does not exist counts as compliant, so
  removing the package (`apt purge`) is an equally valid fix. The packages are not installed on
  a default Debian install.

audit:
  manual: |
    For each unit, run `systemctl is-enabled <unit>`. It must print `masked`, or fail because the
    unit does not exist: `isc-dhcp-server.service`, `isc-dhcp-server6.service`,
    `kea-dhcp4-server.service`, `kea-dhcp6-server.service`, `kea-dhcp-ddns-server.service`,
    `named.service`, `dnsmasq.service`.
  logic: all
  checks:
    - id: isc-dhcp-server
      engine: systemd-unit
      description: ISC DHCPv4 server.
      spec: { unit: isc-dhcp-server.service, state: masked }
    - id: isc-dhcp-server6
      engine: systemd-unit
      description: ISC DHCPv6 server.
      spec: { unit: isc-dhcp-server6.service, state: masked }
    - id: kea-dhcp4
      engine: systemd-unit
      description: Kea DHCPv4 server.
      spec: { unit: kea-dhcp4-server.service, state: masked }
    - id: kea-dhcp6
      engine: systemd-unit
      description: Kea DHCPv6 server.
      spec: { unit: kea-dhcp6-server.service, state: masked }
    - id: kea-dhcp-ddns
      engine: systemd-unit
      description: Kea dynamic DNS update server.
      spec: { unit: kea-dhcp-ddns-server.service, state: masked }
    - id: named
      engine: systemd-unit
      description: BIND DNS server.
      spec: { unit: named.service, state: masked }
    - id: dnsmasq
      engine: systemd-unit
      description: dnsmasq DNS and DHCP server.
      spec: { unit: dnsmasq.service, state: masked }

remediation:
  manual: |
    Stop and mask each unit that is installed: `systemctl mask --now <unit>`. If the package is not
    needed at all, remove it instead: `apt purge isc-dhcp-server kea-dhcp4-server kea-dhcp6-server
    kea-dhcp-ddns-server bind9 dnsmasq`.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Run `systemctl unmask <unit>` then `systemctl enable --now <unit>`.
  scripts:
    - id: isc-dhcp-server
      from_check: isc-dhcp-server
    - id: isc-dhcp-server6
      from_check: isc-dhcp-server6
    - id: kea-dhcp4
      from_check: kea-dhcp4
    - id: kea-dhcp6
      from_check: kea-dhcp6
    - id: kea-dhcp-ddns
      from_check: kea-dhcp-ddns
    - id: named
      from_check: named
    - id: dnsmasq
      from_check: dnsmasq

