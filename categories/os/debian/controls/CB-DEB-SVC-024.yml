# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-SVC-024
title: Remove the X Window System server from servers
finding:
  title: An X Window System server is installed on a server
  description: A graphical server stack adds a large amount of privileged, rarely needed code.
status: active
profiles: [server-hardened]
risk:
  severity: low
assessment: automated
tags: [packages, x11, attack-surface]

description: |
  `xserver-common` holds the files shared by every X.Org server (Xorg, Xvfb, Xephyr...). When it
  is absent, no X server is installed.
rationale: |
  An X server is complex software, historically run with root privileges, with a long record of
  local privilege escalation flaws. A server administered over SSH does not need it.
impact: |
  Removes `xserver-common` and every package that depends on it: X servers, and the graphical
  desktop if one is installed. X client applications forwarded over SSH (`ssh -X`) still work,
  since they use the X server of the administrator's workstation.
notes: |
  The control is only in the hardened server profile; desktops need an X server or Xwayland.

audit:
  manual: |
    Run `dpkg-query -W -f='${Status}\n' xserver-common`. It must not print `install ok installed`.
  checks:
    - id: xserver-common
      engine: package
      description: X.Org server common files.
      spec: { name: xserver-common, state: absent }

remediation:
  manual: |
    Run `apt purge xserver-common` after checking the list of packages apt will remove.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Reinstall the needed X server, for example `apt install xserver-xorg-core`.
  scripts:
    - id: xserver-common
      from_check: xserver-common

references:
  - title: Xserver(1), Debian manual pages
    url: https://manpages.debian.org/trixie/xserver-common/Xserver.1.en.html
    publisher: Debian
    kind: vendor-doc
    accessed: 2026-10-18
  - title: ANSSI-BP-028 v2.0 - Recommandations de configuration d'un système GNU/Linux (R58)
    url: https://messervices.cyber.gouv.fr/documents-guides/fr_np_linux_configuration-v2.0.pdf
    publisher: ANSSI
    kind: guide
    accessed: 2026-10-18
