id: CB-DEB-BOOT-003
title: Restrict the kernel log buffer to privileged users
finding:
  title: Unprivileged users can read the kernel log buffer
  description: The kernel log can reveal addresses, hardware details and errors useful to an attacker.
status: draft
profiles: [core]
risk:
  severity: low
assessment: automated
tags: [kernel, sysctl, information-disclosure]

description: |
  The `kernel.dmesg_restrict` sysctl controls who can read the kernel ring buffer with
  `dmesg` or `/dev/kmsg`. With `1`, only processes with the `CAP_SYSLOG` capability can read it.
rationale: |
  Kernel messages often contain memory addresses, driver and firmware versions, and traces of
  failed operations. Reading them helps a local attacker tune a kernel exploit.
impact: |
  Unprivileged users can no longer run `dmesg`. Administrators use `sudo dmesg` or
  `journalctl -k`, which needs membership of the `adm` or `systemd-journal` group.
notes: |
  Debian kernels are built with this restriction on by default, so the check usually passes
  on a fresh install. The control guards against it being turned off.

setting:
  location: sysctl `kernel.dmesg_restrict`, persisted in `/etc/sysctl.d/`
  default_value: "1"
  recommended_value: "1"

audit:
  manual: |
    Run `sysctl kernel.dmesg_restrict`. The value must be `1`.
    Then check that no sysctl configuration file sets it to `0`.
  checks:
    - id: running
      engine: sysctl
      description: Running value of kernel.dmesg_restrict.
      spec: { key: kernel.dmesg_restrict, value: 1 }

remediation:
  manual: |
    Create `/etc/sysctl.d/60-cirsec.conf` containing `kernel.dmesg_restrict = 1`,
    remove any other assignment of this key, then run `sysctl --system`.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Remove the line from `/etc/sysctl.d/60-cirsec.conf` and run `sysctl -w kernel.dmesg_restrict=0`.
  scripts:
    - id: set
      from_check: running

references:
  - title: Linux kernel documentation - Documentation for /proc/sys/kernel/ (dmesg_restrict)
    url: https://docs.kernel.org/admin-guide/sysctl/kernel.html
    publisher: The Linux Kernel Organization
    kind: vendor-doc
    accessed: 2026-10-18
