    url: https://manpages.debian.org/trixie/dovecot-core/dovecot.1.en.html
    publisher: Debian
    kind: vendor-doc
    accessed: 2026-10-18
  - title: systemctl(1), Debian manual pages
    url: https://manpages.debian.org/trixie/systemd/systemctl.1.en.html
    publisher: Debian
    kind: vendor-doc
    accessed: 2026-10-18
  - title: ANSSI-BP-028 v2.0 - Recommandations de configuration d'un système GNU/Linux (R62)
    url: https://messervices.cyber.gouv.fr/documents-guides/fr_np_linux_configuration-v2.0.pdf
    publisher: ANSSI
    kind: guide
    accessed: 2026-10-18
