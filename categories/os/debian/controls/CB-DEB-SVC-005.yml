# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-SVC-005
title: Disable IMAP and POP3 mail access servers the system does not provide
finding:
  title: An IMAP or POP3 server can run on a system that does not provide mailboxes
  description: A mail access server accepts user passwords from the network and exposes stored mail.
status: draft
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [services, mail, imap, pop3, attack-surface]

description: |
  IMAP and POP3 servers let mail clients read mailboxes stored on the system. Debian packages
  Dovecot (`dovecot.service` and `dovecot.socket`) and Cyrus (`cyrus-imapd.service`).

  The control passes when each unit is masked or not installed at all.
rationale: |
  These servers authenticate users with their passwords, so they are a target for password
  guessing, and a flaw in them exposes every mailbox on the system.
impact: |
  Masking a unit stops it and prevents it from starting again. Sending mail through the local
  mail transfer agent is not affected. Mail servers must exclude this control in their
  tailoring file.
notes: |
  A unit that does not exist counts as compliant, so removing the package is an equally valid fix.

audit:
  manual: |
    For each unit, run `systemctl is-enabled <unit>`. It must print `masked`, or fail because the
    unit does not exist: `dovecot.service`, `dovecot.socket`, `cyrus-imapd.service`.
  logic: all
  checks:
    - id: dovecot
      engine: systemd-unit
      description: Dovecot IMAP and POP3 server.
      spec: { unit: dovecot.service, state: masked }
    - id: dovecot-socket
      engine: systemd-unit
      description: Dovecot socket activation.
      spec: { unit: dovecot.socket, state: masked }
    - id: cyrus-imapd
      engine: systemd-unit
      description: Cyrus IMAP and POP3 server.
      spec: { unit: cyrus-imapd.service, state: masked }

remediation:
  manual: |
    Stop and mask each unit that is installed: `systemctl mask --now <unit>`. If the package is not
    needed at all, remove it instead: `apt purge dovecot-core cyrus-imapd cyrus-common`.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Run `systemctl unmask <unit>` then `systemctl enable --now <unit>`.
  scripts:
    - id: dovecot-socket
      from_check: dovecot-socket
    - id: dovecot
      from_check: dovecot
    - id: cyrus-imapd
      from_check: cyrus-imapd

references:
