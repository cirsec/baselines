id: CB-DEB-AUTH-021
title: Do not list nologin as a valid shell
finding:
  title: nologin is declared as a valid login shell
  description: Programs that only allow accounts with a valid shell (FTP servers, chsh) treat no-login accounts as normal ones.
status: draft
profiles: [server-hardened, desktop-hardened]
risk:
  severity: low
assessment: automated
tags: [accounts, shells]

description: |
  `/etc/shells` lists the valid login shells. Some programs, like `chsh` and FTP servers, use it
  to decide whether an account may log in. `nologin` exists precisely to refuse logins and must
  not appear there.
rationale: |
  Listing `nologin` makes service accounts look like regular users to programs that rely on
  `/etc/shells`, which can open them to FTP logins or let users switch to it and back.
impact: |
  None known. Debian does not list it by default.

audit:
  manual: |
    Run `grep nologin /etc/shells`. There must be no match.
  checks:
    - id: shells
      engine: file-content
      spec: { path: /etc/shells, pattern: "nologin", expect: no_match }

remediation:
  manual: |
    Remove the `nologin` lines from `/etc/shells`.
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  scripts:
    - id: remove
      engine: shell
      content: |
        cb_backup /etc/shells
        sed -i '/nologin/d' /etc/shells

references:
  - title: shells(5), Debian manual pages
    url: https://manpages.debian.org/trixie/manpages/shells.5.en.html
    publisher: Debian
    kind: vendor-doc
    accessed: 2026-10-18
