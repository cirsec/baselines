# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-SVC-009
title: Disable the Squid web proxy on systems that are not proxy servers
finding:
  title: A web proxy can run on a system that is not a proxy server
  description: An open or forgotten proxy relays traffic for others and hides its origin.
status: draft
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [services, proxy, http, attack-surface]

description: |
  Squid (`squid.service`) is the HTTP caching proxy packaged by Debian.

  The control passes when the unit is masked or not installed at all.
rationale: |
  A proxy relays connections for its clients. A misconfigured one lets outsiders reach internal
  systems or use the host to hide attacks, and its cache can hold sensitive responses.
impact: |
  Masking the unit stops it and prevents it from starting again. Proxy servers must exclude this
  control in their tailoring file.
notes: |
  A unit that does not exist counts as compliant, so removing the package is an equally valid fix.

audit:
  manual: |
    Run `systemctl is-enabled squid.service`. It must print `masked`, or fail because the unit does
    not exist.
  checks:
    - id: squid
      engine: systemd-unit
      description: Squid proxy server.
      spec: { unit: squid.service, state: masked }

remediation:
  manual: |
    Run `systemctl mask --now squid.service`, or `apt purge squid` if the package is not needed.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Run `systemctl unmask squid.service` then `systemctl enable --now squid.service`.
  scripts:
    - id: squid
      from_check: squid

references:
