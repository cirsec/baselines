  - framework: cis-debian-12
    framework_version: "2.0.0"
    id: "1.2.1.6"
    relation: stricter
    note: Files must not be readable by their group either (0600).
  - framework: cis-debian-13
    framework_version: "1.1.0"
    id: "1.2.1.5"
    relation: equivalent
  - framework: cis-debian-13
    framework_version: "1.1.0"
    id: "1.2.1.6"
    relation: stricter
    note: Files must not be readable by their group either (0600).
