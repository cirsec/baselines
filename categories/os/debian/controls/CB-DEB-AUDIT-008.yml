id: CB-DEB-AUDIT-008
title: Send system logs to a remote log server
finding:
  title: System logs are only stored on the system that produced them
  description: An intruder with root access can erase the local logs, and a lost disk takes the history with it.
status: draft
profiles: [core]
risk:
  severity: medium
assessment: manual
tags: [logging, remote, journald, rsyslog]

description: |
  A copy of the logs must leave the system as they are produced, to a log server or a central
  collection platform the system cannot modify. On Debian, two ways fit the chosen logging system:

  - with the journal alone, `systemd-journal-upload` (package `systemd-journal-remote`) sends the
    journal over HTTPS to a `systemd-journal-remote` server;
  - with rsyslog, an `omfwd` action sends messages over TCP, preferably with TLS
    (CB-DEB-AUDIT-009).
rationale: |
  Remote logs survive the compromise or loss of the system and are the reference when local logs
  have been altered. They also allow correlating events across systems.
impact: |
  Requires a log server and network flows to it. Messages are queued when the server is
  unreachable; size the queue so a long outage does not fill the disk.

audit:
  manual: |
    1. With the journal alone: run `systemctl is-active systemd-journal-upload` and check `URL=` in
       `systemd-analyze cat-config systemd/journal-upload.conf`.
    2. With rsyslog: look for an `action(type="omfwd" target=...)` or `@@host` line with
       `grep -Er 'omfwd|^\s*[^#].*@@?' /etc/rsyslog.conf /etc/rsyslog.d/`.
    3. Confirm on the log server that recent messages from this system have arrived.

remediation:
  manual: |
    1. With the journal alone: install `systemd-journal-remote`, set `URL=https://<server>:19532`
       and the client certificate in `/etc/systemd/journal-upload.conf.d/`, then run
       `systemctl enable --now systemd-journal-upload`.
    2. With rsyslog: add to `/etc/rsyslog.d/60-remote.conf`:
       ```
       *.* action(type="omfwd" target="<server>" port="6514" protocol="tcp"
                  StreamDriver="gtls" StreamDriverMode="1" StreamDriverAuthMode="x509/name"
                  queue.type="LinkedList" queue.filename="fwd" queue.saveOnShutdown="on"
                  action.resumeRetryCount="-1")
       ```
       then run `systemctl restart rsyslog`.
  rollback: |
    Disable `systemd-journal-upload`, or remove the forwarding file and restart rsyslog.

