# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-SVC-014
title: Run exactly one time synchronization daemon
finding:
  title: The system clock is not synchronized, or several daemons fight over it
  description: Wrong timestamps break log correlation, certificate checks and Kerberos; two daemons make the clock jump.
status: active
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [time, ntp, chrony, timesyncd]

description: |
  Debian ships several NTP clients: `systemd-timesyncd` (the default on most installs), `chrony`,
  `chronyd-restricted` (Debian 13), `ntpsec` and `openntpd`. Exactly one of them must be active.
rationale: |
  Logs, audit trails and authentication protocols rely on accurate time. With no daemon the
  clock drifts; with two, each corrects the other and the clock jumps, which corrupts timelines
  during an investigation.
impact: |
  None known when one daemon is already active, which is the Debian default.
notes: |
  The Debian packages conflict with each other, so two daemons rarely coexist; the usual failure
  is no daemon at all, for example in a container where `systemd-timesyncd` does not start
  (the host keeps the time). Containers can exclude this control in their tailoring file. The
  daemon's own settings are checked by CB-DEB-SVC-015 (timesyncd) and CB-DEB-SVC-016 (chrony).

audit:
  manual: |
    Run `systemctl is-active chrony chronyd-restricted systemd-timesyncd ntpsec openntpd`. Exactly
    one line must print `active`.
  checks:
    - id: single-daemon
      engine: shell
      description: Number of active time synchronization daemons.
      spec:
        script: |
          n=0 act=
          for u in chrony chronyd-restricted systemd-timesyncd ntpsec openntpd; do
            if systemctl is-active --quiet "$u.service" 2>/dev/null; then
              n=$((n + 1)) act="$act $u"
            fi
          done
          echo "active:${act:- none}"
          [ "$n" -eq 1 ]

remediation:
  manual: |
    - No daemon: run `systemctl enable --now systemd-timesyncd`, or `apt install chrony`.
    - Several daemons: keep one, then `systemctl mask --now <unit>` for the others or purge their
      packages.

