# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-NET-013
title: Restrict ARP answers and ignore gratuitous ARP
finding:
  title: The kernel answers and accepts ARP messages beyond what the local network needs
  description: Permissive ARP handling helps an attacker on the local network to map the host and poison its neighbour table.
status: draft
profiles: [server-hardened, desktop-hardened]
risk:
  severity: low
assessment: automated
tags: [sysctl, network, arp]

description: |
  These kernel settings limit how IPv4 hosts on the same link can influence the system through
  ARP:

  - `arp_filter = 1`: answer an ARP request only on the interface the reply would be routed
    through;
  - `arp_ignore = 2`: answer only when the requested address is configured on the receiving
    interface and the sender is in the same subnet;
  - `drop_gratuitous_arp = 1`: ignore unsolicited ARP announcements;
  - `shared_media = 0` (`all` and `default`): do not send ICMP redirects between subnets sharing
    the same link.
rationale: |
  ARP has no authentication. Answering on every interface leaks the host's addresses across
  networks, and accepting gratuitous ARP lets anyone on the link redirect the host's traffic to
  their own machine (ARP poisoning).
impact: |
  Ignoring gratuitous ARP delays the takeover of a virtual IP address by its standby (VRRP,
  keepalived, Pacemaker) until the neighbour entry expires, including for the default gateway.
  `arp_ignore = 2` breaks hosts that answer for addresses of other subnets on one interface. This
  is why the control is limited to the hardened profiles.
notes: |
  ANSSI lists these settings for every host; they are hardened-only here because of their side
  effects on high availability setups.

setting:
  location: sysctl `net.ipv4.conf.all.{arp_filter,arp_ignore,drop_gratuitous_arp}`, `net.ipv4.conf.{all,default}.shared_media`, persisted in `/etc/sysctl.d/`
  default_value: 0, 0, 0, 1
  recommended_value: 1, 2, 1, 0

audit:
  manual: |
    Run `sysctl net.ipv4.conf.all.arp_filter net.ipv4.conf.all.arp_ignore net.ipv4.conf.all.drop_gratuitous_arp net.ipv4.conf.all.shared_media net.ipv4.conf.default.shared_media`.
    The values must be `1`, `2`, `1`, `0` and `0`. Check that no sysctl file sets other values.
  checks:
    - id: arp-filter
      engine: sysctl
      description: net.ipv4.conf.all.arp_filter.
      spec: { key: net.ipv4.conf.all.arp_filter, value: 1 }
    - id: arp-ignore
      engine: sysctl
      description: net.ipv4.conf.all.arp_ignore.
      spec: { key: net.ipv4.conf.all.arp_ignore, value: 2 }
    - id: drop-gratuitous-arp
      engine: sysctl
      description: net.ipv4.conf.all.drop_gratuitous_arp.
      spec: { key: net.ipv4.conf.all.drop_gratuitous_arp, value: 1 }
    - id: all-shared-media
      engine: sysctl
      description: net.ipv4.conf.all.shared_media.
      spec: { key: net.ipv4.conf.all.shared_media, value: 0 }
    - id: default-shared-media
      engine: sysctl
      description: net.ipv4.conf.default.shared_media.
      spec: { key: net.ipv4.conf.default.shared_media, value: 0 }

remediation:
  manual: |
    Add to `/etc/sysctl.d/60-cirsec.conf`:
    ```
    net.ipv4.conf.all.arp_filter = 1
    net.ipv4.conf.all.arp_ignore = 2
    net.ipv4.conf.all.drop_gratuitous_arp = 1
    net.ipv4.conf.all.shared_media = 0
    net.ipv4.conf.default.shared_media = 0
    ```
    remove other assignments, then run `sysctl --system`.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Remove the lines from `/etc/sysctl.d/60-cirsec.conf` and set the previous values with `sysctl -w`.
  scripts:
    - id: arp-filter
      from_check: arp-filter
    - id: arp-ignore
      from_check: arp-ignore
    - id: drop-gratuitous-arp
      from_check: drop-gratuitous-arp
    - id: all-shared-media
      from_check: all-shared-media
    - id: default-shared-media
      from_check: default-shared-media

references:
