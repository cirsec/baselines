# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-AUTH-019
title: Set a restrictive default umask for login sessions
finding:
  title: New files are readable by every local user by default
  description: With the Debian default umask, documents, exports and logs created by users and root are world-readable.
status: draft
profiles: [core]
risk:
  severity: low
assessment: automated
tags: [accounts, umask, permissions]

description: |
  The umask removes permission bits from every file and directory a process creates. Debian
  login sessions get `022` (files `644`, everyone can read them); on Debian 13, `pam_umask` with
  `USERGROUPS_ENAB` even gives regular users `002`. This control sets `{{ umask }}` from
  `/etc/profile.d/`, which applies to the login shells of every user, root included.
rationale: |
  Users and administrators regularly create files with sensitive content (exports, dumps,
  configuration copies) in their home or in `/tmp`. A restrictive umask keeps them private
  unless someone opens them on purpose.
impact: |
  Files created in shared directories are no longer readable by other users. Teams that share
  files through a common group need `chmod g+r` or a setgid group directory.
notes: |
  Services started by systemd do not read `/etc/profile`; set their umask with `UMask=` in their unit.

setting:
  location: /etc/profile.d/60-cirsec-umask.sh
  default_value: "022"
  recommended_value: "{{ umask }}"

parameters:
  - name: umask
    type: enum
    description: Default umask of login shells.
    default: "027"
    allowed: ["027", "077"]
    profile_defaults:
      server-hardened: "077"

audit:
  manual: |
    Run `su -s /bin/sh -l nobody -c umask` and `su -l root -c umask`. Both must print
    `0{{ umask }}` (or a stricter value).
  checks:
    - id: user
      engine: shell
      description: Umask of a login shell for a regular account.
      spec:
        script: |
          u=$(su -s /bin/sh -l nobody -c umask 2>/dev/null | tail -n 1) || exit 3
          echo "nobody login umask: $u"
          [ $(( 0$u & 0$CB_UMASK )) -eq $(( 0$CB_UMASK )) ]
    - id: root
      engine: shell
      description: Umask of a root login shell.
      spec:
        script: |
          u=$(su -l root -c umask 2>/dev/null | tail -n 1) || exit 3
          echo "root login umask: $u"
          [ $(( 0$u & 0$CB_UMASK )) -eq $(( 0$CB_UMASK )) ]

remediation:
  manual: |
    Create `/etc/profile.d/60-cirsec-umask.sh` containing `umask {{ umask }}`. New login sessions
    pick it up.
  effects:
    restart: session
    disruption: low
    lockout_risk: false
  rollback: |
    Delete `/etc/profile.d/60-cirsec-umask.sh`.
  scripts:
    - id: profile
      engine: shell
      content: |
        f=/etc/profile.d/60-cirsec-umask.sh
        cb_backup "$f"
        printf '%s\n' '# Written by CIRSEC Baselines CB-DEB-AUTH-019' "umask $CB_UMASK" >"$f"
        chmod 644 "$f"

references:
