# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-SVC-023
title: Disable the CUPS print server and printer discovery
finding:
  title: The CUPS print service runs on a system that does not print
  description: CUPS and cups-browsed parse print jobs and printer announcements, and have had remotely exploitable flaws.
status: draft
profiles: [server, desktop-hardened]
risk:
  severity: medium
assessment: automated
tags: [services, cups, printing, attack-surface]

description: |
  CUPS is started by `cups.service`, `cups.socket` and `cups.path`; `cups-browsed.service`
  discovers network printers and adds them automatically.

  The control passes when each unit is masked or not installed at all.
rationale: |
  The print stack parses complex documents and network announcements. Flaws in `cups-browsed`
  have allowed remote code execution by announcing a malicious printer. Servers rarely print.
impact: |
  The system can no longer print, and network printers are no longer discovered. Print servers
  and desktops that print keep CUPS: the control is only in the server and hardened desktop
  profiles, and can be excluded in the tailoring file.
notes: |
  The socket and path units can start `cupsd` on their own, so they are masked too.

audit:
  manual: |
    Run `systemctl is-enabled cups.service cups.socket cups.path cups-browsed.service`. Each must
    print `masked`, or fail because the unit does not exist.
  logic: all
  checks:
    - id: cups-browsed
      engine: systemd-unit
      description: Printer discovery daemon.
      spec: { unit: cups-browsed.service, state: masked }
    - id: cups-socket
      engine: systemd-unit
      description: CUPS socket activation.
      spec: { unit: cups.socket, state: masked }
    - id: cups-path
      engine: systemd-unit
      description: CUPS path activation.
      spec: { unit: cups.path, state: masked }
    - id: cups
      engine: systemd-unit
      description: CUPS scheduler.
      spec: { unit: cups.service, state: masked }

remediation:
  manual: |
    Run `systemctl mask --now cups-browsed.service cups.socket cups.path cups.service`, or
    `apt purge cups cups-daemon cups-browsed` if nothing depends on them.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    Run `systemctl unmask cups-browsed.service cups.socket cups.path cups.service` then
    `systemctl enable --now cups.service cups-browsed.service`.
  scripts:
    - id: cups-browsed
      from_check: cups-browsed
    - id: cups-socket
      from_check: cups-socket
    - id: cups-path
      from_check: cups-path
    - id: cups
      from_check: cups

references:
