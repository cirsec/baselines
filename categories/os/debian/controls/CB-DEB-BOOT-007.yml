id: CB-DEB-BOOT-007
title: Protect hard links to files the user does not own
finding:
  title: Users can create hard links to files they do not own
  description: Hard links to privileged files enable link-based races and keep vulnerable binaries reachable after an update.
status: draft
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [kernel, sysctl, filesystem, toctou]

description: |
  With `fs.protected_hardlinks = 1`, a user can only create a hard link to a file they own, or
  to a file they can both read and write. Linking to other files needs the `CAP_FOWNER` capability.
rationale: |
  Hard links to files owned by other users enable races similar to symlink attacks. They also
  let an attacker keep a copy of a vulnerable setuid binary that survives its replacement by a
  package update, and exploit it later.
impact: |
  None known for normal use. Tools that hard link files they do not own (some backup or
  deduplication tools run as a regular user) must run with the needed privileges.
notes: |
  Debian enables it by default: through `/usr/lib/sysctl.d/99-protect-links.conf` (procps) on
  Debian 12, and through `/usr/lib/sysctl.d/50-default.conf` (linux-sysctl-defaults) on Debian 13.

setting:
  location: sysctl `fs.protected_hardlinks`, persisted in `/etc/sysctl.d/`
  default_value: "1"
  recommended_value: "1"

audit:
  manual: |
    Run `sysctl fs.protected_hardlinks`. The value must be `1`.
    Then check that no sysctl configuration file sets it to `0`.
  checks:
    - id: running
      engine: sysctl
      description: Running value of fs.protected_hardlinks.
      spec: { key: fs.protected_hardlinks, value: 1 }

remediation:
  manual: |
    Create `/etc/sysctl.d/60-cirsec.conf` containing `fs.protected_hardlinks = 1`,
    remove any other assignment of this key, then run `sysctl --system`.
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  rollback: |
    Remove the line from `/etc/sysctl.d/60-cirsec.conf` and run `sysctl --system`.
  scripts:
    - id: set
      from_check: running

references:
  - title: Linux kernel documentation - Documentation for /proc/sys/fs/ (protected_hardlinks)
    url: https://docs.kernel.org/admin-guide/sysctl/fs.html
    publisher: The Linux Kernel Organization
