# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-NET-008
title: Restrict access to firewall and IPsec configuration files
finding:
  title: Firewall or IPsec configuration files can be changed or read by non-root users
  description: Whoever can write the firewall rules can open the host at the next reload; whoever can read IPsec secrets can impersonate the host in its VPN.
status: draft
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [firewall, ipsec, permissions]

description: |
  The rules loaded at boot by ufw (`/etc/ufw/*.rules`), nftables (`/etc/nftables.conf`) and
  iptables-persistent (`/etc/iptables/rules.v4`, `rules.v6`), and the IPsec configuration
  (`/etc/ipsec.conf`, `/etc/ipsec.d/`, `/etc/ipsec.secrets`) must belong to root and must not be
  writable by other users. IPsec secrets and private keys must only be readable by root.
  Each check is not applicable when its files are absent.
rationale: |
  These files decide what reaches the host and with which keys VPN tunnels are authenticated. A
  writable rules file is a firewall bypass waiting for the next reboot; a readable pre-shared key
  or private key lets an attacker set up a rogue tunnel endpoint.
impact: |
  None known. Packages create these files with stricter or equal permissions.

setting:
  location: /etc/ufw, /etc/nftables.conf, /etc/iptables, /etc/ipsec.*
  recommended_value: Owned by root, rules at most 0644 (nftables.conf 0755), secrets and private keys 0600/0700

audit:
  manual: |
    Run `stat -c '%n %U:%G %a' /etc/ufw/*.rules /etc/nftables.conf /etc/iptables/rules.v* /etc/ipsec.conf /etc/ipsec.d /etc/ipsec.d/private /etc/ipsec.secrets 2>/dev/null`.
    Every file must be owned by root:root; `ipsec.secrets` at most 0600, `ipsec.d/private` at most
    0700, `nftables.conf` at most 0755, the others at most 0644 (0755 for the `ipsec.d` directory).
  checks:
    - id: ufw-rules
      engine: file-perms
      description: ufw rules files.
      spec: { path: /etc/ufw/*.rules, owner: root, group: root, mode: "0644" }
    - id: nftables-conf
      engine: file-perms
      description: nftables configuration loaded at boot.
      spec: { path: /etc/nftables.conf, owner: root, group: root, mode: "0755" }
    - id: iptables-rules
      engine: file-perms
      description: Rules restored by iptables-persistent.
      spec: { path: /etc/iptables/rules.v*, owner: root, group: root, mode: "0644" }
    - id: ipsec-conf
      engine: file-perms
      description: IPsec main configuration.
      spec: { path: /etc/ipsec.conf, owner: root, group: root, mode: "0644" }
    - id: ipsec-dir
      engine: file-perms
      description: IPsec configuration directory.
      spec: { path: /etc/ipsec.d, owner: root, group: root, mode: "0755" }
    - id: ipsec-private
      engine: file-perms
      description: IPsec private keys directory.
      spec: { path: /etc/ipsec.d/private, owner: root, group: root, mode: "0700" }
    - id: ipsec-secrets
      engine: file-perms
      description: IPsec pre-shared keys and private key passphrases.
      spec: { path: /etc/ipsec.secrets, owner: root, group: root, mode: "0600" }

remediation:
  manual: |
    Run `chown root:root` on the files listed above, then `chmod 600 /etc/ipsec.secrets`,
    `chmod 700 /etc/ipsec.d/private`, `chmod go-w` on the others.
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  rollback: |
    Restore the previous owner and mode with `chown` and `chmod`.
  scripts:
    - id: ufw-rules
      from_check: ufw-rules
    - id: nftables-conf
      from_check: nftables-conf
    - id: iptables-rules
      from_check: iptables-rules
    - id: ipsec-conf
      from_check: ipsec-conf
    - id: ipsec-dir
      from_check: ipsec-dir
    - id: ipsec-private
      from_check: ipsec-private
    - id: ipsec-secrets
      from_check: ipsec-secrets

