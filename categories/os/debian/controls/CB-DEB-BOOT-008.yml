# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-BOOT-008
title: Install and enable AppArmor
finding:
  title: AppArmor mandatory access control is not active
  description: Without a mandatory access control system, a compromised service keeps every right of its Unix user.
status: draft
profiles: [core]
risk:
  severity: medium
assessment: automated
tags: [apparmor, mac, lsm]

description: |
  AppArmor is the mandatory access control (MAC) system of Debian. It confines programs with
  per-program profiles that list the files, capabilities and network access they may use, on top
  of the classic Unix permissions. It needs the `apparmor` package (parser and profiles) and the
  AppArmor security module enabled in the running kernel.
rationale: |
  Unix permissions only depend on the user a program runs as. A compromised service confined by
  an AppArmor profile cannot read or write outside what its profile allows, even as root, which
  limits what an attacker can do after exploiting it.
impact: |
  None known on a default install: Debian ships AppArmor enabled since Debian 10, and its
  profiles are written not to break the packaged programs.
notes: |
  AppArmor is enabled by the Debian kernel by default. If it was disabled with `apparmor=0` or a
  `security=` / `lsm=` kernel parameter, remove that parameter from `GRUB_CMDLINE_LINUX` in
  `/etc/default/grub`, run `update-grub` and reboot.

setting:
  location: Package `apparmor`; kernel security modules (`/sys/kernel/security/lsm`)
  default_value: Installed and enabled
  recommended_value: Installed and enabled

audit:
  manual: |
    1. Run `dpkg -s apparmor`. The package must be installed.
    2. Run `aa-enabled`. It must print `Yes`.
  checks:
    - id: package
      engine: package
      description: The apparmor package is installed.
      spec: { name: apparmor, state: installed }
    - id: enabled
      engine: file-content
      description: The AppArmor kernel module reports itself enabled.
      spec: { path: /sys/module/apparmor/parameters/enabled, pattern: "^Y$" }

remediation:
  manual: |
    1. Install the package: `apt install apparmor`.
    2. If `aa-enabled` still says it is disabled, remove `apparmor=0`, `security=` or `lsm=`
       from the kernel command line in `/etc/default/grub`, run `update-grub` and reboot.
  effects:
    restart: none
    disruption: low
    lockout_risk: false
  rollback: |
    AppArmor can be disabled for one boot with the `apparmor=0` kernel parameter.
  scripts:
    - id: install
      from_check: package

