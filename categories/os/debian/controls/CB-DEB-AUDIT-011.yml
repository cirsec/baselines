# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-DEB-AUDIT-011
title: Install and run the audit daemon
finding:
  title: The kernel audit records are not collected
  description: Without auditd, security relevant system calls, file changes and command runs are not recorded anywhere.
status: active
profiles: [server-hardened, desktop-hardened]
risk:
  severity: medium
assessment: automated
tags: [auditd]

description: |
  The Linux audit framework records events chosen by rules (system calls, file accesses, program
  runs) with the identity of the user who logged in. `auditd` (package `auditd`) receives these
  records from the kernel and writes them to `/var/log/audit/audit.log`; `audispd-plugins` adds
  the plugins that forward them (syslog, remote server). Neither is installed by default.

  This control requires both packages and the `auditd` service enabled and running.
rationale: |
  The audit log is the detailed, per-user record that investigations rely on after an intrusion.
  It is also required by the audit rules controls CB-DEB-AUDIT-016 to CB-DEB-AUDIT-029.
impact: |
  auditd uses a few megabytes of memory. The disk space used depends on the rules and on the
  activity; see CB-DEB-AUDIT-013 and CB-DEB-AUDIT-014.

setting:
  location: auditd and audispd-plugins packages, auditd.service
  default_value: Not installed
  recommended_value: Installed, auditd.service enabled and active

audit:
  manual: |
    1. Run `dpkg-query -W -f='${Package} ${Status}\n' auditd audispd-plugins`. Both must end with
       `installed`.
    2. Run `systemctl is-enabled auditd` and `systemctl is-active auditd`. They must print
       `enabled` and `active`.
  checks:
    - id: auditd
      engine: package
      description: auditd is installed.
      spec: { name: auditd, state: installed }
    - id: plugins
      engine: package
      description: audispd-plugins is installed.
      spec: { name: audispd-plugins, state: installed }
    - id: service
      engine: systemd-unit
      description: auditd.service is enabled.
      spec: { unit: auditd.service, state: enabled }

remediation:
  manual: |
    Run `apt-get install auditd audispd-plugins`, then `systemctl enable --now auditd`.
  effects:
    restart: none
    disruption: none
    lockout_risk: false
  rollback: |
    Run `apt-get purge auditd audispd-plugins`.
  scripts:
    - id: auditd
      from_check: auditd
    - id: plugins
      from_check: plugins
    - id: service
      from_check: service

