# yaml-language-server: $schema=../../../schema/standard.schema.json
id: debian
code: DEB
title: Debian GNU/Linux
description: Secure configuration baseline for Debian servers. Version-specific differences are handled per control with applicability.versions.
status: draft
version: 0.1.0
applies_to:
  - product: Debian GNU/Linux
    vendor: Debian
    versions: ["12", "13"]
profiles:
  - key: baseline
    title: Baseline
    description: Settings every server should apply. Low operational impact.
  - key: hardened
    title: Hardened
    description: Stronger settings for exposed or sensitive servers. May break some workloads.
    extends: baseline
domains:
  - code: BOOT
    title: Boot & kernel
  - code: AUTH
    title: Accounts & authentication
  - code: NET
    title: Network
  - code: SVC
    title: Services
  - code: FS
    title: Filesystem & permissions
  - code: AUDIT
    title: Logging & auditing
maintainers:
  - name: Alice
    github: Sn0wAlice
primary_sources:
  - title: Debian Security Manual
    url: https://www.debian.org/doc/manuals/securing-debian-manual/
    publisher: Debian
    kind: vendor-doc
  - title: ANSSI - Recommandations de sécurité relatives à un système GNU/Linux
    url: https://cyber.gouv.fr/publications/recommandations-de-securite-relatives-un-systeme-gnulinux
    publisher: ANSSI
    kind: guide
i18n:
  fr:
    title: Debian GNU/Linux
    description: Référentiel de configuration sécurisée pour les serveurs Debian. Les différences entre versions sont gérées par contrôle via applicability.versions.
    domains:
      BOOT: Démarrage et noyau
      AUTH: Comptes et authentification
      NET: Réseau
      SVC: Services
      FS: Système de fichiers et permissions
      AUDIT: Journalisation et audit
    profiles:
      baseline:
        title: Socle
        description: Paramètres que tout serveur devrait appliquer. Impact opérationnel faible.
      hardened:
        title: Renforcé
        description: Paramètres plus stricts pour les serveurs exposés ou sensibles. Peut casser certains usages.
