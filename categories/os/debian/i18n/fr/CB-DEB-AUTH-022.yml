id: CB-DEB-AUTH-022
locale: fr
source_updated: 2026-10-18
translators:
  - name: Alice
    github: Sn0wAlice
title: Désactiver le redémarrage par Ctrl-Alt-Suppr sur la console
finding:
  title: N'importe qui devant la console peut redémarrer le système avec Ctrl-Alt-Suppr
  description: Un redémarrage sans connexion interrompt les services et peut être la première étape d'une attaque au démarrage.
description: |
  systemd redémarre le système quand Ctrl-Alt-Suppr est pressé sur une console texte, via
  `ctrl-alt-del.target`. Masquer cette cible rend la combinaison de touches inopérante.
rationale: |
  Sur un serveur, un redémarrage doit toujours être une action volontaire et authentifiée. La
  combinaison est accessible sans connexion depuis un clavier physique, un commutateur KVM ou la
  console d'un hyperviseur, parfois par accident.
impact: |
  Ctrl-Alt-Suppr ne redémarre plus le système depuis une console texte. Les administrateurs
  redémarrent avec `systemctl reboot`.
notes: |
  Les postes de travail gèrent cette combinaison dans la session graphique ; voir les contrôles du domaine bureau.
audit:
  manual: |
    Lancer `systemctl is-enabled ctrl-alt-del.target`. La commande doit afficher `masked`.
remediation:
  manual: |
    Lancer `systemctl mask ctrl-alt-del.target` et `systemctl daemon-reload`.
  rollback: |
    Lancer `systemctl unmask ctrl-alt-del.target`.
