# yaml-language-server: $schema=../../../../../schema/control-i18n.schema.json
id: CB-DEB-AUTH-005
locale: fr
source_updated: 2026-10-18
translators:
  - name: Alice
    github: Sn0wAlice
title: Configurer sudo avec un pseudo-terminal, un fichier journal et un cache d'authentification court
finding:
  title: Les réglages de sudo permettent le détournement du terminal, ne gardent pas de journal local ou mémorisent l'authentification trop longtemps
  description: Les commandes lancées avec sudo peuvent agir sur le terminal de l'utilisateur, ne laissent de trace que dans syslog, et une session oubliée reste privilégiée.
description: |
  Trois réglages de sudo, définis par des lignes `Defaults` dans `/etc/sudoers` ou `/etc/sudoers.d/` :

  - `use_pty` : lancer chaque commande dans un nouveau pseudo-terminal, pour qu'elle ne puisse pas
    injecter de saisie dans le terminal de l'utilisateur après la fin de sudo ;
  - `logfile` : écrire chaque commande sudo dans un fichier dédié, en plus de syslog ;
  - `timestamp_timeout` : durée en minutes pendant laquelle une authentification réussie est
    mémorisée avant que sudo redemande le mot de passe.
rationale: |
  Sans `use_pty`, un programme malveillant lancé via sudo peut continuer en arrière-plan et
  injecter des frappes dans le shell de l'utilisateur. Un fichier journal dédié garde une trace
  lisible des commandes privilégiées même si syslog est perdu ou saturé. Un cache court limite le
  temps pendant lequel un terminal laissé sans surveillance peut lancer des commandes privilégiées.
impact: |
  Certains programmes interactifs se comportent différemment dans un pseudo-terminal (rare). Les
  utilisateurs ressaisissent leur mot de passe après {{ timestamp_timeout }} minutes sans utiliser sudo.
notes: |
  Debian définit déjà `use_pty` dans `/etc/sudoers` et mémorise l'authentification 15 minutes. Les
  valeurs effectives se lisent avec `sudo -V` en root, qui fusionne tous les fichiers sudoers.
setting:
  location: /etc/sudoers.d/60-cirsec
  recommended_value: "use_pty, logfile={{ log_file }}, timestamp_timeout au plus {{ timestamp_timeout }}"
parameters:
  log_file: Chemin du fichier journal de sudo.
  timestamp_timeout: Durée maximale en minutes de mémorisation de l'authentification par sudo.
audit:
  manual: |
    Lancer `sudo -V` en root et vérifier que :
    1. la sortie contient `Always run commands in a pseudo-tty` ;
    2. `Path to log file:` est renseigné ;
    3. `Authentication timestamp timeout:` vaut au plus {{ timestamp_timeout }} minutes.
remediation:
  manual: |
    Créer `/etc/sudoers.d/60-cirsec` avec `visudo -f /etc/sudoers.d/60-cirsec` :
    ```
    Defaults use_pty
    Defaults logfile="{{ log_file }}"
    Defaults timestamp_timeout={{ timestamp_timeout }}
    ```
    Retirer des autres fichiers sudoers tout `timestamp_timeout` de valeur supérieure.
  rollback: |
    Supprimer `/etc/sudoers.d/60-cirsec`.
