id: CB-DEB-AUTH-021
locale: fr
source_updated: 2026-10-18
translators:
  - name: Alice
    github: Sn0wAlice
title: Ne pas déclarer nologin comme shell valide
finding:
  title: nologin est déclaré comme shell de connexion valide
  description: Les programmes qui n'autorisent que les comptes ayant un shell valide (serveurs FTP, chsh) traitent alors les comptes sans connexion comme des comptes normaux.
description: |
  `/etc/shells` liste les shells de connexion valides. Certains programmes, comme `chsh` et les
  serveurs FTP, s'en servent pour décider si un compte peut se connecter. `nologin` sert justement
  à refuser les connexions et ne doit pas y figurer.
rationale: |
  Lister `nologin` fait passer les comptes de service pour des utilisateurs ordinaires auprès des
  programmes qui s'appuient sur `/etc/shells`, ce qui peut leur ouvrir des connexions FTP.
impact: |
  Aucun connu. Debian ne le liste pas par défaut.
audit:
  manual: |
    Lancer `grep nologin /etc/shells`. Il ne doit y avoir aucun résultat.
remediation:
  manual: |
    Retirer les lignes `nologin` de `/etc/shells`.
