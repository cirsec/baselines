id: CB-DEB-SVC-009
locale: fr
source_updated: 2026-10-18
translators:
  - name: Alice
    github: Sn0wAlice
title: Désactiver le proxy web Squid sur les systèmes qui ne sont pas des serveurs proxy
finding:
  title: Un proxy web peut tourner sur un système qui n'est pas un serveur proxy
  description: Un proxy ouvert ou oublié relaie le trafic d'autrui et en masque l'origine.
description: |
  Squid (`squid.service`) est le proxy HTTP avec cache fourni par Debian.

  Le contrôle est conforme quand l'unité est masquée ou n'est pas installée du tout.
rationale: |
  Un proxy relaie les connexions de ses clients. Mal configuré, il permet à des tiers d'atteindre
  des systèmes internes ou d'utiliser l'hôte pour masquer des attaques, et son cache peut
  contenir des réponses sensibles.
impact: |
  Masquer l'unité l'arrête et l'empêche de redémarrer. Les serveurs proxy doivent exclure ce
  contrôle dans leur fichier de personnalisation.
notes: |
  Une unité inexistante est considérée conforme, donc supprimer le paquet est une correction tout
  aussi valable.
audit:
  manual: |
    Lancer `systemctl is-enabled squid.service`. La commande doit afficher `masked`, ou échouer parce
    que l'unité n'existe pas.
remediation:
  manual: |
    Lancer `systemctl mask --now squid.service`, ou `apt purge squid` si le paquet n'est pas utile.
  rollback: |
    Lancer `systemctl unmask squid.service` puis `systemctl enable --now squid.service`.
