id: CB-DEB-AUDIT-023
locale: fr
source_updated: 2026-10-18
translators:
  - name: Alice
    github: Sn0wAlice
title: Auditer les suppressions et renommages de fichiers par les utilisateurs
finding:
  title: Les suppressions et renommages de fichiers par les utilisateurs ne sont pas enregistrés
  description: Des preuves et des données peuvent être supprimées ou déplacées sans trace.
description: |
  Règles auditd dans `/etc/audit/rules.d/60-cirsec-delete.rules`, clé `delete` : `unlink`,
  `unlinkat`, `rename`, `renameat`, `renameat2` et `rmdir` appelés par des utilisateurs connectés,
  programmes 64 et 32 bits.
rationale: |
  Supprimer des fichiers permet à un intrus d'effacer ses outils et ses traces, et peut détruire des
  données. Les événements gardent le nom de chaque fichier supprimé ou renommé et l'utilisateur
  responsable.
impact: |
  Les utilisateurs interactifs produisent beaucoup d'événements `delete` (les éditeurs enregistrent par renommage, les compilations suppriment des fichiers temporaires). Dimensionner les journaux d'audit en conséquence.
setting:
  location: /etc/audit/rules.d/60-cirsec-delete.rules
  recommended_value: "Règles chargées (auditctl -l) et présentes dans /etc/audit/rules.d/60-cirsec-delete.rules"
audit:
  manual: |
    1. Lancer `auditctl -l` en root. La commande doit lister les règles ci-dessous (clés `delete`).
    2. Lancer `grep -h . /etc/audit/rules.d/*.rules`. Les mêmes règles doivent y figurer, pour être chargées au démarrage.

    Règles attendues, telles que `auditctl -l` les affiche :
    ```
    -a always,exit -F arch=b64 -S rename,rmdir,unlink,unlinkat,renameat,renameat2 -F auid>=1000 -F auid!=-1 -F key=delete
    -a always,exit -F arch=b32 -S unlink,rename,rmdir,unlinkat,renameat,renameat2 -F auid>=1000 -F auid!=-1 -F key=delete
    ```
remediation:
  manual: |
    1. Écrire les règles attendues dans `/etc/audit/rules.d/60-cirsec-delete.rules` (mode 0640).
    2. Lancer `augenrules --load`. Si `auditctl -s` affiche `enabled 2`, la configuration est
       verrouillée : redémarrer pour charger les nouvelles règles.
  rollback: |
    Supprimer `/etc/audit/rules.d/60-cirsec-delete.rules` et lancer `augenrules --load` (ou redémarrer si la configuration est verrouillée).
