id: CB-DEB-SVC-024
locale: fr
source_updated: 2026-10-18
translators:
  - name: Alice
    github: Sn0wAlice
title: Supprimer le serveur X Window System des serveurs
finding:
  title: Un serveur X Window System est installé sur un serveur
  description: Une pile graphique ajoute une grande quantité de code privilégié rarement nécessaire.
description: |
  `xserver-common` contient les fichiers partagés par tous les serveurs X.Org (Xorg, Xvfb,
  Xephyr...). Quand il est absent, aucun serveur X n'est installé.
rationale: |
  Un serveur X est un logiciel complexe, historiquement exécuté avec les privilèges root, avec un
  long historique de failles d'élévation de privilèges locale. Un serveur administré par SSH n'en
  a pas besoin.
impact: |
  Supprime `xserver-common` et tous les paquets qui en dépendent : serveurs X, et l'environnement
  graphique s'il y en a un. Les applications X déportées par SSH (`ssh -X`) fonctionnent toujours,
  car elles utilisent le serveur X du poste de l'administrateur.
notes: |
  Le contrôle n'est que dans le profil serveur renforcé ; les postes ont besoin d'un serveur X ou
  de Xwayland.
audit:
  manual: |
    Lancer `dpkg-query -W -f='${Status}\n' xserver-common`. La commande ne doit pas afficher
    `install ok installed`.
remediation:
  manual: |
    Lancer `apt purge xserver-common` après avoir vérifié la liste des paquets qu'apt va supprimer.
  rollback: |
    Réinstaller le serveur X nécessaire, par exemple `apt install xserver-xorg-core`.
