# yaml-language-server: $schema=../../../../../schema/control-i18n.schema.json
id: CB-DEB-PKG-009
locale: fr
source_updated: 2026-10-18
translators:
  - name: Alice
    github: Sn0wAlice
title: Utiliser une version de Debian qui reçoit encore des mises à jour de sécurité
finding:
  title: La version de Debian n'est plus maintenue
  description: Plus aucun correctif de sécurité n'est publié pour cette version ; les nouvelles vulnérabilités restent ouvertes définitivement.
description: |
  L'équipe de sécurité Debian maintient chaque version stable pendant environ trois ans, jusqu'à
  environ un an après la version stable suivante. L'équipe Debian LTS prolonge ensuite le support
  de sécurité jusqu'à cinq ans au total, pour les architectures et les paquets les plus utilisés.
  Ensuite, plus aucune mise à jour de sécurité n'est publiée. Les distributions testing et
  unstable n'ont pas non plus de support de sécurité.
rationale: |
  Une version non maintenue accumule des vulnérabilités connues, publiques et non corrigées.
  Aucun durcissement de configuration ne compense cela.
impact: |
  Passer à la version stable suivante demande de planifier et de tester les applications hébergées.
notes: |
  Au 2026-10-18 : Debian 12 « bookworm » est en LTS (support de sécurité normal terminé en
  juin 2026, LTS jusqu'en juin 2028) ; Debian 13 « trixie » a le support de sécurité normal.
  Mettre à jour le paramètre `supported_versions` quand les versions arrivent en fin de vie (voir
  les pages Debian des versions et de LTS), et planifier les mises à niveau avant l'échéance
  plutôt qu'après.
setting:
  location: /etc/os-release
  recommended_value: "L'une des versions maintenues : {{ supported_versions }}"
parameters:
  supported_versions: Versions majeures de Debian considérées comme maintenues. Les profils renforcés n'acceptent que les versions en support de sécurité normal, pas en LTS.
audit:
  manual: |
    Lancer `cat /etc/debian_version` et comparer avec les dates de https://www.debian.org/releases/
    et https://wiki.debian.org/LTS. La version doit encore être maintenue, et ne doit pas être
    testing ou unstable (`/etc/debian_version` se terminant par `/sid`).
remediation:
  manual: |
    Passer à une version stable maintenue, en suivant le chapitre sur la mise à niveau des notes de
    publication de la version cible (une version à la fois). Faire passer les systèmes sous testing
    ou unstable sur une version stable.
