id: CB-DEB-AUTH-023
locale: fr
source_updated: 2026-10-18
translators:
  - name: Alice
    github: Sn0wAlice
title: Désactiver les comptes qui ne sont plus utilisés
finding:
  title: Les comptes de personnes ou de services partis sont toujours actifs
  description: Les comptes oubliés gardent des mots de passe et des clés valides que personne ne surveille.
description: |
  Chaque compte local doit appartenir à une personne ou à un service actuels. Les comptes des
  personnes parties ou ayant changé de poste, et des services retirés, doivent être verrouillés ou supprimés.
rationale: |
  Les comptes inutilisés intéressent les attaquants : leur propriétaire ne remarquera pas une
  connexion, et leur mot de passe ou leur clé SSH a pu fuiter il y a longtemps.
impact: |
  Demande une revue périodique avec les personnes qui savent qui a encore besoin d'un accès.
audit:
  manual: |
    1. Lister les comptes interactifs : `awk -F: '$3 >= 1000 && $3 < 65534 {print $1}' /etc/passwd`.
    2. Pour chacun, vérifier avec son propriétaire ou son responsable qu'il est toujours nécessaire.
       `lastlog` et `last` montrent les dernières connexions.
    3. Lister les comptes de service et vérifier que le service correspondant est toujours installé.
remediation:
  manual: |
    Verrouiller les comptes inutilisés avec `usermod -L -e 1 <compte>` (qui fait aussi expirer les
    connexions par clé SSH), puis les supprimer avec `userdel -r <compte>` une fois leurs fichiers archivés.
