id: CB-DEB-SVC-017
locale: fr
source_updated: 2026-10-18
translators:
  - name: Alice
    github: Sn0wAlice
title: Garder le démon cron activé et en cours d'exécution
finding:
  title: Le démon cron est installé mais ne tourne pas
  description: Les tâches de maintenance et de sécurité planifiées, comme la rotation des journaux ou les contrôles d'intégrité, s'arrêtent sans bruit.
description: |
  `cron` exécute les tâches de `/etc/crontab`, de `/etc/cron.d/`, des répertoires
  `/etc/cron.hourly` à `/etc/cron.monthly` et des crontabs des utilisateurs. Quand le paquet est
  installé, `cron.service` doit être activé et en cours d'exécution.
rationale: |
  Les paquets et les administrateurs comptent sur cron pour les tâches périodiques : contrôles
  d'intégrité, rapports par courrier, nettoyages. Un démon arrêté les désactive sans aucun message
  d'erreur.
impact: |
  Aucun connu.
notes: |
  Les images cloud Debian n'installent pas cron (les timers systemd assurent la maintenance des
  paquets) ; le contrôle est alors non applicable.
audit:
  manual: |
    `systemctl is-enabled cron` doit afficher `enabled` et `systemctl is-active cron` doit afficher
    `active`.
remediation:
  manual: |
    Lancer `systemctl unmask cron` s'il est masqué, puis `systemctl enable --now cron`.
  rollback: |
    Lancer `systemctl disable --now cron`.
