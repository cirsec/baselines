id: CB-DEP-LOCK-002
title: Install from the lockfile without modifying it in builds
finding:
  title: Builds may resolve versions different from the lockfile
status: draft
profiles: [baseline]
risk:
  severity: high
assessment: partial
tags: [lockfile, ci]
description: |
  Pipelines and release builds install dependencies in the package manager's frozen or locked mode: they install exactly what the lockfile lists and fail if the manifest and lockfile disagree, instead of updating the lockfile.
rationale: |
  A lockfile only protects the build if the build is forced to follow it. In default mode, several package managers quietly re-resolve and rewrite the lockfile.
impact: |
  Builds fail when someone forgets to update the lockfile. That is the intended behaviour.
audit:
  manual: |
    1. Review the install step of each pipeline.
    2. Check it uses the frozen or locked install mode and that a manifest/lockfile mismatch fails the build.
remediation:
  manual: |
    1. Switch the install step of every pipeline to the package manager's frozen or locked mode.
