id: CB-DEP-LOCK-001
title: Commit a lockfile for every deployable application
finding:
  title: Applications are built without a lockfile
  description: Each build resolves dependencies again and may silently pick up a new, possibly malicious, version.
status: draft
profiles: [baseline]
risk:
  severity: high
assessment: partial
tags: [lockfile, reproducibility]
description: |
  Every application, service or other deployable artifact commits the lockfile produced by its package manager, listing the exact version of every direct and transitive dependency.
rationale: |
  Without a lockfile, the dependency tree is decided at build time by whatever the registry serves that minute. Two builds of the same commit can differ, and a new malicious release is picked up automatically.
impact: |
  Lockfile changes must be reviewed like code. Merge conflicts in lockfiles are more frequent.
notes: |
  Libraries published for others to consume may leave the lockfile out of the published package, but should still commit it for their own tests and builds.
audit:
  manual: |
    1. List deployable projects.
    2. Check each one has a committed, up-to-date lockfile for every ecosystem it uses.
remediation:
  manual: |
    1. Generate the lockfile with the package manager and commit it.
    2. Remove lockfiles from ignore rules.
