# yaml-language-server: $schema=../../../schema/standard.schema.json
id: dependencies
code: DEP
title: Third-party package dependencies
description: |
  How an organization consumes open source and third-party packages from language
  ecosystems: where packages come from, how long a new release waits before use,
  how installs are locked and verified, how new dependencies are vetted, and how
  vulnerable or malicious packages are found and handled. Tool-neutral: each control
  describes the expected state, not a product.
status: draft
version: 1.0.0
applies_to:
  - product: Language package ecosystems
    vendor: Any
    versions: [javascript, python, rust, go, java, dotnet, php, ruby]
profiles:
  - key: baseline
    title: Baseline
    description: What every team consuming third-party packages should do. Low friction.
  - key: hardened
    title: Hardened
    description: For critical or exposed software, and teams that publish software others depend on. Adds review and isolation overhead.
    extends: baseline
domains:
  - code: SRC
    title: Sources & registries
  - code: AGE
    title: Release age & quarantine
  - code: LOCK
    title: Locking & integrity
  - code: EXEC
    title: Install-time execution
  - code: VET
    title: Dependency vetting
  - code: VULN
    title: Vulnerabilities & malicious packages
  - code: UPD
    title: Updates
  - code: INV
    title: Inventory & provenance
  - code: CI
    title: Build environment
  - code: IR
    title: Incident response
maintainers:
  - name: Alice
    github: Sn0wAlice
primary_sources:
  - title: NIST SP 800-218 - Secure Software Development Framework (SSDF) 1.1
    url: https://csrc.nist.gov/pubs/sp/800/218/final
    publisher: NIST
    kind: standard
  - title: SLSA specification v1.0
    url: https://slsa.dev/spec/v1.0/
    publisher: OpenSSF
    kind: standard
  - title: Secure Supply Chain Consumption Framework (S2C2F)
    url: https://github.com/ossf/s2c2f
    publisher: OpenSSF
    kind: guide
  - title: Package Manager Best Practices
    url: https://github.com/ossf/package-manager-best-practices
    publisher: OpenSSF
    kind: guide
  - title: OWASP Top 10 CI/CD Security Risks
    url: https://owasp.org/www-project-top-10-ci-cd-security-risks/
    publisher: OWASP
    kind: guide
i18n:
  fr:
    title: Dépendances de packages tiers
    description: |
      Comment une organisation consomme les packages open source et tiers des écosystèmes
      de langages : d'où viennent les packages, combien de temps une nouvelle version attend
      avant d'être utilisée, comment les installations sont verrouillées et vérifiées, comment
      les nouvelles dépendances sont évaluées, et comment les packages vulnérables ou
      malveillants sont détectés et traités. Neutre vis-à-vis des outils : chaque contrôle
      décrit l'état attendu, pas un produit.
    domains:
      SRC: Sources et registres
      AGE: Âge des versions et quarantaine
      LOCK: Verrouillage et intégrité
      EXEC: Exécution à l'installation
      VET: Évaluation des dépendances
      VULN: Vulnérabilités et packages malveillants
      UPD: Mises à jour
      INV: Inventaire et provenance
      CI: Environnement de build
      IR: Réponse à incident
    profiles:
      baseline:
        title: Socle
        description: Ce que toute équipe qui consomme des packages tiers devrait faire. Peu de friction.
      hardened:
        title: Renforcé
        description: Pour les logiciels critiques ou exposés, et les équipes qui publient des logiciels dont d'autres dépendent. Ajoute de la revue et de l'isolation.
