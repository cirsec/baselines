# yaml-language-server: $schema=../../../schema/standard.schema.json
id: cicd
code: CICD
title: CI/CD pipelines and platforms
description: |
  How an organization secures the systems that build and ship its software: source
  control platforms, CI/CD pipelines and their definitions, runners and build
  environments, secrets, third-party pipeline components, artifacts and provenance,
  deployments, and the self-managed servers behind them. Tool-neutral: each control
  states the expected state, then how to check and apply it on each platform that has
  a matching setting. Every control is checked and applied by hand. Consumption of
  language packages during builds is covered by the dependencies standard (CB-DEP-*).
status: draft
version: 0.1.0
applies_to:
  - product: CI/CD and source control platforms
    vendor: Any
    versions: [github, gitlab, azure-devops, bitbucket, jenkins, teamcity, circleci, buildkite, aws-codesuite, google-cloud-build, tekton, argo-cd, argo-workflows, flux, spinnaker, harness, gitea, forgejo, woodpecker]
profiles:
  - key: baseline
    title: Baseline
    description: What every team running pipelines should do. Low friction.
  - key: hardened
    title: Hardened
    description: For pipelines that build or deploy critical or exposed software (close to SLSA Build L3). Adds isolation, review and approval overhead.
    extends: baseline
domains:
  - code: IAM
    title: Identity & access
  - code: SCM
    title: Source & change control
  - code: PIPE
    title: Pipeline definition & triggers
  - code: COMP
    title: Third-party CI components & integrations
  - code: SEC
    title: Secrets & credentials
  - code: RUN
    title: Runners & build environment
  - code: ART
    title: Artifacts, caches & provenance
  - code: DEPLOY
    title: Deployment & environments
  - code: PLAT
    title: Self-managed platform hardening
  - code: TEST
    title: Security checks in the pipeline
  - code: LOG
    title: Logging, monitoring & response
maintainers:
  - name: Alice
    github: Sn0wAlice
primary_sources:
  - title: OWASP Top 10 CI/CD Security Risks
    url: https://owasp.org/www-project-top-10-ci-cd-security-risks/
    publisher: OWASP
    kind: guide
  - title: NIST SP 800-204D - Strategies for the Integration of Software Supply Chain Security in DevSecOps CI/CD Pipelines
    url: https://csrc.nist.gov/pubs/sp/800/204/d/final
    publisher: NIST
    kind: standard
  - title: NIST SP 800-218 - Secure Software Development Framework (SSDF) 1.1
    url: https://csrc.nist.gov/pubs/sp/800/218/final
    publisher: NIST
    kind: standard
  - title: SLSA specification v1.2
    url: https://slsa.dev/spec/v1.2/
    publisher: OpenSSF
    kind: standard
  - title: Source Code Management Platform Configuration Best Practices
    url: https://best.openssf.org/SCM-BestPractices/
    publisher: OpenSSF
    kind: guide
  - title: Defending software build pipelines from malicious attack
    url: https://www.ncsc.gov.uk/sites/default/files/2026-08/Defending-software-build-pipelines-from-malicious-attack.pdf
    publisher: NCSC
    kind: guide
  - title: Les essentiels DevSecOps
    url: https://messervices.cyber.gouv.fr/documents-guides/anssi_essentiels_devsecops_v1.0.pdf
    publisher: ANSSI
    kind: guide
i18n:
  fr:
    title: Pipelines et plates-formes CI/CD
    description: |
      Comment une organisation sécurise les systèmes qui construisent et livrent ses
      logiciels : plates-formes de gestion de code source, pipelines CI/CD et leurs
      définitions, runners et environnements de build, secrets, composants tiers des
      pipelines, artefacts et provenance, déploiements, et serveurs auto-hébergés qui les
      portent. Neutre vis-à-vis des outils : chaque contrôle décrit l'état attendu, puis
      comment le vérifier et l'appliquer sur chaque plate-forme qui a un réglage
      correspondant. Chaque contrôle se vérifie et s'applique à la main. La consommation
      des packages de langages pendant les builds relève du standard dépendances (CB-DEP-*).
    domains:
      IAM: Identités et accès
      SCM: Code source et contrôle des changements
      PIPE: Définition et déclencheurs des pipelines
      COMP: Composants CI tiers et intégrations
      SEC: Secrets et identifiants
      RUN: Runners et environnement de build
      ART: Artefacts, caches et provenance
      DEPLOY: Déploiement et environnements
      PLAT: Durcissement des plates-formes auto-hébergées
      TEST: Contrôles de sécurité dans le pipeline
      LOG: Journalisation, supervision et réponse
    profiles:
      baseline:
        title: Socle
        description: Ce que toute équipe qui exploite des pipelines devrait faire. Peu de friction.
      hardened:
        title: Renforcé
        description: Pour les pipelines qui construisent ou déploient des logiciels critiques ou exposés (proche de SLSA Build L3). Ajoute de l'isolation, de la revue et des approbations.
