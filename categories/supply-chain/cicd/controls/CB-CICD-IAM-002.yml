# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-IAM-002
title: Validate identity assertions when authentication is delegated
finding:
  title: Delegated sign-in trusts unverified tokens, emails or identity headers
  description: When certificate checks are skipped, unverified emails are accepted or identity headers are trusted from any source, an attacker can sign in as another user by presenting a forged token or sending the header directly to the platform.
status: draft
profiles: [baseline]
risk:
  severity: high
assessment: manual
tags: [oidc, dex, reverse-proxy, authentication, tls]

applicability:
  versions: [argo-cd, gitea, forgejo]

description: |
  When a platform delegates sign-in to an OpenID Connect provider, a Dex connector or an
  authenticating reverse proxy, it checks what it receives: the TLS certificate of the identity
  provider is verified, email addresses are accepted only when the provider marks them verified, and
  identity headers set by a reverse proxy are accepted only from that proxy's addresses, with the
  platform reachable only through it.

  Configuring SSO itself is covered by CB-CICD-IAM-001.
rationale: |
  The platform maps the identity it receives to an account and its roles. Skipping TLS verification
  lets anyone who can intercept the connection to the identity provider forge tokens. Trusting
  unverified emails lets a user of a shared or multi-tenant identity provider register the email of
  an administrator and inherit that account. Trusting identity headers from any address lets anyone
  who reaches the platform directly send `X-WEBAUTH-USER: admin`.
impact: |
  None known when the identity provider has a valid certificate and the proxy addresses are known.
  Fixing a trust-all proxy setting may require network changes so that the platform only accepts
  traffic from the proxy.

audit:
  manual: |
    Read access to the platform configuration (`argocd-cm` ConfigMap, `app.ini`) is enough.

    1. Identify how sign-in is delegated on each platform.
    2. Check the assertion settings:
       - **Argo CD**: in `argocd-cm`, `oidc.tls.insecure.skip.verify` is absent or `"false"`; in
         `dex.config`, no connector sets `insecureSkipEmailVerified: true` unless the identity
         provider is single-tenant and only issues verified emails. `insecureEnableGroups` is set
         only when the provider returns groups in the token and the group names are controlled by
         the organization.
       - **Gitea / Forgejo**: if `[service] ENABLE_REVERSE_PROXY_AUTHENTICATION` or
         `ENABLE_REVERSE_PROXY_AUTHENTICATION_API` is `true`, `[security]
         REVERSE_PROXY_TRUSTED_PROXIES` lists only the proxy addresses (default `127.0.0.0/8,::1/128`)
         and the application port is not reachable except through the proxy.
    3. Fail if TLS verification of the identity provider is disabled, if unverified emails are
       trusted on a multi-tenant provider, or if reverse-proxy authentication trusts `*` or a range
       wider than the proxies.

remediation:
  manual: |
    1. **Argo CD**: set `oidc.tls.insecure.skip.verify: "false"` (or remove it) and give Argo CD the
       identity provider CA if it is private; remove `insecureSkipEmailVerified` from Dex connectors.
       Restart `argocd-server` and test sign-in.
    2. **Gitea / Forgejo**: set `REVERSE_PROXY_TRUSTED_PROXIES` to the proxy addresses only, bind the
       application to localhost or a private interface reachable only by the proxy, and set
       `ENABLE_REVERSE_PROXY_AUTHENTICATION = false` if the proxy no longer authenticates users.
    3. Make the proxy strip any identity header coming from the client before adding its own.

