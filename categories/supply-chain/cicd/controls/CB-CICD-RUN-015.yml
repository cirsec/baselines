# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-RUN-015
title: Run jobs inside a container or VM, never directly on a shared runner host
finding:
  title: Shared runners execute jobs directly on the host
  description: With a shell, host or local executor, job commands run as the runner's own user on the host, so any job can read other projects' code, the runner's credentials and job tokens, and change the runner for the jobs that follow.
status: draft
profiles: [baseline]
risk:
  severity: high
assessment: manual
tags: [runners, executors, sandbox, isolation]

description: |
  Runners shared by several repositories or projects run jobs in a container or a virtual machine:
  Docker, Podman, LXC, Kubernetes or VM-based executors. Executors that run commands directly on the
  host (GitLab `shell`, Gitea and Forgejo `host` labels, Woodpecker `local` backend) are used only on
  runners dedicated to a single trusted repository whose writers are all trusted.

  Privileges inside the container are covered by CB-CICD-RUN-016 and CB-CICD-RUN-018.
rationale: |
  Host execution has no boundary between jobs and the runner: commands run with the runner's user,
  read its configuration and credentials, and share the host network. On a shared runner, every
  project's job can read and alter what the others build.
impact: |
  Builds that need host tools (hardware signing, platform SDKs) must keep a dedicated host runner per
  project or move the tools into images.
notes: |
  GitLab's SSH executor does not check host keys and is exposed to man-in-the-middle attacks. GitLab
  Runner's default executor in `config.toml` is `shell`. On Forgejo, `host` execution also exposes the
  runner state file to jobs.

audit:
  manual: |
    Use read access to runner configuration files.

    1. List runners that serve more than one repository or project, with their executor.
    2. Per product:
       - **GitLab**: `executor` in each `[[runners]]` section of `config.toml` is `docker`,
         `docker-autoscaler`, `kubernetes`, `docker+machine`, `instance` or a VM executor, not `shell`
         or `ssh`.
       - **Gitea / Forgejo**: runner labels name a container environment (`docker://<image>`, or
         `lxc` on Forgejo), not `:host`; on Gitea a label without a scheme also means host.
       - **Woodpecker**: agents use `WOODPECKER_BACKEND=docker` or `kubernetes`, not `local`.
    3. Fail if a runner shared by several repositories or projects runs jobs directly on its host.
remediation:
  manual: |
    1. Package the tools jobs need into build images.
    2. Per product:
       - **GitLab**: register shared runners with the Docker, Kubernetes or an autoscaling executor;
         keep `shell` runners as project runners for trusted projects only.
       - **Gitea / Forgejo**: replace `:host` labels with container labels on shared runners.
       - **Woodpecker**: set `WOODPECKER_BACKEND=docker` (or `kubernetes`) on shared agents.
    3. Re-image hosts that ran untrusted jobs on a host executor.

