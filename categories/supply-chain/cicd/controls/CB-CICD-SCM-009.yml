# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-SCM-009
title: Block force pushes and deletion of protected branches
finding:
  title: Protected branches can be force-pushed or deleted
  description: A force push or a delete-and-recreate rewrites the history of a release branch, which can silently remove a security fix or slip in a commit that never went through review, and erases the trail investigators rely on.
status: draft
profiles: [baseline]
risk:
  severity: high
assessment: manual
tags: [branch-protection, force-push, history-integrity, branch-deletion]

description: |
  The history of default and release branches only moves forward. Force pushes (history rewrite)
  and deletion of these branches are denied to everyone, administrators included.

  When content must really be removed from history (a leaked secret, illegal content), the
  organization follows a documented expunging procedure: the request is recorded, an
  administrator and a second trusted person approve and perform it, the rule is lifted only for
  the time of the operation, and the action is logged. Who may bypass protection rules in general
  is covered by CB-CICD-SCM-011.
rationale: |
  Review, signatures and audit assume that a commit, once merged, stays in the history. Rewriting
  a protected branch breaks this: an attacker or a careless maintainer can drop a fix, replace a
  reviewed commit with an unreviewed one that has the same message, or delete the branch and
  recreate it from another point. Consumers that build from the branch then get code nobody
  approved, and the evidence is gone.
impact: |
  Maintainers cannot clean up history on protected branches with a force push. Mistakes are fixed
  with revert commits; true removal goes through the expunging procedure.
notes: |
  On GitLab, protected branches cannot be deleted with Git, but users with the Maintainer or
  Owner role can still delete them from the web interface or API; keep that role limited
  (CB-CICD-IAM-019). On Bitbucket Cloud, the **Allow rewriting branch history** and **Allow deleting
  this branch** options only exist inside a branch restriction. On Azure DevOps, a branch with
  required policies cannot be deleted.

audit:
  manual: |
    Use a role that can read branch protection and repository security settings.

    1. For each repository, open the rule protecting the default and release branches.
    2. Check that force push and deletion are denied:
       - **GitHub**: the ruleset enables **Block force pushes** and **Restrict deletions**, or the
         branch protection rule has **Allow force pushes** and **Allow deletions** cleared. On
         GitHub Enterprise Server, enterprise **Policies** > **Options** > **Force pushes** is set to
         **Block** or **Block to the default branch**, with **Enforce on all repositories**.
       - **GitLab**: **Settings** > **Repository** > **Branch rules**: **Allowed to force push** is
         off for each protected branch.
       - **Azure DevOps**: **Project settings** > **Repositories** > **Security** (all repositories
         and each repository): **Force push (rewrite history, delete branches and tags)** is not
         allowed for any group or user except a documented break-glass identity.
       - **Bitbucket Cloud**: in **Branch restrictions**, **Allow rewriting branch history** and
         **Allow deleting this branch** are cleared for the protected branches.
       - **Bitbucket Data Center**: **Branch permissions** includes **Prevent rewriting history**
         and **Prevent deletion** without broad exemptions.
       - **Gitea**: the branch rule uses **Disable force push** and **Disable branch deletion**.
    3. Check that a written expunging procedure exists, requires two people and is logged.
    4. Fail if anyone other than a documented break-glass identity can force-push or delete a
       protected branch, or if there is no expunging procedure.

remediation:
  manual: |
    1. Deny force push and deletion on protected branches:
       - **GitHub**: enable **Block force pushes** and **Restrict deletions** in the ruleset, with
         no bypass actor; on GitHub Enterprise Server, also set the enterprise **Force pushes**
         policy.
       - **GitLab**: turn off **Allowed to force push** on each protected branch.
       - **Azure DevOps**: set **Force push (rewrite history, delete branches and tags)** to **Not
         set** for every group (it is not granted by default), and **Deny** where an inherited
         **Allow** exists.
       - **Bitbucket**: clear **Allow rewriting branch history** and **Allow deleting this branch**
         (Cloud), or add **Prevent rewriting history** and **Prevent deletion** (Data Center).
       - **Gitea**: select **Disable force push** and **Disable branch deletion**.
    2. Write the expunging procedure: request ticket, approval by an administrator and a second
       trusted person, temporary lifting of the rule, log of the operation, and restoration of the
       rule.

