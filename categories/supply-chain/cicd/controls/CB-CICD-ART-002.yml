# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-ART-002
title: Keep provenance signing out of reach of user-defined build steps
finding:
  title: Build steps can forge or alter the provenance of the artifacts they produce
  description: When the job that runs the build also controls the provenance signing identity or the fields it attests, a compromised dependency or a malicious change can produce a signed provenance claiming any source, workflow or inputs.
status: draft
profiles: [hardened]
risk:
  severity: medium
assessment: manual
tags: [provenance, slsa, build-isolation, attestation, signing]

description: |
  Provenance for release artifacts is generated and signed by a trusted part of the build platform
  that user-defined build steps cannot influence. Signing material and the identity used to sign are
  not readable from the steps that compile, test or package the code, and every field of the
  provenance is either filled in by the platform or checked by it. This is the provenance part of
  SLSA Build L3.

  In practice, the release build runs in a centrally owned, reviewed build definition (a shared
  reusable workflow or pipeline template pinned to a commit) that does the build and the
  attestation, and verifiers pin the attestation to that signer identity, not only to the calling
  repository.

  Generating provenance at all is covered by CB-CICD-ART-001; the isolation of the build environment
  itself (ephemeral, single-use runners, no access to platform secrets) by the RUN controls.
rationale: |
  SLSA Build L2 provenance proves that the platform signed something, but if the signing step runs in
  the same job as untrusted build steps, a compromised build tool can change what gets signed. Moving
  the build and attestation into a separate, controlled definition and verifying the signer identity
  means an attacker who controls the application repository still cannot obtain provenance that
  claims a different builder or workflow.
impact: |
  Release builds must move into a shared build workflow or template owned by a platform or security
  team, which takes some engineering and slows down changes to the build logic. Verification commands
  and admission policies must be updated to pin the signer workflow.
notes: |
  GitHub documents that artifact attestations reach SLSA v1.0 Build L3 when the build and the
  attestation run in a reusable workflow. Tekton Chains signs from its own controller, outside task
  pods, but a TaskRun step writes the type-hinted results that Chains attests; the SPIRE-based
  protection of results (`enforce-nonfalsifiability: spire`) is documented by Tekton as work in
  progress and not yet functional, so Tekton does not meet this control on its own today.

audit:
  manual: |
    Use a role that can read pipeline definitions, attestation settings and deployment policies.

    1. Identify the release pipelines of critical software and the definition that performs the
       build and signs the provenance.
    2. Check that this definition is owned by a separate team, stored in a protected repository and
       referenced by an immutable version (commit SHA or protected tag).
    3. Check that no signing key, cloud KMS credential or OIDC token used for provenance is
       available to the build steps of the calling pipeline.
    4. Check the verification side:
       - **GitHub**: the build and the `actions/attest` step run inside a reusable workflow called
         with `jobs.<id>.uses: <org>/<repo>/.github/workflows/<file>.yml@<sha>`; verification uses
         `gh attestation verify <artifact> --owner <org> --signer-workflow <org>/<repo>/.github/workflows/<file>.yml`
         (or `--signer-repo`).
       - **Google Cloud Build**: provenance is generated by Cloud Build itself
         (`requestedVerifyOption: VERIFIED`) and verified with
         `slsa-verifier verify-image --builder-id https://cloudbuild.googleapis.com/GoogleHostedWorker`.
    5. Fail if the provenance of a critical release can be produced from a job that also runs
       repository-controlled build steps with access to the signing identity, or if verifiers accept
       any signer workflow.

remediation:
  manual: |
    1. Create a central build definition for each kind of artifact (container image, package,
       binary) in a repository with branch protection and code owner review (CB-CICD-SCM-006,
       CB-CICD-SCM-018).
    2. Make that definition run the build and the attestation together, so the calling pipeline
       only passes parameters:
       - **GitHub**: move the build and `actions/attest` into a reusable workflow; callers use
         `uses: <org>/<build-repo>/.github/workflows/build.yml@<sha>` and grant `id-token: write`
         and `attestations: write` only to that job.
       - **Google Cloud Build**: let Cloud Build generate the provenance (`images:` and
         `requestedVerifyOption: VERIFIED`) instead of signing from a build step.
    3. Update deployment gates and consumer instructions to require the signer identity
       (`--signer-workflow`, or `--builder-id` for slsa-verifier).
    4. Remove signing keys and signing credentials from the application pipelines.

