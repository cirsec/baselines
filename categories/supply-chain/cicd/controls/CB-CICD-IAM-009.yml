# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-IAM-009
title: Disable self-registration on self-managed CI/CD platforms
finding:
  title: Anyone who reaches the platform can create an account
  description: Open sign-up lets an outsider create an account, see internal and public projects, and on many platforms run jobs on shared runners or inherit default permissions.
status: draft
profiles: [baseline]
risk:
  severity: high
assessment: manual
tags: [sign-up, registration, self-managed, account-creation]

description: |
  Accounts on self-managed SCM and CI/CD platforms are created only through the identity provider
  (SSO auto-provisioning restricted to the organization) or by an administrator. Open self-registration
  is disabled. If sign-up must stay open, it requires a confirmed email address in a corporate domain,
  administrator approval where available, and anti-automation (captcha).

  Restricting membership of SaaS organizations to corporate domains is covered by CB-CICD-IAM-010.
rationale: |
  An account is the first step for most attacks on a CI/CD platform: with it, a user sees internal
  projects, can fork them, opens merge requests that run pipelines, and on Forgejo or Gitea with
  Actions can run code on shared runners. On Jenkins, open sign-up combined with the "Logged-in users
  can do anything" strategy makes every new account an administrator.
impact: |
  New users must be provisioned through the identity provider or by an administrator. Public
  community instances that rely on sign-up need the restricted variant instead.

audit:
  manual: |
    Use an instance administrator role or read access to the platform configuration.

    1. Check the registration settings:
       - **GitLab self-managed**: **Admin** > **Settings** > **General** > **New user account
         restrictions**: **Allow new user accounts** is cleared (`signup_enabled: false`); if it
         is selected, **Require admin approval for new user accounts** is selected, **Email
         confirmation settings** is **Hard**, and an allowlist of corporate domains is set.
       - **Gitea / Forgejo**: `[service] DISABLE_REGISTRATION = true` (Forgejo default `false`), or
         `ALLOW_ONLY_EXTERNAL_REGISTRATION = true` with an identity provider restricted to the
         organization; when registration stays open, `REGISTER_EMAIL_CONFIRM = true`,
         `ENABLE_CAPTCHA = true` and `EMAIL_DOMAIN_ALLOWLIST` lists corporate domains.
         `[oauth2_client] ENABLE_AUTO_REGISTRATION = true` is only used with a provider restricted to
         the organization.
       - **Jenkins**: the security realm is not **Jenkins' own user database** with sign-up allowed
         (`allowsSignup: true` under `jenkins.securityRealm.local` in configuration as code).
       - **Woodpecker**: `WOODPECKER_OPEN=false` (default), or when it is `true`, approved
         organizations are set (`WOODPECKER_ORGS` or per-forge allowed organizations) so that only
         members of those organizations can register.
    2. Try to open the sign-up page anonymously.
    3. Fail if an outsider can create an account without administrator approval or a corporate
       identity.

remediation:
  manual: |
    1. Disable open registration (instance administrator):
       - **GitLab self-managed**: clear **Allow new user accounts**, or select **Require admin approval for
         new user accounts**, set **Email confirmation settings** to **Hard** and add allowed domains.
       - **Gitea / Forgejo**: set `DISABLE_REGISTRATION = true`, or `ALLOW_ONLY_EXTERNAL_REGISTRATION
         = true` with an organization-only identity provider, then restart.
       - **Jenkins**: switch the security realm to the identity provider, or turn off sign-up for
         Jenkins' own user database.
       - **Woodpecker**: set `WOODPECKER_OPEN=false`, or restrict it to approved organizations.
    2. Review accounts created while sign-up was open and remove the unknown ones.

