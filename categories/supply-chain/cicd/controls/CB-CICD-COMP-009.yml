# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-COMP-009
title: Update pipeline components automatically after a cooldown
finding:
  title: Pipeline components are not updated, or are updated the day a release appears
  description: Without an update bot, pinned actions and images drift until they carry known flaws; with a bot and no cooldown, a malicious release is proposed for merge within hours of publication.
status: draft
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [dependency-updates, dependabot, cooldown, pinning, supply-chain]

parameters:
  - name: cooldown_days
    type: integer
    description: Minimum number of days between the publication of a new component version and the update proposal.
    unit: days
    default: 7
    minimum: 3

description: |
  A dependency update bot (for example Dependabot or Renovate) covers the CI components of every
  repository (actions and reusable workflows, job and service images, orbs or plugins where the
  bot supports them) as well as code dependencies, and:
  - waits at least `{{ cooldown_days }}` days after a release before proposing it, with a longer
    wait for major versions if wanted; security fixes may skip the wait;
  - updates pinned commit SHAs and digests together with their version comments;
  - never runs code from the dependencies it updates (no external code execution during updates).

  Update proposals go through the normal review and checks. Release-age rules for application
  packages are covered by CB-DEP-AGE-001, and automated updates of code dependencies by
  CB-DEP-UPD-001.
rationale: |
  Pinning components to a commit or digest (CB-CICD-COMP-011) stops silent changes but freezes
  the version; without automated updates, pinned components fall behind on fixes. Most malicious
  releases of popular packages and actions are detected and pulled within days, so a cooldown
  keeps them out of update proposals. A bot that executes manifest code during updates gives that
  code access to the bot's credentials.
impact: |
  Fixes in new releases arrive a few days later, except security updates. Teams receive regular
  update pull requests to review; grouping reduces their number.
notes: |
  Dependabot applies a default cooldown of 3 days to version updates when `cooldown` is not
  configured; security updates are not delayed. When Dependabot bumps an action covered by an
  Actions lockfile, it regenerates the matching lockfile entry in the same pull request.

audit:
  manual: |
    Use read access to the repositories.

    1. Check that every active repository has an update bot configuration that includes its CI
       components (Scorecard `Dependency-Update-Tool` reports repositories without one).
    2. Check the configuration:
       - **GitHub**: `.github/dependabot.yml` has an `updates` entry with `package-ecosystem:
         github-actions` (and `docker` for job images), a `cooldown` with `default-days` of at
         least `{{ cooldown_days }}`, and no `insecure-external-code-execution: allow`. zizmor
         audits `dependabot-cooldown` and `dependabot-execution` report these.
       - **Other platforms**: the bot configuration (for example Renovate `minimumReleaseAge`)
         covers pipeline files and images with the same wait.
    3. Fail if CI components of a repository are not covered by an update bot, if the cooldown is
       shorter than `{{ cooldown_days }}` days, or if the bot may execute external code during
       updates.

remediation:
  manual: |
    1. Add or extend the bot configuration in each repository, ideally from a shared template:
       - **GitHub**: in `.github/dependabot.yml`, add an entry with `package-ecosystem:
         github-actions`, `directory: /`, a weekly `schedule`, `groups` for minor and patch
         updates and `cooldown: default-days: {{ cooldown_days }}`; remove
         `insecure-external-code-execution: allow`.
       - **Renovate**: enable the managers for pipeline files and container images and set
         `minimumReleaseAge` to the same number of days.
    2. Require the normal checks and review on update pull requests.

