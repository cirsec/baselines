# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-COMP-004
title: Disable unused plugins, resolvers and rendering tools
finding:
  title: CI servers and controllers keep plugins and resolvers that nobody needs
  description: Every extra plugin, remote resolver or manifest rendering tool adds code that runs with controller privileges, and unmaintained ones carry flaws that are never fixed.
status: draft
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [attack-surface, plugins, resolvers, gitops, minimization]

applicability:
  versions: [argo-cd, github, jenkins, tekton]

parameters:
  - name: minimization
    type: enum
    description: How far the component set is reduced. `unmaintained-removed` = deprecated and unmaintained plugins are removed; `unused-disabled` = in addition, unused resolvers and rendering tools are disabled, controller egress is allow-listed and superfluous actions are removed.
    default: unmaintained-removed
    profile_defaults:
      hardened: unused-disabled
    allowed: [unmaintained-removed, unused-disabled]

description: |
  CI servers, pipeline controllers and GitOps controllers run only the extensions they need. The
  required level is `{{ minimization }}`:
  - `unmaintained-removed`: deprecated, unmaintained and unused plugins are uninstalled from CI
    servers; the plugin list is kept as code (for example a `plugins.txt` or configuration as
    code file).
  - `unused-disabled`: in addition, remote resolvers and manifest rendering tools that are not
    used are disabled, the controllers that fetch remote content have an egress allow-list, and
    workflows do not add actions for tools the runner image already provides.

  Removing vulnerable components is covered by CB-CICD-COMP-003, and unused platform features by
  CB-CICD-PLAT-014.
rationale: |
  Plugins and resolvers run inside the controller with access to its credentials and to every
  project. Each one widens the attack surface and the patching load. Remote resolvers fetch
  content from URLs that pipeline authors choose, and rendering tools such as Helm or Kustomize can
  read files outside the application directory on the repository server when misconfigured.
impact: |
  Removing a plugin or disabling a resolver breaks the pipelines that still use it; list the
  users before removal. An egress allow-list needs maintenance when new sources are added.
notes: |
  Tekton enables the bundles, git, hub and cluster resolvers by default. The Argo CD option
  `kustomize.buildOptions: --load_restrictor none` lets Kustomize read outside the application
  directory and should not be used.

audit:
  manual: |
    Use an administrator account with read access (Jenkins **Overall/Read** and plugin manager,
    `kubectl get` on the Tekton and Argo CD namespaces).

    1. List the installed extensions and compare them with what pipelines use:
       - **Jenkins**: **Manage Jenkins** > **Plugins** > **Installed plugins**; look for
         deprecated, adopt-this-plugin or unused plugins.
       - **Tekton**: ConfigMap `resolvers-feature-flags` in the resolvers namespace, keys
         `enable-bundles-resolver`, `enable-git-resolver`, `enable-hub-resolver`,
         `enable-cluster-resolver`, `enable-http-resolver`; NetworkPolicy on the resolvers
         deployment.
       - **Argo CD**: ConfigMap `argocd-cm`, keys `kustomize.buildOptions` (no
         `--load_restrictor none`) and `helm.valuesFileSchemes`; Config Management Plugin
         sidecars in use.
       - **GitHub**: zizmor `superfluous-actions` on the workflows.
    2. Fail if deprecated or unmaintained plugins are installed, or, when `{{ minimization }}` is
       `unused-disabled`, if an unused resolver or rendering tool is enabled, if controllers that
       fetch remote content have unrestricted egress, or if workflows use actions that only
       duplicate a preinstalled tool.

remediation:
  manual: |
    1. Agree on the list of needed plugins, resolvers and tools with the pipeline owners.
    2. Reduce the set:
       - **Jenkins** (administrator): uninstall unneeded plugins from **Manage Jenkins** >
         **Plugins** > **Installed plugins** and keep the remaining list in `plugins.txt` or
         configuration as code.
       - **Tekton** (cluster administrator): set the unused `enable-*-resolver` keys to `"false"`
         in `resolvers-feature-flags`, and add a NetworkPolicy that limits resolver egress to the
         registries and Git servers in use.
       - **Argo CD** (administrator): remove `--load_restrictor none` from
         `kustomize.buildOptions`, limit `helm.valuesFileSchemes` to `https`, and run Config
         Management Plugins only for trusted repositories.
       - **GitHub**: replace actions flagged by zizmor `superfluous-actions` with the tool already
         present on the runner.
    3. Restart controllers where needed and run the main pipelines once.
  rollback: |
    Re-enable the resolver or reinstall the plugin, then plan its removal with its users.

