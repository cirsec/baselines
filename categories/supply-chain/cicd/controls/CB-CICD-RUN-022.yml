    publisher: Forgejo
    kind: vendor-doc
    accessed: 2026-11-03
  - title: Self-managed runner security (static hosts and credentials)
    url: https://docs.gitlab.com/runner/security/
    publisher: GitLab
    kind: vendor-doc
    accessed: 2026-11-03
