# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-IAM-011
title: Disable anonymous access to CI/CD platforms
finding:
  title: Unauthenticated users can browse projects, pipelines or executions
  description: Anonymous access exposes source code, pipeline definitions, build logs and deployment history to anyone who reaches the platform, which helps an attacker find secrets and weak pipelines.
status: draft
profiles: [baseline]
risk:
  severity: high
assessment: manual
tags: [anonymous-access, guest, public-access, visibility]

applicability:
  versions: [argo-cd, bitbucket, forgejo, gitea, github, gitlab, harness, teamcity]

parameters:
  - name: signin_required_for
    type: enum
    description: Which content requires sign-in. `private-content` blocks anonymous access to non-public projects, pipelines and executions; `everything` requires sign-in for every page and API call.
    default: private-content
    profile_defaults:
      hardened: everything
    allowed: [private-content, everything]

description: |
  Unauthenticated users cannot see private projects, pipelines, executions, logs or APIs of the
  platform: guest and anonymous access is off, public access features are disabled, and new projects
  and groups default to private. With `{{ signin_required_for }}` set to `everything`, internal
  instances require sign-in for every page and API call, including explore pages and public
  repositories.

  Visibility of individual job logs to signed-in non-members is covered by CB-CICD-PIPE-022, public
  build artifacts by CB-CICD-ART-010.
rationale: |
  Anonymous read access is enough to harvest secrets printed in logs, map the deployment targets and
  find pipelines that run untrusted code. Platforms that allow it per project make accidental exposure
  easy: one project switched to public, or one feature flag enabled, publishes its history. Requiring
  sign-in everywhere removes the question on internal instances.
impact: |
  Public status badges, anonymous clone URLs and unauthenticated dashboards stop working. Open-source
  projects hosted on the same instance need a separate public instance or an exception.

audit:
  manual: |
    Use an administrator role or read access to the platform configuration.

    1. Check anonymous and public access:
       - **Argo CD**: `argocd-cm` does not set `users.anonymous.enabled: "true"`; if it does,
         `policy.default` in `argocd-rbac-cm` grants nothing.
       - **TeamCity**: **Administration** > **Authentication**: guest login is disabled.
       - **Harness**: **Account Settings** > **Authentication** > **Allow public access to
         resources** is off (the feature sits behind the `PL_ALLOW_TO_SET_PUBLIC_ACCESS` flag), and no
         pipeline is marked public.
       - **Gitea / Forgejo**: with `everything`, `[service] REQUIRE_SIGNIN_VIEW = true`.
       - **Bitbucket Data Center**: `bitbucket.properties` sets `feature.public.access=false`, or no
         project or repository has public access enabled.
       - **GitHub Enterprise Server**: **Management Console** > **Private mode** is
         enabled.
       - **GitLab self-managed**: **Admin** > **Settings** > **General** > **Visibility and access
         controls**: **Default project visibility** and **Default group visibility** are Private, and
         **Restricted visibility levels** includes Public (and Internal when `everything` applies).
    2. From a browser without a session, open the platform URL, the explore page and an API listing
       endpoint.
    3. Fail if non-public content is reachable without signing in, or, with `everything`, if any page
       or API call answers without authentication.

remediation:
  manual: |
    1. List projects that rely on anonymous access and agree on exceptions.
    2. Apply the setting (administrator role):
       - **Argo CD**: remove `users.anonymous.enabled` or set it to `"false"`.
       - **TeamCity**: disable guest login in **Administration** > **Authentication**.
       - **Harness**: turn off **Allow public access to resources**.
       - **Gitea / Forgejo**: set `REQUIRE_SIGNIN_VIEW = true` in `[service]` and restart.
       - **Bitbucket Data Center**: set `feature.public.access=false` in `bitbucket.properties` and
         restart.
       - **GitHub Enterprise Server**: enable **Private mode** in the Management Console.
       - **GitLab self-managed**: set default visibilities to Private and add Public to
         **Restricted visibility levels**.
    3. Change existing public projects to private or internal.

