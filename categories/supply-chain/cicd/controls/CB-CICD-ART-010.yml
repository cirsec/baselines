# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-ART-010
title: Keep build artifacts, build results and artifact storage private
finding:
  title: Build artifacts, logs or artifact buckets are readable or writable by anyone
  description: Public artifact buckets, public build projects or world-readable job artifacts expose internal binaries, logs and leaked secrets, and a writable bucket lets an attacker swap artifacts between pipeline stages without touching the reviewed source.
status: draft
profiles: [baseline]
risk:
  severity: high
assessment: manual
tags: [artifacts, storage, s3, visibility, access-control, public-builds]

description: |
  Storage that holds build artifacts and intermediate outputs (S3 or other object storage buckets,
  the platform's built-in artifact store, workflow artifact repositories) is private: no public ACL,
  no public bucket policy, and only the pipeline and deployment identities that need it can read or
  write. Build projects and pipelines whose logs and artifacts would otherwise be published are set
  to private, unless the project is deliberately public and its builds contain nothing sensitive.

  Access to the artifacts of sensitive jobs (release builds, jobs that handle secrets) is limited to
  the roles that need them, artifacts expire when no longer needed, and the credentials used to write
  to artifact storage are scoped to one namespace, project or prefix rather than shared across the
  platform.

  Visibility of job logs in the platform UI is covered by CB-CICD-PIPE-022; encryption of artifact
  storage by CB-CICD-ART-011; who may publish to release registries by CB-CICD-ART-009.
rationale: |
  Build outputs regularly contain things that were never meant to leave the organization:
  proprietary binaries, configuration, test data and secrets printed into logs or packed into
  archives. Public read access hands them to anyone. Write access is worse: artifacts passed between
  stages through a writable bucket can be replaced after review and before deployment, so the
  deployed code no longer matches the reviewed source.
impact: |
  Consumers that downloaded artifacts anonymously (for example open-source users of a public build)
  need another channel, such as a release page. Tightening bucket policies can break pipelines that
  relied on broad credentials, so they must be tested.
notes: |
  The Buildkite agent uploads to a customer S3 bucket with the `public-read` ACL by default
  (`BUILDKITE_S3_ACL`); set `private`, or `bucket-owner-full-control` for buckets with ACLs disabled.
  Restricting who can change pipeline visibility in Buildkite needs the Enterprise plan. In GitLab,
  `artifacts:access` only controls UI and API downloads: jobs using a job token can still fetch
  artifacts unless the project's CI/CD visibility is **Only project members**. Making an AWS
  CodeBuild project public exposes all its past build results, logs and artifacts, including builds
  run while it was private.

audit:
  manual: |
    Use a role that can read storage policies, project settings and pipeline definitions.

    1. List where build artifacts are stored: the platform's built-in store and any external bucket
       or repository.
    2. For each external bucket, check that public access is blocked, no policy or ACL grants read or
       write to everyone or to all authenticated users, and only the pipeline and deployment roles
       have access.
    3. Check platform settings:
       - **Buildkite**: agents set `BUILDKITE_S3_ACL=private` (or `bucket-owner-full-control`);
         pipelines are not public unless intended, and on Enterprise the organization **Security**
         page restricts who can change pipeline visibility.
       - **AWS CodeBuild / CodePipeline**: build projects do not have **Enable public build access**
         selected; the CodePipeline artifact bucket has S3 Block Public Access on and a bucket policy
         limited to the pipeline and action roles.
       - **GitLab**: jobs that produce sensitive artifacts set `artifacts:access: developer`,
         `maintainer` or `none` and an `artifacts:expire_in`; public projects with sensitive pipelines
         set CI/CD visibility to **Only project members**.
       - **TeamCity**: **Project Settings** > **Artifacts Storage** points to a private bucket or the
         built-in store, and the server's artifact directory is readable only by the service.
       - **Argo Workflows**: each namespace uses its own artifact repository
         (`artifactRepositoryRef` or an `artifact-repositories` ConfigMap per namespace), credentials
         come from workload identity (IRSA) rather than static keys, and `insecure` is `false`.
    4. Fail if any artifact store or build project is publicly readable or writable without a
       documented decision, or if one storage credential can write the artifacts of every project.

remediation:
  manual: |
    1. Block public access on every artifact bucket and rewrite its policy to allow only the
       pipeline and deployment identities that need it.
    2. Fix platform settings:
       - **Buildkite**: export `BUILDKITE_S3_ACL=private` in the agent environment (or
         `bucket-owner-full-control` for ACL-disabled buckets) and make non-open-source pipelines
         private.
       - **AWS CodeBuild**: in **Build details** > **Project configuration** > **Edit**, clear
         **Enable public build access**.
       - **GitLab**: add `artifacts:access: developer` (or stricter) and a short `artifacts:expire_in`
         to sensitive jobs, and set CI/CD visibility to **Only project members** where needed.
       - **TeamCity**: in **Project Settings** > **Artifacts Storage**, use a private bucket with
         scoped credentials.
       - **Argo Workflows**: create one artifact repository per namespace and switch credentials to
         IRSA or the cloud's workload identity.
    3. Rotate any secret that was present in previously public artifacts or logs.

