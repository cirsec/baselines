# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-RUN-021
title: Harden and patch runner hosts and build images
finding:
  title: Runner software, hosts or build images are outdated
  description: Runners on old agent versions, unpatched operating systems or images rebuilt months ago carry known vulnerabilities that a job can exploit to escape its sandbox, take over the host or tamper with other builds.
status: draft
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [runners, patching, hardening, images, vulnerability-management]

description: |
  Runner and agent software, the runner host operating system and the images that runners boot or run
  jobs in are hardened and kept current:

  - runner software updates automatically, or is updated within the vendor's support window and at
    most 30 days after a security release;
  - hosts and images follow a hardening baseline (minimal packages, no compilers or tools that jobs do
    not need, no inbound remote access) and receive security updates;
  - runner images are rebuilt regularly from patched bases and have a bounded maximum age, after which
    they are no longer used.

  Patching of the CI/CD server itself is covered by CB-CICD-PLAT-002; host-level hardening of the
  platform by CB-CICD-PLAT-017.
rationale: |
  Runners execute untrusted code by design. Each known vulnerability in the runner, container runtime
  or kernel is a way out of the job's sandbox. Long-lived images also accumulate tools that make
  post-exploitation easier.
impact: |
  An image pipeline and a rotation schedule are needed. Turning off automatic runner updates (common
  for ephemeral container runners) moves the update duty to the image pipeline.
notes: |
  GitHub requires self-hosted runners with automatic updates turned off (`--disableupdate`) to be
  updated within 30 days of a new release. For GitHub custom images on larger runners (GitHub
  Enterprise Cloud), enterprise retention policies default to 20 versions per image, 30 days unused
  retention and a 60-day maximum version age (configurable from 7 to 90 days). Audit tools such as
  poutine flag known vulnerabilities in build platform versions.

audit:
  manual: |
    Use read access to runner inventory, image pipelines and host patch reports.

    1. List runner software versions per pool and compare with the latest release.
    2. Check the age of the images in use and the date of the last host patch cycle.
    3. Check the hardening baseline applied to runner hosts and images (packages installed, services
       listening, remote access).
    4. Per product:
       - **GitHub**: runners keep automatic updates on, or are registered with `--disableupdate` and
         updated by the image pipeline within 30 days of a release. On GitHub Enterprise Cloud with
         custom images, **Enterprise** > **Policies** > **Actions** > **Custom images** limits which
         organizations may create them and sets **Maximum version age**.
       - **Buildkite**: agents run a current `buildkite-agent` version and images are rebuilt with
         patched operating systems and tools.
    5. Fail if a runner version is older than 30 days after a security release, a runner image is older
       than the defined maximum age, or hosts miss available security updates.
remediation:
  manual: |
    1. Build runner images in a pipeline from a minimal, hardened base; rebuild them at least monthly and
       on security releases.
    2. Turn on automatic runner updates, or include runner upgrades in the image pipeline.
    3. **GitHub** (GitHub Enterprise Cloud custom images): as an enterprise owner, set **Maximum version
       age** to 30 to 60 days in the custom images retention policy.
    4. Replace runners still on old images, and remove tools that jobs do not need from images.

