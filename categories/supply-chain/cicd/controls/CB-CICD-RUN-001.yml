# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-RUN-001
title: Build release artifacts on a managed build platform
finding:
  title: Release artifacts are built on developer workstations or unmanaged hosts
  description: An artifact built on a laptop or an ad hoc server carries whatever that machine held at build time, with no platform record of how it was produced, so a compromised workstation can ship tampered releases unnoticed.
status: draft
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [build-platform, release, slsa, provenance, runners]

description: |
  Every artifact that is released or deployed is built by the organization's CI/CD build platform
  (hosted service or self-managed platform run by a platform team), from a pipeline definition kept
  in version control. No release artifact is built on a developer workstation, an administrator's
  server or a one-off virtual machine and then uploaded by hand.

  The build platform is chosen for the SLSA Build level the organization targets: it runs builds on
  infrastructure it controls, keeps a record of each run, and can generate provenance for the
  artifact (CB-CICD-ART-001). Self-hosted runners attached to the platform are allowed; their
  hardening is covered by the other RUN controls.
rationale: |
  A build on a personal machine depends on that machine's state: local tools, cached dependencies,
  modified sources, malware. Nobody can tell afterwards what produced the artifact. A managed build
  platform runs a known pipeline on controlled infrastructure and leaves a log and a provenance
  record, which is the precondition for every later integrity check.
impact: |
  Teams that publish from workstations must move their release steps into a pipeline. Some
  artifacts (signed mobile builds, firmware) may need dedicated runners with special hardware or
  keys before the move.
notes: |
  SLSA treats self-hosted runners as outside the build platform's own trust boundary even at Build
  L3: the platform vouches for the provenance, the organization vouches for the runner. This
  control is about where release builds run, not a ban on self-hosted runners.

audit:
  manual: |
    Use a role that can read release records, package registry metadata and pipeline run history.

    1. List the artifacts released in the review period (packages, container images, binaries,
       mobile builds) and, for each, find the pipeline run that produced it.
    2. Check the uploader identity in the registry: it is a CI identity, not a person
       (CB-CICD-ART-009).
    3. Where provenance is published, check that the builder identity names the build platform.
    4. Ask release owners how each product is built and released; look for manual upload steps in
       release runbooks.
    5. Fail if any released artifact has no matching pipeline run on the build platform, or was
       uploaded by a person from a build made outside the platform.
remediation:
  manual: |
    1. For each product released by hand, write the build and release steps as a pipeline in the
       repository and run it on the organization's build platform.
    2. Give the publishing step a CI identity and remove personal publishing rights from the
       registry (CB-CICD-ART-009).
    3. Enable provenance generation on the platform (CB-CICD-ART-001).
    4. Update release runbooks to start the release pipeline instead of uploading files.

