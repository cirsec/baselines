# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-SCM-022
title: Accept only commits attributed to verified platform users
finding:
  title: Commits can claim any author or committer identity
  description: Git lets anyone write any name and email in a commit, so a pushed commit can impersonate a trusted maintainer and mislead reviewers, audit and any rule that trusts the author field.
status: draft
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [push-rules, commit-identity, attribution, gitlab]

applicability:
  versions: [gitlab]

description: |
  GitLab push rules reject commits whose committer email is not a verified email of the user
  pushing them, whose author is not a GitLab user, or whose committer name does not match the
  pusher's name. The rules are set at instance or top-level group level and present in every
  project.

  Cryptographic commit signatures are covered by CB-CICD-SCM-023.
rationale: |
  Commit metadata is free text. Without these push rules, a developer, or an attacker with a
  developer's token, can push commits that show another person as author and committer. Reviewers
  give more trust to familiar names, and incident responders follow the wrong lead. Tying commits
  to verified platform accounts makes the history attributable without requiring every developer
  to manage signing keys.
impact: |
  Developers must commit with an email address verified in their GitLab account. Commits imported
  from other systems or written by tools with a generic identity are rejected until the identity is
  fixed or the tool uses a GitLab account.
notes: |
  Push rules need GitLab Premium. Instance push rules are copied only to projects created after
  they are set; existing projects keep their own rules and must be updated one by one or through
  the API.

audit:
  manual: |
    Use an administrator, group Owner or project Maintainer role.

    1. Check the push rules at each level:
       - **Instance**: **Admin** > **Push rules**.
       - **Group**: **Settings** > **Repository** > **Pre-defined push rules**.
       - **Project**: **Settings** > **Repository** > **Push rules**.
    2. Check that **Reject unverified users**, **Check whether the commit author is a GitLab user**
       and **Reject inconsistent user name** are selected.
    3. Check a sample of existing projects, since instance rules do not apply to projects created
       before them.
    4. Fail if any project accepts commits from unverified or non-GitLab identities.

remediation:
  manual: |
    1. Ask developers to add and verify the email address they use in Git, and give tools a GitLab
       account (service account or project bot).
    2. Select **Reject unverified users**, **Check whether the commit author is a GitLab user** and
       **Reject inconsistent user name** at instance and top-level group level.
    3. Apply the same rules to existing projects through the project settings or the push rules
       API.
  rollback: |
    Clear the push rules on the affected project if a legitimate import is blocked, then set them
    again once it is done.

