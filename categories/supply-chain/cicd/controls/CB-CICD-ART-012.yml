# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-ART-012
title: Make published releases and their records immutable and archive them read-only
finding:
  title: Published release tags, assets or their integrity data can be changed after release
  description: When a release tag can be moved or a release asset replaced after publication, an attacker or a mistaken re-run can change what users download under a version number they already trust, and the organization can no longer prove what it shipped.
status: draft
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [immutable-releases, release, archive, integrity, evidence]

description: |
  Once a version is released, its tag, its assets and the data that prove its integrity
  (checksums, signatures, provenance, SBOM, release notes listing the commit) cannot be changed or
  deleted: the tag cannot be moved, assets cannot be replaced, and a version number is never reused.
  Corrections are published as a new version.

  A copy of each release record is archived in read-only storage with restricted access, for as
  long as the version is supported plus the audit retention period: the artifacts, their integrity
  and provenance data, the module and dependency versions used, and the build and deployment
  configuration needed to reproduce or investigate the release.

  Protection of release tags in the source repository is covered by CB-CICD-SCM-010; immutable tags
  in registries by CB-CICD-ART-009.
rationale: |
  Users, deployment systems and auditors rely on a version number meaning the same bits forever.
  Mutable releases let an attacker who gains write access swap an asset or move a tag to malicious
  code while keeping a trusted version string, and they make incident investigation unreliable. A
  read-only archive keeps the evidence needed to answer "what exactly did we ship?" even if the
  hosting platform or repository is compromised or deleted.
impact: |
  Teams can no longer fix a release in place; they must publish a new version. Release workflows
  that upload assets after publishing must switch to draft first, then attach assets, then publish.
  The archive needs storage and a retention policy.
notes: |
  GitHub immutable releases lock the tag and assets of releases published after the setting is
  enabled, generate a release attestation, and prevent the tag name from being reused even if the
  repository is deleted and recreated. Title and release notes stay editable.

audit:
  manual: |
    Use a role that can read repository and organization settings and the release archive.

    1. List the repositories that publish releases.
    2. Check that published releases cannot be modified:
       - **GitHub**: organization **Settings** > **Repository** > **General** > **Releases** enforces
         immutability for all or selected repositories, or each repository has **Enable release
         immutability** selected under **Settings** > **General** > **Releases**; recent releases show
         the **Immutable** label.
       - Other platforms: release tags are protected (CB-CICD-SCM-010) and registry tags and package
         versions cannot be overwritten (CB-CICD-ART-009).
    3. Pick a recent release and check that the archive holds its artifacts, checksums, signatures,
       provenance, dependency versions and build configuration, and that the archive is read-only to
       everyone except the archiving process.
    4. Fail if a released tag can be moved or an asset replaced, if a version number was reused, or if
       the release record is missing from the archive.

remediation:
  manual: |
    1. Enable immutability:
       - **GitHub**: in organization **Settings** > **Repository** > **General**, under **Releases**,
         change **No policy** to **All repositories** (or **Selected repositories**); or in each
         repository **Settings** > **General** > **Releases**, select **Enable release
         immutability**. Change release workflows to create a draft, attach assets, then publish.
       - Other platforms: protect release tags and enable immutable tags or versions in the registry.
    2. Set up the archive: a bucket or vault with write-once or object-lock retention, written by the
       release pipeline only, readable by a small group.
    3. Add a release pipeline step that copies the release record to the archive.

