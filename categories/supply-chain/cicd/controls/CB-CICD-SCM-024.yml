# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-SCM-024
title: Verify source signatures before building and deploying
finding:
  title: Pipelines and GitOps controllers build or sync source without verifying its signature
  description: A controller that syncs whatever revision it finds will deploy a commit pushed with a stolen token or served by a tampered mirror, even if the organization signs its commits and tags.
status: draft
profiles: [hardened]
risk:
  severity: medium
assessment: manual
tags: [source-integrity, signature-verification, gitops, signed-tags]

description: |
  Before building a release or syncing a deployment, the consumer of the source checks that the
  revision is signed by a trusted key:

  - GitOps controllers verify the signature of the commit or tag they sync, against an explicit
    list of trusted keys, and refuse to sync otherwise;
  - release pipelines verify the signature of the release tag (and, where the history is fully
    signed, of the commit) before building, or check a source verification summary issued by the
    source platform.

  Signing on the source platform is covered by CB-CICD-SCM-023; verification of artifacts before
  deployment by CB-CICD-ART-006.
rationale: |
  Signing commits only helps if someone checks the signatures where the source is consumed. A
  GitOps controller has write access to production clusters: if it trusts any revision of its
  source repository, an attacker who can push to that repository, or who can intercept the
  connection, controls production. Verifying signatures at the consumer moves the trust from the
  Git server's access control to the signing keys of known maintainers.
impact: |
  All commits or tags consumed by the controller must be signed by keys that are registered in its
  configuration, and key rotation must be planned. Local syncs and unsigned automation commits are
  refused.
notes: |
  Argo CD: `spec.sourceIntegrity` on the AppProject replaces the deprecated `spec.signatureKeys`
  and cannot be combined with it; once enforced, `argocd app sync --local` no longer works, and
  verification is not supported for ApplicationSets generated by the git generator with a
  templated `project`. In `strict` mode Argo CD verifies the whole history, with seal commits to
  accept older unsigned history. Flux verifies OpenPGP and SSH signatures.

audit:
  manual: |
    Use a role that can read GitOps controller configuration and pipeline definitions.

    1. List the GitOps applications and release pipelines that deploy to production, and the
       repositories they consume.
    2. Check signature verification:
       - **Argo CD**: each AppProject used for production defines
         `spec.sourceIntegrity.git.policies` matching its repositories, with `gpg.mode` set to
         `head` or `strict` and a `keys` list; the keys are present in the `argocd-gpg-keys-cm`
         ConfigMap (`argocd gpg list`).
       - **Flux**: each production `GitRepository` sets `spec.verify.mode` (`HEAD`, `Tag` or
         `TagAndHEAD`) and `spec.verify.secretRef` naming a Secret with the trusted public keys;
         `kubectl get gitrepository` shows the `SourceVerified` condition as `True`.
       - **Release pipelines**: the build job runs `git verify-tag` (or `git verify-commit`) against
         a trusted keyring, or checks a source verification attestation, before building.
    3. Fail if a production deployment or release build consumes source without verifying its
       signature against a defined set of trusted keys.

remediation:
  manual: |
    1. Make sure the commits or tags consumed are signed (CB-CICD-SCM-023), and collect the public
       keys of the authorized signers.
    2. Enable verification:
       - **Argo CD**: import the keys with `argocd gpg add --from <key file>`, then add
         `spec.sourceIntegrity.git.policies` to the AppProject with the repository patterns,
         `gpg.mode: head` (or `strict` where the full history is signed) and the key IDs; remove
         `spec.signatureKeys`.
       - **Flux**: create a Secret with the public keys (`.asc` for OpenPGP, `.sshpub` for SSH) and
         set `spec.verify.mode` and `spec.verify.secretRef` on the `GitRepository`.
       - **Release pipelines**: add a step that imports the trusted keyring and runs
         `git verify-tag` on the release tag before the build.
    3. Document key rotation: add the new key, sign with it, then remove the old key.
  rollback: |
    Set the Argo CD policy `gpg.mode` to `none` or remove `spec.verify` from the Flux
    `GitRepository` if a valid deployment is blocked, then fix the signing issue.

