# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-IAM-023
title: Give external collaborators least privilege and time-bound access
finding:
  title: Outside collaborators and guests keep broad access after their work ends
  description: Contractors and guests with admin or write access that nobody reviews keep it after the engagement ends, and their accounts are outside the organization's MFA and leaver process.
status: draft
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [outside-collaborators, guests, external-access, access-review]

description: |
  Outside collaborators, guests and contractors get access only to the repositories and projects they
  work on, with the lowest role that fits (read or write, never admin or owner), an end date recorded
  when access is granted, and a sponsor inside the organization. Their access is reviewed at least
  quarterly and removed when the work ends.

  Who may invite them is covered by CB-CICD-IAM-022.
rationale: |
  External accounts are managed by someone else: their MFA, device security and departure are not
  under the organization's control. Long-forgotten collaborators with write or admin rights are a
  recurring finding in SCM audits, and a compromised contractor account is a common supply chain
  entry point.
impact: |
  Sponsors must request renewals. Contractors who need long-term access should get a managed account
  in the identity provider instead.

audit:
  manual: |
    Use an owner or administrator role.

    1. List external users and their access:
       - **GitHub**: **Organization** > **People** > **Outside collaborators**
         (`GET /orgs/{org}/outside_collaborators`), then the repositories and role of each one.
         Allstar's outside collaborators policy can flag admin or push access continuously.
       - **Azure DevOps**: **Organization settings** > **Users** filtered on guest users; check that
         **Policies** > **External guest access** is off unless there is a business need, and that
         guests belong to one dedicated group.
       - **Other platforms**: list members whose identity is not from the corporate identity provider
         or domain.
    2. For each external user, check the sponsor, the end date and the role.
    3. Fail if an external user has admin or owner rights, has no recorded end date or sponsor, or
       kept access past the end of the work.

remediation:
  manual: |
    1. Lower external users to the lowest role per repository or project, and remove admin rights.
    2. Record a sponsor and an end date for each; put guests in a dedicated group.
    3. **Azure DevOps**: turn **External guest access** off when no guest is needed; otherwise manage
       guests through Entra (with an expiring access package or access review where available).
    4. **GitHub**: enable the Allstar outside collaborators policy, or review
       `/orgs/{org}/outside_collaborators` every quarter.
    5. Remove access on the end date and at each review when it is no longer justified.

