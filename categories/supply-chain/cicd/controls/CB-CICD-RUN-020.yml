# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-RUN-020
title: Restrict agents to allowed repositories and checked-in commands
finding:
  title: Agents build any repository and run any command they receive
  description: An agent that clones whatever repository a job names and runs whatever command string it receives will execute an attacker's code as soon as someone can create or change a pipeline, or abuse a compromised control plane.
status: draft
profiles: [hardened]
risk:
  severity: medium
assessment: manual
tags: [buildkite, agents, allowlist, command-eval]

applicability:
  versions: [buildkite]

description: |
  Self-hosted Buildkite agents accept jobs only for an allowlist of repositories
  (`allowed-repositories`, anchored regular expressions for the organization's repositories). Where
  pipelines can work with scripts committed in the repository, agents also run with command evaluation
  disabled (`no-command-eval`), so they execute only checked-in scripts and refuse arbitrary command
  strings sent by the control plane.

  Signed pipelines, plugin allowlists and pre-bootstrap hooks are complementary agent-side controls
  (CB-CICD-PIPE-006, CB-CICD-COMP-001).
rationale: |
  The agent trusts the control plane to tell it what to clone and run. Restricting repositories and
  commands on the agent itself means that a forged or modified job, from a compromised account, API
  token or control plane, cannot make the agent fetch a foreign repository or run a command that is not
  in reviewed source.
impact: |
  `no-command-eval` also disables plugins and forces strict checkout-override mode; pipelines must call
  scripts from the repository instead of inline commands. It does not protect against malicious changes
  to the repository itself, nor constrain a custom `command` hook, and jobs can still be influenced
  through environment variables.

audit:
  manual: |
    Use read access to agent configuration (`buildkite-agent.cfg`, start flags, environment variables
    or Agent Stack for Kubernetes values).

    1. For each agent pool, read the agent configuration.
    2. Check `allowed-repositories` (`--allowed-repositories`, `BUILDKITE_ALLOWED_REPOSITORIES`) is set
       to anchored, escaped patterns matching only the organization's repositories.
    3. Check `no-command-eval` (`--no-command-eval`, `BUILDKITE_NO_COMMAND_EVAL`) is `true` on agents
       whose pipelines use only checked-in scripts.
    4. Fail if an agent accepts any repository, or if command evaluation stays enabled on agents whose
       pipelines do not need it.
remediation:
  manual: |
    1. Set `allowed-repositories` on every self-hosted agent, for example
       `allowed-repositories="^git@github\.com:my-org/.*$"`, and apply it to all agents of a queue.
    2. Move inline commands of sensitive pipelines into scripts in the repository, then set
       `no-command-eval=true` on their agents.
    3. Combine with a pre-bootstrap hook or the environment variable allowlist to reject unexpected
       environment variables.
    4. Restart the agents and run the pipelines to confirm they still pass.

