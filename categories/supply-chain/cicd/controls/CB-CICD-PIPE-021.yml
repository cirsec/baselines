# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-PIPE-021
title: Sandbox Jenkins pipeline scripts and run builds with a non-system identity
finding:
  title: Jenkins pipeline scripts run unsandboxed or builds run as SYSTEM
  description: An unsandboxed Groovy script or a dangerous approved signature runs code inside the controller, and builds running as SYSTEM can start, configure or read any other job, so one editable Jenkinsfile can take over the whole instance.
status: draft
profiles: [baseline]
risk:
  severity: high
assessment: manual
tags: [jenkins, groovy-sandbox, script-approval, build-authorization, environment-filters]
applicability:
  versions: [jenkins]

description: |
  Pipeline scripts that users can edit run in the Groovy sandbox. The list of approved scripts and
  method signatures in **In-process Script Approval** contains no signature that gives access to
  the controller (for example `Jenkins.getInstance`, file or process execution APIs) and is
  reviewed periodically. Only global trusted libraries kept under controller-level change control
  run outside the sandbox (CB-CICD-PIPE-003).

  The expected level is `{{ build_identity }}`:

  - `sandboxed`: the sandbox is on for every user-editable Pipeline and no dangerous signature is
    approved;
  - `dedicated-user`: in addition, **Access Control for Builds** makes builds run as the user who
    triggered them or a specific low-privileged user instead of SYSTEM, and environment variable
    filters strip or reject unsafe variables (for example `PATH` and `LD_PRELOAD` overrides) on
    build steps.

  Builds running on the controller itself are covered by CB-CICD-RUN-008.
rationale: |
  Jenkins pipelines are Groovy programs executed by the controller. Outside the sandbox, or with a
  dangerous signature approved, a script can call internal APIs, read credentials of all jobs and
  run commands on the controller. By default builds run as SYSTEM, so a user who can configure one
  job can use pipeline steps to trigger or copy artifacts from any other job.
impact: |
  Scripts that relied on approved dangerous signatures must be moved to a trusted global library.
  Running builds as a specific user requires that user to hold the permissions the builds need
  (for example to trigger downstream jobs). The Authorize Project plugin is not actively
  maintained.
notes: |
  Disabling the sandbox for a Pipeline requires an administrator to approve the whole script.
  Environment variable filters are available since Jenkins 2.248 and LTS 2.249.1 and need plugins
  such as Safe Batch Environment Filter or Generic Build Step Environment Filters.

parameters:
  - name: build_identity
    type: enum
    description: sandboxed requires the Groovy sandbox and no dangerous approvals; dedicated-user also runs builds as a non-system user with environment variable filters.
    allowed: [sandboxed, dedicated-user]
    default: sandboxed
    profile_defaults:
      hardened: dedicated-user

audit:
  manual: |
    Use a Jenkins administrator account (read only is not enough to see script approvals).

    1. For each Pipeline job defined in the UI, check that **Use Groovy Sandbox** is ticked.
    2. Open **Manage Jenkins** > **In-process Script Approval** and review the approved scripts and
       signatures. Fail on signatures that reach the Jenkins instance, the file system or process
       execution, and on approved whole scripts that nobody owns.
    3. For `dedicated-user`:
       - **Manage Jenkins** > **Security** > **Access Control for Builds** (Authorize Project
         plugin) is configured to run builds as the user who triggered them or as a specific user,
         not SYSTEM;
       - **Manage Jenkins** > **System** > environment variable filters are configured for build
         steps (Safe Batch Environment Filter, Generic Build Step Environment Filters).
    4. Fail if a user-editable Pipeline runs outside the sandbox, if a dangerous signature is
       approved, or, for `{{ build_identity }}` = `dedicated-user`, if builds still run as SYSTEM.

remediation:
  manual: |
    1. Tick **Use Groovy Sandbox** on every UI-defined Pipeline; Jenkinsfile-based Pipelines from
       SCM run sandboxed by default.
    2. Revoke dangerous approvals in **In-process Script Approval** and move the code that needs
       them to a reviewed global trusted library.
    3. For `dedicated-user`: install the Authorize Project plugin, set **Access Control for
       Builds** to run as the triggering user or a dedicated user, and configure environment
       variable filters for build steps.
    4. Review the approval list on a schedule.

