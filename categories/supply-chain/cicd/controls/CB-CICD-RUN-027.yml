# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-RUN-027
title: Monitor runner activity and outbound connections
finding:
  title: Runner activity is not monitored
  description: Without runner logs kept off-host and without endpoint or egress monitoring, a job that steals secrets, opens a reverse shell or tampers with the runner leaves no trace once the runner is destroyed or cleaned.
status: draft
profiles: [hardened]
risk:
  severity: medium
assessment: manual
tags: [runners, monitoring, edr, egress, logging]

description: |
  Build infrastructure is monitored like other production hosts:

  - runner and agent application logs (job assignment, connections, errors) are forwarded to central
    log storage before ephemeral runners are destroyed;
  - runner hosts or nodes run endpoint detection (EDR) or runtime security monitoring;
  - outbound connections from runners go through a monitored proxy or egress monitoring that records
    destinations, and unexpected destinations raise alerts.

  Audit logs of the CI platform are covered by CB-CICD-LOG-001 and CB-CICD-LOG-003; network
  segmentation of runners by CB-CICD-RUN-023.
rationale: |
  Most CI compromises end with data leaving the runner: secrets, source code, signing keys. Runners are
  also short-lived, so evidence disappears with them unless it was shipped elsewhere. Monitoring
  processes and egress on the runner is often the only way to see the attack while it happens.
impact: |
  EDR agents and proxies add cost and can slow builds. A proxy needs an allowlist maintained with the
  build teams.
notes: |
  GitHub recommends forwarding runner application logs to external storage before deploying ephemeral
  autoscaled runners. Buildkite notes that proxy environment variables alone do not force all build
  traffic through the proxy: egress restrictions must be configured separately.

audit:
  manual: |
    Use read access to the logging and monitoring platforms and to runner images.

    1. Check that runner and agent logs from each runner type reach central storage, with a retention
       that covers incident investigation.
    2. Check that runner hosts or nodes run the organization's EDR or runtime monitoring agent and that
       its alerts are routed to the security team.
    3. Check how runner egress is monitored (proxy logs, flow logs, egress monitoring tool) and that
       alerts exist for unexpected destinations.
    4. Per product:
       - **GitHub**: self-hosted runner `_diag` logs (`Runner_*.log`, `Worker_*.log`) are forwarded
         before runners are destroyed; GitHub-hosted runners can use an egress monitoring tool such as
         StepSecurity Harden-Runner.
       - **Buildkite**: agents run behind a monitored proxy (`http_proxy`, `https_proxy`) combined with
         network egress restrictions.
    5. Fail if runner logs stay only on the runner, if runners have no endpoint monitoring, or if
       outbound connections are neither logged nor alerted on.
remediation:
  manual: |
    1. Add a log forwarder to runner images that ships runner and agent logs to the central platform.
    2. Install the EDR or runtime monitoring agent on runner hosts and Kubernetes nodes, with rules
       tuned for build workloads.
    3. Route runner egress through a logging proxy or capture flow logs, and create alerts for
       destinations outside the expected set.
    4. **Buildkite**: set `http_proxy` and `https_proxy` for the agent service and block direct egress at
       the network level.

