# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-ART-003
title: Record every dependency consumed by the build in the provenance
finding:
  title: Build provenance lists only the top-level source, not the dependencies the build pulled in
  description: When provenance omits the packages, base images and tools fetched during the build, a poisoned dependency leaves no trace in the release record and cannot be found quickly across releases after a compromise is disclosed.
status: draft
profiles: [hardened]
risk:
  severity: low
assessment: manual
tags: [provenance, dependencies, resolved-dependencies, slsa, sbom]

description: |
  The provenance of critical release artifacts lists every artifact the build consumed, in its
  `resolvedDependencies` (or equivalent) field, with a digest for each: source repositories, base
  images, packages, build tools and the outputs of earlier tasks or child pipelines.

  To make the list complete, dependencies are fetched in a dedicated step that the platform
  observes (prefetching), pulled through a proxy that records them, or vendored in the source
  repository, and pipelines made of several tasks report the inputs of each task, not only the
  inputs of the top-level run.

  An SBOM of the shipped artifact is a different record (what is inside the artifact) and is covered
  by the dependency standard (CB-DEP-INV-001).
rationale: |
  Supply-chain attacks often arrive through a dependency resolved during the build, not through the
  application source. With a complete list of consumed inputs in signed provenance, a team can
  answer "which releases were built with this compromised package or image?" from records instead of
  rebuilding or guessing, and a verifier can refuse artifacts built from unapproved inputs.
impact: |
  Builds must fetch dependencies in a way the platform can observe, which can mean restructuring
  pipelines (prefetch steps, a recording proxy, vendoring). Provenance documents grow larger. The
  completeness requirement goes beyond the published SLSA v1.2 levels.
notes: |
  The SLSA "dependencies complete" requirement is a draft for a future Build level (v1.3) and is not
  part of SLSA v1.2. Tekton Chains only inspects pipeline-level results unless
  `artifacts.pipelinerun.enable-deep-inspection` is `"true"`; with it, the inputs and outputs of
  child TaskRuns are captured too.

audit:
  manual: |
    Use a role that can read pipeline definitions, platform configuration and attestations.

    1. Pick a recent critical release and open its provenance.
    2. Compare `resolvedDependencies` (or the platform's equivalent field) with the inputs the build
       actually used: lock files, base image references, tool downloads, outputs of earlier tasks.
    3. Check how dependencies reach the build: a prefetch step, a recording proxy or vendored
       sources, rather than ad hoc downloads inside build scripts.
    4. Platform settings:
       - **Tekton**: in the `chains-config` ConfigMap, `artifacts.pipelinerun.enable-deep-inspection`
         is `"true"` and the format is `slsa/v2alpha4`; check with
         `kubectl get configmap chains-config -n tekton-chains -o yaml`.
       - Other platforms: review the provenance content manually; no platform setting makes it
         complete on its own.
    5. Fail if a dependency used by the build is missing from the provenance, or if it is listed
       without a digest.

remediation:
  manual: |
    1. Move dependency resolution into a dedicated, early step that fetches everything by digest or
       from a lock file, and keep later steps offline where possible (CB-CICD-RUN-024).
    2. Route package and image downloads through an internal proxy or registry that records what each
       build fetched (CB-DEP-SRC-001), or vendor the dependencies.
    3. Make the provenance include these inputs:
       - **Tekton**: set `artifacts.pipelinerun.enable-deep-inspection: "true"` in `chains-config`
         and use type-hinted results in tasks so Chains can record each task's inputs.
       - Other platforms: add the resolved inputs to the attested material with the provenance
         generator's options, or attach a signed attestation listing them.
    4. Spot-check a release each quarter by comparing its provenance with its lock files.

