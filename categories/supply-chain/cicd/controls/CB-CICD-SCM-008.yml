# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-SCM-008
title: Limit branch creation to trusted contributors on pipeline repositories
finding:
  title: Any contributor can create branches in repositories that hold pipelines
  description: A user who can create a branch can push a modified pipeline definition to it and have it run with the pipeline's service connections and secrets, even without permission to contribute to protected branches.
status: draft
profiles: [hardened]
risk:
  severity: medium
assessment: manual
tags: [branch-creation, poisoned-pipeline-execution, azure-repos, least-privilege]

applicability:
  versions: [azure-devops]

description: |
  In Azure Repos repositories that define pipelines, the **Create branch** permission is granted
  only to a group of trusted contributors. Other contributors work from forks and submit pull
  requests, so their changes to the pipeline definition do not run with the target repository's
  pipeline resources until reviewed.

  Protection of the branches that can reach secrets is covered by CB-CICD-PIPE-008; pipelines on
  pull requests from forks by CB-CICD-PIPE-010.
rationale: |
  A YAML pipeline runs the definition found on the branch that triggered it. Microsoft documents
  that a user with **Create branch** can introduce code into the repository even without
  **Contribute**: a new branch with an edited pipeline file then runs with the same agent pools,
  service connections and variable groups as the protected branches, unless those resources are
  further restricted. Limiting branch creation closes this poisoned pipeline execution path.
impact: |
  Contributors outside the trusted group must use forks, which changes their workflow and means
  pull request pipelines from forks run without secrets. Branch-based workflows (feature branches
  for everyone) are not compatible with this control on the affected repositories.

audit:
  manual: |
    Use a role that can read repository security (Project Administrators or **Manage permissions**
    on the repository).

    1. List the Azure Repos repositories that contain YAML pipeline definitions used by pipelines
       with access to service connections, variable groups or environments.
    2. Open **Project settings** > **Repositories** > **All Repositories** (or the repository) >
       **Security** and review **Create branch** for each group, including Contributors.
    3. Check **Project settings** > **Repositories** > **Settings** > **Allow users to manage
       permissions for their created branches**.
    4. Fail if **Create branch** is allowed for Contributors or other broad groups on these
       repositories.

remediation:
  manual: |
    1. Create a group of trusted contributors for each pipeline repository.
    2. In **Project settings** > **Repositories** > the repository > **Security**, set **Create
       branch** to **Allow** for that group and to **Not set** for Contributors (use **Deny** only
       to override an **Allow** inherited from elsewhere).
    3. Ask other contributors to work from forks of the repository.
    4. Restrict pipeline resources (service connections, agent pools, environments) to the
       protected branches with checks, so a branch created later cannot use them.
  rollback: |
    Set **Create branch** back to **Allow** for Contributors on the repository.

