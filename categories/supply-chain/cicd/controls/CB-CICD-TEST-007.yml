    kind: vendor-doc
    accessed: 2026-11-03
  - title: License scanning of CycloneDX files
    url: https://docs.gitlab.com/user/compliance/license_scanning_of_cyclonedx_files/
    publisher: GitLab
    kind: vendor-doc
    accessed: 2026-11-03
