# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-LOG-006
title: Alert on security-sensitive CI/CD events
finding:
  title: Security-sensitive CI/CD changes raise no alert
  description: Branch protection is removed, a secret or runner is added, a protection is bypassed or a package is published from an unexpected identity, and nobody is told; the attacker has days or weeks before the change is noticed by chance.
status: draft
profiles: [baseline]
risk:
  severity: high
assessment: manual
tags: [alerting, detection, siem, audit-log, monitoring]

description: |
  The SIEM raises alerts, handled by the security operations team, on CI/CD audit events that weaken
  protections or create new access, at least:

  - changes to branch protection, rulesets, required reviews and deployment protections, and every
    bypass of them;
  - creation or change of secrets and variables at organization, repository or environment level;
  - registration of runners or agents and changes to runner groups;
  - creation of tokens, deploy keys, app installations and webhooks;
  - grants of administrator or owner rights, and changes to CI/CD security policies (for example
    which actions may run, fork pull request approval);
  - bypass of secret scanning push protection;
  - changes to pipeline or build project definitions outside the normal path, and rejected
    approvals of production deployments;
  - package publishes and changes to registry permissions or package origin controls.

  Each alert has a documented triage procedure and, where the change is expected (for example by
  automation or a change ticket), a precise exception instead of a disabled rule.

  Runner behaviour monitoring is covered by CB-CICD-RUN-027 and GitOps reconciliation alerts by
  CB-CICD-LOG-007.
rationale: |
  Supply chain attackers who gain CI/CD access first weaken protections or add their own access: a
  new runner, a token, a removed review requirement, a pushed secret. These steps leave audit events
  minutes before the malicious build. Alerting on them turns the audit log from a forensic record
  into an early detection source.
impact: |
  Needs SIEM rules per platform and a triage process. Noisy rules must be tuned with exceptions for
  known automation identities.

audit:
  manual: |
    Use read access to the SIEM rules and to the alert history.

    1. List the alert rules on CI/CD sources and map them to the event families above.
    2. Check the platform-specific events:
       - **GitHub**: rules exist for audit log events such as `protected_branch.policy_override`,
         `protected_branch.destroy`, `repository_ruleset.update` and `repository_ruleset.destroy`,
         `org.update_actions_secret`, `repo.update_actions_secret` and
         `environment.update_actions_secret`, `org.register_self_hosted_runner`,
         `repo.register_self_hosted_runner` and `org.runner_group_created`,
         `org.update_actions_settings`, `org.set_actions_fork_pr_approvals_policy`,
         `secret_scanning_push_protection.bypass`, `personal_access_token.request_created`,
         `hook.create`, `integration_installation.create` and `packages.package_version_published`.
       - **AWS CodeBuild / CodePipeline / CodeArtifact**: rules exist on CloudTrail events
         `codebuild:UpdateProject`, `CreateWebhook`, `UpdateWebhook` and `ImportSourceCredentials`;
         `codepipeline:UpdatePipeline`; EventBridge `CodePipeline Action Execution State Change`
         events where an approval action is `FAILED` (rejected); and
         `codeartifact:PublishPackageVersion`, `PutPackageOriginConfiguration`,
         `PutRepositoryPermissionsPolicy` and `PutDomainPermissionsPolicy`.
    3. Trigger a harmless test event (for example create and delete a test secret) and check that the
       alert reaches the security team.
    4. Fail if one of the event families has no alert rule for a platform in use, or if alerts are
       not routed to a team that triages them.

remediation:
  manual: |
    1. Make sure the audit events are in the SIEM (CB-CICD-LOG-003); on GitHub Enterprise Cloud,
       enable API request events if token activity must be alerted on (CB-CICD-LOG-002).
    2. Write a rule for each event family and platform, starting with the GitHub and AWS events
       listed in the audit procedure, and the equivalent events of the other platforms in use.
    3. Add exceptions for named automation identities and change windows, not blanket
       suppressions.
    4. Write the triage steps for each alert (who to contact, how to confirm, how to revert) and
       link them to the incident runbook (CB-CICD-LOG-009).
    5. Test the rules after each platform change and at least once a year.

