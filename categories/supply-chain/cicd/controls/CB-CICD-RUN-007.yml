# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-RUN-007
title: Authenticate runner connections to the server and to source hosts
finding:
  title: Runners connect over unverified channels or accept unknown host keys
  description: A runner that talks to its server without TLS or certificate checks, or trusts any SSH host key on first checkout, can be fed jobs or source code by anyone positioned on the network, and leaks its credentials to them.
status: draft
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [runners, agents, tls, ssh, network]

description: |
  Runners and agents connect to the CI/CD server over TLS with certificate verification, or over
  WebSocket on the server's HTTPS endpoint. Agent listener ports that are not used are closed, and
  those that are needed are reachable only from the runner networks. Source checkouts over SSH check
  host keys against a managed `known_hosts` file instead of accepting new keys on first use.

  TLS settings of the platform itself are covered by CB-CICD-PLAT-004; TLS and host key checks for
  repository connections made by the platform are covered by CB-CICD-SEC-019.
rationale: |
  The runner connection carries jobs, secrets and runner credentials. Without verification, an
  attacker on the path can impersonate the server and read them, or impersonate a Git host and serve
  modified source that is then built and released.
impact: |
  Self-managed servers need a certificate the runners trust (internal CA distributed to runner
  images). Managed `known_hosts` files must be updated when a Git host rotates its keys.
notes: |
  Woodpecker serves agent gRPC without TLS and its agent skips certificate verification by
  default: put the server behind a TLS proxy or use a Unix socket for local agents. The Jenkins
  inbound agent TCP port reveals the Jenkins version to anyone who connects.

audit:
  manual: |
    Use read access to runner configuration (files, deployment manifests) and the server's security
    settings.

    1. For each runner type, check the server URL scheme and certificate verification settings.
    2. Check which agent listener ports the server exposes and from where they are reachable.
    3. Check how runners verify SSH host keys for checkouts.
       - **Woodpecker**: agents set `WOODPECKER_GRPC_SECURE=true` (default `false`) and
         `WOODPECKER_GRPC_SKIP_VERIFY=false` (default `true`).
       - **TeamCity**: `serverUrl` in each agent's `buildAgent.properties` starts with `https://`.
       - **Jenkins**: **Manage Jenkins** > **Security** > **Agents** > **TCP port for inbound
         agents** is disabled with inbound agents using WebSocket, or set to a fixed port reachable
         only from agent networks. The official Docker image exposes port 50000.
       - **Buildkite**: agents run with `no-ssh-keyscan=true` (`--no-ssh-keyscan`) and a managed
         `known_hosts`.
    4. Fail if a runner connects to the server without TLS or without certificate verification, if an
       agent port is reachable from outside the runner networks, or if SSH checkouts accept unknown
       host keys.
remediation:
  manual: |
    1. Give the CI server a certificate trusted by runner hosts and switch runner URLs to HTTPS.
    2. Per product:
       - **Woodpecker**: terminate agent gRPC on a TLS proxy (or a Unix socket via
         `WOODPECKER_GRPC_ADDR` for agents on the same host) and set `WOODPECKER_GRPC_SECURE=true`,
         `WOODPECKER_GRPC_SKIP_VERIFY=false` on agents.
       - **TeamCity**: set `serverUrl=https://...` in `buildAgent.properties` and restart the agents.
       - **Jenkins**: configure inbound agents to use WebSocket and disable the TCP agent port, or set
         a fixed port and allow it only from agent networks.
       - **Buildkite**: set `no-ssh-keyscan=true` and distribute a `known_hosts` file with the Git
         hosts' keys.
    3. Firewall unused agent ports on the server.

