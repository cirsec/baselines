# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-SCM-012
title: Require independent approval before merging to protected branches
finding:
  title: Pull requests can be merged into protected branches without an approving review
  description: Without a required approval, a single developer, or an attacker holding one developer's token, can merge any change, including a modified pipeline or a backdoor, into the code that is built and released.
status: draft
profiles: [baseline]
risk:
  severity: high
assessment: manual
tags: [code-review, approvals, four-eyes, flow-control, pull-requests]

description: |
  A pull or merge request into a default or release branch can only be merged after
  `{{ required_approvals }}` approving review(s) from people with write access who are not the
  author. Approvals from the platform's automation token or from AI agents acting under their own
  identity do not count toward this number (CB-CICD-SCM-013).

  The rule is enforced by the platform (blocking), not shown as a warning. Self-approval and
  last-pusher approval are covered by CB-CICD-SCM-013, reset of approvals on new commits by
  CB-CICD-SCM-014, and code owner review of sensitive paths by CB-CICD-SCM-018.
rationale: |
  Independent review is the main barrier between one compromised or malicious account and the
  production code base. It also catches honest mistakes in pipeline definitions that would expose
  secrets. Two approvals on critical repositories mean that two people must be fooled, or two
  accounts compromised, before code ships.
impact: |
  Each change waits for a reviewer, which slows small teams; agree on review turnaround times.
  Repositories maintained by one person need a second reviewer from another team. Bots that
  merge their own pull requests (dependency updates) need a review rule or a narrowly scoped
  exception.
notes: |
  GitHub adds one required approval by default for pull requests opened by Copilot without a
  human attribution (preview setting **Require an additional approval for unattributed Copilot pull
  requests**); keep it enabled. On GitLab, required approvals need Premium; the Free tier only has
  optional approvals. On Bitbucket Cloud, merge checks only block the merge with Premium (**Prevent
  a merge with unresolved merge checks**); on Standard they are warnings. On Azure DevOps,
  approvals from requestors do not count unless **Allow requestors to approve their own changes**
  is selected.

parameters:
  - name: required_approvals
    type: integer
    description: Minimum number of approving reviews from people other than the author.
    unit: approvals
    default: 1
    profile_defaults:
      hardened: 2
    minimum: 1
    maximum: 10

audit:
  manual: |
    Use a role that can read branch protection, merge request and branch policy settings.

    1. For each repository, check the review requirement on default and release branches:
       - **GitHub**: the ruleset rule **Require a pull request before merging** has **Required
         approvals** of at least `{{ required_approvals }}` (or the branch protection rule
         **Require a pull request before merging** > **Require approvals**). Scorecard `Code-Review` and legitify help at scale.
       - **GitLab** (Premium): **Settings** > **Merge requests** > **Merge request approvals**:
         approval rules targeting the protected branches require at least
         `{{ required_approvals }}` approvals, or a merge request approval policy enforces it.
       - **Azure DevOps**: branch policy **Require a minimum number of reviewers** is on with at
         least `{{ required_approvals }}` reviewers (repository or cross-repository policy).
       - **Bitbucket Cloud**: **Branch restrictions** > merge checks: **Minimum number of
         approvals** is at least `{{ required_approvals }}` and **Prevent a merge with unresolved
         merge checks** is selected (Premium).
       - **Bitbucket Data Center**: **Repository settings** (or **Project settings**) > **Merge
         checks** > **Minimum approvals** is enabled with at least `{{ required_approvals }}`.
       - **Gitea / Forgejo**: the branch rule's **Required approvals** is at least
         `{{ required_approvals }}`.
    2. Sample recently merged pull requests and confirm each had the required approvals from
       someone other than the author.
    3. Fail if a protected branch accepts merges with fewer than `{{ required_approvals }}`
       independent approvals, or if the check is only a warning.

remediation:
  manual: |
    1. Make sure every repository has at least two people able to review, borrowing reviewers
       from another team where needed.
    2. Set the requirement:
       - **GitHub**: in the ruleset, enable **Require a pull request before merging** and set
         **Required approvals** to `{{ required_approvals }}`.
       - **GitLab**: add an approval rule for the protected branches with
         `{{ required_approvals }}` required approvals, or a merge request approval policy at
         group level.
       - **Azure DevOps**: turn on **Require a minimum number of reviewers** with
         `{{ required_approvals }}` reviewers, as a cross-repository policy where possible.
       - **Bitbucket Cloud**: set **Minimum number of approvals** and enable **Prevent a merge with
         unresolved merge checks** (Premium).
       - **Bitbucket Data Center**: enable the **Minimum approvals** merge check.
       - **Gitea / Forgejo**: set **Required approvals** in the branch rule, optionally restricted
         to an allowlist of reviewers.

