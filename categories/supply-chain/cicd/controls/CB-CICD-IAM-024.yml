# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-IAM-024
title: Disable inactive platform accounts after a defined period
finding:
  title: Accounts unused for months keep their access to code and pipelines
  description: Dormant accounts and their tokens are not watched by anyone, so a takeover of one goes unnoticed, and their access was usually granted for work that has ended.
status: draft
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [dormant-accounts, inactivity, deprovisioning, access-review]

parameters:
  - name: max_inactivity_days
    type: integer
    description: Number of days without activity after which a user account is disabled or removed.
    unit: days
    default: 90
    minimum: 30
    maximum: 180

description: |
  User accounts without activity for {{ max_inactivity_days }} days are disabled or removed from SCM
  and CI/CD platforms, and their personal access tokens, SSH keys and sessions are revoked.
  Administrator accounts are reviewed with priority. The period is documented, and the platform's
  automatic deactivation is used where available; elsewhere a scheduled review applies it.

  Automatic deprovisioning of leavers is covered by CB-CICD-IAM-025, unused tokens by
  CB-CICD-IAM-031.
rationale: |
  Inactive accounts belong to people who changed roles, left, or never needed access. They are
  rarely protected as well as active ones and nobody notices when they start being used again, which
  makes them good targets for credential stuffing and for attackers who want to blend in.
impact: |
  Users who come back after a long absence must ask for reactivation. Some platforms do not count API
  or Git activity as activity: check the definition before automatic deactivation, so service
  accounts are not disabled (they should be non-human identities anyway, CB-CICD-IAM-027).
notes: |
  On GitHub Enterprise Server, dormancy ignores personal access token, SSH key and GitHub App use and
  Git operations on private repositories, and dormant users are not suspended automatically.

audit:
  manual: |
    Use an administrator or owner role that can see user activity.

    1. List accounts with their last activity:
       - **GitLab self-managed**: **Admin** > **Settings** > **General** > **Account and limit** >
         **Dormant users**: **Deactivate dormant users after a period of inactivity** is selected
         with at most {{ max_inactivity_days }} days (minimum 90). On GitLab.com, the top-level group
         removes dormant members automatically or the member list (`last_activity_on`) is reviewed.
       - **GitHub Enterprise Cloud**: **Enterprise settings** > **Compliance** > **Reports** >
         **Dormant Users**. On GitHub Enterprise Server, the dormant users list in the site admin
         dashboard, with the dormancy threshold set to the policy.
       - **Azure DevOps**: **Organization settings** > **Users** shows the last access date.
    2. For SSO platforms, check that the identity provider disables inactive identities on the same
       schedule.
    3. Fail if active accounts have been inactive longer than {{ max_inactivity_days }} days, or if
       their tokens are still valid.

remediation:
  manual: |
    1. Document the inactivity period.
    2. **GitLab self-managed**: enable **Deactivate dormant users after a period of inactivity** and
       set the number of days. On GitLab.com, enable automatic removal of dormant members for the
       group (group Owner).
    3. **GitHub**: download the dormant users report every quarter and remove or suspend the listed
       users; on GitHub Enterprise Server set the dormancy threshold and suspend dormant users.
    4. **Azure DevOps**: review **Users** each quarter, remove inactive users, and disable their Entra
       account if they left; revoke their PATs.
    5. Revoke tokens and SSH keys of every disabled account.

