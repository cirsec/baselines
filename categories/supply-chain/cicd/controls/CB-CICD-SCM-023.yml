# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-SCM-023
title: Require signed commits on protected branches
finding:
  title: Protected branches accept unsigned commits
  description: Without signatures, nothing proves that a commit on a release branch was written by the person it names, so a stolen token or a compromised mirror can introduce commits that look legitimate.
status: draft
profiles: [hardened]
risk:
  severity: medium
assessment: manual
tags: [commit-signing, signed-commits, provenance, integrity]

applicability:
  versions: [github, gitlab, gitea, forgejo]

description: |
  Commits pushed to default and release branches carry a valid cryptographic signature (GPG, SSH
  or S/MIME, or a platform-issued signature for web and bot commits) that the platform verifies,
  and pushes containing unsigned or unverifiable commits are rejected. Signing keys are registered
  on the developers' platform accounts, so a signature ties a commit to a known collaborator;
  developers protect their keys and use multi-factor authentication on the account that holds
  them.

  Verification of signatures by pipelines and GitOps controllers before building or deploying is
  covered by CB-CICD-SCM-024; identity checks without signatures by CB-CICD-SCM-022.
rationale: |
  Git author fields can be forged, and platform access tokens are a common target. A required
  signature means that pushing a commit attributed to a maintainer also requires that maintainer's
  private key. Signed history is also what downstream verification (pipelines, Argo CD, Flux) can
  check, giving source integrity beyond the platform's own access control.
impact: |
  Every developer must set up a signing key and register it, and tools that commit (release bots,
  dependency updaters) must sign their commits or commit through the platform API. Collaborators who
  push an unsigned commit must rewrite and force-push their own branch before merging.
notes: |
  On GitHub, commits made in the web interface, and commits made by a GitHub App through the API
  without custom author, committer or signature information, are signed by GitHub. Users who enable
  vigilant mode see unsigned commits that claim their identity flagged as unverified. On GitLab,
  **Reject unsigned commits** (Premium) still accepts commits created through the GitLab UI or API
  without signatures; the Web IDE is blocked by default in projects with this rule. On Gitea and
  Forgejo, the `[repository.signing] DEFAULT_TRUST_MODEL` decides which signatures count as
  verified; `collaborator` or `collaboratorcommitter` ties them to repository collaborators.

audit:
  manual: |
    Use a role that can read branch protection or push rules.

    1. Check the signing requirement on default and release branches:
       - **GitHub**: the ruleset enables **Require signed commits** (branch protection: **Require
         signed commits**). legitify and Checkov flag repositories without it.
       - **GitLab** (Premium): push rule **Reject unsigned commits** is selected at instance
         (**Admin** > **Push rules**), group (**Settings** > **Repository** > **Pre-defined push
         rules**) or project (**Settings** > **Repository** > **Push rules**) level.
       - **Gitea / Forgejo**: the branch rule enables **Require signed commits**, and `app.ini`
         `[repository.signing] DEFAULT_TRUST_MODEL` is `collaborator` or `collaboratorcommitter`.
    2. Inspect recent commits on protected branches (`git log --show-signature` or the platform's
       verification badge) and confirm they are verified.
    3. Fail if a protected branch accepts unsigned or unverified commits from developers or bots.

remediation:
  manual: |
    1. Help developers create signing keys and register them on their accounts; configure bots to
       sign or to commit through the platform API.
    2. Require signatures:
       - **GitHub**: enable **Require signed commits** in the ruleset for the protected branches.
       - **GitLab**: select **Reject unsigned commits** in the push rules at group or instance
         level, and in existing projects.
       - **Gitea / Forgejo**: enable **Require signed commits** in the branch rule and set
         `DEFAULT_TRUST_MODEL` to `collaborator` or `collaboratorcommitter`.
    3. Check that the merge method used for pull requests produces verified commits on the target
       branch.

