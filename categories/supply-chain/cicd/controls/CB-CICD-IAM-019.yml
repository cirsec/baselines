id: CB-CICD-IAM-019
title: Limit repository and project administrators to a few named owners
finding:
  title: Many users hold admin or owner rights on individual repositories
  description: Repository admins and project owners can remove branch protection, change pipeline settings and read or replace CI/CD variables, so each extra one is another account that can bypass review.
status: draft
profiles: [baseline]
risk:
  severity: medium
assessment: manual
tags: [repository-admin, project-owner, least-privilege, branch-protection]

applicability:
  versions: [github, gitlab]

description: |
  Each repository or project has a small number of administrators (two to three, so that one absence
  does not block changes), named and accountable. Other contributors get write or maintain access
  through teams or groups. Owner and Maintainer roles on GitLab count as administrators for this
  purpose, since both can change protection and CI/CD settings.

  Organization and instance administrators are covered by CB-CICD-IAM-018.
rationale: |
  Repository administrators can disable branch protection, push directly, change who approves, add
  deploy keys and webhooks, and on GitLab Maintainers can read unmasked CI/CD variables and edit
  protected branch settings. Spread across many accounts, these rights make review and approval
  rules easy to bypass.
impact: |
  Users losing admin or maintainer rights may need a team owner to make settings changes on their
  behalf.

audit:
  manual: |
    Use an organization owner or group owner role.

    1. List administrators per repository or project:
       - **GitHub**: **Repository settings** > **Collaborators and teams** filtered on **Admin**, or
         `GET /repos/{owner}/{repo}/collaborators?permission=admin`. Allstar's admin policy can flag
         repositories without a team or user admin.
       - **GitLab**: project **Manage** > **Members** filtered on Owner and Maintainer, or
         `GET /projects/:id/members/all`.
    2. Fail if a repository or project has more administrators (Owner plus Maintainer on GitLab) than
       the documented maximum, or none.

remediation:
  manual: |
    1. For each repository or project, name two or three administrators.
    2. Lower the others to write or maintain (GitHub) or Developer (GitLab), granted through a team or
       group.
    3. Add the list to the access review (CB-CICD-IAM-026).

references:
  - title: Repository roles for an organization (GitHub)
