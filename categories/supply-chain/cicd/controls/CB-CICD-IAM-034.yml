# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-IAM-034
title: Run each pipeline with a dedicated least-privilege cloud identity
finding:
  title: Builds run with a broad default or shared service identity
  description: Code in any built repository can do everything the build identity can; a default service account with editor-level roles or a pipeline role shared by many projects turns one compromised build into access to the whole cloud project.
status: draft
profiles: [baseline]
risk:
  severity: high
assessment: manual
tags: [service-role, service-account, least-privilege, cloud-build, codebuild]

applicability:
  versions: [aws-codesuite, google-cloud-build]

parameters:
  - name: default_build_identity
    type: enum
    description: How the platform's default build identity is handled. `unused` means no build or trigger uses it and it holds no extra roles; `blocked-by-policy` also prevents its use through organization policy.
    default: unused
    profile_defaults:
      hardened: blocked-by-policy
    allowed: [unused, blocked-by-policy]

description: |
  Each build project, trigger or pipeline runs as its own cloud identity (IAM service role or
  user-specified service account) that has only the permissions the job needs, on the resources it
  needs. Deploy actions that reach other accounts or projects assume separate roles scoped to the
  target. The platform's default build identity is `{{ default_build_identity }}`: never used by builds
  and stripped of roles it does not need, and with `blocked-by-policy` its use is prevented by
  organization policy.

  Who can change builds or act as their identity is covered by CB-CICD-IAM-036; cloud credentials of
  other CI platforms by CB-CICD-SEC-015; identities of Kubernetes build pods by CB-CICD-RUN-019.
rationale: |
  The build identity is available to every command in the build, including dependency install scripts
  and test code from the repository. A shared or default identity with broad roles (Compute Engine
  default service account with Editor, a CodePipeline role reused for every pipeline) lets one
  poisoned build read other projects' artifacts, change infrastructure or escalate through IAM.
impact: |
  Each project needs its own role or service account and an inventory of the permissions it uses.
  Builds that relied on implicit permissions of the default identity fail until the needed roles are
  granted to the new one.
notes: |
  On Google Cloud Build, for triggered builds the service account set in the build config file is
  ignored: only the service account set on the trigger is used.

audit:
  manual: |
    Use a cloud role that can read build configurations and IAM policies (for example a viewer role
    plus IAM read).

    1. **AWS CodeBuild**: for each project, the service role (`serviceRole`) is specific to the project,
       its policies name the project's resources rather than `*`, and its trust policy for
       `codebuild.amazonaws.com` uses `aws:SourceArn` and `aws:SourceAccount` conditions.
    2. **AWS CodePipeline**: each pipeline has its own service role (`roleArn`), deploy actions that
       reach other accounts use an action-level `roleArn` scoped to the target, and console-created
       roles have been reduced to what the pipeline uses.
    3. **Google Cloud Build**: each trigger has a user-specified service account with only the roles
       it needs; no build runs as the Cloud Build legacy service account
       (`PROJECT_NUMBER@cloudbuild.gserviceaccount.com`) or the Compute Engine default service
       account, and those accounts do not hold roles they do not need (such as `roles/editor`). With
       `blocked-by-policy`, the organization policy has `constraints/cloudbuild.useBuildServiceAccount`
       and `constraints/cloudbuild.useComputeServiceAccount` set to not enforced, and
       `constraints/cloudbuild.disableCreateDefaultServiceAccount` enforced.
    4. Fail if a build runs with a default or shared identity, or if a build identity has permissions
       on resources unrelated to its project.

remediation:
  manual: |
    1. Create one role or service account per build project, trigger or pipeline, and grant only the
       actions and resources it uses (CloudTrail or Cloud Audit Logs show what it calls).
    2. **AWS**: attach the role to the CodeBuild project and CodePipeline pipeline; add
       `aws:SourceArn` and `aws:SourceAccount` conditions to the trust policy; use action-level roles
       for cross-account deploy actions.
    3. **Google Cloud Build**: set the service account on each trigger; remove unneeded roles from the
       legacy and Compute Engine default service accounts. With `blocked-by-policy`, set
       `constraints/cloudbuild.useBuildServiceAccount` and
       `constraints/cloudbuild.useComputeServiceAccount` to not enforced, and enforce
       `constraints/cloudbuild.disableCreateDefaultServiceAccount`, at organization or folder level.
    4. Remove the old shared roles once the builds run with their own identity.

