# yaml-language-server: $schema=../../../../schema/control.schema.json
id: CB-CICD-SEC-016
title: Pin cloud trust policies for CI ID tokens to a repository and a protected ref
finding:
  title: Cloud roles trust CI ID tokens from any repository, branch or project of the issuer
  description: A trust policy that checks only the issuer or the audience, or uses wildcards on the owner or repository, lets any pipeline on the platform, including a fork or another customer's project, assume the cloud role.
status: draft
profiles: [baseline]
risk:
  severity: critical
assessment: manual
tags: [oidc, workload-identity, federation, trust-policy, cloud-credentials]

description: |
  Every cloud role, workload identity pool, federated credential or secrets manager role that
  accepts ID tokens from a CI/CD platform checks the audience (`aud`) and a subject (`sub` or
  equivalent claims) bound to one specific repository or project and to a protected branch, tag or
  environment. No condition uses a wildcard on the owner, organization, repository or project path,
  and no role relies on the audience alone or on user-controlled claims such as user name or
  e-mail.

  When `{{ claim_binding }}` is `immutable-ids`, the subject also includes immutable identifiers of
  the owner and repository or project (numeric IDs) instead of names that can be reclaimed, and
  deploy roles add conditions on usage context where the provider supports them (source network,
  session tags, deploying identity).

  Using federated credentials instead of static keys is covered by CB-CICD-SEC-015.
parameters:
  - name: claim_binding
    type: enum
    description: repo-and-ref checks aud and pins sub to one repository and a protected ref or environment; immutable-ids also requires immutable owner and repository or project IDs in the claims checked, plus extra usage conditions on deploy roles.
    allowed: [repo-and-ref, immutable-ids]
    default: repo-and-ref
    profile_defaults:
      hardened: immutable-ids
rationale: |
  The CI platform's OIDC issuer is shared by every repository and every customer of that platform.
  A trust policy that only checks the issuer accepts tokens from all of them. Wildcards on the
  repository or branch let a fork, a new repository with a reused name, or an unreviewed branch
  assume a production role. Names can be reclaimed after a rename or deletion, which immutable IDs
  prevent.
impact: |
  Each role needs a trust policy per repository and environment. Renaming or transferring a
  repository changes name-based subjects, and on GitHub may switch it to the immutable format,
  which breaks existing trust policies until they are updated.
notes: |
  GitHub immutable subject claims are the default for repositories created after 15 July 2026 and
  are not available on GitHub Enterprise Server. On AWS, GitLab's `project_id` and `namespace_id`
  condition keys exist only for the gitlab.com identity provider; self-managed instances can rely
  only on `sub`. CircleCI's default audience is the organization ID, which alone matches every
  project of the organization.

audit:
  manual: |
    Use read access to the cloud IAM trust policies and to the CI platform's OIDC settings.

    1. List the cloud roles, workload identity providers, federated credentials and secrets
       manager roles that trust a CI/CD issuer (for example `token.actions.githubusercontent.com`,
       `gitlab.com` or the self-managed instance URL, `oidc.circleci.com/org/<id>`).
    2. For each one, read the conditions:
       - **GitHub**: `token.actions.githubusercontent.com:aud` is set (for example
         `sts.amazonaws.com`, `api://AzureADTokenExchange`) and `:sub` names one repository and an
         environment (`repo:ORG/REPO:environment:prod`) or a protected ref, without `*` in the owner
         or repository segment. Check the repository's subject format under **Settings** >
         **Actions** > **OIDC** or with `GET /repos/{owner}/{repo}/actions/oidc/customization/sub`.
       - **GitLab**: the trust condition on `sub` names the project path and a protected ref
         (`project_path:GROUP/PROJECT:ref_type:branch:ref:main`) or environment; where the provider
         supports more claims, `ref_protected` or `environment_protected` is `true` and
         `project_id` or `namespace_id` is checked. On self-managed instances, **Admin** >
         **Settings** > **CI/CD** > **Continuous Integration and Deployment** > **Block JWT generation
         in reclaimed project paths** stays selected.
       - **CircleCI**: the trust policy checks the project (`oidc.circleci.com/project-id` condition
         key on AWS, or the project in `sub`) and a branch or `vcs-ref` claim where the provider
         allows it, not only `aud` equal to the organization ID.
       - **Buildkite**: trust policies match immutable claims such as `organization_id` and
         `pipeline_id` and the branch, rather than mutable slugs.
    3. When `{{ claim_binding }}` is `immutable-ids`, also check:
       - **GitHub**: the organization or repository uses immutable subject claims or a custom
         subject template with `repository_owner_id` and `repository_id` (API:
         `GET /orgs/{org}/actions/oidc/customization/sub` shows `include_claim_keys`), and trust
         policies match those IDs.
       - **GitLab**: trust policies check `project_id` or `namespace_id` where supported.
       - Deploy roles carry extra conditions (source IP ranges of the runners, required session
         tags) where the cloud provider supports them.
    4. Fail if a trust policy does not check the audience, accepts any repository, project or
       branch of the issuer, uses a wildcard on owner or repository, relies only on user-controlled
       claims, or, for `immutable-ids`, matches names instead of immutable IDs.

remediation:
  manual: |
    1. Rewrite each trust policy with exact `aud` and `sub` conditions for one repository and its
       protected branch or environment. Use one role per repository and environment.
    2. Per platform:
       - **GitHub**: deploy from jobs that declare `environment:` so the subject contains the
         environment name; for `immutable-ids`, opt in to immutable subject claims at organization
         level, or set a custom template with
         `PUT /orgs/{org}/actions/oidc/customization/sub` and `include_claim_keys` such as
         `repository_owner_id`, `repository_id` and `environment`, then update trust policies.
       - **GitLab**: add conditions on `ref_protected` / `environment_protected` and, on
         gitlab.com, on `project_id` and `namespace_id`; customize the project's `sub` claim with
         the projects API if the provider only supports `sub`. Never trust `user_login` or
         `user_email` alone.
       - **CircleCI**: add the `oidc.circleci.com/project-id` condition (AWS) or equivalent claim
         check, and a branch condition, to every role.
       - **Buildkite**: match `organization_id` and `pipeline_id` claims.
    3. Test each pipeline after the change and remove the old permissive policies.
  rollback: |
    Keep the previous trust policy statement in a disabled copy of the role for the duration of the
    migration; never restore wildcards on production roles.

