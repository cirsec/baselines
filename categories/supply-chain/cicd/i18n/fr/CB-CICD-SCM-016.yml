# yaml-language-server: $schema=../../../../../schema/control-i18n.schema.json
id: CB-CICD-SCM-016
locale: fr
source_updated: 2026-11-03
translators:
  - name: Alice
    github: Sn0wAlice
title: Bloquer la fusion tant que des fils de revue sont ouverts ou qu'un relecteur rejette
finding:
  title: Des pull requests peuvent être fusionnées avec des commentaires de revue non résolus ou un vote de rejet
  description: Un relecteur qui repère un problème et laisse un commentaire ou un vote de rejet n'empêche pas la fusion ; l'approbation obligatoire d'une autre personne suffit alors à livrer du code qu'un relecteur a signalé.
description: |
  Une pull request ou merge request vers une branche protégée ne peut pas être finalisée tant que
  des fils de revue ne sont pas résolus, ou qu'un relecteur a demandé des modifications ou voté
  rejet ou attente. L'auteur traite chaque fil, et c'est le relecteur, pas l'auteur, qui décide
  qu'un vote bloquant est levé.

  Le droit d'écarter une revue bloquante relève de CB-CICD-SCM-015.
rationale: |
  Les approbations obligatoires ne comptent que les votes positifs. Sans cette règle, l'objection
  d'un relecteur sécurité peut être couverte en silence par n'importe quel autre approbateur, ou
  rester sans réponse dans un fil pendant que la modification est fusionnée. Rendre bloquants les
  fils ouverts et les votes négatifs garde les réserves de chaque relecteur dans la décision de
  fusion.
impact: |
  Les auteurs doivent résoudre ou répondre à chaque fil avant de fusionner, et un relecteur absent
  peut bloquer une demande jusqu'à ce que quelqu'un ayant le droit adéquat écarte son vote.
notes: |
  Sur GitHub, une revue qui demande des modifications bloque déjà la fusion jusqu'à ce que ce
  relecteur approuve, mais toute personne ayant un accès en écriture peut l'écarter si ce droit
  n'est pas restreint (CB-CICD-SCM-015). Sur Bitbucket Cloud, les contrôles de fusion ne bloquent
  qu'avec Premium.
audit:
  manual: |
    Utiliser un rôle qui peut lire la protection de branche et les réglages de fusion.

    1. Vérifier les règles des branches par défaut et de release :
       - **GitHub** : la règle de ruleset **Require a pull request before merging** exige que toutes
         les conversations soient résolues (protection de branche : **Require conversation
         resolution before merging**).
       - **GitLab** : **Settings** > **Merge requests** > **Merge checks** > **All threads must be
         resolved** est coché.
       - **Azure DevOps** : la stratégie de branche **Vérifier la résolution des commentaires** est
         **Activée** et **Obligatoire**, et **Exiger un nombre minimal de réviseurs** a **Autoriser
         l'achèvement même si certains réviseurs votent pour attendre ou rejeter** décoché.
       - **Bitbucket Cloud** : les contrôles de fusion de la restriction de branche incluent **No
         changes are requested** et **No unresolved pull request tasks**, avec **Prevent a merge with
         unresolved merge checks** (Premium).
    2. Échec si une pull request peut être fusionnée alors qu'un fil n'est pas résolu ou qu'un vote
       de rejet, d'attente ou de demande de modifications est toujours en place.
remediation:
  manual: |
    1. Rendre bloquants les fils ouverts et les votes négatifs :
       - **GitHub** : activer la résolution des conversations dans la règle de pull request du
         ruleset.
       - **GitLab** : cocher **All threads must be resolved** dans les contrôles de fusion du projet.
       - **Azure DevOps** : régler **Vérifier la résolution des commentaires** sur **Obligatoire** et
         décocher **Autoriser l'achèvement même si certains réviseurs votent pour attendre ou
         rejeter**.
       - **Bitbucket Cloud** : ajouter les contrôles de fusion **No changes are requested** et **No
         unresolved pull request tasks** et les imposer (Premium).
    2. Convenir de la façon dont les relecteurs marquent un fil comme résolu, pour que les auteurs ne
       résolvent pas des fils sans réponse.
