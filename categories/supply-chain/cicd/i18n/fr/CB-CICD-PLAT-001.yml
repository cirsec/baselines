id: CB-CICD-PLAT-001
locale: fr
source_updated: 2026-11-03
translators:
  - name: Alice
    github: Sn0wAlice
title: Intégrer la chaîne CI/CD à l'analyse de risque et la protéger comme la production
finding:
  title: La chaîne CI/CD est absente de l'analyse de risque
  description: Les plates-formes, runners et services SaaS capables de déployer en production sont traités comme de l'outillage de développement ; ils sont moins protégés que les systèmes qu'ils modifient, et un attaquant atteint la production par leur intermédiaire.
description: |
  L'analyse de risque de l'organisation couvre toute la chaîne CI/CD : gestion du code source,
  plates-formes de CI et de CD, runners et hôtes de build, registres d'artefacts, contrôleurs
  GitOps, postes des développeurs et administrateurs qui peuvent modifier les pipelines,
  sous-traitants ayant un accès, et chaque service SaaS impliqué.

  Pour chaque service SaaS, l'analyse indique les données qu'il détient ou voit (code source,
  secrets, journaux de build, artefacts), où elles sont hébergées et sous quelle juridiction, et si
  c'est acceptable pour la confidentialité des projets concernés.

  Chaque composant reçoit au moins le niveau de protection de l'environnement le plus sensible
  qu'il peut déployer ou modifier : un pipeline qui déploie en production est protégé comme la
  production. L'analyse est revue quand une plate-forme, un mode d'hébergement ou une intégration
  majeure change.

  Les mesures techniques relèvent des autres contrôles CB-CICD ; ce contrôle vérifie qu'elles
  découlent d'une analyse de risque qui inclut la chaîne.
rationale: |
  Une chaîne CI/CD détient les identifiants et l'autorité pour modifier la production : compromettre
  un runner, un plugin, un poste de développeur ou une intégration SaaS est souvent plus simple
  qu'attaquer la production directement. Hors de l'analyse de risque, la chaîne est administrée avec
  des habitudes de développement (administrateurs partagés, serveurs non corrigés, jetons larges) et
  ses fournisseurs SaaS sont choisis sans regarder où vont le code et les secrets.
impact: |
  Ajoute les composants CI/CD au périmètre de l'analyse de risque et peut élever les exigences de
  protection des systèmes de build et de déploiement (administration, supervision, correctifs) à
  celles de la production.
audit:
  manual: |
    Demander au responsable du risque ou à l'équipe sécurité l'analyse de risque en vigueur et
    l'inventaire des composants CI/CD (CB-CICD-PLAT-002).

    1. Vérifier que le périmètre de l'analyse nomme explicitement les composants CI/CD en service :
       SCM, plates-formes de CI et de CD, runners, registres, contrôleurs GitOps, postes
       d'administration et de développement, sous-traitants et services SaaS.
    2. Pour chaque service SaaS, vérifier que les catégories de données, le lieu d'hébergement et la
       juridiction ont été évalués et acceptés pour le niveau de confidentialité des projets servis.
    3. Pour chaque composant qui peut déployer ou modifier un environnement, comparer son niveau de
       protection requis à celui de l'environnement.
    4. Comparer la date de la dernière revue au dernier changement de plate-forme ou d'hébergement.
    5. Échec si un composant CI/CD qui peut atteindre la production manque à l'analyse, si un
       service SaaS a été adopté sans évaluation des données et de leur localisation, ou si un
       composant a un niveau de protection requis inférieur à celui d'un environnement qu'il déploie.
remediation:
  manual: |
    1. Ajouter la chaîne CI/CD au périmètre de l'analyse de risque, en prenant l'inventaire de
       CB-CICD-PLAT-002 comme liste des composants.
    2. Évaluer chaque service SaaS : données détenues, région d'hébergement, juridiction,
       sous-traitants et garanties contractuelles ; consigner la décision.
    3. Attribuer à chaque composant le niveau de protection de l'environnement le plus sensible qu'il
       peut modifier et en déduire les mesures (administration, isolement, supervision, correctifs).
    4. Planifier une revue au moins annuelle et à chaque changement de plate-forme, de mode
       d'hébergement ou d'intégration majeure.
