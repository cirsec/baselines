# yaml-language-server: $schema=../../../../../schema/control-i18n.schema.json
id: CB-CICD-SCM-019
locale: fr
source_updated: 2026-11-03
translators:
  - name: Alice
    github: Sn0wAlice
title: Exiger la réussite des vérifications CI et sécurité avant la fusion
finding:
  title: Des pull requests peuvent être fusionnées sans réussir les vérifications CI et sécurité
  description: Quand les vérifications sont facultatives, ou que n'importe quelle intégration peut les déclarer, une modification qui casse les tests, introduit une vulnérabilité ou désactive une analyse de sécurité peut être fusionnée, et un faux statut de réussite suffit à satisfaire la règle.
description: |
  Une pull request ou merge request vers une branche protégée ne peut être fusionnée qu'après la
  réussite, sur son dernier commit, des vérifications CI et sécurité exigées (build, tests, analyse
  statique, analyses de dépendances et de secrets). Un pipeline sauté ou absent ne compte pas comme
  une réussite. Le rattachement des vérifications est fixé par `{{ check_binding }}` :

  - `required` : les vérifications sont déclarées obligatoires dans la règle de protection.
  - `bound-to-source` : en plus, chaque vérification obligatoire n'est acceptée que si elle vient
    de l'application ou de l'identité CI attendue, si bien qu'un statut publié par une autre
    intégration ou un utilisateur ne peut pas la satisfaire.

  Le choix des analyses de sécurité obligatoires relève de CB-CICD-TEST-001 ; le blocage sur
  nouvelles découvertes de CB-CICD-TEST-003 ; le test du résultat exact de la fusion de
  CB-CICD-SCM-020.
rationale: |
  Une vérification non obligatoire n'est qu'indicative : sous la pression elle est ignorée, et un
  attaquant peut simplement fusionner avant qu'elle se termine. Sur les plates-formes où les statuts
  de commit peuvent être posés par quiconque a un accès en écriture, un attaquant peut aussi
  publier une fausse « réussite » au nom de la vérification. Rattacher la vérification à
  l'application CI rend le résultat aussi fiable que le pipeline qui l'a produit.
impact: |
  Les fusions attendent la fin des pipelines, et les vérifications instables bloquent les
  livraisons jusqu'à leur correction. Renommer un job CI impose de mettre à jour la règle de
  protection.
notes: |
  Sur GitLab, seuls les pipelines exécutés par GitLab lui-même satisfont **Pipelines must
  succeed** ; le rattachement est donc intégré. Garder **Skipped pipelines are considered
  successful** décoché. Sur Gitea et Forgejo, les motifs de vérification de statut correspondent à
  des noms de contexte et ne peuvent pas être rattachés à une source ; `bound-to-source` repose alors
  sur la restriction de qui peut publier des statuts. Sur Azure DevOps, les stratégies de
  vérification de statut acceptent une **Identité autorisée**.
parameters:
  check_binding: Les vérifications obligatoires sont seulement listées, ou aussi rattachées à la source CI attendue.
audit:
  manual: |
    Utiliser un rôle qui peut lire la protection de branche, les réglages de merge requests et les
    stratégies de branche.

    1. Lister les vérifications CI et sécurité attendues sur chaque dépôt.
    2. Vérifier qu'elles sont obligatoires sur les branches protégées :
       - **GitHub** : la règle de ruleset **Require status checks to pass** (protection de branche :
         **Require status checks to pass before merging**) liste les vérifications CI et sécurité.
         Pour `bound-to-source`, chaque vérification a l'application CI (par exemple GitHub Actions)
         comme source attendue au lieu de **any source**. Scorecard `CI-Tests` aide à grande
         échelle.
       - **GitLab** : **Settings** > **Merge requests** > **Merge checks** : **Pipelines must
         succeed** est coché et **Skipped pipelines are considered successful** décoché ; le
         pipeline inclut les jobs de sécurité.
       - **Azure DevOps** : les stratégies de branche incluent une **Validation de build** réglée sur
         **Obligatoire** pour les pipelines CI et sécurité, avec une expiration du build, et des
         **Vérifications de statut** réglées sur **Obligatoire** pour les vérifications externes ;
         pour `bound-to-source`, chaque stratégie de vérification de statut fixe une **Identité
         autorisée**.
       - **Gitea / Forgejo** : la règle de branche active **Enable status check** avec des motifs
         correspondant aux jobs CI et sécurité.
    3. Échec si une branche protégée accepte des fusions sans que les vérifications attendues
       réussissent, si les pipelines sautés comptent comme réussis, ou, avec `bound-to-source`, si
       une vérification obligatoire peut être satisfaite par n'importe quelle source.
remediation:
  manual: |
    1. S'assurer que les pipelines publient des noms de vérification stables pour le build, les
       tests et les analyses de sécurité.
    2. Les rendre obligatoires :
       - **GitHub** : ajouter les vérifications à **Require status checks to pass** dans le ruleset ;
         pour `bound-to-source`, choisir l'application CI comme source de chaque vérification.
       - **GitLab** : cocher **Pipelines must succeed**, décocher **Skipped pipelines are considered
         successful**, et inclure les jobs de sécurité dans le pipeline (CB-CICD-TEST-001).
       - **Azure DevOps** : ajouter des stratégies de **Validation de build** (Obligatoire,
         déclenchement automatique, expiration à la mise à jour de la branche) et des stratégies de
         **Vérifications de statut** avec une **Identité autorisée**.
       - **Gitea / Forgejo** : cocher **Enable status check** et saisir les motifs de vérification de
         statut.
    3. Corriger ou mettre en quarantaine les vérifications instables plutôt que de les rendre
       facultatives.
