id: CB-CICD-SCM-026
locale: fr
source_updated: 2026-11-03
translators:
  - name: Alice
    github: Sn0wAlice
title: Publier une politique de sécurité et accepter les signalements privés de vulnérabilités sur les dépôts publics
finding:
  title: Les dépôts publics n'ont ni politique de sécurité ni canal de signalement privé
  description: Sans politique publiée ni canal privé, un chercheur qui trouve une vulnérabilité abandonne ou ouvre une issue publique, révélant la faille aux attaquants avant qu'un correctif existe.
description: |
  Chaque dépôt public publie une politique de sécurité (`SECURITY.md`) qui indique les versions
  prises en charge et comment signaler une vulnérabilité en privé, et active le signalement privé de
  vulnérabilités de GitHub pour que les signalements arrivent sous forme de brouillons d'avis de
  sécurité visibles des seuls mainteneurs.

  La politique peut être un `SECURITY.md` par défaut dans le dépôt `.github` de l'organisation, qui
  s'applique à tout dépôt qui n'a pas le sien. Le traitement des signalements reçus suit le
  processus de gestion des incidents et des vulnérabilités de l'organisation (CB-CICD-LOG-009).
rationale: |
  Le code public est lu par les chercheurs comme par les attaquants. Une politique claire et un
  canal privé rendent probable qu'une vulnérabilité parvienne d'abord aux mainteneurs, et leur
  laissent le temps de la corriger avant sa divulgation. Les signalements déposés en issues
  publiques exposent les utilisateurs du projet, y compris les pipelines qui consomment ses actions
  ou ses paquets.
impact: |
  Les mainteneurs doivent suivre et trier les signalements entrants dans le délai annoncé par la
  politique.
audit:
  manual: |
    Utiliser un rôle de propriétaire d'organisation ou un jeton qui peut lire les réglages des dépôts.

    1. Lister les dépôts publics de l'organisation.
    2. Pour chacun, vérifier qu'une politique de sécurité apparaît dans l'onglet **Security** du dépôt
       (`SECURITY.md` à la racine, dans `.github/` ou `docs/`, ou la politique par défaut de
       l'organisation). Le check `Security-Policy` de Scorecard et la politique `security` d'Allstar
       aident à grande échelle.
    3. Vérifier que **Settings** > **Advanced Security** > **Private vulnerability reporting** est
       activé, ou que la configuration de sécurité de l'organisation l'active pour les dépôts
       publics.
    4. Échec si un dépôt public n'a pas de politique de sécurité ou n'accepte pas les signalements
       privés de vulnérabilités.
remediation:
  manual: |
    1. Rédiger une politique de sécurité qui indique les versions prises en charge, comment signaler
       en privé et les délais de réponse attendus ; la publier comme `SECURITY.md` par défaut dans le
       dépôt `.github` de l'organisation, ou par dépôt depuis **Security** > **Security policy** >
       **Start setup**.
    2. Activer le signalement privé de vulnérabilités pour tous les dépôts publics via une
       configuration de sécurité de l'organisation, ou par dépôt dans **Settings** > **Advanced
       Security** > **Private vulnerability reporting** > **Enable**.
    3. Désigner des mainteneurs pour trier les signalements et publier les avis une fois la faille
       corrigée.
