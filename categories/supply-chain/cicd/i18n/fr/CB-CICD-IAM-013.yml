id: CB-CICD-IAM-013
locale: fr
source_updated: 2026-11-03
translators:
  - name: Alice
    github: Sn0wAlice
title: Réserver la création de nouvelles organisations CI/CD à des administrateurs approuvés
finding:
  title: Tout utilisateur du locataire de l'entreprise peut créer une nouvelle organisation CI/CD
  description: Les organisations créées hors gouvernance échappent aux stratégies, à l'envoi des journaux d'audit et aux revues d'accès des organisations officielles, et peuvent héberger du code et des pipelines que personne ne surveille.
description: |
  Seul un groupe d'administrateurs en liste d'autorisation peut créer de nouvelles organisations Azure
  DevOps connectées au locataire Microsoft Entra de l'entreprise. Les demandes de nouvelle
  organisation suivent un processus qui applique les stratégies standard (SSO, stratégies de PAT,
  envoi des journaux d'audit) avant toute utilisation.

  La création de dépôts et de projets dans une organisation relève de CB-CICD-SCM-001.
rationale: |
  Par défaut, tout membre d'un locataire Entra peut créer une organisation Azure DevOps. Ces
  organisations fantômes utilisent les identités de l'entreprise mais aucune des stratégies de niveau
  organisation, ne figurent pas dans l'inventaire, et hébergent souvent des pipelines oubliés avec des
  connexions de service vers la production.
impact: |
  Les équipes doivent demander les nouvelles organisations. Les organisations existantes ne sont pas
  affectées.
audit:
  manual: |
    Utiliser un compte qui a le rôle Azure DevOps Administrator dans Microsoft Entra.

    1. Dans une organisation connectée au locataire, ouvrir **Paramètres de l'organisation** >
       **Microsoft Entra ID** et vérifier que la stratégie de locataire **Restrict organization
       creation** est activée, avec une liste d'autorisation limitée au groupe des administrateurs et
       un message d'erreur personnalisé qui renvoie vers le processus de demande.
    2. Lister les organisations connectées au locataire et les comparer à l'inventaire.
    3. Échec si la stratégie est désactivée ou si la liste d'autorisation contient des groupes larges.
remediation:
  manual: |
    1. Avec le rôle Azure DevOps Administrator, ouvrir **Paramètres de l'organisation** > **Microsoft
       Entra ID** et activer **Restrict organization creation**.
    2. Ajouter le groupe d'administrateurs autorisés à la liste d'autorisation et définir le message
       d'erreur.
    3. Revoir les organisations créées avant la stratégie et les placer sous gouvernance ou les
       supprimer.
